<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS · Evaluation</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../ARGUS_Icon.png">
<style>
  @font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-400.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-500.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-600.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-700.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-600.woff2) format('woff2')}
  :root{
    --bg:#fff; --surf:#f6f7f8; --surf2:#eef0f2; --line:#d9dde1;
    --tx:#16181a; --mut:#5d6368; --t3:#2E7D32; --t1:#C62828; --prio:#E65100; --acc:#1f2530;
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--surf);color:var(--tx);font-family:var(--sans);line-height:1.5;font-size:15px}
  .topbar{background:var(--acc);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;z-index:5}
  .topbar .brand{font-weight:700;letter-spacing:1px;font-size:16px}
  .topbar .brand small{font-weight:400;letter-spacing:0;opacity:.75;margin-left:8px;font-size:12px}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px}
  .intro{color:var(--mut);font-size:13.5px;margin:4px 2px 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 15px;margin-bottom:13px}
  .sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);margin:20px 2px 8px}
  label.q{display:block;font-weight:600;font-size:14.5px;margin-bottom:9px}
  .sub{font-weight:400;color:var(--mut);font-size:12.5px}
  input[type=text],select,textarea{font-family:var(--sans);font-size:15px;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;color:var(--tx);width:100%}
  textarea{min-height:78px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
  .scale{display:flex;gap:7px}
  .scale button{flex:1;border:1px solid var(--line);background:var(--surf2);color:var(--mut);border-radius:10px;padding:13px 0;font-size:18px;font-weight:700;font-family:var(--mono);cursor:pointer}
  .scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .scalelab{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:5px}
  .fieldlab{display:block;font-size:12.5px;color:var(--mut);margin:0 0 5px;font-weight:600}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chips button{border:1px solid var(--line);background:var(--surf2);color:var(--tx);border-radius:20px;padding:9px 15px;font-size:14px;cursor:pointer}
  .chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .sendbtn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:11px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
  .sendbtn:disabled{opacity:.55;cursor:default}
  .err{color:var(--t1);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}
  .done{text-align:center;padding:48px 18px}
  .done .big{font-size:46px}
  .done h2{font-size:21px;margin:10px 0 6px}
  .done p{color:var(--mut);font-size:14px}
  .req{color:var(--prio)}
  .foot{text-align:center;color:var(--mut);font-size:11.5px;padding:6px 16px 20px}
</style>
</head>
<body>
<div class="topbar"><span class="brand">ARGUS<small>· Evaluation</small></span></div>
<div id="app"></div>
<div class="foot">Anonyme Rückmeldung · keine Pflicht-Personendaten · Datenverarbeitung beim Betreiber der ARGUS-Instanz.</div>

<script src="../config.js"></script>
<script>
"use strict";
var _cfg = window.ARGUS_CONFIG || null;
var _ok = !!(_cfg && typeof _cfg.url==='string' && _cfg.url.indexOf('https://')===0 && _cfg.anonKey);
var SUPA_URL = _ok ? _cfg.url : '';
var SUPA_KEY = _ok ? _cfg.anonKey : '';

/* Kurs aus ?kurs= (Default PPF-Kurse) — der Trainer kann den Link
 * vorparametrisieren, ohne dass Teilnehmer tippen müssen. */
function qparam(n){ try{ return new URLSearchParams(location.search).get(n)||''; }catch(e){ return ''; } }
var DEFAULT_COURSE = qparam('kurs') || 'PPF-Kurse';

var RATINGS = [
  ['bedienung',  'Die Bedienung war einfach und verständlich.'],
  ['stress',     'Auch unter Zeitdruck / mit Handschuhen gut bedienbar.'],
  ['tacstart',   'Das Erfassen nach tacSTART war klar und nachvollziehbar.'],
  ['tempo',      'Patienten anlegen ging schnell genug.'],
  ['uebersicht', 'Die Patientenübersicht war hilfreich.'],
  ['einsatz',    'ARGUS würde im echten Einsatz helfen.'],
  ['gesamt',     'Gesamteindruck.']
];

var answers = { ratings:{}, rolle:'', erfahrung:'', empfehlung:'' };

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function viewForm(){
  var h='<div class="wrap">';
  h+='<div class="intro">Danke, dass du ARGUS im Kurs ausprobiert hast! Deine Rückmeldung hilft, das Werkzeug besser zu machen. Der Bogen ist <b>anonym</b> und dauert ~2 Minuten.</div>';

  h+='<div class="sec">Zu dir (optional)</div><div class="card">';
  h+='<label class="fieldlab">Kurs</label><input type="text" id="course" value="'+esc(DEFAULT_COURSE)+'">';
  h+='<label class="fieldlab" style="margin-top:12px">Funktion / Rolle</label>';
  h+='<select id="rolle"><option value="">— keine Angabe —</option><option>Ersthelfer / Laie</option><option>Rettungssanitäter:in</option><option>Notfallsanitäter:in</option><option>Ärztin / Arzt</option><option>Führung / Leitung</option><option>Sonstige</option></select>';
  h+='<label class="fieldlab" style="margin-top:12px">Vorerfahrung mit tacSTART / Sichtung</label>';
  h+='<div class="chips" data-chip="erfahrung"><button type="button" data-v="keine">keine</button><button type="button" data-v="etwas">etwas</button><button type="button" data-v="viel">viel</button></div>';
  h+='</div>';

  h+='<div class="sec">Bewertung <span class="sub">(1 = trifft nicht zu · 5 = trifft voll zu)</span></div>';
  RATINGS.forEach(function(r){
    h+='<div class="card"><label class="q">'+esc(r[1])+'</label>';
    h+='<div class="scale" data-rate="'+r[0]+'">';
    for(var i=1;i<=5;i++) h+='<button type="button" data-v="'+i+'">'+i+'</button>';
    h+='</div><div class="scalelab"><span>trifft nicht zu</span><span>trifft voll zu</span></div></div>';
  });

  h+='<div class="sec">Deine Worte</div>';
  h+='<div class="card"><label class="q">Was war besonders gut?</label><textarea id="gut"></textarea></div>';
  h+='<div class="card"><label class="q">Was hat gefehlt oder war hinderlich?</label><textarea id="schlecht"></textarea></div>';
  h+='<div class="card"><label class="q">Verbesserungsvorschläge / Sonstiges</label><textarea id="sonst"></textarea></div>';

  h+='<div class="card"><label class="q">Würdest du ARGUS weiterempfehlen?</label>';
  h+='<div class="chips" data-chip="empfehlung"><button type="button" data-v="ja">ja</button><button type="button" data-v="eher ja">eher ja</button><button type="button" data-v="eher nein">eher nein</button><button type="button" data-v="nein">nein</button></div></div>';

  h+='<div class="card"><label class="fieldlab">Kürzel / Name <span class="sub">(freiwillig)</span></label><input type="text" id="kuerzel" placeholder="leer lassen = anonym"></div>';

  h+='<button class="sendbtn" id="send">Bewertung absenden</button>';
  h+='<div class="err" id="err"></div>';
  if(!_ok) document.getElementById('err');
  h+='</div>';
  return h;
}

function viewDone(){
  return '<div class="done"><div class="big">✅</div><h2>Vielen Dank!</h2><p>Deine Rückmeldung wurde gespeichert.<br>Du kannst das Fenster jetzt schließen.</p></div>';
}

function render(){ document.getElementById('app').innerHTML = state==='done'?viewDone():viewForm(); }
var state='form';

document.addEventListener('click', function(e){
  var sc=e.target.closest('.scale [data-v]');
  if(sc){ var grp=sc.closest('[data-rate]'); answers.ratings[grp.getAttribute('data-rate')]=+sc.getAttribute('data-v');
    grp.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b===sc); }); return; }
  var ch=e.target.closest('.chips [data-v]');
  if(ch){ var cg=ch.closest('[data-chip]'); answers[cg.getAttribute('data-chip')]=ch.getAttribute('data-v');
    cg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b===ch); }); return; }
  if(e.target.id==='send'){ submit(); }
});

function submit(){
  var err=document.getElementById('err'); err.textContent='';
  if(!_ok){ err.textContent='Konfiguration fehlt (config.js) — bitte den Kursleiter informieren.'; return; }
  var payload = {
    course: (document.getElementById('course').value||'').trim() || DEFAULT_COURSE,
    answers: {
      ratings: answers.ratings,
      rolle: document.getElementById('rolle').value||'',
      erfahrung: answers.erfahrung||'',
      empfehlung: answers.empfehlung||'',
      gut: (document.getElementById('gut').value||'').trim(),
      schlecht: (document.getElementById('schlecht').value||'').trim(),
      sonstiges: (document.getElementById('sonst').value||'').trim(),
      kuerzel: (document.getElementById('kuerzel').value||'').trim(),
      ts: Date.now(),
      app: 'evaluation.html'
    }
  };
  /* lokale Sicherung, falls das Netz wackelt — geht beim Schließen nicht verloren */
  try{ localStorage.setItem('argus_eval_last', JSON.stringify(payload)); }catch(e){}
  var btn=document.getElementById('send'); btn.disabled=true; btn.textContent='Wird gesendet…';
  fetch(SUPA_URL+'/rest/v1/course_evaluations', {
    method:'POST',
    headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
    body: JSON.stringify(payload)
  }).then(function(r){
    if(r.ok){ state='done'; render(); window.scrollTo(0,0); }
    else { return r.text().then(function(t){ throw new Error('HTTP '+r.status+(t?' · '+t.slice(0,120):'')); }); }
  }).catch(function(e){
    btn.disabled=false; btn.textContent='Bewertung absenden';
    err.textContent='Konnte nicht senden ('+e.message+'). Deine Eingaben bleiben erhalten — bitte später erneut versuchen.';
  });
}

render();
</script>
</body>
</html>
