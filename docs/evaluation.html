<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS · Evaluation</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../ARGUS_Icon.png">
<style>
  @font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-400.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-500.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-600.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-700.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-600.woff2) format('woff2')}
  :root{
    --bg:#fff; --surf:#f6f7f8; --surf2:#eef0f2; --line:#d9dde1;
    --tx:#16181a; --mut:#5d6368; --t3:#2E7D32; --t1:#C62828; --t2:#F2B600; --prio:#E65100; --ready:#1565C0; --acc:#1f2530;
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--surf);color:var(--tx);font-family:var(--sans);line-height:1.5;font-size:15px}
  .topbar{background:var(--acc);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;z-index:5}
  .topbar .brand{font-weight:700;letter-spacing:1px;font-size:16px}
  .topbar .brand small{font-weight:400;letter-spacing:0;opacity:.75;margin-left:8px;font-size:12px}
  .prog{height:4px;background:var(--surf2)}
  .prog > i{display:block;height:100%;width:0;background:var(--t3);transition:width .25s}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px}
  .intro{color:var(--mut);font-size:13.5px;margin:4px 2px 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 15px;margin-bottom:11px}
  .card.miss{border-color:var(--prio);box-shadow:0 0 0 1px var(--prio) inset}
  .sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);margin:22px 2px 8px}
  .sec .sub{font-weight:400;text-transform:none;letter-spacing:0;color:var(--mut)}
  label.q{display:block;font-weight:600;font-size:14.5px;margin-bottom:10px}
  .qn{color:var(--mut);font-weight:700;margin-right:5px}
  .sub{font-weight:400;color:var(--mut);font-size:12.5px}
  input[type=text],select,textarea{font-family:var(--sans);font-size:15px;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;color:var(--tx);width:100%}
  textarea{min-height:74px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
  .scale{display:flex;gap:7px}
  .scale button{flex:1;border:1px solid var(--line);background:var(--surf2);color:var(--mut);border-radius:10px;padding:14px 0;font-size:18px;font-weight:700;font-family:var(--mono);cursor:pointer}
  .scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .scalelab{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
  .nps{display:flex;flex-wrap:wrap;gap:6px}
  .nps button{width:calc((100% - 30px)/6);border:1px solid var(--line);background:var(--surf2);color:var(--mut);border-radius:9px;padding:11px 0;font-size:15px;font-weight:700;font-family:var(--mono);cursor:pointer}
  .nps button.on{background:var(--ready);border-color:var(--ready);color:#fff}
  .fieldlab{display:block;font-size:12.5px;color:var(--mut);margin:0 0 5px;font-weight:600}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chips button{border:1px solid var(--line);background:var(--surf2);color:var(--tx);border-radius:20px;padding:9px 14px;font-size:13.5px;cursor:pointer}
  .chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .sendbtn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:11px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
  .sendbtn:disabled{opacity:.55;cursor:default}
  .err{color:var(--t1);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}
  .done{text-align:center;padding:48px 18px}
  .done .big{font-size:46px}
  .done h2{font-size:21px;margin:10px 0 6px}
  .done p{color:var(--mut);font-size:14px}
  .req{color:var(--prio);font-weight:700}
  .foot{text-align:center;color:var(--mut);font-size:11.5px;padding:6px 16px 22px}
</style>
</head>
<body>
<div class="topbar"><span class="brand">ARGUS<small>· Evaluation</small></span></div>
<div class="prog"><i id="prog"></i></div>
<div id="app"></div>
<div class="foot">Anonyme Rückmeldung · keine Pflicht-Personendaten · Verarbeitung beim Betreiber der ARGUS-Instanz, ausschließlich zur Verbesserung.</div>

<script src="../config.js"></script>
<script>
"use strict";
var EVAL_VERSION = 2;   /* Fragebogen-Version — bei Item-Änderung erhöhen (Auswertung mappt Keys→Frage/Polung) */

var _cfg = window.ARGUS_CONFIG || null;
var _ok = !!(_cfg && typeof _cfg.url==='string' && _cfg.url.indexOf('https://')===0 && _cfg.anonKey);
var SUPA_URL = _ok ? _cfg.url : '';
var SUPA_KEY = _ok ? _cfg.anonKey : '';

function qparam(n){ try{ return new URLSearchParams(location.search).get(n)||''; }catch(e){ return ''; } }
var DEFAULT_COURSE = qparam('kurs') || 'PPF-Kurse';

/* Kern-Items: 5-stufige Zustimmung. polarity:+1 = hohe Werte = gut,
 * polarity:-1 = REVERSE (hohe Werte = schlecht; gegen Durchklicken/Ja-Sage-Bias).
 * Konstrukt zur Doku der Auswertung mitgespeichert. */
var ITEMS = [
  ['verstanden', 'Ich habe schnell verstanden, wie ARGUS funktioniert.',                         +1, 'lernbarkeit'],
  ['stress',     'Auch unter Zeitdruck / mit Handschuhen war die Bedienung gut machbar.',          +1, 'feldtauglichkeit'],
  ['tacstart',   'Das Erfassen nach tacSTART war klar und nachvollziehbar.',                       +1, 'kernfunktion'],
  ['unsicher',   'An manchen Stellen war ich unsicher, ob ich richtig vorgehe.',                   -1, 'fehlersicherheit'],
  ['umstaendlich','Die App war an manchen Stellen umständlicher als nötig.',                       -1, 'einfachheit'],
  ['ueberblick', 'Ich hatte meine Patienten / die Lage jederzeit im Blick.',                       +1, 'uebersicht'],
  ['vertrauen',  'Im echten Einsatz würde ich mich auf ARGUS verlassen.',                          +1, 'vertrauen'],
  ['vspapier',   'ARGUS ist schneller und übersichtlicher als die Sichtung auf Papier.',           +1, 'mehrwert']
];
var HAKTE = ['tacSTART-Erfassung','Patient finden / öffnen','Maßnahmen & Vitalwerte','Foto','Übergabe / Abtransport','Sync mehrerer Geräte','Anmeldung / Codes','nichts davon'];

var A = { ratings:{}, nps:null, hakte:[], rolle:'', erfahrung:'', manv:'' };

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function scaleRow(key){
  var h='<div class="scale" data-rate="'+key+'">';
  for(var i=1;i<=5;i++) h+='<button type="button" data-v="'+i+'"'+(A.ratings[key]===i?' class="on"':'')+'>'+i+'</button>';
  h+='</div><div class="scalelab"><span>stimme gar nicht zu</span><span>stimme voll zu</span></div>';
  return h;
}

function viewForm(){
  var h='<div class="wrap">';
  h+='<div class="intro">Danke, dass du ARGUS im Kurs ausprobiert hast! Deine ehrliche Rückmeldung macht das Werkzeug besser. <b>Anonym</b>, ~3 Minuten. <span class="req">*</span> = Pflichtfeld.</div>';

  h+='<div class="sec">Zu dir <span class="sub">(für die Auswertung — optional)</span></div><div class="card">';
  h+='<label class="fieldlab">Kurs</label><input type="text" id="course" value="'+esc(DEFAULT_COURSE)+'">';
  h+='<label class="fieldlab" style="margin-top:12px">Funktion / Rolle</label>';
  h+='<select id="rolle"><option value="">— keine Angabe —</option><option>Ersthelfer / Laie</option><option>Rettungssanitäter:in</option><option>Notfallsanitäter:in</option><option>Ärztin / Arzt</option><option>Führung / Leitung</option><option>Sonstige</option></select>';
  h+='<label class="fieldlab" style="margin-top:12px">Vorerfahrung mit Sichtung / tacSTART</label>';
  h+='<div class="chips" data-chip="erfahrung"><button type="button" data-v="keine">keine</button><button type="button" data-v="etwas">etwas</button><button type="button" data-v="viel">viel</button></div>';
  h+='<label class="fieldlab" style="margin-top:12px">Schon eine MANV-/Sichtungslage erlebt (real oder Übung)?</label>';
  h+='<div class="chips" data-chip="manv"><button type="button" data-v="ja">ja</button><button type="button" data-v="nein">nein</button></div>';
  h+='</div>';

  h+='<div class="sec">Deine Bewertung <span class="sub">· 1 = stimme gar nicht zu, 5 = stimme voll zu <span class="req">*</span></span></div>';
  ITEMS.forEach(function(it,idx){
    h+='<div class="card" data-card="r-'+it[0]+'"><label class="q"><span class="qn">'+(idx+1)+'.</span>'+esc(it[1])+'</label>'+scaleRow(it[0])+'</div>';
  });

  h+='<div class="sec">Gesamt</div>';
  h+='<div class="card" data-card="nps"><label class="q">Wie wahrscheinlich würdest du ARGUS einer Kollegin / einem Kollegen weiterempfehlen? <span class="req">*</span></label>';
  h+='<div class="nps" data-nps>';
  for(var n=0;n<=10;n++) h+='<button type="button" data-v="'+n+'"'+(A.nps===n?' class="on"':'')+'>'+n+'</button>';
  h+='</div><div class="scalelab"><span>unwahrscheinlich</span><span>sehr wahrscheinlich</span></div></div>';
  h+='<div class="card"><label class="q">Kurz: Warum diese Bewertung? <span class="sub">(der wichtigste Grund)</span></label><textarea id="warum" placeholder="ein, zwei Sätze genügen"></textarea></div>';

  h+='<div class="sec">Wo hakte es? <span class="sub">(Mehrfachauswahl möglich)</span></div>';
  h+='<div class="card"><div class="chips" data-multi="hakte">';
  HAKTE.forEach(function(t){ h+='<button type="button" data-v="'+esc(t)+'">'+esc(t)+'</button>'; });
  h+='</div></div>';

  h+='<div class="sec">Deine Worte <span class="sub">(freiwillig, aber Gold wert)</span></div>';
  h+='<div class="card"><label class="q">Was hat dir am meisten geholfen?</label><textarea id="gut"></textarea></div>';
  h+='<div class="card"><label class="q">Was hat am meisten gestört oder gefehlt?</label><textarea id="schlecht"></textarea></div>';
  h+='<div class="card"><label class="q">Die <b>eine</b> Sache, die wir als Nächstes verbessern sollten?</label><textarea id="eine"></textarea></div>';

  h+='<div class="card"><label class="fieldlab">Kürzel <span class="sub">(freiwillig — sonst bleibt es anonym)</span></label><input type="text" id="kuerzel" placeholder="leer lassen = anonym"></div>';

  h+='<button class="sendbtn" id="send">Bewertung absenden</button>';
  h+='<div class="err" id="err"></div>';
  h+='</div>';
  return h;
}

function viewDone(){
  return '<div class="done"><div class="big">✅</div><h2>Vielen Dank!</h2><p>Deine Rückmeldung wurde gespeichert und fließt direkt in die Weiterentwicklung ein.<br>Du kannst das Fenster jetzt schließen.</p></div>';
}

var state='form';
function render(){ document.getElementById('app').innerHTML = state==='done'?viewDone():viewForm(); updateProgress(); }

function updateProgress(){
  var total = ITEMS.length + 1;                          // Kern-Items + NPS
  var done = Object.keys(A.ratings).length + (A.nps!=null?1:0);
  var p = Math.round(100*done/total);
  var el=document.getElementById('prog'); if(el) el.style.width = p+'%';
}

document.addEventListener('click', function(e){
  var sc=e.target.closest('.scale [data-v]');
  if(sc){ var grp=sc.closest('[data-rate]'); A.ratings[grp.getAttribute('data-rate')]=+sc.getAttribute('data-v');
    grp.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b===sc); });
    var card=grp.closest('[data-card]'); if(card) card.classList.remove('miss'); updateProgress(); return; }
  var np=e.target.closest('[data-nps] [data-v]');
  if(np){ A.nps=+np.getAttribute('data-v'); var g=np.closest('[data-nps]');
    g.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b===np); });
    var c=np.closest('[data-card]'); if(c) c.classList.remove('miss'); updateProgress(); return; }
  var ch=e.target.closest('.chips[data-chip] [data-v]');
  if(ch){ var cg=ch.closest('[data-chip]'); A[cg.getAttribute('data-chip')]=ch.getAttribute('data-v');
    cg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b===ch); }); return; }
  var mu=e.target.closest('.chips[data-multi] [data-v]');
  if(mu){ var v=mu.getAttribute('data-v'); var i=A.hakte.indexOf(v);
    if(i>=0){ A.hakte.splice(i,1); mu.classList.remove('on'); } else { A.hakte.push(v); mu.classList.add('on'); } return; }
  if(e.target.id==='send'){ submit(); }
});

function firstMissing(){
  for(var i=0;i<ITEMS.length;i++){ if(A.ratings[ITEMS[i][0]]==null) return 'r-'+ITEMS[i][0]; }
  if(A.nps==null) return 'nps';
  return null;
}

function submit(){
  var err=document.getElementById('err'); err.textContent='';
  document.querySelectorAll('.card.miss').forEach(function(c){ c.classList.remove('miss'); });
  var miss=firstMissing();
  if(miss){
    // alle fehlenden Pflichtkarten markieren, zur ersten scrollen
    ITEMS.forEach(function(it){ if(A.ratings[it[0]]==null){ var c=document.querySelector('[data-card="r-'+it[0]+'"]'); if(c) c.classList.add('miss'); } });
    if(A.nps==null){ var cn=document.querySelector('[data-card="nps"]'); if(cn) cn.classList.add('miss'); }
    var t=document.querySelector('[data-card="'+miss+'"]'); if(t) t.scrollIntoView({behavior:'smooth',block:'center'});
    err.textContent='Bitte noch die markierten Pflichtfragen ausfüllen (Bewertung + Weiterempfehlung).';
    return;
  }
  if(!_ok){ err.textContent='Konfiguration fehlt (config.js) — bitte den Kursleiter informieren.'; return; }

  var payload = {
    course: (document.getElementById('course').value||'').trim() || DEFAULT_COURSE,
    answers: {
      eval_version: EVAL_VERSION,
      ratings: A.ratings,                 // {key: 1..5}
      scale: { min:1, max:5, label:'zustimmung' },
      items: ITEMS.map(function(it){ return { key:it[0], polarity:it[2], konstrukt:it[3] }; }),
      nps: A.nps,                         // 0..10
      warum: (document.getElementById('warum').value||'').trim(),
      hakte: A.hakte,                     // [labels]
      gut: (document.getElementById('gut').value||'').trim(),
      schlecht: (document.getElementById('schlecht').value||'').trim(),
      eine_verbesserung: (document.getElementById('eine').value||'').trim(),
      rolle: document.getElementById('rolle').value||'',
      erfahrung: A.erfahrung||'',
      manv_erlebt: A.manv||'',
      kuerzel: (document.getElementById('kuerzel').value||'').trim(),
      ts: Date.now(),
      app: 'evaluation.html'
    }
  };
  try{ localStorage.setItem('argus_eval_last', JSON.stringify(payload)); }catch(e){}
  var btn=document.getElementById('send'); btn.disabled=true; btn.textContent='Wird gesendet…';
  fetch(SUPA_URL+'/rest/v1/course_evaluations', {
    method:'POST',
    headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
    body: JSON.stringify(payload)
  }).then(function(r){
    if(r.ok){ state='done'; render(); window.scrollTo(0,0); }
    else { return r.text().then(function(t){ throw new Error('HTTP '+r.status+(t?' · '+t.slice(0,120):'')); }); }
  }).catch(function(e){
    btn.disabled=false; btn.textContent='Bewertung absenden';
    err.textContent='Konnte nicht senden ('+e.message+'). Deine Eingaben bleiben erhalten — bitte später erneut versuchen.';
  });
}

render();
</script>
</body>
</html>
