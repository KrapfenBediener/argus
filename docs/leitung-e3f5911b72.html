/* Filter/Sortierung für die Zugänge-Tabellen (Owner-Wunsch 2026-06-12).
 * Rein clientseitig auf den geladenen _tokens; bei aktivem Filter werden
 * die Karten zwangsweise aufgeklappt, sonst wäre das Ergebnis unsichtbar. */
var _zugFilter={art:'alle',status:'alle',sort:'neu'};
function zugFilterActive(){ return _zugFilter.art!=='alle' || _zugFilter.status!=='alle'; }
function tokenArtKey(t){
  /* Phase 6.12 (06.12-10): persönliche Codes und Monats-Codes aus argus_vw_codes */
  if(t.art==='persoenlich' || t.art==='person_alt') return 'person';
  if(t.art==='praesidiums_code' || t.art==='fremdkraefte_code') return 'monat';
  if(t.observer) return 'beobachter';
  if(t.is_admin) return 'admin';
  if(t.is_master) return 'master';
  if(t.gast) return 'gast';
  if(t.single_use) return 'einmal';
  return 'dauerhaft';
}
function tokenStatusKey(t){
  if(t.revoked) return 'gesperrt';
  if(t.single_use && t.used_at) return 'verbraucht';
  if(t.expires_at && t.expires_at<=Date.now()) return 'abgelaufen';
  return 'aktiv';
}
function tokenMatches(t){
  if(_zugFilter.art!=='alle'    && tokenArtKey(t)!==_zugFilter.art) return false;
  if(_zugFilter.status!=='alle' && tokenStatusKey(t)!==_zugFilter.status) return false;
  return true;
}
function sortTokens(list){
  var l=list.slice();
  l.sort(function(a,b){
    var ta=Date.parse(a.created_at||'')||0, tb=Date.parse(b.created_at||'')||0;
    return _zugFilter.sort==='alt' ? ta-tb : tb-ta;
  });
  return l;
}
function zugSel(field, opts){
  var h='<select data-action="zugfilter" data-field="'+field+'">';
  opts.forEach(function(o){
    h+='<option value="'+o[0]+'"'+(_zugFilter[field]===o[0]?' selected':'')+'>'+o[1]+'</option>';
  });
  return h+'</select>';
}

/* Klickbarer Karten-Kopf; def=1 → standardmäßig zugeklappt.
 * forceOpen überstimmt den Merker (aktiver Filter klappt alles auf). */
function foldHead(key, defCollapsed, title, summary, forceOpen){
  var open=(forceOpen!==undefined) ? !!forceOpen : !isCollapsed(key, defCollapsed);
  return '<div class="cardhead'+(open?' open':'')+'" data-action="togglecard" data-key="'+esc(key)+'" data-def="'+(defCollapsed?'1':'0')+'">'
       + '<span class="chev">▶</span><span class="ctitle">'+title+'</span>'
       + (summary?'<span class="csum">'+summary+'</span>':'')
       + '</div>';
}

/* Code-/Token-Erzeugung — 1:1 aus der Feld-App portiert */
function genShortCode(){
  /* WR-02 (04.14 Code-Review): kryptografisch statt Math.random. Das Alphabet hat
     32 Zeichen (Zweierpotenz) → b%32 ist bias-frei (256/32=8). Konsistent zu genToken. */
  var AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var a=new Uint8Array(8); crypto.getRandomValues(a);
  var s='';for(var i=0;i<8;i++){ if(i===4)s+='-'; s+=AL[a[i]%32]; }
  return s;
}
function genToken(){ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a,function(b){return b.toString(16).padStart(2,'0');}).join(''); }

/* Wurzel-URL der Feld-App: das Segment „docs/<datei>" aus dem eigenen
 * Pfad entfernen — die Leitungs-Seite liegt selbst unter docs/. */
function feldAppRoot(){
  return location.origin + location.pathname.replace(/docs\/[^\/]*$/,'');
}

/* Phase 6.12 (Plan 06.12-10, D6.12-04/-10/-24): „Personen & Zugänge“ lädt nur
 * über die Verwaltungs-RPCs — Präsidien (Zugangscodes, Formulare), Codes, Personen
 * und gesperrte Anmeldeversuche; der MasterToken nutzt denselben Weg (kein
 * Roh-Lesen von access_tokens mehr, T-06.12-1005). Trainer laden nur die
 * Präsidien (Abschnitt Zugangscodes). Codes werden auf die bisherige Zeilenform
 * abgebildet (codeZuToken), damit Filter, Karten und Knöpfe unverändert bleiben. */
var _zugAlteAus=false, _fkSitz=[], _codesErr=null, _sperren=null, _sperrenErr=null;
function codeZuToken(c){
  var a=String((c && c.art)||'');
  return { short_code:c.short_code||null, label:c.label||'', art:a, art_anzeige:c.art_anzeige||'', kuerzel:c.kuerzel||null,
    praesidium_id:c.praesidium_id||null, created_at:c.created_at||null, revoked:c.revoked===true,
    expires_at:c.expires_at==null ? null : +c.expires_at, used_at:c.used_at==null ? null : +c.used_at,
    is_master:a==='master', is_admin:a==='flz_zugang', observer:a==='beobachter', gast:a==='gast', single_use:a==='einmal',
    loeschbar:c.loeschbar===true, loeschgrund:c.loeschgrund||null };
}
async function loadZugaenge(){
  _praes=null; _tokens=null; _zugErr=null; _codesErr=null; _zugAlteAus=false; _fkSitz=[]; _sperren=null; _sperrenErr=null;
  _vwPraes=null; _pers=null; _persErr=null;
  if(state.section==='zugaenge') render();
  var cl=sb();
  if(!cl){ _zugErr='Sitzung abgelaufen — bitte neu anmelden.'; if(state.section==='zugaenge') render(); return; }
  try{
    await probeServerV(cl);
    var pr=await vwRpc('argus_vw_praesidien');
    if(!pr.ok){ _zugErr=pr.meldung; }
    else{
      praesVwUebernehmen(pr);
      _praes=(_vwPraes||[]).map(function(p){ return { id:p.id, name:p.name, schulung:p.schulung===true }; });
      if(vwSicht().admin){
        var res=await Promise.all([vwRpc('argus_vw_codes', { p_praesidium_id:null }), vwRpc('argus_vw_personen'), vwRpc('argus_vw_anmeldesperren')]);
        var co=res[0];
        if(co.ok){
          _tokens=(Array.isArray(co.codes) ? co.codes : []).filter(function(c){ return !!c && typeof c==='object'; }).map(codeZuToken);
          codeMarkBeschneiden();   /* Quick 261024 */
          _zugAlteAus=co.alte_codes_aus===true;
          _fkSitz=Array.isArray(co.fremdkraft_sitzungen) ? co.fremdkraft_sitzungen : [];
        }else{ _tokens=[]; _codesErr=co.meldung; }
        personenUebernehmen(res[1]);
        if(res[2].ok) _sperren=Array.isArray(res[2].sperren) ? res[2].sperren : [];
        else _sperrenErr=res[2].meldung;
      }
    }
  }catch(e){ _zugErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(state.section==='zugaenge') render();
}

function tokenArt(t){
  if(t.art_anzeige) return t.art_anzeige;   /* Phase 6.12: Bezeichnung des Servers (argus_vw_codes) */
  if(t.observer) return 'Beobachter (alt)';
  if(t.is_admin) return 'FLZ-Zugang';
  if(t.is_master) return 'MasterToken';
  if(t.gast) return 'Gast (alt, 24 h)';
  if(t.single_use) return 'Einmalig';
  if(t.temporary) return '24 h';
  return 'Dauerhaft';
}
function tokenStatus(t){
  if(t.revoked) return '<span class="pill red">GESPERRT</span>';
  if(t.single_use && t.used_at) return '<span class="pill gray">verbraucht</span>';
  if(t.expires_at && t.expires_at<=Date.now()) return '<span class="pill gray">abgelaufen</span>';
  if(t.gast && t.expires_at){
    var hrs=Math.max(0,Math.ceil((t.expires_at-Date.now())/3600000));
    return '<span class="pill green">aktiv · noch '+hrs+' h</span>';
  }
  /* Phase 6.12: Monats-Codes (und andere befristete Codes) mit Ablaufdatum */
  if(t.expires_at) return '<span class="pill green">aktiv · bis '+esc(new Date(+t.expires_at).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}))+'</span>';
  return '<span class="pill green">aktiv</span>';
}
/* ── Code-Notiz und Löschen (Quick 261019, Migration 0036) ──────────────────
 * „Notiz“ ändert die Bezeichnung eines Codes (argus_master_code_notiz), „Aus
 * Liste löschen“ entfernt gesperrte, abgelaufene und verbrauchte Codes
 * (argus_master_code_loeschen; erst Protokoll admin_code_geloescht, dann
 * delete). Beide nur mit MasterToken und erst ab Server-Schema 36 sichtbar —
 * ein älterer Server blendet die Knöpfe aus. Der Server prüft jede Löschung
 * selbst; codeLoeschGrund ist nur die Vorauswahl für die Anzeige. */
var CODE_V=36;
var _serverV=null;   /* null = ungeprüft, 0 = alter Server/unbekannt */
/* Phase 6.12 (06.12-10, D6.12-21): Schalter „alte Code-Arten abschalten“ (ab 0042) */
var _alteCodesAus=false;
async function probeServerV(cl){
  if(_serverV!==null && _serverV>=CODE_V) return;
  try{
    var r=await cl.rpc('argus_server_time');
    var v=(r && !r.error && r.data && typeof r.data==='object') ? +r.data.v : 0;
    _serverV=isFinite(v) ? v : 0;
    _alteCodesAus=!!(r && !r.error && r.data && r.data.alte_codes_aus===true);
  }catch(e){ _serverV=0; }
}
function codeAktionenAn(){ return (+_serverV||0)>=CODE_V; }
/* ── Präsidiums-Schlüssel erneuern (Phase 6.10, Migration 0037, D6.10-04) ───
 * Der Präsidiums-Schlüssel dient nur dem Entdecken/Beitritt/Anklopfen im Mesh
 * ohne Netz (nie Patientendaten). Kein automatischer Ablauf — erneuert wird nur
 * hier, auf ausdrückliche Auslösung (z. B. Geräteverlust): MasterToken je
 * Präsidium, FLZ-Zugang für das eigene Präsidium. Erst ab Server-Schema 37
 * sichtbar. Geräte holen den neuen Schlüssel beim nächsten Netzkontakt; der
 * vorherige gilt bis dahin weiter (Notweg über den MasterMedic). */
var MESHKEY_V=37;
function meshKeyAktionAn(){ return (+_serverV||0)>=MESHKEY_V; }
/* ── Phase 6.12 (Plan 06.12-09): Server-Stand der neuen Verwaltung ─────────
 * Persönliche Sitzungen und die neuen Bereiche brauchen Server-Stand 45
 * (Migrationen 0039–0045). Älterer Server (v bekannt, 0 = unbekannt) → klarer
 * Hinweis statt kaputter Bereiche (T-06.12-0904). Der MasterToken behält seine
 * bisherigen Bereiche (D6.12-21) — der Hinweis erscheint für ihn nur in den
 * neuen Bereichen; FLZ-Zugang und Phase-5-Rollen bleiben unberührt. */
var VW_V=45;
/* Phase 6.12 (06.12-10): „Präsidien“ und „Personen & Zugänge“ brauchen nur 0041–0043
 * (live) — sie stehen bewusst NICHT in VW_NEU, damit der MasterToken Schulung leeren,
 * Zwillinge anlegen und Präsidiums-Schlüssel erneuern behält (D6.12-21). */
var VW_NEU=['uebersicht'];
function serverZuAlt(role, section){
  var v=+_serverV||0;
  if(!(v>0 && v<VW_V)) return false;
  if(role==='ident') return true;
  if(role==='master') return VW_NEU.indexOf(section)>=0;
  return false;
}
function serverZuAltHtml(v, master){
  var h='<div class="mh"><h2>Verwaltung</h2></div><div class="card">';
  h+='<div style="font-weight:700">Server-Stand zu alt (v '+esc(String(+v||0))+') — diese Verwaltung braucht Server-Stand '+VW_V+'. Bitte die Migrationen 0039–0045 einspielen.</div>';
  if(master) h+='<div class="hint" style="margin-top:8px">Die bisherigen Bereiche (Personen &amp; Zugänge, Präsidien, Einsätze, Protokoll, Audit-Log) bleiben mit dem MasterToken nutzbar.</div>';
  return h+'</div>';
}
async function erneuerePraesSchluessel(pid, pname){
  if(!pid){ toast('Präsidium nicht gesetzt — bitte neu anmelden.'); return; }
  var ok=await confirmModal('Präsidiums-Schlüssel'+(pname?' für „'+pname+'“':'')+' erneuern?\nNur nötig, wenn ein Gerät verloren ging. Alle Geräte brauchen danach einmal Netz, um den neuen Schlüssel zu holen. Erneuern?', 'Erneuern');
  if(!ok) return;
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var r; try{ r=await cl.rpc('argus_praesidium_meshkey_erneuern',{p_praesidium_id:pid}); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error||!r.data){ toast('Erneuern fehlgeschlagen: '+(r.error?(r.error.message||'unbekannt'):'kein Ergebnis')); return; }
  if(r.data.ok!==true){ toast('Erneuern nicht möglich: '+(r.data.meldung||r.data.fehler||'unbekannt')); return; }
  toast('Präsidiums-Schlüssel erneuert — Epoche '+(+r.data.epoche||0));
  if(state.section==='praesidien') loadPraesidienVw();   /* Phase 6.12: neue Epoche anzeigen */
}
/* Anmeldefrist eines eingelösten Codes — wie argus_exchange_code (0024) */
function codeAnmeldeMs(t){
  if(t.gast) return 24*3600000;
  if(t.ttl_hours!=null) return (+t.ttl_hours)*3600000;
  return 30*86400000;
}
/* 'gesperrt' | 'abgelaufen' | 'verbraucht' | null (nicht löschbar) —
 * spiegelt die Regel von argus_master_code_loeschen: nie MasterToken, nie
 * aktiv; verbraucht erst, wenn die damit ausgestellte Anmeldung abgelaufen ist. */
function codeLoeschGrund(t, now){
  if(!t || !t.short_code || t.is_master) return null;
  /* Phase 6.12: argus_vw_codes liefert die Server-Regel mit (loeschbar/loeschgrund) */
  if(t.loeschbar!==undefined) return t.loeschbar===true ? (t.loeschgrund||'gesperrt') : null;
  if(now==null) now=Date.now();
  if(t.revoked) return 'gesperrt';
  if(t.expires_at!=null && +t.expires_at<=now) return 'abgelaufen';
  if(t.single_use && t.used_at!=null && (+t.used_at)+codeAnmeldeMs(t)<=now) return 'verbraucht';
  return null;
}
/* Bezeichnung = „<Präsidium> <Art>“ + optional „ — <Notiz>“ (so legen
 * Einmal-Link, Dauerhaft-Code, FLZ-Zugang, Dauercode, Gast-Code und
 * FLZ-Beobachter sie an). Ohne erkennbare Art ist die ganze Bezeichnung die Notiz. */
var NOTIZ_RE=/^([\s\S]*?(?:Einmal-Link|Dauerhaft-Code|Dauercode|FLZ-Zugang|Gast-Code|FLZ-Beobachter))(?: — ([\s\S]*))?$/;
function notizTeile(label){
  var s=String(label||'');
  var m=NOTIZ_RE.exec(s);
  return m ? {basis:m[1], notiz:m[2]||''} : {basis:'', notiz:s};
}
function notizLabel(basis, notiz){
  var n=String(notiz||'').replace(/\s+/g,' ').trim();
  var b=String(basis||'');
  return b ? (n ? b+' — '+n : b) : n;
}
function codeKnoepfe(t){
  if(!codeAktionenAn() || !t.short_code) return '';
  var h='<button class="btn ghost" data-action="codenotiz" data-sc="'+esc(t.short_code)+'" title="Notiz ändern">Notiz</button>';
  if(codeLoeschGrund(t)) h+='<button class="btn ghost" data-action="codeloeschen" data-sc="'+esc(t.short_code)+'">Aus Liste löschen</button>';
  return h;
}
function codeAusListe(sc){
  return (_tokens||[]).filter(function(x){ return x.short_code===sc; })[0]||null;
}
async function editCodeNotiz(sc){
  var t=codeAusListe(sc);
  if(!t){ toast('Code nicht gefunden — bitte aktualisieren.'); return; }
  var teile=notizTeile(t.label);
  var neu=await promptModal('Notiz zu Code '+sc+(teile.basis?' ('+teile.basis+')':'')+' — erscheint in der Liste; leer = Notiz entfernen', teile.notiz);
  if(neu===null) return;   /* Abbrechen = nichts ändern */
  var lbl=notizLabel(teile.basis, neu);
  if(lbl.length>200){ toast('Notiz zu lang — die Bezeichnung darf höchstens 200 Zeichen haben.'); return; }
  /* Phase 6.12 (06.12-10): argus_vw_code_notiz setzt die ganze Bezeichnung */
  var r=await vwRpc('argus_vw_code_notiz',{p_short_code:sc, p_notiz:lbl});
  if(!r.ok){ toast('Notiz nicht gespeichert: '+r.meldung); return; }
  toast(r.unveraendert ? 'Notiz unverändert' : 'Notiz gespeichert');
  loadZugaenge();
}
async function loescheCode(sc){
  var t=codeAusListe(sc);
  if(!t || !codeLoeschGrund(t)){ toast('Nur gesperrte, abgelaufene oder verbrauchte Codes lassen sich löschen.'); return; }
  var ok=await confirmModal('Code '+sc+(t.label?' („'+t.label+'“)':'')+' aus der Liste löschen?\nDer Code wird endgültig entfernt und lässt sich nicht wiederherstellen. Der Eintrag im Protokoll bleibt erhalten.', 'Löschen');
  if(!ok) return;
  var r=await vwRpc('argus_vw_code_loeschen',{p_short_code:sc});
  if(!r.ok){ toast('Löschen nicht möglich: '+r.meldung); loadZugaenge(); return; }
  toast('Code '+sc+' gelöscht');
  loadZugaenge();
}
/* ── Codes markieren und gesammelt löschen (Quick 261024, Owner-Wunsch 24.10.2026) ──
 * Ersetzt den Sammel-Knopf „Gesperrte/abgelaufene entfernen (N)“ (codeloeschenalle,
 * loescheCodesAlle). Kontrollkästchen nur für löschbare Codes (codeLoeschGrund =
 * Server-Regel aus argus_vw_codes), nie MasterToken, nie aktive Codes. Nach EINER
 * In-App-Bestätigung wird je Code nacheinander argus_vw_code_loeschen aufgerufen —
 * der Server prüft jeden Code selbst (Rechte des MasterTokens bzw. der persönlichen
 * Sitzung, Regel 0036). Gruppe = Präsidiums-ID, '' = „Ohne Präsidium“. */
var _codeMark={}, _codeLauf=null, _codeErg={};
function codeMarkierbar(t){ return !!t && !!t.short_code && !t.is_master && !!codeLoeschGrund(t); }
function codeMarkiert(sc){ return !!(_codeMark && _codeMark[sc]===true); }
function markierteCodes(list){ return (list||[]).filter(function(t){ return codeMarkierbar(t) && codeMarkiert(t.short_code); }); }
function codeGruppe(pid){
  var l=_tokens||[];
  if(pid) return l.filter(function(t){ return t.praesidium_id===pid; });
  return l.filter(function(t){ return !(_praes||[]).some(function(p){ return p.id===t.praesidium_id; }); });
}
/* nach dem Laden: nur Markierungen noch vorhandener, weiterhin löschbarer Codes behalten */
function codeMarkBeschneiden(){
  var neu={};
  (_tokens||[]).forEach(function(t){ if(codeMarkierbar(t) && codeMarkiert(t.short_code)) neu[t.short_code]=true; });
  _codeMark=neu;
}
function codeMarkBox(t){
  if(!codeAktionenAn() || !codeMarkierbar(t)) return '';
  return '<input type="checkbox" data-action="codemark" data-sc="'+esc(t.short_code)+'" aria-label="Code '+esc(t.short_code)+' markieren" title="Zum Löschen markieren" style="width:22px;height:22px;margin:0;cursor:pointer"'+(codeMarkiert(t.short_code)?' checked':'')+'>';
}
/* Leiste je Karte: „Alle löschbaren markieren“ (wirkt auf die sichtbaren, d. h. gefilterten
 * Codes), Zähler „N markiert“, „Markierte löschen“; während des Löschens der Fortschritt,
 * danach das Ergebnis. */
function codeMarkLeiste(pid, pname, list, shown){
  if(!codeAktionenAn()) return '';
  var key=pid||'';
  var loeschbar=(list||[]).filter(codeMarkierbar);
  var erg=_codeErg ? _codeErg[key] : null;
  var lauf=!!(_codeLauf && _codeLauf.pid===key);
  if(!loeschbar.length && !erg && !lauf) return '';
  var h='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">';
  if(lauf){
    h+='<span class="hint" style="margin:0">Wird gelöscht … '+(+_codeLauf.i||0)+' von '+(+_codeLauf.n||0)+'</span>';
  }else if(loeschbar.length){
    var sicht=(shown||[]).filter(codeMarkierbar);
    var m=markierteCodes(list).length;
    var alle=sicht.length>0 && sicht.every(function(t){ return codeMarkiert(t.short_code); });
    if(sicht.length) h+='<button class="btn ghost" data-action="codemarkalle" data-pid="'+esc(key)+'">'+(alle?'Markierung aufheben':'Alle löschbaren markieren ('+sicht.length+')')+'</button>';
    h+='<span class="hint" style="margin:0">'+m+' markiert</span>';
    h+='<button class="btn warn" data-action="codemarkloeschen" data-pid="'+esc(key)+'" data-pname="'+esc(pname||'')+'"'+(m?'':' disabled')+'>Markierte löschen'+(m?' ('+m+')':'')+'</button>';
  }
  if(erg && !lauf) h+='<span class="hint" style="margin:0">'+esc(erg)+'</span>';
  return h+'</div>';
}
function codeMarkSetzen(sc, an){
  var t=codeAusListe(sc);
  if(an && codeMarkierbar(t)) _codeMark[sc]=true; else delete _codeMark[sc];
  _codeErg={};
  render();
}
function codeMarkAlle(pid){
  var sicht=codeGruppe(pid).filter(tokenMatches).filter(codeMarkierbar);
  var alle=sicht.length>0 && sicht.every(function(t){ return codeMarkiert(t.short_code); });
  sicht.forEach(function(t){ if(alle) delete _codeMark[t.short_code]; else _codeMark[t.short_code]=true; });
  _codeErg={};
  render();
}
async function loescheMarkierte(pid, pname){
  if(_codeLauf) return;   /* läuft schon */
  var key=pid||'';
  var list=markierteCodes(codeGruppe(key));
  if(!list.length){ toast('Keine Codes markiert.'); return; }
  var n=list.length;
  var ok=await confirmModal((n===1?'1 markierten Code':n+' markierte Codes')+(pname?' von „'+pname+'“':'')+' aus der Liste löschen?\n'+(n===1?'Der Code wird':'Die Codes werden')+' endgültig entfernt und lässt sich nicht wiederherstellen. Die Einträge im Protokoll bleiben erhalten.', n===1?'1 Code löschen':n+' Codes löschen');
  if(!ok) return;
  var geloescht=0, nicht=0, grund='', abbruch=false;
  _codeErg={};
  _codeLauf={ pid:key, i:0, n:n };
  try{
    for(var i=0;i<n;i++){
      _codeLauf.i=i+1; render();
      var sc=list[i].short_code;
      var r=await vwRpc('argus_vw_code_loeschen',{p_short_code:sc});
      if(r.ok){ geloescht++; delete _codeMark[sc]; continue; }
      if(r.fehler==='sitzung'){ nicht+=n-i; abbruch=true; break; }   /* abgemeldet — Rest nicht versuchen */
      nicht++;
      if(!grund && r.meldung) grund=String(r.meldung);
    }
  }finally{ _codeLauf=null; }
  var txt=geloescht+' gelöscht, '+nicht+' nicht löschbar'+(grund?' ('+grund+')':'');
  _codeErg[key]=txt;
  toast(txt);
  if(abbruch) return;
  await loadZugaenge();
}

/* ── Phase 6.12 (Plan 06.12-10): Zugangscodes und gesperrte Anmeldeversuche ──
 * Präsidiums-Code (Selbstregistrierung mit Kürzel) und Fremdkräfte-Code (72 h,
 * nur dieses Präsidium) wechseln monatlich (D6.12-13, 0041). Anzeigen und
 * Erneuern nur laut Sitzung: Administrator/MasterToken im eigenen Bereich, Trainer
 * nur den Präsidiums-Code des Stamms und den Fremdkräfte-Code des Zwillings; der
 * Server prüft und protokolliert jede Anzeige (T-06.12-1002). */
function datumKurz(ms){
  if(ms==null || !isFinite(+ms) || +ms<=0) return '—';
  return new Date(+ms).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
}
/* Rein: Reihenfolge Echtbetrieb-Präsidium → sein Zwilling (eingerückt); übrige
 * Schulungs-Präsidien ohne Elternteil in der Liste am Ende. */
function praesReihenfolge(liste){
  var l=(Array.isArray(liste) ? liste : []).filter(function(p){ return !!p && typeof p==='object' && typeof p.id==='string'; });
  var out=[], drin={};
  l.filter(function(p){ return !p.schulung; }).forEach(function(p){
    out.push({ p:p, zwilling:false }); drin[p.id]=true;
    var z=p.schulungs_zwilling_id ? l.filter(function(x){ return x.id===p.schulungs_zwilling_id; })[0] : null;
    if(z && !drin[z.id]){ out.push({ p:z, zwilling:true }); drin[z.id]=true; }
  });
  l.forEach(function(p){ if(!drin[p.id]){ out.push({ p:p, zwilling:false }); drin[p.id]=true; } });
  return out;
}
/* Rein: was die Sitzung je Präsidium mit den Monats-Codes darf (nur Anzeige-Komfort). */
function zugcodeRechte(p, sicht){
  var n={ praes:false, praesNeu:false, fremd:false, fremdNeu:false };
  if(!p || !sicht) return n;
  if(sicht.master || sicht.admin){
    var ok=sicht.master || !!(p.darf && p.darf.codes===true);
    return { praes:ok && !p.schulung, praesNeu:ok && !p.schulung, fremd:ok, fremdNeu:ok };
  }
  if(sicht.trainer){
    var stamm=!p.schulung && !!sicht.stamm && p.id===sicht.stamm;
    var zw=!!p.schulung && !!sicht.stamm && p.echt_id===sicht.stamm;
    return { praes:stamm, praesNeu:false, fremd:zw, fremdNeu:zw };
  }
  return n;
}

      h+='<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost" data-action="zugcodezeigen" data-pid="'+pid+'" data-art="praesidiums_code">Präsidiums-Code anzeigen</button>';

      h+='<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost" data-action="zugcodezeigen" data-pid="'+pid+'" data-art="fremdkraefte_code">Fremdkräfte-Code anzeigen</button>';

/* Rein: Restdauer einer Sperre („noch 12 min“, „noch 1 h 5 min“). */
function restDauerText(s){
  var m=Math.ceil(Math.max(0, +s||0)/60);
  if(m<60) return 'noch '+m+' min';
  var h=Math.floor(m/60), r=m%60;
  return 'noch '+h+' h'+(r ? ' '+r+' min' : '');
}

  }

    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';

    h+='<div class="card"><p class="hint" style="margin:0">Personen und weitere Zugänge verwaltet ein Administrator.</p></div>';

  else h+='<div class="card">'+sperrenListeHtml(_sperren)+'</div>';

}

/* Abschnitt „Weitere Zugänge“ (bisheriges Kartenmuster, Daten aus argus_vw_codes):
 * Alt-Codes und persönliche Codes je Präsidium der gewählten Umgebung — sperren,
 * Notiz, löschen, QR; Ausgabe nur noch Dauercode/Einmal-Link und nur bei Schalter
 * AUS (D6.12-15/-21). Phase 6.8 (D6.8-07): Präsidien der gewählten Umgebung;
 * Schulungs-Werkzeuge (anlegen/prüfen, leeren) nur im Modus Schulung. */
function weitereZugaengeHtml(){
  var h='<div class="sech" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">Weitere Zugänge · '+(_umg==='schulung'?'Schulung':'Echtbetrieb')+'<span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;text-transform:none;letter-spacing:0;font-weight:400">'+
    /* Phase 6.12 (06.12-10): Schulungs-Zwillinge anlegen/prüfen, Schulung leeren und
     * Präsidiums-Schlüssel stehen jetzt im Bereich „Präsidien“ */
    (_umg==='schulung'
      ? '<span class="hint">Schulungs-Zwillinge anlegen und leeren: Bereich „Präsidien“</span>'
      : '<span class="hint">Schulungs-Präsidien: oben auf ‚Schulung‘ umschalten</span>')+
    '</span></div>';
  h+='<div class="hint" style="margin:-4px 0 8px">Bisherige Code-Arten und persönliche Codes je Präsidium. Neu ausgegeben werden nur noch Dauercodes und Einmal-Links (Übergang bis zum Präsidiums-Code).</div>';
  /* Filter-/Sortier-Leiste (wirkt auf alle Karten; aktiver Filter klappt auf) */
  h+='<div class="card" style="padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  h+='<span class="hint" style="margin:0">Filter:</span>';
  h+=zugSel('art',[['alle','Alle Arten'],['dauerhaft','Dauerhaft'],['einmal','Einmalig'],['admin','FLZ-Zugang'],['master','MasterToken'],['gast','Gast (alt)'],['beobachter','Beobachter (alt)'],['person','Persönlich/Person'],['monat','Präsidiums-/Fremdkräfte-Code']]);
  h+=zugSel('status',[['alle','Jeder Status'],['aktiv','aktiv'],['gesperrt','gesperrt'],['verbraucht','verbraucht'],['abgelaufen','abgelaufen']]);
  h+='<span class="hint" style="margin:0 0 0 8px">Sortierung:</span>';
  h+=zugSel('sort',[['neu','Neueste zuerst'],['alt','Älteste zuerst']]);
  if(zugFilterActive()) h+='<button class="btn ghost" data-action="zugfilterreset" style="margin-left:auto">✕ Filter zurücksetzen</button>';
  h+='</div>';
  if(_codesErr){
    h+='<div class="card" style="border-color:var(--t1)"><div style="color:var(--t1);font-weight:600">Codes nicht abrufbar</div><div class="hint" style="margin-top:4px">'+esc(_codesErr)+'</div></div>';
    return h;
  }
  if(_praes===null || _tokens===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
    return h;
  }
  /* „unbekannt“ (Flag fehlt) erscheint in beiden Modi — mit Hinweis, nie still versteckt */
  var praesU=_praes.filter(function(p){ var u=umgebungVon(p); return u===_umg || u==='unbekannt'; });
  if(!_praes.length){
    h+='<div class="card"><p class="hint" style="margin:0">Keine Präsidien angelegt.</p></div>';
  }else if(!praesU.length){
    h+='<div class="card"><p class="hint" style="margin:0">Keine Präsidien in der Umgebung '+(_umg==='schulung'?'Schulung':'Echtbetrieb')+'.</p></div>';
  }
  var used={};
  praesU.forEach(function(p){
    var list=_tokens.filter(function(t){ return t.praesidium_id===p.id; });
    list.forEach(function(t){ used[t.short_code||('tok'+Math.random())]=true; });
    var shown=sortTokens(list.filter(tokenMatches));
    var nRev=list.filter(function(t){return t.revoked;}).length;
    var sum=zugFilterActive()
      ? shown.length+' von '+list.length+' Code'+(list.length===1?'':'s')
      : list.length+' Code'+(list.length===1?'':'s')+(nRev?' · '+nRev+' gesperrt':'');
    var key='zug-'+p.id;
    var open=zugFilterActive() || !isCollapsed(key, true);
    if(umgebungVon(p)==='unbekannt') sum='Umgebung unbekannt · '+sum;
    h+='<div class="card">';
    h+=foldHead(key, true, esc(p.name), sum, open);
    if(open){
      /* Owner 2026-10-14: nur noch Dauerhaft · Einmal. Gast-, Beobachter-Codes und
       * (Phase 6.12, D6.12-15) FLZ-Zugänge werden nicht mehr angelegt — bestehende
       * bleiben in der Liste sichtbar und sperrbar. Schalter „alte Code-Arten
       * abschalten“ AN → Hinweis statt Ausgabe (D6.12-21). */
      h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px;align-items:center">';
      if(_zugAlteAus){
        h+='<span class="hint" style="margin:0">Alte Code-Arten sind abgeschaltet — neue Geräte registrieren sich mit dem Präsidiums-Code.</span>';
      }else{
        h+='<span class="hint" style="margin:0">Zugangs-Link erstellen &amp; kopieren:</span>';
        h+='<button class="btn ghost" data-action="mklink" data-pid="'+esc(p.id)+'" data-pname="'+esc(p.name)+'" data-kind="perm">Dauerhaft-Link</button>';
        h+='<button class="btn ghost" data-action="mklink" data-pid="'+esc(p.id)+'" data-pname="'+esc(p.name)+'" data-kind="once">Einmal-Link</button>';
      }
      h+='</div>';
      h+= shown.length ? tokenRows(shown)
        : '<div class="hint">'+(list.length?'Keine Codes passend zum Filter.':'Noch keine Codes für dieses Präsidium.')+'</div>';
      /* Quick 261024: Markieren + „Markierte löschen“ ersetzt „Gesperrte/abgelaufene entfernen (N)“ */
      h+=codeMarkLeiste(p.id, p.name, list, shown);
    }
    h+='</div>';
  });
  var rest=_tokens.filter(function(t){ return !_praes.some(function(p){return p.id===t.praesidium_id;}); });
  if(rest.length){
    var restShown=sortTokens(rest.filter(tokenMatches));
    var restOpen=zugFilterActive() || !isCollapsed('zug-rest', true);
    h+='<div class="card">';
    h+=foldHead('zug-rest', true, 'Ohne Präsidium (MasterToken u. a.)',
      (zugFilterActive()? restShown.length+' von ':'')+rest.length+' Code'+(rest.length===1?'':'s'), restOpen);
    if(restOpen) h+='<div style="margin-top:8px">'+(restShown.length?tokenRows(restShown):'<div class="hint">Keine Codes passend zum Filter.</div>')+codeMarkLeiste('', 'Ohne Präsidium', rest, restShown)+'</div>';
    h+='</div>';
  }
  h+='<p class="hint">„Einmal-Link" = nur einmal einlösbar (danach verbraucht), dann 24 h Zugang. Empfänger: Link kopieren → in ARGUS „📋 Einfügen". Bei der Erstellung kann eine Zuteilung (Name/Dienstnr./Funktion) erfasst werden — sie erscheint als Bezeichnung und macht gezieltes Sperren möglich. Verbrauchte Einmal-Codes werden 6 Monate nach Einlösung automatisch aus dieser Liste gelöscht.</p>';
  if(codeAktionenAn()){
    h+='<p class="hint">„Notiz“ ändert die Bezeichnung eines Codes nachträglich. „Aus Liste löschen“ und das Kästchen zum Markieren gibt es nur für gesperrte, abgelaufene und verbrauchte Codes (verbrauchte Einmal-Codes erst, wenn die damit erteilte Anmeldung abgelaufen ist): Der Code wird endgültig entfernt, der Eintrag im Protokoll bleibt erhalten. „Alle löschbaren markieren“ wählt die sichtbaren löschbaren Codes eines Präsidiums, „Markierte löschen“ löscht sie nach einer Rückfrage nacheinander. Aktive Codes und der MasterToken lassen sich nicht löschen.</p>';
  }
  h+='<p class="hint">Sperren wirkt <b>sofort serverseitig</b> — auch bereits angemeldete Geräte verlieren den Zugriff umgehend (die App zeigt die Abmeldung spätestens beim nächsten Start/Reconnect an). Einzige Ausnahme: Anmeldungen aus der Zeit vor dem 12.06.2026 laufen noch bis zum Ablauf ihrer alten Anmeldung (max. 30 Tage) weiter.</p>';
  h+='<p class="hint">„FLZ-Zugang" (alt) = Code für den Sachbearbeiter der FLZ: öffnet die anonyme Lageansicht des Präsidiums (Lage-Seite und hier) und erlaubt, <b>Dauercodes</b> für das Präsidium auszugeben und zu sperren. Neue FLZ-Zugänge werden nicht mehr ausgegeben — bestehende gelten bis zur Übergabe; neue Sachbearbeiter erhalten einen persönlichen Code oder registrieren sich mit dem Präsidiums-Code.</p>';
  return h;
}

/* Gast-Code (Paket 2, 2026-06-13): Ausgabe ausgebaut (Phase 6.12, Plan 06.12-10,
 * D6.12-20) — Funktion makeGast und Aktion mkgast entfernt; die RPC-Ausgabe lehnt
 * seit 0040 ab, der Direkt-Insert ist seit 0041 per Trigger blockiert. Bestehende
 * Gast-Codes bleiben in „Weitere Zugänge“ sichtbar, sperr- und löschbar und per QR
 * zeigbar (showGastQrModal), bis sie ablaufen. */

/* Schulungs-Provisionierung (Paket 3, Migration 0011): legt für jedes echte
 * Präsidium ein Schwester-Präsidium „<Name> — Schulung" an (master-only,
 * idempotent — der RPC meldet nur tatsächlich neu angelegte Namen). */
async function makeProvision(){
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var r; try{ r=await cl.rpc('argus_provision_schulung'); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error){ toast('Provisionierung fehlgeschlagen: '+(r.error.message||'unbekannt')); return; }
  var neu=(r.data && Array.isArray(r.data.angelegte)) ? r.data.angelegte : [];
  /* toast() setzt textContent — kein esc() nötig (würde doppelt kodieren) */
  toast(neu.length
    ? 'Schulungs-Präsidien angelegt: '+neu.map(function(n){return String(n);}).join(', ')
    : 'Keine neuen Schulungs-Präsidien nötig.');
  praesOderZugNeuLaden();
}

/* Schulungs-Präsidium leeren (Plan 04.14-03, Task 3A, master-only):
 * Ruft argus_schulung_reset auf — tombstont alle offenen CCPs des Schulungs-
 * Präsidiums (patients+checklists gelöscht). Nur bei schulung=true.
 * Muster: makeProvision (master-only RPC-Aktion). */
async function makeReset(pid, pname){
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var ok=await confirmModal(
    'Alle offenen Übungs-CCPs von „'+pname+'“ leeren?\nPatienten und Checklisten dieser CCPs werden gelöscht. Nur Schulungsdaten.',
    'Leeren'
  );
  if(!ok) return;
  var r; try{ r=await cl.rpc('argus_schulung_reset',{p_praesidium_id:pid}); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error||!r.data){ toast('Leeren fehlgeschlagen: '+(r.error?r.error.message:'kein Ergebnis')); return; }
  if(r.data.error){ toast('Leeren nicht möglich: '+r.data.error); return; }
  var res=r.data.reset!=null?r.data.reset:0;
  var hyg=r.data.hygiene!=null?r.data.hygiene:0;
  toast('Präsidium geleert — '+res+' CCP(s) zurückgesetzt, '+hyg+' alte(r) Tombstone(s) bereinigt.');
  praesOderZugNeuLaden();
}

/* Beobachter-Zugang (FLZ, Phase 4.12): vorhandenen aktiven Beobachter-Code des
 * Präsidiums wiederverwenden, sonst neu anlegen. Bewusst NUR der CODE in die
 * Zwischenablage — die Adresse der Lageansicht wird hier NICHT konstruiert
 * (D-06 analog: ihr Name gehört nicht in diese committete Datei). */
async function makeObserver(pid, pname){
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var sc=null;
  var rows=(_tokens||[]).filter(function(t){
    return t.praesidium_id===pid && t.observer && !t.revoked;
  });
  if(rows.length && rows[0].short_code){
    sc=rows[0].short_code;
  }else{
    /* Zuteilung (Nachverfolgbarkeit) — analog Einmal-Link */
    var zut=await promptModal('Empfangsstelle des Beobachter-Zugangs? (z. B. FLZ, Name — erscheint in der Liste; leer = ohne Zuteilung)','');
    if(zut===null) return;   /* Abbrechen = nicht anlegen */
    zut=(zut||'').trim();
    var ins=await cl.from('access_tokens').insert({token:genToken(),praesidium_id:pid,is_master:false,observer:true,label:pname+' FLZ-Beobachter'+(zut?' — '+zut:''),short_code:genShortCode(),temporary:false,ttl_hours:null,single_use:false,used_at:null}).select('short_code').single();
    if(ins.error||!ins.data){ toast('Konnte Beobachter-Code nicht anlegen'+(ins.error?' · '+ins.error.message:'')); return; }
    sc=ins.data.short_code;
  }
  try{ await navigator.clipboard.writeText(sc); toast('Beobachter-Code kopiert ✓ — Adresse der Lageansicht separat übermitteln'); }
  catch(e){ await promptModal('Beobachter-Code (FLZ) — '+pname+' (kopieren; Adresse der Lageansicht separat übermitteln):', sc); }
  loadZugaenge();
}

/* Admin-Token ausgeben (Plan 04.14-02) — Phase 6.12 (Plan 06.12-10, D6.12-15):
 * FLZ-Zugänge werden nicht mehr neu ausgegeben (kein Knopf mehr); bestehende
 * gelten bis zur Übergabe. Der Aufruf zeigt nur noch den Hinweis. */
async function makeAdmin(pid, pname){
  await confirmModal('FLZ-Zugänge werden nicht mehr ausgegeben — bitte eine Person mit persönlichem Code anlegen.', 'OK');
}

/* Link erstellen (Portierung adminlink-Handler der Feld-App):
 * Einmalig = immer neuer Insert; Dauerhaft/24 h = vorhandenen passenden,
 * NICHT gesperrten Code anbieten, sonst neu anlegen. */
async function makeLink(pid, pname, kind){
  /* Phase 6.12 (06.12-10): Ausgabe über argus_vw_code_ausgeben (Dauercode/Einmal-Link,
   * nur bei Schalter „alte Code-Arten abschalten“ AUS — D6.12-15/-21) */
  if(_zugAlteAus){ toast('Alte Code-Arten sind abgeschaltet — neue Geräte registrieren sich mit dem Präsidiums-Code.'); return; }
  var sc=null;
  if(kind==='once'){
    /* Zuteilung (Nachverfolgbarkeit): wer bekommt den Code? Erscheint als
     * Bezeichnung in der Zugänge-Tabelle — Kette Aktion → Code → Zuteilung
     * → Person; die Auflösung zur Person bleibt organisatorisch. */
    var zut=await promptModal('Für wen ist der Einmal-Link? (Name/Dienstnr./Funktion — erscheint in der Liste; leer = ohne Zuteilung)','');
    if(zut===null) return;   /* Abbrechen = nicht anlegen */
    zut=(zut||'').trim();
    var ins=await vwRpc('argus_vw_code_ausgeben',{p_praesidium_id:pid, p_art:'einmal', p_notiz:zut});
    if(!ins.ok || !ins.short_code){ toast('Konnte Einmal-Code nicht anlegen · '+(ins.meldung||'kein Ergebnis')); if(ins.fehler==='alte_codes_aus') loadZugaenge(); return; }
    sc=ins.short_code;   /* bestätigter Code aus der DB */
  }else{
    /* Dauerhaft — Code-Art „24 h" wurde 2026-06-12 abgeschafft (Migration 0006) */
    var rows=(_tokens||[]).filter(function(t){
      return t.praesidium_id===pid && t.art==='dauerhaft' && !t.revoked && !t.loeschbar && !!t.short_code;
    });
    if(rows.length && rows[0].short_code){
      sc=rows[0].short_code;
    }else{
      /* Quick 261019: Notiz wie beim FLZ-Zugang (Bezeichnung „<Präsidium> Dauerhaft-Code — <Notiz>“) */
      var notiz=await promptModal('Notiz zum neuen Dauerhaft-Code? (z. B. Einheit, Empfänger — erscheint in der Liste; leer = ohne Notiz)','');
      if(notiz===null) return;   /* Abbrechen = nicht anlegen */
      notiz=(notiz||'').trim();
      /* Bezeichnung „<Präsidium> Dauerhaft-Code — <Notiz>“ legt der Server an */
      var ins2=await vwRpc('argus_vw_code_ausgeben',{p_praesidium_id:pid, p_art:'dauerhaft', p_notiz:notiz});
      if(!ins2.ok || !ins2.short_code){ toast('Konnte Code nicht anlegen · '+(ins2.meldung||'kein Ergebnis')); if(ins2.fehler==='alte_codes_aus') loadZugaenge(); return; }
      sc=ins2.short_code;
    }
  }
  var url=feldAppRoot()+'#code='+sc;
  var lbl=kind==='once'?'Einmal-Link (24 h)':'Dauerhaft-Link';
  try{ await navigator.clipboard.writeText(url); toast(lbl+' kopiert ✓'); }
  catch(e){ await promptModal(lbl+' — '+pname+' (kopieren):', url); }
  loadZugaenge();
}

/* Code sperren/entsperren (D-11) — Phase 6.12 (06.12-10): argus_vw_code_sperren
 * (Recht im Präsidium des Codes; persönliche Codes nach den Personen-Regeln). */
async function toggleRevoke(sc, isRevoked){
  var msg=isRevoked
    ? 'Code '+sc+' wieder entsperren? Er ist danach am Feldgerät wieder einlösbar.'
    : 'Code '+sc+' sperren? Geräte mit diesem Code verlieren den Zugang beim nächsten Start bzw. bei Wiederverbindung (ab App-Version 0.23).';
  var ok=await confirmModal(msg, isRevoked?'Entsperren':'Sperren');
  if(!ok) return;
  var r=await vwRpc('argus_vw_code_sperren',{p_short_code:sc, p_sperren:!isRevoked});
  if(!r.ok){ toast('Änderung fehlgeschlagen: '+r.meldung); return; }
  toast(isRevoked?'Code entsperrt':'Code gesperrt');
  loadZugaenge();
}

/* ── Bereich „Dauercodes" (FLZ-Zugang = bisherige Admin-Rolle, 0023) ─────
 * Der FLZ-Zugang gibt unbefristete Dauercodes fürs eigene Präsidium aus (via
 * argus_admin_issue_dauerhaft) und sperrt Geräte-Codes des eigenen Präsidiums
 * (via argus_admin_revoke_code). Da der FLZ-/Admin-JWT kein access_tokens-Select
 * darf (kein praesidium_id-Claim), werden die in DIESER Sitzung ausgegebenen
 * Codes clientseitig im Speicher vorgehalten (_adminGastCodes — Name historisch). */
var _adminGastCodes=[];   /* {short_code, label, expires_at, revoked} — diese Sitzung */

function secAdminZugang(){
  var pname=esc(sessionStorage.getItem('argusl_padmin_name')||'');
  var h='<div class="mh"><h2>Dauercodes</h2></div>';
  h+='<div class="card"><div class="hint" style="margin:0 0 6px">Präsidium: <b>'+pname+'</b></div>';
  /* Phase 6.12 (06.12-10, D6.12-21): Schalter „alte Code-Arten abschalten“ AN → Hinweis statt Ausgabe */
  if(_alteCodesAus) h+='<div class="hint" style="margin:0">Alte Code-Arten sind abgeschaltet — neue Geräte registrieren sich mit dem Präsidiums-Code.</div></div>';
  else h+='<button class="btn" data-action="mkadmingast">Dauercode ausgeben</button></div>';
  if(meshKeyAktionAn()){
    h+='<div class="card"><div class="hint" style="margin:0 0 6px">Präsidiums-Schlüssel (Mesh ohne Netz): nur bei Geräteverlust erneuern — kein automatischer Ablauf.</div>';
    h+='<button class="btn ghost" data-action="meshkeyerneuern" data-pid="'+esc(sessionStorage.getItem('argusl_padmin')||'')+'" data-pname="'+pname+'">Präsidiums-Schlüssel erneuern</button></div>';
  }
  if(_adminGastCodes.length){
    h+='<div class="sech">Ausgegebene Codes dieser Sitzung</div>';
    h+='<div class="tablewrap"><table><thead><tr><th>Code</th><th>Bezeichnung</th><th>Gültig</th><th>Status</th><th></th></tr></thead><tbody>';
    _adminGastCodes.forEach(function(c){
      var exp=c.expires_at ? ('bis '+fmtMs(c.expires_at)) : 'unbefristet';
      h+='<tr>';
      h+='<td class="mono" style="font-weight:600;white-space:nowrap">'+esc(c.short_code)+'</td>';
      h+='<td>'+esc(c.label||'')+'</td>';
      h+='<td class="hint">'+exp+'</td>';
      h+='<td>'+(c.revoked ? '<span class="pill red">GESPERRT</span>' : '<span class="pill green">aktiv</span>')+'</td>';
      if(!c.revoked){
        h+='<td><div style="display:flex;gap:6px;flex-wrap:wrap">'
          +'<button class="btn ghost" data-action="showgastqr" data-sc="'+esc(c.short_code)+'" data-lbl="'+esc(c.label||'')+'" title="QR anzeigen">QR</button>'
          +'<button class="btn warn" data-action="adminrevoke" data-sc="'+esc(c.short_code)+'">Sperren</button>'
          +'</div></td>';
      }else{
        h+='<td></td>';
      }
      h+='</tr>';
    });

/* Frist-Einstufung — 1:1 aus der Feld-App portiert (04.8-05, JSC 10/10):
 * 'abgelaufen' (Frist <= jetzt) · 'bald' (< 24 h entfernt) · 'ok' ·
 * null (keine Frist gesetzt). */
function fristStatus(purgeAfter, now){
  if(purgeAfter==null) return null;
  if(now==null) now=nowMs();
  if(+purgeAfter <= now) return 'abgelaufen';
  if(+purgeAfter - now < 86400000) return 'bald';
  return 'ok';
}

async function loadEinsaetze(){

  if(!cl){ _einsErr='Sitzung abgelaufen — bitte neu anmelden.'; if(state.section==='einsaetze') render(); return; }
  /* Phase 6.12 (Plan 06.12-11, D6.12-05): Lagen mit ihrem Einsatz-Index und „Ohne Lage“
   * über rpc/argus_einsatzmappe_liste (0045, nur Zähler und Fristen) — je Umgebung ein
   * Abruf, damit auch Bestands-CCPs ohne Lage ihre Umgebung tragen. Der Server liefert
   * nur Präsidien mit protokoll_lesen (MasterToken alle). */
  var teile={}, mfehler='';
  for(var u=0;u<2;u++){
    var umg=u ? 'schulung' : 'echt';
    var ml=await vwRpc('argus_einsatzmappe_liste', { p_umgebung:umg });

  if(mfehler) _mlisteErr=mfehler;
  else _mliste=einsatzListeZusammen(teile.echt, teile.schulung);
  /* Zähler je Einsatz (Patienten, Fotos, Checklisten) wie bisher über
   * argus_governance_einsaetze — ohne Lagen-Verzeichnis bleibt das die bisherige Liste. */
  try{

    if(r.error){ if(!_mliste) _einsErr=r.error.message||'Abruf fehlgeschlagen'; }
    else{ _eins=Array.isArray(r.data)?r.data:[]; }
  }catch(e){ if(!_mliste) _einsErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(!Array.isArray(_eins) && _mliste) _eins=einsAusListe(_mliste);
  /* Phase 6.8 (D6.8-07) → 6.12-11: Präsidium je Einsatz aus den Antworten (0044 je
   * Einsatz, 0045 je Lage bzw. Bestands-CCP) — kein Lesen von ccps mehr. Ohne
   * Zuordnung → „Ohne Präsidiumszuordnung“ (nichts wird verborgen). */
  if(Array.isArray(_eins)){
    await ensurePraes();
    var map={};
    _eins.forEach(function(e){ if(e && e.ccp_id!=null && e.praesidium_id) map[e.ccp_id]=e.praesidium_id; });
    if(_mliste){
      _mliste.lagen.forEach(function(l){
        (Array.isArray(l.einsaetze)?l.einsaetze:[]).forEach(function(e){ if(e && e.ccp_id!=null && l.praesidium_id) map[e.ccp_id]=l.praesidium_id; });
      });
      _mliste.ohne_lage.forEach(function(e){ if(e.ccp_id!=null && e.praesidium_id) map[e.ccp_id]=e.praesidium_id; });
    }

/* Phase 6.8 (D6.8-07, rein): Einsatz-Gruppen je Präsidium der gewählten Umgebung.
 * keys in Eingangsreihenfolge; gruppen[key].ccp_id → ccpPraes → Präsidium →
 * umgebungVon. Gleiche Umgebung → Block des Präsidiums (Blöcke nach Name, de);
 * andere Umgebung → andere; keine/unbekannte Zuordnung oder Umgebung „unbekannt“
 * → ohne (erscheint in beiden Modi). */
function einsaetzeNachPraesidium(keys, gruppen, ccpPraes, praesidien, umgebung){
  var out={bloecke:[], ohne:[], andere:[]}, idx={}, pmap={}, cp=ccpPraes||{}, gr=gruppen||{};
  (Array.isArray(praesidien) ? praesidien : []).forEach(function(p){ if(p && p.id!=null) pmap['k'+p.id]=p; });
  (keys||[]).forEach(function(k){
    var g=gr[k]||{};
    var pid=(g.ccp_id!=null && Object.prototype.hasOwnProperty.call(cp, g.ccp_id)) ? cp[g.ccp_id] : null;
    var p=(pid!=null && pid!=='') ? pmap['k'+pid] : null;
    var u=p ? umgebungVon(p) : 'unbekannt';
    if(!p || u==='unbekannt'){ out.ohne.push(k); return; }
    if(u!==umgebung){ out.andere.push(k); return; }
    var b=idx['k'+p.id];
    if(!b){ b={pid:p.id, name:p.name||'', keys:[]}; idx['k'+p.id]=b; out.bloecke.push(b); }
    b.keys.push(k);
  });
  out.bloecke.sort(function(a,z){ return String(a.name).localeCompare(String(z.name),'de'); });
  return out;
}
/* Präsidiumsname eines Einsatzes (für die gemischte Wiedervorlage) — '' wenn unbekannt. */
function einsatzPraesName(g){
  var pid=(g && g.ccp_id!=null && _ccpPraes) ? _ccpPraes[g.ccp_id] : null;
  if(!pid || !Array.isArray(_praes)) return '';
  for(var i=0;i<_praes.length;i++){ if(_praes[i] && _praes[i].id===pid) return _praes[i].name||''; }
  return '';
}
/* T-06.8-33: Zahl der Wiedervorlagen (Frist abgelaufen / < 24 h) in der jeweils
 * ANDEREN Umgebung — für das Badge am Umschalter. null, solange nicht geladen. */
function wiedervorlageAndere(){
  /* Phase 6.12 (06.12-11): mit Lagen-Verzeichnis zählen die Einsatzprotokolle der anderen Umgebung */
  if(_mliste) return einsaetzeNachLage(_mliste, _umg, nowMs()).andere.wieder;
  if(!Array.isArray(_eins)) return null;
  var gg=einsatzGroups(), now=nowMs(), n=0;
  var r=einsaetzeNachPraesidium(gg.order, gg.groups, _ccpPraes, _praes, _umg==='schulung' ? 'echt' : 'schulung');
  r.bloecke.forEach(function(b){
    b.keys.forEach(function(k){ var s=fristStatus(gg.groups[k].purge_after, now); if(s==='abgelaufen'||s==='bald') n++; });
  });
  return n;
}

/* Gruppierung: ein Verbund (merge_group_id) = ein Einsatz. */
function einsatzGroups(){
  var groups={}, order=[];
  (_eins||[]).forEach(function(e){
    var k=e.merge_group_id || e.ccp_id || '?';
    if(!groups[k]){
      groups[k]={ key:k, ccp_id:e.ccp_id, kennungen:[], einsatz_typ:e.einsatz_typ,
        closed_at:e.closed_at, purge_after:e.purge_after, photo_purge_after:e.photo_purge_after,
        exported_at:e.exported_at||null,
        patient_count:0, photo_count:0, checklist_count:0 };
      order.push(k);
    }
    var g=groups[k];
    if(e.kennung && g.kennungen.indexOf(e.kennung)<0) g.kennungen.push(e.kennung);
    if(e.exported_at && (!g.exported_at || e.exported_at>g.exported_at)) g.exported_at=e.exported_at;
    g.patient_count+=(+e.patient_count||0);
    g.photo_count+=(+e.photo_count||0);
    g.checklist_count+=(+e.checklist_count||0);
    if(e.closed_at!=null && (g.closed_at==null || +e.closed_at>+g.closed_at)) g.closed_at=e.closed_at;
    if(e.purge_after!=null && (g.purge_after==null || +e.purge_after>+g.purge_after)) g.purge_after=e.purge_after;
    if(e.photo_purge_after!=null && (g.photo_purge_after==null || +e.photo_purge_after>+g.photo_purge_after)) g.photo_purge_after=e.photo_purge_after;
  });
  return { groups:groups, order:order };
}

    if(!b.name && name) b.name=String(name);

/* Druck-Overlay füllen, body[data-mappe-print] setzen, drucken; Aufräumen erst nach dem
 * Druck-Snapshot (afterprint, Rückfall 60 s; iOS-Safari druckt sonst die normale Ansicht). */
function vMappePrint(m, protokolle){
  var h=mappeDruckHtml(m, protokolle);
  var overlay=document.getElementById('mappe-print-overlay');
  if(!overlay){ overlay=document.createElement('div'); overlay.id='mappe-print-overlay'; document.body.appendChild(overlay); }
  overlay.innerHTML=h;
  document.body.setAttribute('data-mappe-print','1');
  var cleaned=false;
  function mappeCleanup(){
    if(cleaned) return; cleaned=true;
    try{ window.removeEventListener('afterprint', mappeCleanup); }catch(e){}
    document.body.removeAttribute('data-mappe-print');
    overlay.innerHTML='';
  }
  window.addEventListener('afterprint', mappeCleanup);
  setTimeout(mappeCleanup, 60000);
  try{ window.print(); }
  catch(e){ mappeCleanup(); }
}
/* Ablauf „Mappe drucken“: Wahl (nur Verzeichnis / mit Einsatzprotokollen) → Mappe
 * (geöffnet oder neu geladen, Pflicht-Log) → ggf. je Einsatz mit Protokoll genau ein
 * argus_governance_protokoll → ein Druckdokument. Ein Fehler → Toast, nichts gedruckt. */
async function druckeMappe(lageId){
  if(!lageId){ toast('Lage nicht gefunden — bitte aktualisieren.'); return; }
  var w=await auswahlModal('Mappe drucken — nur Verzeichnis oder mit Einsatzprotokollen? Jeder Protokoll-Abruf wird protokolliert.\n\nDas Verzeichnis enthält keine Patientendaten; Fotos werden nie gedruckt. Für eine PDF-Datei im Druckdialog „Als PDF sichern“ wählen.',
    [{ wert:'verzeichnis', label:'Nur Verzeichnis' }, { wert:'protokolle', label:'Mit Einsatzprotokollen' }]);
  if(!w) return;
  var d=(_mappe && _mappe.lage && String(_mappe.lage.id)===String(lageId)) ? _mappe : await mappeLaden(lageId);
  if(!d) return;
  var m=mappeModell(d), prot=null;
  if(w==='protokolle'){
    var k=await ensureKuerzel();
    if(!k){ toast('Ohne Kürzel kein Protokoll-Abruf'); return; }
    var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
    var ziel=m.einsaetze.filter(function(g){ return g.status==='protokoll'; });
    prot={};
    for(var i=0;i<ziel.length;i++){
      var g=ziel[i], r;
      toast('Lade Einsatzprotokoll '+(i+1)+' von '+ziel.length+'…');
      try{ r=await cl.rpc('argus_governance_protokoll',{p_ccp_id:g.ccp_id,p_kuerzel:k}); }
      catch(e){ r={error:{message:'keine Verbindung'}}; }
      if(!r || r.error){
        toast('Abruf fehlgeschlagen (CCP '+(g.kennungen.join(' + ')||'?')+'): '+((r && r.error && r.error.message)||'keine Verbindung')+' — nichts gedruckt.');
        return;
      }
      prot[g.ccp_id]=r.data||{};
    }
  }
  vMappePrint(m, prot);
}

  var devs=(d && Array.isArray(d.devices)) ? d.devices : null;
  var ev=(d && Array.isArray(d.herkunft)) ? d.herkunft : null;
  if(!devs && !ev) return null;
  devs=devs||[]; ev=ev||[];
  var kenn={}; devs.forEach(function(x){ if(x && x.kennung) kenn[x.kennung]=true; });
  var merged=Object.keys(kenn).length>1;
  var byId={}; (pats||[]).forEach(function(p){ if(p && p.id!=null) byId[String(p.id)]=patLabelPlain(p); });
  /* Phase 6.10 (Migration 0038): Kennungen der geladenen CCPs — Herkunft im Verbund nennt den CCP des Ursprungsgeräts */
  var kennCcp={}; ((d && Array.isArray(d.ccps)) ? d.ccps : []).forEach(function(c){ if(c && c.id!=null && c.kennung) kennCcp[String(c.id)]=String(c.kennung); });
  var nCcp=Object.keys(kennCcp).length;
  var rows=devs.filter(Boolean).map(function(x){
    var st;
    if(x.left_at) st='verlassen '+hhmmMs(x.left_at);
    else if(x.lost_at && +x.lost_at>=(+x.last_seen||0)) st='abgemeldet durch MasterMedic '+(x.lost_by||'?')+' '+hhmmMs(x.lost_at);
    else st='zuletzt gesehen '+hhmmMs(x.last_seen);
    return { label:(merged && x.kennung ? (x.kennung+'·'+x.device_no) : String(x.device_no)),
      op:x.operator||'', first:x.first_seen, last:x.last_seen, status:st, open:(x.open_n|0) };
  });
  var herk={}, events=[];
  ev.forEach(function(e){
    if(!e || typeof e!=='object') return;
    var det=(e.detail && typeof e.detail==='object') ? e.detail : {};
    var dev=parseInt(det.dev,10)||0;
    if(e.action==='herkunft'){
      var h=herk[dev]||(herk[dev]={direkt:{}, nachgereicht:{}, nachfrist:{}, mesh:{}});
      if(det.weg==='mesh'){
        /* Phase 6.7 (D6.7-04): Gateway-Upload aus dem Mesh — Ursprungsgerät je Satz unter mesh[fuer] sammeln.
         * Phase 6.10 (0038): im Verbund zusätzlich nach CCP des Ursprungsgeräts (detail.fuer_ccp) — nur wenn
         * vom gebuchten CCP verschieden (ohne ccp_id im Ereignis: nur im Verbund) und die Kennung bekannt ist. */
        var fuer=parseInt(det.fuer,10)||dev;
        var fc=(det.fuer_ccp!=null) ? String(det.fuer_ccp) : '';
        var fk=(fc && kennCcp[fc] && (e.ccp_id!=null ? fc!==String(e.ccp_id) : nCcp>1)) ? kennCcp[fc] : '';
        var mk=String(fuer)+(fk ? '|'+fk : '');
        var ms=h.mesh[mk]||(h.mesh[mk]={fuer:fuer, ccp:fk, ids:{}});
        (Array.isArray(det.ids)?det.ids:[]).forEach(function(id){ ms.ids[String(id)]=true; });
      }else{
        var w=(det.weg==='nachgereicht'||det.weg==='nachfrist') ? det.weg : 'direkt';
        (Array.isArray(det.ids)?det.ids:[]).forEach(function(id){ h[w][String(id)]=true; });
      }
    }else if(e.action==='flz_merge'){
      /* D6.9-05: Zuordnung durch die FLZ — kein Gerät beteiligt (dev:null) */
      events.push({at:e.at, label:flzMergeEreignis(det), dev:null, kuerzel:e.kuerzel||'', open:null});
    }else if(HERK_EV[e.action]){
      events.push({at:e.at, label:HERK_EV[e.action], dev:dev, kuerzel:e.kuerzel||'', open:(det.open_n!=null ? (det.open_n|0) : null)});
    }
  });
  function names(set){
    var known=[], more=0;
    Object.keys(set).forEach(function(id){ if(byId[id]) known.push(byId[id]); else more++; });
    known.sort(function(a,b){ return a<b?-1:a>b?1:0; });
    return {known:known, more:more};
  }
  var herkRows=Object.keys(herk).map(Number).sort(function(a,b){return a-b;}).map(function(dev){
    var h=herk[dev];
    var mesh=Object.keys(h.mesh).map(function(k){ return h.mesh[k]; }).sort(function(a,b){
      return (a.fuer-b.fuer) || (a.ccp<b.ccp?-1:a.ccp>b.ccp?1:0);
    }).map(function(g){
      var nm=names(g.ids); return {fuer:g.fuer, ccp:g.ccp, known:nm.known, more:nm.more, n:Object.keys(g.ids).length};
    });
    return {dev:dev, direktN:Object.keys(h.direkt).length, nach:names(h.nachgereicht), nf:names(h.nachfrist), mesh:mesh};
  });
  events.sort(function(a,b){ return (+a.at||0)-(+b.at||0); });
  return {rows:rows, herk:herkRows, events:events};
}
function vDatenherkunft(d, pats){
  var m=herkunftModel(d, pats);
  var h='<div class="sech">Datenherkunft</div>';
  if(!m){
    return h+'<div class="card"><p class="hint" style="margin:0">Keine Herkunftsdaten (Server-Migration 0026 fehlt).</p></div>';
  }
  if(!m.rows.length && !m.herk.length && !m.events.length){
    return h+'<div class="card"><p class="hint" style="margin:0">Keine Geräte- oder Herkunftsdaten erfasst.</p></div>';
  }
  if(m.rows.length){
    h+='<div class="tablewrap"><table><thead><tr><th>Gerät</th><th>Bediener</th><th>Erstes Signal</th><th>Letztes Signal</th><th>Status</th><th>Offen beim letzten Signal</th></tr></thead><tbody>';
    m.rows.forEach(function(r){
      h+='<tr><td class="mono" style="font-weight:600">'+esc(r.label)+'</td><td>'+(r.op?esc(r.op):'—')+'</td>'+
        '<td class="hint" style="white-space:nowrap">'+esc(fmtMs(r.first))+'</td><td class="mono">'+esc(hhmmMs(r.last))+'</td>'+
        '<td>'+esc(r.status)+'</td><td>'+esc(String(r.open))+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  if(m.herk.length){
    h+='<div class="card" style="margin-top:8px"><div style="font-weight:600;margin-bottom:4px">Herkunft der Patienten je Gerät</div>';
    m.herk.forEach(function(r){
      var parts=[];
      if(r.direktN) parts.push('direkt '+r.direktN+' '+(r.direktN===1?'Patient':'Patienten'));
      function lst(o){ return o.known.map(esc).join(', ')+(o.more ? (o.known.length?' ':'')+'+'+o.more+' weitere' : ''); }
      if(r.nach.known.length||r.nach.more) parts.push('nachgereicht: '+lst(r.nach));
      if(r.nf.known.length||r.nf.more) parts.push('nach Abschluss (Nachfrist): '+lst(r.nf));
      /* Phase 6.7 (D6.7-04): Gateway — dieses Gerät hat Patienten eines anderen Geräts aus dem Mesh hochgeladen */
      (r.mesh||[]).forEach(function(mm){
        if(mm.known.length||mm.more) parts.push('für Gerät '+esc(String(mm.fuer))+(mm.ccp ? ' · CCP '+esc(mm.ccp) : '')+' (Mesh): '+mm.n+' '+(mm.n===1?'Patient':'Patienten')+' — '+lst(mm));
      });
      h+='<div style="font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--surf2)">Gerät '+esc(String(r.dev||'?'))+': '+(parts.length?parts.join(' · '):'—')+'</div>';
    });
    h+='</div>';
  }
  if(m.events.length){
    h+='<div class="card" style="margin-top:8px"><div style="font-weight:600;margin-bottom:4px">Ereignisse</div>';
    m.events.forEach(function(e){
      h+='<div style="font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--surf2)"><span class="mono">'+esc(fmtMs(e.at))+'</span>'+(e.dev!==null ? ' · Gerät '+esc(String(e.dev||'?'))+' ' : ' · ')+esc(e.label)+
        (e.kuerzel?(' · '+esc(e.kuerzel)):'')+(e.open!=null?(' · offen: '+esc(String(e.open))):'')+'</div>';
    });
    h+='</div>';
  }
  return h;
}

/* AT-MIST-Druckansicht (Paket 3): druckbare Karten je Patient aus dem bereits
 * geladenen Protokoll (_detail.data.patients) — KEIN API-Aufruf, KEINE Fotos
 * (argus_governance_protokoll liefert ohnehin kein photo-Feld, nur has_photo).
 * Vorlage: exportPrintCard der Feld-App; fehlende Helper (fmtDur/ageStr/pno/
 * Maßnahmen-Labels) als Inline-Varianten portiert. */
function vAtmistPrint(){
  var d=_detail && _detail.data;
  if(!d) return;
  var pats=activePats(d);   /* Grabsteine nie als Patienten */
  if(!pats.length){ toast('Keine Patientendaten (mehr) vorhanden.'); return; }
  var ccps=Array.isArray(d.ccps)?d.ccps:[];
  var kenn=ccps.map(function(c){return c.kennung||'?';}).sort().join(', ')||'?';
  /* row()-Helper — 1:1 aus exportPrintCard der Feld-App */
  function row(letter,label,val){
    return '<div style="display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line)">'+
      '<span class="mono" style="width:22px;height:22px;border-radius:6px;background:var(--acc);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+letter+'</span>'+
      '<div style="flex:1;min-width:0"><div style="font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700">'+label+'</div>'+
      '<div style="font-size:13.5px;line-height:1.4">'+val+'</div></div></div>';
  }
  /* Inline-Helper (in der Leitungs-Seite nicht vorhanden — bewusst lokal) */
  function pno(p){ return esc(String(p.num!=null?p.num:'?'))+(p.ccp?' <span style="font-size:13px;color:var(--mut)">('+ccpDisp(p.ccp)+')</span>':''); }
  function fmtDur(ms){
    if(ms==null||ms<0) return '—';
    var m=Math.floor(ms/60000);
    return (m>=60?Math.floor(m/60)+' h ':'')+(m%60)+' min';
  }
  function ageStr(ms){
    if(!ms) return '—';
    return new Date(+ms).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';
  }
  /* Maßnahmen-Labels der Feld-App (TXG flach): p.tx ist ein Objekt {feldId:true} */
  var TXL={seiten:'Seitenlage',wendl:'Wendl/Güdel',larynx:'Larynxtubus',intub:'ET-Intubation',konio:'Koniotomie',
    chest:'Chest Seal',entlast:'Entlastungspkt.',drainage:'Thoraxdrainage',
    druck:'Druckverband',tampon:'Tamponade',haemo:'Hämostatikum',becken:'Beckenschlinge',zugang:'i.v./i.o.',
    txa:'TXA',medo:'Meds andere',waerme:'Wärmeerhalt',schiene:'Schienung',hws:'HWS-Immo.'};
  var now=nowMs();
  /* TQ-Referenzzeitpunkt je CCP: das Protokoll existiert nur für ABGESCHLOSSENE
   * Einsätze und kann Tage später gedruckt werden — "now - tq_start" wäre dann
   * medizinisch irreführend ("TQ seit 53 h"). Referenz ist daher closed_at des
   * zugehörigen CCP (Fallback now, falls die Row unerwartet offen wäre). */
  var ccpClose={}; ccps.forEach(function(c){ if(c&&c.id&&c.closed_at)ccpClose[c.id]=+c.closed_at; });
  var h='<div style="padding:12px"><div style="font-weight:700;font-size:15px;margin-bottom:2px">AT-MIST · CCP '+esc(kenn)+'</div>';
  h+='<div style="font-size:11.5px;color:var(--mut);margin-bottom:10px">Einsatzprotokoll · gedruckt '+new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr · '+pats.length+' Patient(en) · ohne Fotos</div>';
  pats.slice().sort(function(a,b){ return (+a.num||0)-(+b.num||0); }).forEach(function(p){
    var c=CATS[p.cat]||null;
    var dim='<span style="color:#9aa0a6;font-style:italic">— nicht erfasst</span>';
    var ap=[]; if(p.age)ap.push(esc(String(p.age))+' J');
    var g=p.gender==='m'?'männl.':(p.gender==='w'?'weibl.':''); if(g)ap.push(g);
    var tp=[];
    /* tq_start: snake_case — Protokoll-Rows kommen roh aus der DB (to_jsonb),
     * NICHT aus dem normalisierten Feld-App-Modell (dort hieße es tqStart).
     * Dauer bis Einsatzende (closed_at), plus absolute Anlagezeit. */
    var tqRef=ccpClose[p.ccp_id]||now;
    /* TQ nicht mehr unter „Zeiten" (AT-MIST: das Tourniquet ist eine Maßnahme → tl unten). */
    if(p.created)tp.push('erfasst '+ageStr(p.created));
    var il=[];
    if(Array.isArray(p.inj))p.inj.forEach(function(it){ if(it)il.push(esc(String(it.r||'?'))+' – '+esc(String(it.a||'?'))); });
    if(p.injury&&String(p.injury).trim())il.push(esc(String(p.injury)));
    var v=(p.vit&&typeof p.vit==='object')?p.vit:{};
    var vp=[['WASB',v.avpu],['AF',v.af],['SpO₂',v.spo2],['HF',v.hf],['RR',v.rr],['Schmerz',v.pain]]
      .filter(function(x){return x[1]!=null&&String(x[1]).trim()!=='';});
    var sVal=vp.length?('<span class="mono">'+vp.map(function(x){return x[0]+' '+esc(String(x[1]));}).join(' · ')+'</span>'):dim;
    if(p.allergies)sVal+='<br><b style="color:var(--t1)">⚠ Allergien: '+esc(String(p.allergies))+'</b>';
    var vlog=Array.isArray(v.log)?v.log:[];
    if(vlog.length){
      /* filter(Boolean): ein null-Eintrag im gemeinsam geschriebenen jsonb-Log
       * darf nicht den gesamten Druck per TypeError abbrechen. */
      sVal+='<div style="margin-top:4px;font-size:11.5px;color:var(--mut)">Verlauf:'+vlog.filter(Boolean).map(function(m){
        var tm=(m&&m.t)?new Date(+m.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'—';
        var parts=[]; if(m.af)parts.push('AF '+esc(String(m.af))); if(m.spo2)parts.push('SpO₂ '+esc(String(m.spo2)));
        if(m.hf)parts.push('HF '+esc(String(m.hf))); if(m.rr)parts.push('RR '+esc(String(m.rr)));
        if(m.avpu)parts.push('WASB '+esc(String(m.avpu))); if(m.pain)parts.push('Schmerz '+esc(String(m.pain)));
        return '<br>'+tm+': '+(parts.join(' · ')||'—');
      }).join('')+'</div>';
    }
    var tl=[]; if(p.tq_start)tl.push('<b style="color:var(--t1)">Tourniquet'+(p.tq_site?' ('+esc(String(p.tq_site))+')':'')+' · angelegt '+ageStr(p.tq_start)+' · '+fmtDur(tqRef-p.tq_start)+' bis Einsatzende</b>');
    if(p.tx&&typeof p.tx==='object'){
      Object.keys(TXL).forEach(function(k){ if(p.tx[k])tl.push(esc(TXL[k])); });
    }
    h+='<div class="card" style="padding:10px 13px;margin-bottom:10px;page-break-inside:avoid">';
    h+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
       '<span class="mono" style="font-size:18px;font-weight:700">'+pno(p)+'</span>'+
       (c?'<span class="pill" style="background:'+c.bg+';color:'+c.fg+'">'+c.label+'</span>':'<span class="pill gray">'+esc(String(p.cat||'—'))+'</span>')+
       (p.prio?'<span class="pill" style="background:var(--prio);color:#fff">PRIO</span>':'')+
       (p.status==='gpa'?'<span class="pill gray">gPA</span>':'')+
       (p.name&&String(p.name).trim()!==''?'<span style="font-size:12.5px;color:var(--mut)">Name: '+esc(String(p.name))+'</span>':'')+
       '</div>';
    h+='<div style="margin-top:6px">';
    h+=row('A','Alter / Geschlecht', ap.length?ap.join(' · '):dim);
    h+=row('T','Zeiten', tp.length?tp.join(' · '):dim);
    h+=row('M','Mechanismus', (p.moi&&String(p.moi).trim()!=='')?esc(String(p.moi)):dim);
    h+=row('I','Verletzungen', il.length?il.join('<br>'):dim);
    h+=row('S','Befund / Vitalwerte', sVal);
    h+=row('T','Maßnahmen', tl.length?tl.map(function(x){return '▸ '+x;}).join('<br>'):dim);
    h+='</div></div>';
  });
  h+='</div>';
  var overlay=document.getElementById('atmist-print-overlay');
  if(!overlay){ overlay=document.createElement('div'); overlay.id='atmist-print-overlay'; document.body.appendChild(overlay); }
  overlay.innerHTML=h;
  document.body.setAttribute('data-atmist-print','1');
  /* Cleanup erst NACH dem Druck-Snapshot: auf nicht-blockierenden Browsern
   * (iOS/iPadOS Safari) laeuft das Skript hinter window.print() sofort weiter —
   * direktes Entfernen des Attributs druckte die normale Protokollansicht.
   * Daher einmaliger afterprint-Listener; Fallback-Timeout fuer Browser ohne
   * afterprint; try/catch, damit das Attribut bei werfendem print() nicht
   * dauerhaft gesetzt bleibt. */
  var cleaned=false;
  function atmistCleanup(){
    if(cleaned)return; cleaned=true;
    try{ window.removeEventListener('afterprint',atmistCleanup); }catch(e){}
    document.body.removeAttribute('data-atmist-print');
    overlay.innerHTML='';
  }
  window.addEventListener('afterprint',atmistCleanup);
  setTimeout(atmistCleanup,60000);
  try{ window.print(); }
  catch(e){ atmistCleanup(); }
}

/* Foto-Einzelabruf (Lazy-Load, eigener Protokoll-Eintrag foto_view) */
async function showFoto(pid, num){
  var k=await ensureKuerzel();
  if(!k){ toast('Ohne Kürzel kein Foto-Abruf'); return; }
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var r;
  try{ r=await cl.rpc('argus_governance_photo',{p_patient_id:pid,p_kuerzel:k}); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error){ toast('Foto-Abruf fehlgeschlagen: '+(r.error.message||'keine Verbindung')); return; }
  var photo=r.data && r.data.photo;
  if(!photo){ toast('Kein Foto vorhanden — bereits endgültig gelöscht?'); return; }
  /* Sicherheit (Stored-XSS-Härtung): photo ist ein von Feldgeräten geschriebener
   * DB-Wert. Nur strikte data:image-Base64-URIs zulassen und NIE per innerHTML
   * einsetzen (Attribut-Breakout) — Element per DOM bauen, src als Property. */
  if(typeof photo!=='string' || !/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=\s]+$/i.test(photo)){
    toast('Ungültiges Bildformat — Anzeige abgebrochen.'); return;
  }
  var ts=new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:12px;cursor:pointer';
  var img=document.createElement('img');
  img.alt='Patientenfoto';
  img.style.cssText='max-width:100%;max-height:78%;object-fit:contain;border-radius:8px';
  img.src=photo;   /* validiert; als Property gesetzt → kein HTML-Parsing */
  ov.appendChild(img);
  var cap=document.createElement('div');
  cap.style.cssText='color:#cfd6df;font-size:12.5px;text-align:center;max-width:480px';
  cap.textContent='Patient Nr. '+(num||'?')+' · Dieser Abruf wurde protokolliert ('+k+', '+ts+' Uhr).';
  ov.appendChild(cap);
  var xbtn=document.createElement('div');
  xbtn.style.cssText='position:absolute;top:12px;right:16px;color:#fff;font-size:30px;line-height:1;font-weight:300';
  xbtn.textContent='✕';
  ov.appendChild(xbtn);
  document.body.appendChild(ov);
  ov.addEventListener('click',function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); });
}

/* Protokoll-Frist +72 h (D-03): Pflicht-Begründung mit Leer-Abweisung,
 * Bestätigung mit Frist-Vorschau + Export-Hinweis, wirkt auf den Verbund. */
async function extendFrist(ccpId, kennung, frist){
  var k=await ensureKuerzel();
  if(!k){ toast('Ohne Kürzel keine Verlängerung'); return; }
  var grund=null, msg='Begründung (Pflicht): Warum muss das Einsatzprotokoll über die Frist hinaus aufbewahrt werden?';
  for(;;){
    var inp=await promptModal(msg,'');
    if(inp===null) return;   /* abgebrochen */
    if(inp.trim()){ grund=inp.trim(); break; }
    msg='Begründung darf nicht leer sein — bitte den Grund angeben (Pflichtfeld):';
  }
  var neu=Math.max(nowMs(), +frist||0)+72*3600000;   /* Vorschau — verbindlich rechnet der Server identisch */
  var ok=await confirmModal('Protokoll-Frist für CCP '+kennung+' um 72 Std verlängern — neue Frist: '+fmtMs(neu)+'. Die Foto-Frist bleibt unverändert (Fotos werden nicht verlängert). Bei dauerhaftem Bedarf: Export an die zuständige Stelle statt wiederholter Verlängerung.','+72 h verlängern');
  if(!ok) return;
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var r;
  try{ r=await cl.rpc('argus_extend_protokoll_frist',{p_ccp_id:ccpId,p_kuerzel:k,p_grund:grund,p_stunden:72}); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error){ toast('Verlängerung fehlgeschlagen: '+(r.error.message||'keine Verbindung')); return; }
  var nf=r.data && r.data.purge_after;
  toast('Frist verlängert'+(nf?' — bis '+fmtMs(nf):''));
  loadEinsaetze();
}

/* Felder eines Personen-Formulars (Präfix px) aus dem DOM lesen. */
function personFormLesen(px){
  function el(id){ return document.getElementById(px+id); }
  var w={ kuerzel:'', rolle:'sachbearbeiter', stamm:'', alle:false, bereiche:[], notiz:'' }, e;
  if((e=el('usbnk'))) w.kuerzel=String(e.value||'').trim().toUpperCase();
  if((e=el('rolle')) && e.value) w.rolle=e.value;
  if((e=el('praes'))) w.stamm=e.value||'';
  if((e=el('alle'))) w.alle=!!e.checked;
  if((e=el('label'))) w.notiz=String(e.value||'');
  var boxes=document.querySelectorAll('input[data-ber="'+px+'"]');
  for(var i=0;i<boxes.length;i++){ if(boxes[i].checked && boxes[i].value && boxes[i].value!==w.stamm) w.bereiche.push(boxes[i].value); }
  if(w.rolle!=='administrator'){ w.alle=false; w.bereiche=[]; }
  if(w.alle) w.bereiche=[];
  return w;
}

    render(); return;
  }
  var k=w.kuerzel.replace(/[\s\-]/g,'');

  if(!w.alle && !w.stamm){ _persForm.fehler='Bitte ein Stamm-Präsidium wählen.'; render(); return; }

  _persForm.laeuft=true;
  var r=await vwRpc('argus_vw_person_anlegen', { p_kuerzel:k, p_rolle:w.rolle, p_stamm:w.stamm||null,

  }
  var kz=(r.identitaet && r.identitaet.kuerzel) || k;

/* ── Nachweis: Filter, Zeilen, Export für den DSB (Phase 6.12, Plan 06.12-11, D6.12-04/-08) ──
 * Zeitraum aus Datumsfeldern (lokaler Tag, einschließlich), Präsidium nur aus dem Bereich
 * der Sitzung (Server prüft erneut), Aktion bzw. Lösch-Grund. Export über
 * rpc/argus_vw_nachweis_export (serverseitig protokolliert) als CSV (Semikolon, UTF-8 mit
 * BOM, Schutz gegen Formel-Ausführung) oder JSON. Server-Texte nur über esc(). */
function nachweisZeitraum(von, bis){
  function tag(s, ende){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s==null ? '' : s));
    if(!m) return null;
    var t=new Date(+m[1], +m[2]-1, +m[3], ende?23:0, ende?59:0, ende?59:0, ende?999:0).getTime();
    return isFinite(t) ? t : null;
  }
  return { von:tag(von, false), bis:tag(bis, true) };
}
function nachweisArgs(quelle, f, limit){
  var x=(f && typeof f==='object') ? f : {}, z=nachweisZeitraum(x.von, x.bis);
  var a={ p_quelle:quelle, p_von:z.von, p_bis:z.bis, p_praesidium_id:x.praes ? String(x.praes) : null,
    p_aktion:(x.action && x.action!=='alle') ? String(x.action) : null };
  if(limit!=null) a.p_limit=limit;
  return a;
}

function nachweisZeilenHtml(zeilen, quelle){

        '<td>'+esc(String(l.photo_count!=null?l.photo_count:'—'))+'</td><td>'+esc(String(l.checklist_count!=null?l.checklist_count:'—'))+'</td></tr>';

/* Rein: CSV für den DSB — Semikolon, jedes Feld in Anführungszeichen (verdoppelt),
 * UTF-8-BOM, Zellen mit = + - @ Tab oder Wagenrücklauf am Anfang erhalten ein ' (T-06.12-1102). */
function nachweisCsv(zeilen, spalten){
  var sp=Array.isArray(spalten) ? spalten : [];
  function zelle(v){
    var s=(v==null) ? '' : (typeof v==='object' ? JSON.stringify(v) : String(v));
    if(/^[=+\-@\t\r]/.test(s)) s="'"+s;
    return '"'+s.replace(/"/g, '""')+'"';
  }
  var out=[sp.map(zelle).join(';')];
  (Array.isArray(zeilen) ? zeilen : []).forEach(function(r){
    var x=(r && typeof r==='object') ? r : {};
    out.push(sp.map(function(k){ return zelle(Object.prototype.hasOwnProperty.call(x, k) ? x[k] : null); }).join(';'));
  });
  return '﻿'+out.join('\r\n')+'\r\n';
}

async function nachweisExport(quelle, format){
  var q=(quelle==='audit' || quelle==='loeschlaeufe') ? quelle : 'protokoll';
  var fm=format==='json' ? 'json' : 'csv';
  var gf=_glogFilter||{};
  var f= q==='audit' ? _auditFilter : (q==='protokoll' ? gf : { praes:gf.praes, von:gf.von, bis:gf.bis });
  var args=nachweisArgs(q, f);
  args.p_format=fm;
  toast('Export wird erstellt…');
  var r=await vwRpc('argus_vw_nachweis_export', args);
  if(!r.ok){ toast('Export nicht möglich: '+r.meldung); return; }
  var zeilen=(Array.isArray(r.zeilen) ? r.zeilen : []).filter(function(z){ return z && typeof z==='object'; }).map(function(z){
    var c={}; Object.keys(z).forEach(function(k){ c[k]=z[k]; });
    c.zeit=(z.at!=null && isFinite(+z.at)) ? new Date(+z.at).toISOString() : '';
    return c;
  });
  var d=new Date(nowMs());
  function zz(n){ return (n<10?'0':'')+n; }
  var name='argus-nachweis-'+q+'-'+d.getFullYear()+'-'+zz(d.getMonth()+1)+'-'+zz(d.getDate())+'.'+fm;
  try{
    if(fm==='csv') nachweisDownload(name, nachweisCsv(zeilen, NACHWEIS_SPALTEN[q]), 'text/csv;charset=utf-8');
    else nachweisDownload(name, JSON.stringify({ exportiert:d.toISOString(), quelle:q,
      filter:{ von:args.p_von, bis:args.p_bis, praesidium_id:args.p_praesidium_id, aktion:args.p_aktion },
      anzahl:zeilen.length, mehr:r.mehr===true, zeilen:zeilen }, null, 2), 'application/json');
  }catch(e){ toast('Export fehlgeschlagen'); return; }
  toast('Export erstellt — '+zeilen.length+' Einträge (protokolliert)'+(r.mehr===true ? ' · weitere vorhanden, Zeitraum eingrenzen' : ''));
}

var _adminLageData=null, _adminLageErr=null, _adminLageTimer=null;
/* Phase 6.8 (D6.8-04): Zeitpunkt des letzten erfolgreichen Polls — Alter der

  var lagen=Array.isArray(_adminLageData.einsatzlagen) ? _adminLageData.einsatzlagen : null;

   * Summenleiste, Kopfband-Karten je Verbund/CCP, Aktualität mit Fallback.
   * Keine Koordinaten-Kopie, keine Ort-Korrektur (FLZ-Zugang ist read-only). */
  var gruppen=lageGruppen(ccps), vn=0, ohneAkt=false;

  gruppen.forEach(function(g){ if(g.verbund) vn++; });
  ccps.forEach(function(c){ if(!c || typeof c!=='object' || !('zuletzt_gesehen' in c)) ohneAkt=true; });
  function karte(g){

  }
  if(lagen){

      a.gis.forEach(function(gi){ h+=karte(gruppen[gi]); });
      h+='</div>';
      if(!a.gis.length) h+='<p class="hint" style="margin:0">Noch kein CCP in dieser Lage.</p>';

    h+=summenLeiste(lageSummen(ccps));

  return h;
}
async function loadAdminLage(){
  _adminLageData=null; _adminLageErr=null;
  if(state.section==='admin-lage') render();
  /* Auto-Refresh starten (Intervall sauber clearen falls schon läuft) */
  if(_adminLageTimer){ clearInterval(_adminLageTimer); _adminLageTimer=null; }
  await _doAdminLagePoll();
  _adminLageTimer=setInterval(_doAdminLagePoll, 20000);
}
async function _doAdminLagePoll(){
  var cl=sb();
  if(!cl){
    _adminLageErr='Sitzung abgelaufen — bitte neu anmelden.';
    if(state.section==='admin-lage') render();
    if(_adminLageTimer){ clearInterval(_adminLageTimer); _adminLageTimer=null; }
    return;
  }
  try{
    var r=await cl.rpc('argus_lage');
    if(r.error){ _adminLageErr=r.error.message||'Abruf fehlgeschlagen'; }
    else{ _adminLageData=r.data||null; _adminLageErr=null; _adminLageOkAt=nowMs(); }
  }catch(e){ _adminLageErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(state.section==='admin-lage') render();
}

document.addEventListener('click', async function(e){

    state.section=nav.getAttribute('data-nav');
