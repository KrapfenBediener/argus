<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS · Verwaltung</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../assets/icon-verwaltung-192.png">
<link rel="apple-touch-icon" href="../assets/icon-verwaltung-180.png">
<meta name="apple-mobile-web-app-title" content="ARGUS Verwaltung">
<style>
  /* Selbst gehostete Schriften (kein externes CDN) */
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-400.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-500.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-600.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-700.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-600.woff2) format('woff2')}
  :root{
    --bg:#fff; --surf:#f6f7f8; --surf2:#eef0f2; --line:#d9dde1;
    --tx:#16181a; --mut:#5d6368;
    --t1:#C62828; --t2:#F2B600; --t3:#2E7D32; --t5:#1b1d20; --t5b:#3a3d41;
    --prio:#E65100; --ready:#1565C0; --acc:#1f2530;
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--surf);color:var(--tx);font-family:var(--sans);line-height:1.5;font-size:14px}
  button{font-family:var(--sans);cursor:pointer;border:0}
  input,textarea{font-family:var(--sans);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--tx);width:100%}
  input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
  select{font-family:var(--sans);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;color:var(--tx)}
  select:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
  .mono{font-family:var(--mono)}
  /* Topbar (Schiefer = Chrome) */
  .topbar{background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;position:sticky;top:0;z-index:50}
  .topbar .brand{font-weight:700;letter-spacing:1px;font-size:16px}
  .topbar .brand small{font-weight:400;letter-spacing:0;opacity:.75;margin-left:8px;font-size:12px}
  .topbar button{background:#ffffff1d;color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600}
  .topbar button:hover{background:#ffffff30}
  /* Layout: Seitennavigation + Inhalt */
  .layout{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100vh - 46px)}
  .side{background:#fff;border-right:1px solid var(--line);padding:14px 12px}
  .side .sh{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:4px 2px 8px}
  .side .it{padding:9px 11px;border-radius:8px;font-size:13.5px;margin-bottom:3px;cursor:pointer;user-select:none}
  .side .it:hover{background:var(--surf2)}
  .side .it.on{background:var(--acc);color:#fff}
  .side .it.on:hover{background:var(--acc)}
  .side .lockedsec{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line)}
  .side .lockedsec .sh{color:var(--mut)}
  .side .locked{padding:9px 11px;border-radius:8px;font-size:13.5px;margin-bottom:3px;color:var(--mut);opacity:.5;cursor:not-allowed;user-select:none;display:flex;justify-content:space-between;align-items:center}
  .side .locked:hover{background:none}
  .main{padding:20px 22px 60px;max-width:1100px;width:100%}
  .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .mh h2{margin:0;font-size:18px}
  /* Bausteine */
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px}
  .hint{font-size:12px;color:var(--mut)}
  .sech{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
  /* Einklappbare Karten/Blöcke (Owner-Wunsch 2026-06-12: weniger Scrollen) */
  .cardhead{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .cardhead .chev{flex:0 0 auto;color:var(--mut);font-size:10px;display:inline-block;transition:transform .15s}
  .cardhead.open .chev{transform:rotate(90deg)}
  .cardhead .ctitle{font-weight:600;font-size:15px}
  .cardhead .csum{color:var(--mut);font-size:12px;font-weight:400;margin-left:auto;white-space:nowrap}
  .sech.fold{cursor:pointer;user-select:none}
  .sech.fold .chev{display:inline-block;font-size:9px;margin-right:5px;transition:transform .15s}
  .sech.fold.open .chev{transform:rotate(90deg)}
  /* Druck (Übergabe-Export): nur den Inhalt, keine Navigation/Buttons */
  @media print{
    .side,.topbar,.btn,.mh button{display:none!important}
    body{background:#fff}
    .layout{display:block}
    /* AT-MIST-Druckmodus (Paket 3): nur das Karten-Overlay drucken */
    body[data-atmist-print] .layout{display:none!important}
    body[data-atmist-print] #atmist-print-overlay{display:block!important}
    /* Phase 6.12 (06.12-11): Einsatzmappe — nur das eigene Druck-Overlay (ein Dokument je Lage) */
    body[data-mappe-print] .layout,body[data-mappe-print] .ubar{display:none!important}
    body[data-mappe-print] #mappe-print-overlay{display:block!important}
  }
  /* AT-MIST-Overlay nur im Druckmodus sichtbar */
  #atmist-print-overlay{display:none}
  /* Phase 6.12 (06.12-11): Mappe-Overlay nur im Druckmodus der Einsatzmappe sichtbar */
  #mappe-print-overlay{display:none}
  .btn{background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
  .btn:hover{filter:brightness(1.25)}
  .btn.ghost{background:var(--surf2);color:var(--tx)}
  .btn.ghost:hover{filter:none;background:var(--line)}
  .btn.warn{background:var(--t1)}
  .btn[disabled]{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--surf2);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .tablewrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
  .pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .pill.gray{background:var(--surf2);color:var(--mut)}
  .pill.red{background:var(--t1)}
  .pill.green{background:var(--t3)}
  /* Login */
  .loginwrap{min-height:calc(100vh - 46px);display:flex;align-items:flex-start;justify-content:center;padding:60px 14px}
  .loginbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px;max-width:380px;width:100%;box-shadow:0 6px 22px rgba(0,0,0,.06)}
  .loginbox h1{font-size:18px;margin:0 0 4px}
  .arg-logo{width:52px;height:52px;border-radius:13px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin:0 auto 14px;letter-spacing:1px}
  .fieldlab{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
  .lerr{color:var(--t1);font-size:12.5px;font-weight:600;margin-top:10px;min-height:18px}
  /* Modal */
  .modalov{position:fixed;inset:0;background:rgba(15,21,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
  .modalbx{background:#fff;border-radius:13px;padding:20px 18px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .modalmsg{font-size:14px;margin-bottom:14px;white-space:pre-wrap}
  .modalrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  /* Toast */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--acc);color:#fff;font-weight:600;padding:11px 20px;border-radius:30px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:2000;max-width:90%}
  .toast.show{opacity:1}
  /* Wiedervorlage */
  .wieder{border:1px solid var(--t1);border-left:5px solid var(--t1);border-radius:11px;background:#fff;padding:14px;margin-bottom:14px}
  .wieder .wt{color:var(--t1);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  /* 6.8-BAUSTEINE-ANFANG */
  /* Geteilt mit der Verwaltung (Drift-Test): Klassen der Bausteine umgebungsBand,
   * summenLeiste, karteA. Hintergründe über Variablen (Großbild überschreibt nur diese). */
  .uband{padding:8px 14px;font-weight:700;font-size:13px;letter-spacing:.3px;line-height:1.35;border-left:10px solid transparent}
  .uband.u-echt{background:#39404b;color:#fff;border-left-color:var(--t1)}
  .uband.u-schulung{background:#F2B600;color:#1b1d20;border-left-color:#1b1d20}
  .uband.u-unbekannt{background:#c9cdd2;color:#1b1d20;border-left-color:#6b7178}
  /* Summenleiste D6.8-03: sechs große Kacheln + schmale Nebenzeile */
  .sumbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0 0 6px}
  .sumbar .sum{background:var(--bg);border-radius:10px;padding:12px 6px 10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  /* Infokacheln (abtransportiert, offene CCPs): nur umrandet, ohne Füllung, in der Textfarbe des Modus */
  .sumbar .sum.info{background:transparent;border:2px solid var(--tx);color:var(--tx);box-shadow:none}
  .sumbar .n{font-family:var(--mono);font-weight:700;font-size:38px;line-height:1.05;color:inherit}
  .sumbar .l{font-size:13px;font-weight:700;color:inherit}
  .sumneben{font-size:12.5px;color:var(--mut);margin:0 0 12px;padding:0 2px}
  .sumneben b{font-family:var(--mono);font-weight:600;color:var(--tx)}
  /* Kartenmuster A D6.8-02: 2-px-Rahmen, dunkles Kopfband, Kategorien, Metazeile */
  .ka{background:var(--bg);border:2px solid var(--acc);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .kb{background:var(--acc);color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 10px;padding:7px 10px;font-weight:700;font-size:14px;line-height:1.3}
  .kb.alt{background:#6b7178}
  .kb.rot{background:var(--t1)}
  .kb .kbl{min-width:0;overflow-wrap:anywhere}
  .kbr{flex:0 0 auto;margin-left:auto;font-weight:600;font-size:12px;white-space:nowrap}
  .ka .geo{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
  .ka .ked{cursor:pointer;font-size:13px;opacity:.85;margin-left:4px}
  .kz{display:flex;gap:5px;padding:9px 10px 5px}
  .kz .k{flex:1;border-radius:6px;text-align:center;color:#fff;padding:6px 0 5px}
  .kz .k .n{display:block;font-family:var(--mono);font-weight:700;font-size:22px;line-height:1.05}
  .kz .k .l{font-size:10px;font-weight:600;opacity:.95}
  .kmeta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:3px 10px 8px;font-size:12px;color:var(--mut)}
  .kmeta b{font-family:var(--mono);font-weight:600;color:var(--tx)}
  /* Verbund: je Mitglied eine Standortzeile (eine Patientenliste, mehrere Orte) */
  .vmem{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);padding:5px 10px;border-top:1px dashed var(--line)}
  .vmem .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vmem .ked{margin-left:auto}
  /* Verbund D6.9-10: kleiner Hinweis „Verbund“ unter dem Kopfband */
  .vhin{padding:4px 10px 0;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut)}
  .vhin .vort{color:var(--tx)}
  /* D6.10-08: Anzeige-Zusatz „Kennung doppelt“ (Pille) am CCP-Kopf und an der Mitgliedszeile */
  .kdop{display:inline-block;margin-left:6px;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:.3px;background:#F2B600;color:#1b1d20;white-space:nowrap;vertical-align:1px}
  .vmem .kdop{flex:0 0 auto}
  /* Lagen D6.11-08/-10: Abschnitt je Lage mit Kopf (Name, „vor Ort eröffnet“, CCPs, Eröffnung) */
  .labschnitt{margin:18px 0 0}
  .lkopf{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0 0 8px;padding:8px 12px;border-left:8px solid var(--acc);border-radius:6px;background:var(--surf2);color:var(--tx);font-size:15px;font-weight:700}
  .lkopf.ohne{border-left-color:#9aa1a8}
  .lkopf .lkn{min-width:0;overflow-wrap:anywhere}
  .lkopf .lvo{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .lkopf .lkr{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--mut)}
  .lkhin{font-size:12px;color:var(--mut);margin:-4px 0 8px 2px}
  .lgesamt{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
  /* 6.8-BAUSTEINE-ENDE */
  /* 6.8-VERWALTUNG — Bandzeile mit Umschalter, Navigationsgruppen, Raster (nur Verwaltung) */
  .ubar{position:sticky;top:var(--toph,46px);z-index:40;display:flex;align-items:stretch;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .ubar .uband{flex:1;display:flex;align-items:center;min-width:0}
  .ubar .segw{display:flex;align-items:stretch;background:var(--acc)}
  .seg{background:var(--acc);color:#fff;padding:8px 16px;font-size:13px;font-weight:700;white-space:nowrap;border-left:1px solid #ffffff33;display:flex;align-items:center;gap:6px;border-radius:0}
  .seg:hover{background:#39404b}
  .seg.on{background:#fff;color:var(--acc);box-shadow:inset 0 -4px 0 var(--t1)}
  .seg.on.s-schulung{background:#F2B600;color:#1b1d20;box-shadow:inset 0 -4px 0 #1b1d20}
  .wvz{display:inline-block;min-width:19px;padding:0 6px;border-radius:10px;background:var(--t1);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;line-height:19px;text-align:center;border:1px solid #fff}
  .side .sh.grp{margin:16px 2px 6px;color:var(--acc);font-weight:700}
  .side .sh.grp:first-child{margin-top:4px}
  .lgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .eliste{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
  .ka .kbody{padding:9px 12px 4px;font-size:13px}
  .ka .kakt{display:flex;gap:8px;flex-wrap:wrap;padding:6px 12px 12px}
  .kb .pill{font-size:11px}
  .kb .pill.gray{background:#ffffff26;color:#fff}
  .kb .pill{border:1px solid #ffffff80}
  .ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:20px 0 8px;padding:6px 12px;border-radius:6px;background:var(--surf2);border-left:6px solid var(--acc);font-weight:700;font-size:14px}
  .ptitle .pcount{font-weight:600;font-size:12px;color:var(--mut)}
  .ptitle.ohne{border-left-color:#6b7178}
  /* 6.12-VERWALTUNG — Übersicht „Was braucht Aufmerksamkeit“ (nur Verwaltung) */
  .uebraster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card.ueb{margin-bottom:0;border-left:6px solid var(--acc)}
  .card.ueb.neutral{border-left-color:#6b7178}
  .card.ueb.leer{border-left-color:var(--t3);font-weight:600}
  .ueb .uebk{display:flex;align-items:baseline;gap:10px}
  .ueb .uebn{font-family:var(--mono);font-size:22px;font-weight:700;min-width:28px}
  .ueb .uebt{font-weight:600;font-size:14px}
  .ueb .uebli{margin:8px 0 0;padding-left:18px;font-size:13px}
  .ueb .uebakt{margin-top:10px}
  @media(max-width:900px){ .uebraster{grid-template-columns:1fr} }
  @media(max-width:900px){ .lgrid{grid-template-columns:1fr 1fr} .sumbar{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media(max-width:760px){
    .layout{grid-template-columns:1fr}
    .side{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
    .side .sh{width:100%;margin:2px}
    .side .it,.side .locked{margin-bottom:0}
    .side .lockedsec{margin-top:0;padding-top:0;border-top:0;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
    .main{padding:14px}
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">ARGUS<small>· Verwaltung<span id="toprole"></span></small></span>
  <button id="logoutbtn" data-action="logout" style="display:none">Abmelden</button>
</div>
<div id="app"></div>
<div class="hint" style="text-align:center;padding:14px 16px 18px">Datenschutzhinweis: in der ARGUS-App unter Hilfestellungen → Datenschutz.</div>
<div class="toast" id="toast"></div>
<script src="../vendor/supabase.js"></script>
<script src="../config.js"></script>
<script>
"use strict";

/* ============================================================
 * ARGUS · Leitung — Governance-Oberfläche (Desktop)
 * Alle Inhalte ausschließlich nach Anmeldung mit MasterToken
 * (is_master-JWT). Die Seite selbst enthält keine Daten.
 * Sitzung bewusst flüchtig: sessionStorage, kein Verlauf.
 * ============================================================ */

/* ── Inline-QR-Generator (Plan 04.14-03, Task 1; ersetzt 04.14-03) ───
 * Erprobter, breit eingesetzter QR-Encoder INLINE (kein externes CDN, kein npm).
 * Library: qrcode-generator von Kazuhiko Arase
 *   Quelle: https://github.com/kazuhikoarase/qrcode-generator
 *   Lizenz: MIT (frei verwendbar; Copyright (c) 2009 Kazuhiko Arase)
 * Supply-Chain-Sichtung (T-0414-11): kompakte, unveränderte Portierung des
 *   bekannten qrcode-generator-Kerns (Byte-Modus, automatische Versions-/
 *   Maskenwahl) — keine Netz-Requests, keine eval/Function-Konstrukte.
 *
 * Öffentliche API (unverändert für Task 2):
 *   drawQR(targetEl, text)  — rendert einen scannbaren QR als <canvas>.
 * ──────────────────────────────────────────────────────────────────── */
(function(){
/* === qrcode-generator (Kazuhiko Arase, MIT) — kompakter Kern === */
var qrcode=function(){
  var qrcode=function(typeNumber,errorCorrectionLevel){
    var PAD0=0xEC,PAD1=0x11;
    var _typeNumber=typeNumber;
    var _errorCorrectionLevel=QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules=null,_moduleCount=0,_dataCache=null,_dataList=[];
    var _this={};
    var makeImpl=function(test,maskPattern){
      _moduleCount=_typeNumber*4+17;
      _modules=function(moduleCount){
        var modules=new Array(moduleCount);
        for(var row=0;row<moduleCount;row+=1){
          modules[row]=new Array(moduleCount);
          for(var col=0;col<moduleCount;col+=1){ modules[row][col]=null; }
        }
        return modules;
      }(_moduleCount);
      setupPositionProbePattern(0,0);
      setupPositionProbePattern(_moduleCount-7,0);
      setupPositionProbePattern(0,_moduleCount-7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test,maskPattern);
      if(_typeNumber>=7){ setupTypeNumber(test); }
      if(_dataCache==null){ _dataCache=createData(_typeNumber,_errorCorrectionLevel,_dataList); }
      mapData(_dataCache,maskPattern);
    };
    var setupPositionProbePattern=function(row,col){
      for(var r=-1;r<=7;r+=1){
        if(row+r<=-1||_moduleCount<=row+r) continue;
        for(var c=-1;c<=7;c+=1){
          if(col+c<=-1||_moduleCount<=col+c) continue;
          if((0<=r&&r<=6&&(c==0||c==6))||(0<=c&&c<=6&&(r==0||r==6))||(2<=r&&r<=4&&2<=c&&c<=4)){
            _modules[row+r][col+c]=true;
          }else{ _modules[row+r][col+c]=false; }
        }
      }
    };
    var getBestMaskPattern=function(){
      var minLostPoint=0,pattern=0;
      for(var i=0;i<8;i+=1){
        makeImpl(true,i);
        var lostPoint=QRUtil.getLostPoint(_this);
        if(i==0||minLostPoint>lostPoint){ minLostPoint=lostPoint; pattern=i; }
      }
      return pattern;

    var qr=qrcode(0,'M');          /* Typ 0 = automatische Versionswahl, ECC Level M */
    qr.addData(String(text),'Byte');
    qr.make();
    var count=qr.getModuleCount();
    var quiet=4;                   /* Quiet-Zone: 4 Module (Spec-konform) */
    var target=Math.min(256, (targetEl&&targetEl.offsetWidth)||256);
    var msize=Math.max(3, Math.floor(target/(count+2*quiet)));
    var cw=(count+2*quiet)*msize;
    var cv=document.createElement('canvas');
    cv.width=cw; cv.height=cw;
    cv.style.cssText='display:block;image-rendering:pixelated;max-width:100%;height:auto';
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,cw);
    ctx.fillStyle='#000';
    for(var r=0;r<count;r+=1){ for(var c=0;c<count;c+=1){ if(qr.isDark(r,c)){ ctx.fillRect((c+quiet)*msize,(r+quiet)*msize,msize,msize); } } }
    if(targetEl){ targetEl.innerHTML=''; targetEl.appendChild(cv); }
    return cv;
  }catch(e){
    if(targetEl){ targetEl.textContent='QR konnte nicht erzeugt werden'; }
    return null;
  }
};
})();

/* ── APP_INSTALL_URL: öffentliche Feld-App-Installadresse (Plan 04.14-03, Task 2)
 * PFLEGE: diese Konstante auf die öffentliche Installadresse der ARGUS-Feld-App
 * setzen (z. B. "https://argus.example.de"). Bewusst NICHT die geheime
 * Leitungs-URL (D-06). Leer lassen = QR zeigt Hinweis statt Link. */
var APP_INSTALL_URL = 'https://krapfenbediener.github.io/argus';

/* buildGastDeepLink(short_code) → <APP_INSTALL_URL>/index.html#code=<sc>
 * Der Feld-App unterstützt #code= BEREITS (index.html, wird hier NICHT geändert). */
function buildGastDeepLink(sc){
  if(!APP_INSTALL_URL) return '';
  return APP_INSTALL_URL.replace(/\/+$/,'')+'/index.html#code='+encodeURIComponent(sc);
}

/* showGastQrModal(sc, label) — zeigt QR + Klartext-Code nach Gast-Code-Ausgabe.
 * Kein natives alert/confirm/prompt — In-App-Modal (Projektkonvention). */
function showGastQrModal(sc, label){
  var link=buildGastDeepLink(sc);
  var qrHtml='';
  if(link){
    qrHtml='<div id="gast-qr-canvas" style="display:flex;justify-content:center;margin:10px 0"></div>';
  }else{
    qrHtml='<div class="hint" style="margin:8px 0;color:var(--t1)">App-Adresse nicht hinterlegt — QR nicht verfügbar. Bitte APP_INSTALL_URL in der Leitungs-Seite setzen.</div>';
  }
  var ov=document.createElement('div'); ov.className='modalov';
  ov.innerHTML='<div class="modalbx" style="max-width:380px">'
    +'<div style="font-weight:700;font-size:15px;margin-bottom:6px">Code als QR</div>'
    +(label?'<div class="hint" style="margin-bottom:8px">'+esc(label)+'</div>':'')
    +qrHtml
    +'<div style="text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:3px;margin:8px 0">'+esc(sc)+'</div>'
    +(link?'<div class="hint" style="word-break:break-all;margin-bottom:6px">'+esc(link)+'</div>':'')
    +'<div class="hint" style="margin-bottom:12px">Scannen öffnet die ARGUS-App mit vorausgefülltem Code.</div>'
    +'<div class="modalrow"><button class="btn" data-m="close">Schließen</button></div>'
    +'</div>';
  document.body.appendChild(ov);
  if(link){
    var cel=ov.querySelector('#gast-qr-canvas');
    if(cel) drawQR(cel, link);
  }
  ov.addEventListener('click',function(e){
    var b=e.target.closest('[data-m]');
    if(b||e.target===ov) ov.remove();
  });
}

/* Phase 6.12 (Plan 06.12-10): Code-Dialog für persönliche Codes und Monats-Codes
 * (T-06.12-1002) — Code nur im Dialogtext und im QR (Deep-Link #code=), nie in
 * Attributen; Kopierknopf; In-App-Modal (keine nativen Dialoge).
 * o = {titel, code, zeilen[]}. codeDialogHtml ist rein. */
function codeDialogHtml(o){
  o=o || {};
  var link=o.code ? buildGastDeepLink(String(o.code)) : '';
  var h='<div style="font-weight:700;font-size:15px;margin-bottom:6px">'+esc(o.titel||'Code')+'</div>';
  h+= link ? '<div id="vw-qr" style="display:flex;justify-content:center;margin:10px 0"></div>'
           : '<div class="hint" style="margin:8px 0;color:var(--t1)">App-Adresse nicht hinterlegt — QR nicht verfügbar.</div>';
  h+='<div style="text-align:center;font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:3px;margin:8px 0">'+esc(o.code||'—')+'</div>';
  (Array.isArray(o.zeilen) ? o.zeilen : []).forEach(function(z){ if(z) h+='<div class="hint" style="margin-bottom:6px">'+esc(z)+'</div>'; });
  h+='<div class="hint" style="margin-bottom:12px">Scannen öffnet die ARGUS-App mit vorausgefülltem Code.</div>';
  h+='<div class="modalrow"><button class="btn ghost" data-m="kopieren">Code kopieren</button><button class="btn" data-m="close">Schließen</button></div>';
  return h;
}
function codeDialog(o){
  var ov=modalBase(codeDialogHtml(o));
  var link=(o && o.code) ? buildGastDeepLink(String(o.code)) : '';
  var cel=ov.querySelector('#vw-qr');
  if(cel && link) drawQR(cel, link);
  ov.addEventListener('click', async function(e){
    var b=e.target.closest('[data-m]');
    if(b && b.getAttribute('data-m')==='kopieren'){
      try{ await navigator.clipboard.writeText(String(o.code)); toast('Code kopiert ✓'); }
      catch(err){ toast('Kopieren nicht möglich — bitte abschreiben.'); }
      return;
    }
    if(b || e.target===ov) ov.remove();
  });
  return ov;
}

/* HTML-Escaping JEDES dynamischen Werts — Daten kommen aus gemeinsam
 * beschreibbaren Tabellen (Kennungen, Labels, Begründungen von Feld-Geräten). */
function esc(s){
  if(s==null) return '';

}

function ccpDisp(c){ c=(c==null?'':String(c)); var i=c.indexOf('~'); if(i<0) return esc(c); var base=c.slice(0,i), dev=parseInt(c.slice(i+1),10)||0; return esc(base)+(dev?(' · Gerät '+dev):''); }
/* de-DE-Datumsformat für bigint-Millisekunden (Muster govFmt der Feld-App) */
function fmtMs(ms){
  if(ms==null) return '—';
  return new Date(+ms).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr';
}
/* timestamptz (ISO-String, z. B. purge_log.at) ebenfalls de-DE */
function fmtIso(s){
  if(!s) return '—';
  var d=new Date(s);
  if(isNaN(d.getTime())) return esc(String(s));
  return d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr';
}

function kennungKurz(k){

}

function sitzungsPraesidium(pid, pname, praesidien){
  var liste=Array.isArray(praesidien) ? praesidien : [], hit=null, i;
  if(pid){ for(i=0;i<liste.length;i++){ if(liste[i] && liste[i].id===pid){ hit=liste[i]; break; } } }
  if(!hit && pname){ for(i=0;i<liste.length;i++){ if(liste[i] && liste[i].name===pname){ hit=liste[i]; break; } } }
  if(hit) return {id:hit.id, name:hit.name, umgebung:umgebungVon(hit)};
  return {id:pid||'', name:pname||'', umgebung:umgebungVon({name:pname})};
}
function lageGruppen(ccps){
  var idx={}, out=[], vn=0;
  (ccps||[]).forEach(function(c){
    var key=c.verbund_gruppe || ('solo-'+(c.praesidium_id||'')+'-'+c.kennung);
    var g=idx['k'+key];
    if(!g){ g={key:key, verbund:!!c.verbund_gruppe, n:0, members:[]}; idx['k'+key]=g; out.push(g); }
    g.members.push(c);
  });
  out.forEach(function(g){
    if(g.verbund && g.members.length<2) g.verbund=false;
    if(g.verbund) g.n=++vn;
  });
  return out;
}
function lageHaupt(members){
  var m=(Array.isArray(members) ? members : []).filter(function(c){ return !!c && typeof c==='object'; });
  var best=null, i;
  if(!m.length) return null;
  for(i=0;i<m.length;i++){ if(m[i].id && m[i].id===m[i].verbund_gruppe) return m[i]; }
  function kenn(c){ return (c.kennung===null || c.kennung===undefined || c.kennung==='') ? null : String(c.kennung); }
  best=m[0];
  for(i=1;i<m.length;i++){
    var a=kenn(m[i]), b=kenn(best);
    if(a!==null && (b===null || a<b)) best=m[i];
  }
  return best;
}
function lageSummen(list){

  (list||[]).forEach(function(c){

    s.gpa+=(+c.gpa||0); s.prio+=(+c.prio||0); s.ready+=(+c.ready||0);
  });
  s.pat=s.t1+s.t2+s.t3+s.t5+s.gpa;

}
/* geteilt — D6.11-08/-10: Abschnitte je Lage; Verbund → Lage des Haupt-CCP; unbekannte/fehlende Lage → „Ohne Lage“.
 * gruppen aus lageGruppen, lagen = einsatzlagen der Lage-Antwort (nur Objekte mit
 * Zeichenketten-id). Reihenfolge: Eröffnungszeit, dann Name, dann id. Je Lage (auch
 * ohne CCP) {key, lage, gis, s}; zuletzt höchstens ein {key:'ohne', lage:null, gis, s}
 * — nur mit mindestens einer Gruppe. gis = Indizes in gruppen, s = lageSummen. */
function lagenAbschnitte(gruppen, lagen){
  var gr=Array.isArray(gruppen) ? gruppen : [], idx={}, out=[], ohne={key:'ohne', lage:null, gis:[], s:null}, ohneM=[];
  var ls=(Array.isArray(lagen) ? lagen : []).filter(function(l){ return !!l && typeof l==='object' && typeof l.id==='string'; });
  ls.sort(function(a, b){
    var d=(+a.eroeffnet_at||0)-(+b.eroeffnet_at||0);
    if(d) return d<0 ? -1 : 1;
    d=String(a.name||'').localeCompare(String(b.name||''), 'de');
    if(d) return d;
    return a.id<b.id ? -1 : (a.id>b.id ? 1 : 0);
  });
  ls.forEach(function(l){
    if(idx['k'+l.id]) return;
    var ab={key:l.id, lage:{id:l.id, name:l.name, vor_ort:l.vor_ort, eroeffnet_at:l.eroeffnet_at}, gis:[], s:null, m:[]};
    idx['k'+l.id]=ab; out.push(ab);
  });
  gr.forEach(function(g, gi){
    var m=(g && g.members) || [], hp=lageHaupt(m), lid=hp && hp.einsatzlage_id;
    var ab=(typeof lid==='string' && idx['k'+lid]) || null;
    if(ab){ ab.gis.push(gi); ab.m=ab.m.concat(m); }
    else{ ohne.gis.push(gi); ohneM=ohneM.concat(m); }
  });
  out.forEach(function(ab){ ab.s=lageSummen(ab.m); delete ab.m; });
  if(ohne.gis.length){ ohne.s=lageSummen(ohneM); out.push(ohne); }
  return out;
}
/* geteilt — D6.11-08/-10: Kopf eines Lage-Abschnitts — Lagename (escaped), Kennzeichen

function ccpAktualitaet(c, standMs, seitPollMs, schwelleMs){
  function zahl(v){
    if(typeof v==='number') return isFinite(v) ? v : null;
    if(typeof v==='string' && v.trim()!=='' && isFinite(+v)) return +v;
    return null;
  }
  c=c||{};
  var la=zahl(c.letzte_aenderung);
  if(!('zuletzt_gesehen' in c)) return {modus:'ohne', t:la, alt:false, min:null};
  var hb=zahl(c.zuletzt_gesehen), t=null;
  if(hb!==null) t=hb;
  if(la!==null && (t===null || la>t)) t=la;
  if(t===null) return {modus:'mit', t:null, alt:true, min:null};
  var alter=Math.max(0, (+standMs||0) + Math.max(0, +seitPollMs||0) - t);
  return {modus:'mit', t:t, alt:alter>schwelleMs, min:Math.floor(alter/60000)};
}
function gruppenAktualitaet(members, standMs, seitPollMs, schwelleMs){
  function zahl(v){
    if(typeof v==='number') return isFinite(v) ? v : null;
    if(typeof v==='string' && v.trim()!=='' && isFinite(+v)) return +v;
    return null;
  }
  var la=null, zg=null, hat=false;
  (members||[]).forEach(function(c){
    if(!c) return;
    var a=zahl(c.letzte_aenderung);
    if(a!==null && (la===null || a>la)) la=a;
    if('zuletzt_gesehen' in c){
      hat=true;
      var g=zahl(c.zuletzt_gesehen);
      if(g!==null && (zg===null || g>zg)) zg=g;
    }
  });
  var syn={letzte_aenderung:la};
  if(hat) syn.zuletzt_gesehen=zg;
  return ccpAktualitaet(syn, standMs, seitPollMs, schwelleMs);
}

/* ── Sitzung (D-07): sessionStorage (Standard, flüchtig) + Opt-in „Angemeldet bleiben" ──
 * Schlüssel argusl_jwt / argusl_jwt_exp / argusl_role / argusl_padmin /
 * argusl_padmin_name / argusl_kuerzel. Standard: Tab zu = Sitzung weg.
 * Opt-in (Owner 2026-10-14): mit gesetztem argusl_keep werden die Schlüssel
 * zusätzlich in localStorage gespiegelt und beim nächsten Öffnen wiederhergestellt
 * — bis zum Ablauf des JWT (Master: 30 Tage), bis „Abmelden" oder bis der Server
 * mit 401 ablehnt (Sofortsperre greift also weiterhin). Explizite Schlüsselliste
 * statt Präfix-Scan: gleicher Origin wie die Lage-Seite (argusl_ ⊂ arguslg_). */
/* Phase 6.12 (Plan 06.12-09): + argusl_irolle/_ialle/_istamm/_ipraes der persönlichen
 * Sitzung (Rolle ident). Die Geräte-Kennung argusl_geraet gehört bewusst NICHT dazu. */
var SESS_KEYS=['argusl_jwt','argusl_jwt_exp','argusl_role','argusl_padmin','argusl_padmin_name','argusl_kuerzel','argusl_keep','argusl_irolle','argusl_ialle','argusl_istamm','argusl_ipraes'];
function sessWipeLocal(){ try{ SESS_KEYS.forEach(function(k){ localStorage.removeItem(k); }); }catch(e){} }
function sessRestore(){
  try{
    if(sessionStorage.getItem('argusl_jwt')) return;
    if(localStorage.getItem('argusl_keep')!=='1' || !localStorage.getItem('argusl_jwt')) return;
    SESS_KEYS.forEach(function(k){ var v=localStorage.getItem(k); if(v!=null) sessionStorage.setItem(k,v); });
  }catch(e){}
}
function sessMirror(){
  try{
    if(sessionStorage.getItem('argusl_keep')!=='1') return;
    if(localStorage.getItem('argusl_jwt')===sessionStorage.getItem('argusl_jwt')) return;
    SESS_KEYS.forEach(function(k){ var v=sessionStorage.getItem(k); if(v!=null) localStorage.setItem(k,v); });
  }catch(e){}
}
function sessionJwt(){
  sessRestore();
  var jwt=sessionStorage.getItem('argusl_jwt');
  var exp=parseInt(sessionStorage.getItem('argusl_jwt_exp')||'0',10);
  if(!jwt||!exp) return null;
  if(exp<=nowMs()){ sessionStorage.clear(); sessWipeLocal(); return null; }
  sessMirror();
  return jwt;
}
function sb(){
  var jwt=sessionJwt();
  if(!jwt) return null;
  if(_sb && jwt===_sbJwt) return _sb;
  var lib=window.supabase;
  if(!lib || !lib.createClient) return null;
  _sbJwt=jwt;
  _sb=lib.createClient(SUPA_URL, SUPA_KEY, {
    auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false},
    global:{ headers:{ Authorization:'Bearer '+jwt } }
  });
  return _sb;
}

/* ── Phase 6.12 (Plan 06.12-09): persönliche Anmeldung und Sitzung ──────────
 * D6.12-02/-14/-21. Persönliche Codes (Trainer/Administrator) melden sich zuerst
 * über rpc/argus_anmelden an (Oberfläche 'verwaltung', Geräte-Kennung dieser
 * Seite für die Fehlversuchs-Begrenzung je Gerät). Alt-Codes (MasterToken,
 * FLZ-Zugang, nicht übertragene Phase-5-Personen) → fehler alt_code bzw. HTTP 404
 * (Server ohne argus_anmelden) → unverändert die bisherige Kette in doLogin.
 * Bestandssitzungen (ohne argusl_i*) bleiben angemeldet und unverändert. */
/* Geräte-Kennung dieser Seite: 16 Hex-Zeichen, dauerhaft in localStorage
 * 'argusl_geraet' (nicht in SESS_KEYS — überlebt das Abmelden). */
function vwGeraetId(){
  var v='', b=new Uint8Array(8), i;
  try{ v=localStorage.getItem('argusl_geraet')||''; }catch(e){}
  if(/^[0-9a-f]{16}$/.test(v)) return v;
  try{ crypto.getRandomValues(b); }catch(e){ for(i=0;i<8;i++) b[i]=Math.floor(Math.random()*256); }
  v='';
  for(i=0;i<8;i++) v+=(b[i]+256).toString(16).slice(1);
  try{ localStorage.setItem('argusl_geraet', v); }catch(e){}
  return v;
}
/* Antwort-Klasse von argus_anmelden: 'ident' (persönliche Sitzung), 'alt'
 * (bisherige Kette: alt_code, HTTP 404/≠2xx, unlesbare Antwort, abgelaufen — die
 * Alt-RPCs entscheiden dann selbst) oder 'fehler' (Meldung ohne Rückfall:
 * alt_code_aus, gedrosselt, rolle, gesperrt, code, registrierung, oberflaeche,
 * konfiguration …). */
function anmeldeKlasseVw(d, status){
  if(d && typeof d==='object' && d.ok===true && d.jwt) return 'ident';
  if(status===404 || !(status>=200 && status<300)) return 'alt';
  if(!d || typeof d!=='object' || d.ok!==false || typeof d.fehler!=='string') return 'alt';
  if(d.fehler==='alt_code' || d.fehler==='abgelaufen') return 'alt';
  return 'fehler';
}
/* Meldung zur Klasse 'fehler' (Server-Text; Präsidiums-Code mit eigenem Hinweis). */
function anmeldeMeldungVw(d){
  if(d && d.fehler==='registrierung') return 'Präsidiums-Code — gilt nur für die Selbstregistrierung in der Feld-App.';
  if(d && typeof d.meldung==='string' && d.meldung) return d.meldung;
  if(d && d.fehler==='rolle') return 'Ihre Rolle nutzt die FLZ-Seite und die Feld-App — die Verwaltung ist Trainern und Administratoren vorbehalten.';
  return 'Anmeldung fehlgeschlagen.';
}
/* Präsidien der persönlichen Sitzung normalisiert ({id, name, schulung}). */
function praesListeVw(l){
  return (Array.isArray(l) ? l : []).filter(function(p){
    return !!p && typeof p==='object' && typeof p.id==='string' && !!p.id;
  }).map(function(p){ return {id:p.id, name:String(p.name==null ? '' : p.name), schulung:!!p.schulung}; });
}
function identPraesVw(){
  try{ return praesListeVw(JSON.parse(sessionStorage.getItem('argusl_ipraes')||'[]')); }catch(e){ return []; }
}
/* Rolle/Bereich der persönlichen Sitzung (aus argus_anmelden bzw. argus_sitzung). */
function identDatenSpeichernVw(d){
  sessionStorage.setItem('argusl_irolle', String(d.rolle==null ? '' : d.rolle));
  sessionStorage.setItem('argusl_ialle', d.bereich_alle===true ? '1' : '');
  sessionStorage.setItem('argusl_istamm', String(d.stamm_praesidium_id==null ? '' : d.stamm_praesidium_id));
  sessionStorage.setItem('argusl_ipraes', JSON.stringify(praesListeVw(d.praesidien)));
}
function identSitzungSpeichernVw(d){
  sessionStorage.setItem('argusl_jwt', d.jwt);
  sessionStorage.setItem('argusl_jwt_exp', String((+d.exp||0)*1000));
  sessionStorage.setItem('argusl_role', 'ident');
  sessionStorage.setItem('argusl_kuerzel', String(d.kuerzel==null ? '' : d.kuerzel));
  identDatenSpeichernVw(d);
}
/* Laufende Prüfung der persönlichen Sitzung (T-06.12-0902): beim Start und alle
 * 5 min rpc/argus_sitzung. art null (gesperrt, abgelaufen, gelöscht) bzw. 401 →
 * abmelden mit Hinweis; sonst Rolle/Bereich übernehmen und nur bei Änderung neu
 * zeichnen (Eingaben bleiben erhalten). Netz-/Serverfehler → nichts tun. */
var _sitzTimer=null;
async function sitzungAktualisieren(){
  if(sessionRole()!=='ident') return;
  var jwt=sessionJwt();
  if(!jwt){ render(); return; }
  var resp=null, d=null;
  try{
    resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_sitzung',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+jwt },
      body:'{}'
    });
  }catch(e){ return; }
  if(!resp) return;
  if(resp.status===401){ doLogout('Sitzung beendet — bitte neu anmelden.'); return; }
  if(!(resp.status>=200 && resp.status<300)) return;
  try{ d=await resp.json(); }catch(e){ return; }
  if(!d || typeof d!=='object') return;
  if(d.art===null){ doLogout('Sitzung beendet — bitte neu anmelden.'); return; }
  if(d.art!=='identitaet') return;
  var vorher=['argusl_kuerzel','argusl_irolle','argusl_ialle','argusl_istamm','argusl_ipraes'].map(function(k){ return sessionStorage.getItem(k); }).join('|');
  identDatenSpeichernVw(d);
  if(d.kuerzel!=null && d.kuerzel!=='') sessionStorage.setItem('argusl_kuerzel', String(d.kuerzel));
  var nachher=['argusl_kuerzel','argusl_irolle','argusl_ialle','argusl_istamm','argusl_ipraes'].map(function(k){ return sessionStorage.getItem(k); }).join('|');
  if(vorher!==nachher){ render(); loadSection(); }
}
function sitzungsPruefungStarten(){
  if(_sitzTimer) return;
  _sitzTimer=setInterval(sitzungAktualisieren, 300000);
}

/* ── Phase 6.12 (Plan 06.12-10): Hülle für die Verwaltungs-RPCs (0041–0043) ──
 * Nur Namen der Positivliste (sonst ohne Aufruf „Unbekannte Aktion.“); keine
 * Sitzung bzw. HTTP 401 → abmelden mit „Sitzung abgelaufen …“; Netzfehler →
 * „Keine Verbindung …“; Antwort {ok:false, fehler, meldung} wird roh
 * weitergereicht (Anzeige escaped bzw. über textContent). Rechte prüft der
 * Server (argus_darf) — für persönliche Sitzungen wie für den MasterToken.
 * Phase 6.12 (Plan 06.12-11, 0045): + argus_einsatzmappe_liste/argus_einsatzmappe
 * (Einsatzmappe je Lage; Pflicht-Log beim Öffnen einer Mappe) und argus_vw_nachweis/
 * argus_vw_nachweis_export (0044, Nachweis mit Filtern; Export pflichtprotokolliert). */
var VW_RPCS=['argus_vw_personen','argus_vw_person_anlegen','argus_vw_person_aendern','argus_vw_person_notiz',
  'argus_vw_person_sperren','argus_vw_person_code_neu','argus_vw_person_loeschen','argus_vw_person_code_uebertragen',
  'argus_vw_codes','argus_vw_code_sperren','argus_vw_code_notiz','argus_vw_code_loeschen','argus_vw_codes_loeschen_alle',
  'argus_vw_code_ausgeben','argus_vw_zugangscode','argus_vw_zugangscode_erneuern','argus_vw_anmeldesperren',
  'argus_vw_anmeldesperre_freigeben','argus_vw_praesidien','argus_vw_praesidium_anlegen',
  'argus_einsatzmappe_liste','argus_einsatzmappe','argus_vw_nachweis','argus_vw_nachweis_export'];
async function vwRpc(fn, args){
  if(VW_RPCS.indexOf(fn)<0) return { ok:false, fehler:'aktion', meldung:'Unbekannte Aktion.' };
  var ab='Sitzung abgelaufen — bitte neu anmelden.';
  if(!sessionJwt()){ doLogout(ab); return { ok:false, fehler:'sitzung', meldung:ab }; }
  var cl=sb();
  if(!cl) return { ok:false, fehler:'netz', meldung:'Keine Verbindung — bitte erneut versuchen.' };
  var r;
  try{ r=await cl.rpc(fn, args||{}); }
  catch(e){ return { ok:false, fehler:'netz', meldung:'Keine Verbindung — bitte erneut versuchen.' }; }
  if(r && r.status===401){ doLogout(ab); return { ok:false, fehler:'sitzung', meldung:ab }; }
  if(!r || r.error){
    var m=r && r.error && typeof r.error.message==='string' ? r.error.message : '';
    if(r && r.error && !r.status && /fetch|network|netz/i.test(m)) return { ok:false, fehler:'netz', meldung:'Keine Verbindung — bitte erneut versuchen.' };
    return { ok:false, fehler:'server', meldung:m || 'Abruf fehlgeschlagen.' };
  }
  var d=r.data;
  if(!d || typeof d!=='object' || Array.isArray(d)) return { ok:false, fehler:'antwort', meldung:'Unerwartete Antwort vom Server.' };
  if(d.ok===true) return d;
  var out={};
  Object.keys(d).forEach(function(k){ out[k]=d[k]; });
  out.ok=false;
  out.fehler=typeof d.fehler==='string' ? d.fehler : '';
  out.meldung=(typeof d.meldung==='string' && d.meldung) ? d.meldung : 'Nicht möglich.';
  return out;
}

/* ── Login (D-07): MasterToken oder Admin-Token ──────────────────
 * Ablauf: zuerst argus_exchange_code versuchen (Master-Strecke).
 * Liefert sie kein JWT oder keinen Master, zweiten Versuch gegen
 * argus_exchange_admin_code mit demselben Code. Erst wenn auch das
 * scheitert, wird die Abweisung gezeigt.
 * Wichtig: argus_exchange_admin_code NUR aufrufen, wenn Master-Versuch
 * wirklich keinen Master ergab — Doppel-Log vermeiden.
 * NICHTS wird im Abweisungspfad in sessionStorage gespeichert. */
async function doLogin(raw){
  /* Ohne Config liefe der fetch relativ gegen den eigenen Origin (kryptischer
   * 404) — daher hier hart abfangen, Hinweis steht auch in der Login-Ansicht. */
  if(_configError){ setLoginError('Konfiguration fehlt (config.js) — kein Backend verbunden.'); return; }
  var clean=(raw||'').replace(/[\s\-]/g,'').toUpperCase();
  if(clean.length<8){ setLoginError('Bitte vollständigen Zugangs-Token eingeben.'); return; }
  setLoginError('');
  /* Opt-in „Angemeldet bleiben": Flag in der Sitzung; sessionJwt() spiegelt dann
   * nach localStorage (gilt für alle drei Login-Pfade). Ohne Häkchen: evtl. alte
   * persistierte Sitzung löschen. */
  var keep=!!($('keepme') && $('keepme').checked);
  try{ sessionStorage.setItem('argusl_keep', keep?'1':''); }catch(e){}
  if(!keep) sessWipeLocal();
  var btn=$('loginbtn'); if(btn){ btn.disabled=true; btn.textContent='Prüfe…'; }
  try{
    /* ── 0. Persönlicher Code (Phase 6.12, Plan 06.12-09; D6.12-02/-14/-21) ──
     * Erst argus_anmelden; nur 'alt' (alt_code, 404, …) läuft in die bisherige
     * Kette 1–3, die wörtlich unverändert bleibt. */
    var resp0=await fetch(SUPA_URL+'/rest/v1/rpc/argus_anmelden',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ p_code:clean, p_oberflaeche:'verwaltung', p_praesidium_id:null, p_scope:'echt', p_geraet:vwGeraetId() })
    });
    var data0=null; try{ data0=await resp0.json(); }catch(e){}
    var klasse=anmeldeKlasseVw(data0, resp0.status);
    if(klasse==='ident'){
      identSitzungSpeichernVw(data0);
      state.section='uebersicht';   /* persönliche Sitzung: Einstieg Übersicht */
      render();
      loadSection();
      sitzungsPruefungStarten();
      return;
    }
    if(klasse==='fehler'){ setLoginError(anmeldeMeldungVw(data0)); return; }
    /* 'alt': bisherige Kette — ein abgelaufener persönlicher Code behält seine Meldung */
    var altMeldung=(data0 && data0.fehler==='abgelaufen') ? anmeldeMeldungVw(data0) : '';

    /* ── 1. Master-Versuch (argus_exchange_code) ── */
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean })
    });
    var data=await resp.json();   /* ungültiger Code = HTTP 200 + {error:…} */

    if(data && data.jwt && data.is_master===true){
      /* ── Master-Pfad: alles wie bisher ── */
      sessionStorage.setItem('argusl_jwt', data.jwt);
      sessionStorage.setItem('argusl_jwt_exp', String(data.exp*1000));
      sessionStorage.setItem('argusl_role', 'master');
      state.section='zugaenge';     /* D-10: direkt in den ersten Bereich */
      render();
      loadSection();
      return;
    }

    /* ── 2. Admin-Versuch (argus_exchange_admin_code) ──
     * Nur wenn Master-Versuch kein Master-JWT geliefert hat —
     * vermeidet Doppel-Log im governance_log. */
    var resp2=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_admin_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean })
    });
    var data2=await resp2.json();

    if(data2 && data2.jwt){
      /* ── Admin-Pfad ── */
      sessionStorage.setItem('argusl_jwt', data2.jwt);
      sessionStorage.setItem('argusl_jwt_exp', String(data2.exp*1000));
      sessionStorage.setItem('argusl_role', 'admin');
      sessionStorage.setItem('argusl_padmin', data2.praesidium_id||'');
      sessionStorage.setItem('argusl_padmin_name', data2.praesidium_name||'');
      state.section='admin-zugang'; /* Direkteinstieg für Admin */
      render();
      loadSection();
      return;
    }

    /* ── 3. Pro-Person-Versuch (argus_exchange_person_code, Plan 05-03) ──
     * Erst NACHDEM Master- und Admin-Versuch fehlgeschlagen sind. Ein
     * Person-Code an argus_exchange_code liefert dank CR-02-Härtung (Plan 01)
     * bereits einen Fehler statt eines is_master-JWT — der Master-Versuch
     * scheitert also korrekt zuerst. Der Person-Token trägt die USBNK, damit
     * Leitungs-Seiten-Aktionen personenscharf protokolliert werden (D-08). */
    var resp3=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_person_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean })
    });
    var data3=await resp3.json();

    if(data3 && data3.jwt){
      var prole=(data3.argus_role||'').toLowerCase();
      sessionStorage.setItem('argusl_jwt', data3.jwt);
      sessionStorage.setItem('argusl_jwt_exp', String(data3.exp*1000));
      /* USBNK als Sitzungs-Kürzel (Actor) — erscheint in Governance-/Audit-Aktionen */
      sessionStorage.setItem('argusl_kuerzel', data3.usbnk||'');
      if(prole==='master'){
        sessionStorage.setItem('argusl_role', 'master');
        state.section='zugaenge';     /* volle Master-Ansicht */
      }else if(prole==='admin'){
        sessionStorage.setItem('argusl_role', 'admin');
        sessionStorage.setItem('argusl_padmin', data3.praesidium_id||'');
        sessionStorage.setItem('argusl_padmin_name', data3.praesidium_name||'');
        state.section='admin-zugang'; /* reduzierte Admin-Ansicht */
      }else{
        /* flz / normal: in Phase 5 (noch) keine Leitungs-Seiten-Ansicht.
         * Anmeldung akzeptieren, aber freundlichen Hinweis zeigen — KEINE
         * kaputte/leere Master-Ansicht rendern. */
        sessionStorage.setItem('argusl_role', prole||'normal');
        state.section='noview';
      }
      render();
      loadSection();
      return;
    }

    /* ── Abweisung — KEIN sessionStorage-Schreiben ── */
    setLoginError(altMeldung || 'Nur mit Master-, Admin- oder Pro-Person-Token — dieser Code hat keine Leitungs-Berechtigung.');
  }catch(e){
    setLoginError('Keine Verbindung — bitte erneut versuchen.');
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='Anmelden'; }
  }
}
function setLoginError(msg){ var e=$('loginerr'); if(e) e.textContent=msg||''; }
/* Phase 6.12 (Plan 06.12-09): optionaler Hinweis (z. B. „Sitzung beendet …“) —
 * übersteht das Neuladen in sessionStorage 'argusl_hinweis' und erscheint
 * einmal in der Login-Fehlerzeile. */
function doLogout(msg){
  sessionStorage.clear(); sessWipeLocal();
  if(typeof msg==='string' && msg){ try{ sessionStorage.setItem('argusl_hinweis', msg); }catch(e){} }
  location.reload();
}

/* ── Navigation / Router ───────────────────────────────────────── */
/* Phase 6.12 (Plan 06.12-09, D6.12-04): Gliederung Übersicht · Einsätze ·
 * Personen & Zugänge · Präsidien (Plan 06.12-10) · Nachweis — interne
 * Bereichs-IDs unverändert (Inventar D6.8-07). Bis dahin Gruppen „Betrieb“,
 * „Nachweis“, „Personen“ (Phase 6.8). „Identitäten“ (Phase 5) ist seit Plan
 * 06.12-10 der Abschnitt „Personen“ in „Personen & Zugänge“; die Route bleibt
 * (nurRoute, ohne eigenen Navigationspunkt) — D6.12-21: alle bisherigen
 * Funktionen bleiben erreichbar. */
var SECTIONS_VERWALTUNG=[
  { id:'uebersicht',    label:'Übersicht',          grp:'Verwaltung' },
  { id:'einsaetze',     label:'Einsätze',           grp:'Verwaltung' },
  { id:'zugaenge',      label:'Personen & Zugänge', grp:'Verwaltung' },
  { id:'praesidien',    label:'Präsidien',          grp:'Verwaltung' },
  { id:'identitaeten',  label:'Identitäten',        grp:'Verwaltung', nurMaster:true, nurRoute:true },
  { id:'protokoll',     label:'Protokoll',          grp:'Nachweis' },
  { id:'audit',         label:'Audit-Log',          grp:'Nachweis' }
];
/* Master-Bereiche (volle Governance) — Name bleibt, gleiche Liste */
var SECTIONS_MASTER=SECTIONS_VERWALTUNG;
/* Admin-Bereiche (reduziert: nur eigenes Präsidium) */
var SECTIONS_ADMIN=[
  { id:'admin-zugang', label:'Dauercodes', grp:'Betrieb' },
  { id:'admin-lage',   label:'Lage',       grp:'Betrieb' }
];
/* Sichtbare Bereiche je Rolle (rein; Navigation ist nur Komfort — Rechte prüft
 * der Server, T-06.12-0901): Master und Administrator alles, Trainer ohne
 * „Nachweis“, FLZ-Zugang unverändert (Dauercodes, Lage), sonst nichts. */
function sektionenFuer(role, irolle){
  if(role==='master') return SECTIONS_VERWALTUNG.slice();
  if(role==='ident'){
    return SECTIONS_VERWALTUNG.filter(function(s){
      if(s.nurMaster) return false;
      if(irolle==='administrator') return true;
      if(irolle==='trainer') return s.grp!=='Nachweis';
      return false;
    });
  }
  if(role==='admin') return SECTIONS_ADMIN.slice();
  return [];
}
function irolleVw(){ try{ return sessionStorage.getItem('argusl_irolle')||''; }catch(e){ return ''; } }
function sideNav(){
  var role=sessionRole();
  /* Rollen ohne Leitungs-Seiten-Ansicht (flz/normal, Phase 5): keine
   * privilegierten Bereiche anbieten — die Navigation bleibt leer. */
  var secs=sektionenFuer(role, irolleVw());
  var h='<nav class="side">', grp=null;
  if(!secs.length) h+='<div class="sh">Bereiche</div>';
  secs.forEach(function(s){
    if(s.nurRoute) return;   /* Phase 6.12 (06.12-10): Route ohne eigenen Navigationspunkt */
    if(s.grp!==grp){ grp=s.grp; h+='<div class="sh grp">'+esc(s.grp)+'</div>'; }
    h+='<div class="it'+(state.section===s.id?' on':'')+'" data-nav="'+s.id+'">'+esc(s.label)+'</div>';
  });
  h+='</nav>';
  return h;
}
function render(){
  var app=$('app');
  var logged=!!sessionJwt();
  $('logoutbtn').style.display = logged ? '' : 'none';
  var tr=$('toprole'); if(tr) tr.textContent = logged ? ' · '+kopfRolle() : '';
  if(!logged){
    app.innerHTML=vLogin();
    return;
  }
  /* Band klebt direkt unter der Topbar → deren Höhe als Abstand (D6.8-01) */
  var tb=document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--toph', tb.offsetHeight+'px');
  /* Phase 6.12: persönliche Sitzung nur in ihren Bereichen (sonst Übersicht) */
  var role=sessionRole();
  if(role==='ident' && !sektionenFuer(role, irolleVw()).some(function(s){ return s.id===state.section; })) state.section='uebersicht';
  var h=kopfBand()+'<div class="layout">'+sideNav()+'<main class="main">';
  if(serverZuAlt(role, state.section))    h+=serverZuAltHtml(_serverV, role==='master');
  else if(state.section==='uebersicht')   h+=secUebersicht();
  else if(state.section==='zugaenge')     h+=secZugaenge();
  else if(state.section==='praesidien')   h+=secPraesidien();
  else if(state.section==='einsaetze')    h+=secEinsaetze();
  else if(state.section==='protokoll')    h+=secProtokoll();
  else if(state.section==='identitaeten') h+=secIdentitaeten();
  else if(state.section==='audit')        h+=secAudit();
  else if(state.section==='admin-zugang') h+=secAdminZugang();
  else if(state.section==='admin-lage')   h+=secAdminLage();
  else if(state.section==='noview')       h+=secNoView();
  h+='</main></div>';
  app.innerHTML=h;
}
function loadSection(){
  /* Präsidienliste fürs Band des FLZ-Zugangs (nicht blockierend; Fehler → Heuristik) */
  if(_praes===null && sessionRole()==='admin') ensurePraes().then(function(p){ if(p) render(); });
  /* Phase 6.12: persönliche Sitzung erst nach der Server-Stand-Prüfung laden */
  if(sessionRole()==='ident' && _serverV===null){
    var cl0=sb();
    if(cl0){ probeServerV(cl0).then(function(){ render(); if(_serverV!==null) loadSection(); }); return; }
  }
  if(serverZuAlt(sessionRole(), state.section)) return;
  if(state.section==='uebersicht')        loadUebersicht();
  else if(state.section==='zugaenge')     loadZugaenge();
  else if(state.section==='praesidien')   loadPraesidienVw();
  else if(state.section==='einsaetze')    loadEinsaetze();
  else if(state.section==='protokoll')    loadProtokoll();
  else if(state.section==='identitaeten') loadIdentitaeten();
  else if(state.section==='audit')        loadAudit();
  else if(state.section==='admin-zugang') loadAdminZugang();
  else if(state.section==='admin-lage')   loadAdminLage();
}

/* ── Bereich „Übersicht“ (Phase 6.12, Plan 06.12-09, D6.12-04/-14/-19) ──────
 * „Was braucht Aufmerksamkeit“: Punkte aus rpc/argus_vw_uebersicht (Server prüft
 * Recht und Bereich, nur Zähler und Kennungen — keine Patientendaten) und für
 * Master/Administrator die gesperrten Anmeldeversuche (rpc/argus_vw_anmeldesperren,
 * nur Geräte-Sperren, ohne Auffälligkeits-Hinweis — D6.12-19). Je Punkt eine
 * Karte mit Anzahl, kurzer Liste und Sprung in den passenden Bereich. Alle
 * Server-Texte über esc() (T-06.12-0903). */
var UEBERSICHT_TEXTE={
  wiedervorlage:            { titel:'Einsatzprotokolle in Wiedervorlage (Löschfrist ≤ 24 h)', ziel:'einsaetze' },
  ohne_export:              { titel:'Echtbetrieb-Einsätze noch nicht exportiert', ziel:'einsaetze' },
  foto_frist:               { titel:'Fotos werden in < 24 h gelöscht', ziel:'einsaetze' },
  codes_loeschbar:          { titel:'Gesperrte oder abgelaufene Codes löschbar', ziel:'zugaenge' },
  identitaeten_gesperrt:    { titel:'Gesperrte Personen', ziel:'zugaenge' },
  lagen_ohne_ccp:           { titel:'Offene Lagen ohne offenen CCP — in der FLZ abschließen', ziel:'einsaetze' },
  kennung_doppelt:          { titel:'Kennung doppelt (offline eröffnet)', ziel:'einsaetze' },
  offline_eroeffnet:        { titel:'Offline eröffnete CCPs', ziel:'einsaetze' },
  verbund_konflikt:         { titel:'Zusammenlegung ohne Netz widersprach dem Serverstand (7 Tage)', ziel:'protokoll' },
  geraete_abgemeldet:       { titel:'Abgemeldete Geräte in offenen CCPs', ziel:'einsaetze' },
  auffangnetz:              { titel:'Offene CCPs ohne Aktivität seit > 50 Tagen', ziel:'einsaetze' },
  praesidien_ohne_zwilling: { titel:'Präsidien ohne Schulungs-Zwilling', ziel:'praesidien' },
  selbstregistrierungen:    { titel:'Neue Selbstregistrierungen (7 Tage)', ziel:'zugaenge' },
  zugangscode_ablauf:       { titel:'Präsidiums-/Fremdkräfte-Code läuft bald ab', ziel:'zugaenge' },
  anmeldesperren:           { titel:'Gesperrte Anmeldeversuche', ziel:'zugaenge' }
};
/* Rein: Übersicht u ({ok, punkte}), Sperren (Liste oder null), sicht = sichtbare
 * Bereichs-IDs der Rolle (sektionenFuer) → HTML. Reihenfolge wie vom Server;
 * Sprung nur in sichtbare Bereiche (sonst nur Text). */
function uebersichtPunkte(u, sperren, sicht){
  var punkte=(u && Array.isArray(u.punkte)) ? u.punkte.filter(function(p){ return !!p && typeof p==='object' && typeof p.art==='string' && !!p.art; }) : [];
  sicht=Array.isArray(sicht) ? sicht : [];
  /* Sperren aus argus_vw_anmeldesperren nur, wenn die Übersicht sie nicht schon enthält */
  if(Array.isArray(sperren) && !punkte.some(function(p){ return p.art==='anmeldesperren'; })){
    var akt=sperren.filter(function(x){ return !!x && typeof x==='object' && (x.aktiv===true || (+x.rest_s||0)>0); });
    if(akt.length) punkte=punkte.concat([{ art:'anmeldesperren', anzahl:akt.length, liste:akt.map(function(x){
      return { kurzkennung:x.kurzkennung, praesidium_name:x.ziel_praesidium_name, bis:x.gesperrt_bis };
    }) }]);
  }
  if(!punkte.length) return '<div class="card ueb leer">Nichts offen — alles im grünen Bereich.</div>';
  var ARTEN={ praesidiums_code:'Präsidiums-Code', fremdkraefte_code:'Fremdkräfte-Code' };
  function zeit(ms){
    var d=new Date(+ms);
    if(!ms || isNaN(d.getTime())) return '';
    return d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr';
  }
  function eintrag(e){
    if(!e || typeof e!=='object') return '';
    var t=[];
    if(e.kuerzel!=null && e.kuerzel!=='') t.push('<b>'+esc(e.kuerzel)+'</b>');
    if(e.kurzkennung!=null && e.kurzkennung!=='') t.push('Gerät '+esc(e.kurzkennung));
    if(e.art) t.push(esc(ARTEN[e.art]||e.art));
    t.push(e.praesidium_name ? esc(e.praesidium_name) : 'ohne Präsidium');
    if(e.anzahl!=null) t.push(esc(String(+e.anzahl||0)));
    if(e.at) t.push(esc(zeit(e.at)));
    if(e.bis) t.push('bis '+esc(zeit(e.bis)));
    return '<li>'+t.join(' · ')+'</li>';
  }
  var h='<div class="uebraster">';
  punkte.forEach(function(p){
    var tx=Object.prototype.hasOwnProperty.call(UEBERSICHT_TEXTE, p.art) ? UEBERSICHT_TEXTE[p.art] : null;
    var l=Array.isArray(p.liste) ? p.liste : [];
    h+='<div class="card ueb'+(tx ? '' : ' neutral')+'">';
    h+='<div class="uebk"><span class="uebn">'+esc(String(+p.anzahl||0))+'</span><span class="uebt">'+esc(tx ? tx.titel : p.art)+'</span></div>';
    if(l.length){
      h+='<ul class="uebli">'+l.slice(0,5).map(eintrag).join('')+'</ul>';
      if(l.length>5) h+='<div class="hint">… und '+(l.length-5)+' weitere</div>';
    }
    if(tx && sicht.indexOf(tx.ziel)>=0) h+='<div class="uebakt"><button class="btn ghost" data-nav="'+esc(tx.ziel)+'">Öffnen</button></div>';
    h+='</div>';
  });
  return h+'</div>';
}
var _ueb=null, _uebSperren=null, _uebErr=null;
function uebersichtSperrenSichtbar(){
  var r=sessionRole();
  return r==='master' || (r==='ident' && irolleVw()==='administrator');
}
function secUebersicht(){
  var h='<div class="mh"><h2>Übersicht · Was braucht Aufmerksamkeit</h2><button class="btn ghost" data-action="uebersichtreload">↻ Aktualisieren</button></div>';
  h+='<div class="hint" style="margin:-6px 0 12px">Nur Zähler und Kennungen im eigenen Bereich — keine Patientendaten.'+((_ueb && _ueb.stand) ? ' Stand '+esc(fmtMs(_ueb.stand))+'.' : '')+'</div>';
  if(_uebErr){
    h+='<div class="card" style="border-color:var(--t1)"><div style="color:var(--t1);font-weight:600">Abruf fehlgeschlagen</div><div class="hint" style="margin-top:4px">'+esc(_uebErr)+'</div>';
    h+='<div style="margin-top:10px"><button class="btn" data-action="uebersichtreload">Neu laden</button></div></div>';
    return h;
  }
  if(_ueb===null) return h+'<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
  return h+uebersichtPunkte(_ueb, _uebSperren, sektionenFuer(sessionRole(), irolleVw()).map(function(s){ return s.id; }));
}
async function loadUebersicht(){
  _ueb=null; _uebSperren=null; _uebErr=null;
  if(state.section==='uebersicht') render();
  var cl=sb();
  if(!cl){ _uebErr='Sitzung abgelaufen — bitte neu anmelden.'; if(state.section==='uebersicht') render(); return; }
  try{
    if(_serverV===null) await probeServerV(cl);
    if(serverZuAlt(sessionRole(), 'uebersicht')){ if(state.section==='uebersicht') render(); return; }
    var r=await cl.rpc('argus_vw_uebersicht');
    if(r.error) _uebErr=r.error.message||'Abruf fehlgeschlagen';
    else if(!r.data || r.data.ok!==true) _uebErr=(r.data && typeof r.data.meldung==='string' && r.data.meldung) ? r.data.meldung : 'Übersicht nicht verfügbar.';
    else{
      _ueb=r.data;
      if(uebersichtSperrenSichtbar()){
        try{
          var sp=await cl.rpc('argus_vw_anmeldesperren');
          if(!sp.error && sp.data && sp.data.ok===true && Array.isArray(sp.data.sperren)) _uebSperren=sp.data.sperren;
        }catch(e){}
      }
    }
  }catch(e){ _uebErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(state.section==='uebersicht') render();
}

/* ── Bereich „Zugänge" (D-11) ───────────────────────────────────
 * Portierung der Admin-Panel-Logik der Feld-App, erweitert um
 * 24-h-Codes und die Code-Sperre (revoked-Flag, Migration 0003). */
var _praes=null, _tokens=null, _zugErr=null;

/* Einklapp-Zustand je Karte/Block (Owner-Wunsch 2026-06-12). Persistenz in
 * sessionStorage — überlebt Bereichswechsel, endet mit der Sitzung. */
var _collapsed={};
try{ _collapsed=JSON.parse(sessionStorage.getItem('arguslt_collapsed')||'{}')||{}; }catch(e){ _collapsed={}; }
function isCollapsed(key, defCollapsed){ return (key in _collapsed) ? !!_collapsed[key] : !!defCollapsed; }
function toggleCard(key, defCollapsed){
  _collapsed[key]=!isCollapsed(key, defCollapsed);
  try{ sessionStorage.setItem('arguslt_collapsed', JSON.stringify(_collapsed)); }catch(e){}
