    render(); loadSection();
    return;
  }
  var el=e.target.closest('[data-action]');
  if(!el) return;
  var a=el.getAttribute('data-action');
  if(a==='logout'){ clearAdminLageTimer(); doLogout(); return; }
  /* Phase 6.8 (D6.8-01): Umgebung der Ansicht umschalten — reiner Anzeigefilter */
  if(a==='umgebung'){
    _umg=el.getAttribute('data-u')==='schulung' ? 'schulung' : 'echt';
    try{ sessionStorage.setItem('argusl_umg', _umg); }catch(err){}
    _detail=null; _mappe=null;
    render();
    return;
  }
  if(a==='login'){ var li=$('logininp'); await doLogin(li?li.value:''); return; }
  if(a==='pastetoken'){
    var pi=$('logininp');
    try{
      var txt=await navigator.clipboard.readText();
      if(pi) pi.value=(txt||'').trim();
      await doLogin(txt||'');
    }catch(err){ setLoginError('Zwischenablage nicht lesbar — bitte Token eintippen.'); }
    return;
  }
  if(a==='zugreload'){ loadZugaenge(); return; }
  /* Phase 6.12 (Plan 06.12-09): Übersicht neu laden */
  if(a==='uebersichtreload'){ loadUebersicht(); return; }
  if(a==='togglecard'){ toggleCard(el.getAttribute('data-key'), el.getAttribute('data-def')==='1'); return; }
  if(a==='zugfilterreset'){ _zugFilter={art:'alle',status:'alle',sort:_zugFilter.sort}; render(); return; }
  if(a==='mklink'){
    await makeLink(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'', el.getAttribute('data-kind'));
    return;
  }
  if(a==='mkobserver'){
    await makeObserver(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'');
    return;
  }
  /* Phase 6.12 (06.12-10, D6.12-20): Zweig mkgast entfernt (Gast-Code-Ausgabe ausgebaut) */
  /* Phase 6.12 (06.12-10, D6.12-13/-14): Monats-Codes anzeigen/erneuern, Anmeldesperre freigeben */
  if(a==='zugcodezeigen'){ await zeigeZugcode(el.getAttribute('data-pid'), el.getAttribute('data-art')); return; }
  if(a==='zugcodeerneuern'){ await erneuereZugcode(el.getAttribute('data-pid'), el.getAttribute('data-art'), el.getAttribute('data-pname')||''); return; }
  if(a==='sperrefreigeben'){ await gebeSperreFrei(el.getAttribute('data-schluessel'), el.getAttribute('data-kurz')||''); return; }
  if(a==='provision'){ await makeProvision(); return; }
  /* Phase 6.12 (06.12-10, D6.12-10): Präsidium anlegen (nur instanzweit) */
  if(a==='praesidiumneu'){ await doPraesidiumNeu(el.getAttribute('data-op')||''); return; }
  /* Phase 6.12 (06.12-11): Knöpfe der Einsatzmappe tragen data-ccpid — dann erst das Protokoll öffnen */
  if(a==='protoexport'){ if(!(await protokollFuerKnopf(el))) return; await exportProtokoll(); return; }
  if(a==='protoprint'){ if(!(await protokollFuerKnopf(el))) return; window.print(); return; }
  if(a==='atmistprint'){ if(!(await protokollFuerKnopf(el))) return; vAtmistPrint(); return; }
  if(a==='togglerevoke'){
    await toggleRevoke(el.getAttribute('data-sc'), el.getAttribute('data-rev')==='1');
    return;
  }
  /* Quick 261019 (Migration 0036): Notiz ändern, Codes aus der Liste löschen */
  if(a==='codenotiz'){ await editCodeNotiz(el.getAttribute('data-sc')); return; }
  if(a==='codeloeschen'){ await loescheCode(el.getAttribute('data-sc')); return; }
  /* Quick 261024: Codes markieren und gesammelt löschen (ersetzt codeloeschenalle) */
  if(a==='codemark'){ codeMarkSetzen(el.getAttribute('data-sc'), !!el.checked); return; }
  if(a==='codemarkalle'){ codeMarkAlle(el.getAttribute('data-pid')||''); return; }
  if(a==='codemarkloeschen'){ await loescheMarkierte(el.getAttribute('data-pid')||'', el.getAttribute('data-pname')||''); return; }
  /* Phase 6.10 (Migration 0037): Präsidiums-Schlüssel erneuern — MasterToken/FLZ-Zugang */
  if(a==='meshkeyerneuern'){
    await erneuerePraesSchluessel(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'');
    return;
  }
  if(a==='einsreload'){ _detail=null; loadEinsaetze(); return; }
  /* Phase 6.12 (Plan 06.12-11, D6.12-05): Einsatzmappe einer Lage öffnen (bzw. neu laden) und schließen */
  if(a==='mappeoeffnen'){ await oeffneMappe(el.getAttribute('data-lage')); return; }
  if(a==='mappeschliessen'){ _mappe=null; _detail=null; render(); return; }
  /* Phase 6.12 (Plan 06.12-11, D6.12-05/-08): Mappe drucken bzw. als PDF sichern (ein Dokument je Lage) */
  if(a==='mappedrucken'){ await druckeMappe(el.getAttribute('data-lage')); return; }
  if(a==='openproto'){ await openProtokoll(el.getAttribute('data-ccpid')); return; }
  if(a==='closeproto'){ _detail=null; render(); return; }
  if(a==='protophoto'){ await showFoto(el.getAttribute('data-pid'), el.getAttribute('data-num')); return; }
  if(a==='extendfrist'){
    await extendFrist(el.getAttribute('data-ccpid'), el.getAttribute('data-kennung')||'?', el.getAttribute('data-frist'));
    return;
  }
  if(a==='protoreload'){ loadProtokoll(); return; }
  /* Phase 6.12 (06.12-10, D6.12-15): ohne Knopf — zeigt nur den Hinweis, dass keine FLZ-Zugänge mehr ausgegeben werden */
  if(a==='mkadmin'){
    await makeAdmin(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'');
    return;
  }
  if(a==='mkadmingast'){ await makeAdminGast(); return; }
  if(a==='adminrevoke'){
    await makeAdminRevoke(el.getAttribute('data-sc'));
    return;
  }
  if(a==='adminlagereload'){
    _adminLageData=null; _adminLageErr=null;
    if(state.section==='admin-lage') render();
    await _doAdminLagePoll();
    return;
  }
  /* Plan 04.14-03: neue Aktionen */
  if(a==='mkreset'){
    await makeReset(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'');
    return;
  }
  if(a==='showgastqr'){
    showGastQrModal(el.getAttribute('data-sc'), el.getAttribute('data-lbl')||'');
    return;
  }
  if(a==='glogfilterreset'){
    /* Phase 6.12 (06.12-11): auch Präsidium/Zeitraum zurück → neu laden */
    _glogFilter={action:'alle',kuerzel:'',praes:'',von:'',bis:''};
    loadProtokoll();
    return;
  }
  /* Phase 6.12 (Plan 06.12-11, D6.12-04): Nachweis-Export für den DSB (CSV/JSON, serverseitig protokolliert) */
  if(a==='nachweisexport'){ await nachweisExport(el.getAttribute('data-quelle'), el.getAttribute('data-format')); return; }
  /* ── Personen-Aktionen (Plan 05-03; Phase 6.12, Plan 06.12-10: über argus_vw_*) ── */
  if(a==='mkperson'){ await doMkPerson(el.getAttribute('data-op')||''); return; }
  if(a==='usbnksearch'){ await doUsbnkSearch(); return; }
  if(a==='personrole'){ await doPersonRole(el.getAttribute('data-id')); return; }
  if(a==='personrevoke'){ await doPersonRevoke(el.getAttribute('data-id')); return; }
  /* Phase 6.12 (Plan 06.12-10): Notiz, Code ersetzen, löschen, Bestand übertragen */
  if(a==='personnotiz'){ await doPersonNotiz(el.getAttribute('data-id')); return; }
  if(a==='personcode'){ await doPersonCode(el.getAttribute('data-id')); return; }
  if(a==='personloeschen'){ await doPersonLoeschen(el.getAttribute('data-id')); return; }
  if(a==='personuebertragen'){ await doPersonUebertragen(el.getAttribute('data-sc')); return; }
  /* ── Audit-Log-Aktionen (Plan 05-03) ── */
  if(a==='auditreload'){
    _audit=null; _auditErr=null;
    if(state.section==='audit') render();
    await loadAudit();
    return;
  }
  if(a==='auditfilterreset'){
    _auditFilter={action:'alle',usbnk:'',praes:'',von:'',bis:''};
    loadAudit();
    return;
  }
});
/* Filter-/Sortier-Selects (Zugänge): Auswahl übernehmen und neu rendern */
document.addEventListener('change', function(e){
  var el=e.target.closest('select[data-action="zugfilter"]');
  if(el){ _zugFilter[el.getAttribute('data-field')]=el.value; render(); return; }
  /* Protokoll-Filter (Plan 04.14-03, Task 3B): Select */
  /* Phase 6.12 (06.12-11): Aktion und Präsidium filtert der Server → neu laden */
  var gl=e.target.closest('select[data-action="glogfilter"]');
  if(gl){ _glogFilter[gl.getAttribute('data-field')]=gl.value; loadProtokoll(); return; }
  /* Audit-Log-Filter (Plan 05-03): Select */
  var al=e.target.closest('select[data-action="auditfilter"]');
  if(al){ _auditFilter[al.getAttribute('data-field')]=al.value; loadAudit(); return; }
  /* Phase 6.12 (06.12-11): Zeitraum (Datumsfelder) → neu laden */
  var gd=e.target.closest('input[type="date"][data-action="glogfilter"]');
  if(gd){ _glogFilter[gd.getAttribute('data-field')]=gd.value||''; loadProtokoll(); return; }
  var ad=e.target.closest('input[type="date"][data-action="auditfilter"]');
  if(ad){ _auditFilter[ad.getAttribute('data-field')]=ad.value||''; loadAudit(); return; }
  /* Personen (Phase 6.12, Plan 06.12-10): Bereichs-Auswahl nur für Administratoren
   * (Anlege-Formular pers-, Dialog prd-); Rollen-Filter der Liste */
  var ro=e.target.closest('select[data-rollewahl]');
  if(ro){
    var pw=document.getElementById(ro.getAttribute('data-rollewahl')+'ber-wrap');
    if(pw) pw.style.display=(ro.value==='administrator')?'':'none';
    return;
  }
  var pf=e.target.closest('select#pers-filter-rolle');
  if(pf){ _persFilter.rolle=pf.value||'alle'; render(); return; }
});
/* Protokoll-Filter Freitext-Kürzel: live filtern bei Eingabe */
document.addEventListener('input', function(e){
  var gk=e.target.closest('input[data-action="glogfilter"][data-field="kuerzel"]');
  if(gk){ _glogFilter.kuerzel=gk.value; render(); return; }
  /* Audit-Log-Filter Freitext-USBNK: live filtern */
  var au=e.target.closest('input[data-action="auditfilter"][data-field="usbnk"]');
  if(au){ _auditFilter.usbnk=au.value; render(); return; }
});
$('logininp') && $('logininp').focus();
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='logininp'){
    doLogin(document.activeElement.value);
  }
});

/* Start: abgelaufene/fehlende Sitzung → Login, sonst direkt Zugänge (D-10).
 * Phase 6.12 (Plan 06.12-09): Bestandssitzungen (MasterToken, FLZ-Zugang,
 * Phase-5-Person) unverändert; persönliche Sitzung → Übersicht + Sitzungsprüfung. */
function startSeite(){
  var ok=!!sessionJwt();
  if(ok && sessionRole()==='ident') state.section='uebersicht';
  /* Owner 24.10.: Alt-FLZ-Zugang startet nach dem Neuladen wie beim Login in „Dauercodes“ (statt „Keine Berechtigung“ in Zugänge) */
  if(ok && sessionRole()==='admin') state.section='admin-zugang';
  render();
  if(!ok) return;
  loadSection();
  if(sessionRole()==='ident'){ sitzungAktualisieren(); sitzungsPruefungStarten(); }
}
startSeite();
</script>
