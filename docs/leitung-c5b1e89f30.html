<style>
  /* Selbst gehostete Schriften (kein externes CDN) */
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-400.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-500.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-600.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-700.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-600.woff2) format('woff2')}
  :root{
    --bg:#fff; --surf:#f6f7f8; --surf2:#eef0f2; --line:#d9dde1;
    --tx:#16181a; --mut:#5d6368;
    --t1:#C62828; --t2:#F2B600; --t3:#2E7D32; --t5:#1b1d20; --t5b:#3a3d41;
    --prio:#E65100; --ready:#1565C0; --acc:#1f2530;
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--surf);color:var(--tx);font-family:var(--sans);line-height:1.5;font-size:14px}
  button{font-family:var(--sans);cursor:pointer;border:0}
  input,textarea{font-family:var(--sans);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--tx);width:100%}
  input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
  .mono{font-family:var(--mono)}
  /* Topbar (Schiefer = Chrome) */
  .topbar{background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;position:sticky;top:0;z-index:50}
  .topbar .brand{font-weight:700;letter-spacing:1px;font-size:16px}
  .topbar .brand small{font-weight:400;letter-spacing:0;opacity:.75;margin-left:8px;font-size:12px}
  .topbar button{background:#ffffff1d;color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600}
  .topbar button:hover{background:#ffffff30}
  /* Layout: Seitennavigation + Inhalt */
  .layout{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100vh - 46px)}
  .side{background:#fff;border-right:1px solid var(--line);padding:14px 12px}
  .side .sh{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:4px 2px 8px}
  .side .it{padding:9px 11px;border-radius:8px;font-size:13.5px;margin-bottom:3px;cursor:pointer;user-select:none}
  .side .it:hover{background:var(--surf2)}
  .side .it.on{background:var(--acc);color:#fff}
  .side .it.on:hover{background:var(--acc)}
  .side .lockedsec{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line)}
  .side .lockedsec .sh{color:var(--mut)}
  .side .locked{padding:9px 11px;border-radius:8px;font-size:13.5px;margin-bottom:3px;color:var(--mut);opacity:.5;cursor:not-allowed;user-select:none;display:flex;justify-content:space-between;align-items:center}
  .side .locked:hover{background:none}
  .main{padding:20px 22px 60px;max-width:1100px;width:100%}
  .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .mh h2{margin:0;font-size:18px}
  /* Bausteine */
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px}
  .hint{font-size:12px;color:var(--mut)}
  .sech{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
  .btn{background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
  .btn:hover{filter:brightness(1.25)}
  .btn.ghost{background:var(--surf2);color:var(--tx)}
  .btn.ghost:hover{filter:none;background:var(--line)}
  .btn.warn{background:var(--t1)}
  .btn[disabled]{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--surf2);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .tablewrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
  .pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .pill.gray{background:var(--surf2);color:var(--mut)}
  .pill.red{background:var(--t1)}
  .pill.green{background:var(--t3)}
  /* Login */
  .loginwrap{min-height:calc(100vh - 46px);display:flex;align-items:flex-start;justify-content:center;padding:60px 14px}
  .loginbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px;max-width:380px;width:100%;box-shadow:0 6px 22px rgba(0,0,0,.06)}
  .loginbox h1{font-size:18px;margin:0 0 4px}
  .arg-logo{width:52px;height:52px;border-radius:13px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin:0 auto 14px;letter-spacing:1px}
  .fieldlab{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
  .lerr{color:var(--t1);font-size:12.5px;font-weight:600;margin-top:10px;min-height:18px}
  /* Modal */
  .modalov{position:fixed;inset:0;background:rgba(15,21,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
  .modalbx{background:#fff;border-radius:13px;padding:20px 18px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .modalmsg{font-size:14px;margin-bottom:14px;white-space:pre-wrap}
  .modalrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  /* Toast */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--acc);color:#fff;font-weight:600;padding:11px 20px;border-radius:30px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:2000;max-width:90%}
  .toast.show{opacity:1}
  /* Wiedervorlage */
  .wieder{border:1px solid var(--t1);border-left:5px solid var(--t1);border-radius:11px;background:#fff;padding:14px;margin-bottom:14px}
  .wieder .wt{color:var(--t1);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  @media(max-width:760px){
    .layout{grid-template-columns:1fr}
    .side{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
    .side .sh{width:100%;margin:2px}
    .side .it,.side .locked{margin-bottom:0}
    .side .lockedsec{margin-top:0;padding-top:0;border-top:0;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
    .main{padding:14px}
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">ARGUS<small>· Leitung</small></span>
  <button id="logoutbtn" data-action="logout" style="display:none">Abmelden</button>
</div>

<script src="../vendor/supabase.js"></script>
<script>
"use strict";

/* ============================================================
 * ARGUS · Leitung — Governance-Oberfläche (Desktop)
 * Alle Inhalte ausschließlich nach Anmeldung mit MasterToken
 * (is_master-JWT). Die Seite selbst enthält keine Daten.
 * Sitzung bewusst flüchtig: sessionStorage, kein Verlauf.
 * ============================================================ */

var SUPA_URL = 'https://sehuosjyjmrpzcqrelej.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlaHVvc2p5am1ycHpjcXJlbGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0Mjk1MzksImV4cCI6MjA5NjAwNTUzOX0.G0DuJmeJBQwTLK8n4m4PVFSf2eNStZy_F0gIouMxIuo';

var _sb = null;
var _sbJwt = null;
var state = { section:'zugaenge' };   /* Direkteinstieg: Zugänge — keine Übersichtsseite */

/* ── Hilfsfunktionen ─────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function nowMs(){ return Date.now(); }
/* HTML-Escaping JEDES dynamischen Werts — Daten kommen aus gemeinsam
 * beschreibbaren Tabellen (Kennungen, Labels, Begründungen von Feld-Geräten). */
function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* de-DE-Datumsformat für bigint-Millisekunden (Muster govFmt der Feld-App) */
function fmtMs(ms){
  if(ms==null) return '—';
  return new Date(+ms).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr';
}
/* timestamptz (ISO-String, z. B. purge_log.at) ebenfalls de-DE */
function fmtIso(s){
  if(!s) return '—';
  var d=new Date(s);
  if(isNaN(d.getTime())) return esc(String(s));
  return d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr';
}
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },2200);
}

/* ── In-Page-Modals (keine nativen Dialoge — Projektkonvention) ── */
function modalBase(innerHtml){
  var ov=document.createElement('div'); ov.className='modalov';
  ov.innerHTML='<div class="modalbx">'+innerHtml+'</div>';
  document.body.appendChild(ov);
  return ov;
}
function confirmModal(msg, okLabel){
  return new Promise(function(resolve){
    var ov=modalBase('<div class="modalmsg">'+esc(msg)+'</div>'+
      '<div class="modalrow"><button class="btn ghost" data-m="no">Abbrechen</button>'+
      '<button class="btn" data-m="yes">'+esc(okLabel||'OK')+'</button></div>');
    ov.addEventListener('click',function(e){
      var b=e.target.closest('[data-m]');
      if(b){ ov.remove(); resolve(b.getAttribute('data-m')==='yes'); }
      else if(e.target===ov){ ov.remove(); resolve(false); }
    });
  });
}
function promptModal(msg, def){
  return new Promise(function(resolve){
    var ov=modalBase('<div class="modalmsg">'+esc(msg)+'</div>'+
      '<input id="modalinp" value="'+esc(def||'')+'">'+
      '<div class="modalrow"><button class="btn ghost" data-m="no">Abbrechen</button>'+
      '<button class="btn" data-m="yes">OK</button></div>');
    var inp=ov.querySelector('#modalinp'); inp.focus(); inp.select();
    function done(ok){ var v=inp.value; ov.remove(); resolve(ok?v:null); }
    ov.addEventListener('click',function(e){
      var b=e.target.closest('[data-m]');
      if(b){ done(b.getAttribute('data-m')==='yes'); }
      else if(e.target===ov){ done(false); }
    });
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') done(true); });
  });
}

/* ── Sitzung (D-07): sessionStorage, bewusst flüchtig ───────────
 * Schlüssel argusl_jwt / argusl_jwt_exp. Tab zu = Sitzung weg.
 * Abgelaufene Sitzung führt zurück zum Login. */
function sessionJwt(){
  var jwt=sessionStorage.getItem('argusl_jwt');
  var exp=parseInt(sessionStorage.getItem('argusl_jwt_exp')||'0',10);
  if(!jwt||!exp) return null;
  if(exp<=nowMs()){ sessionStorage.clear(); return null; }
  return jwt;
}
function sb(){
  var jwt=sessionJwt();
  if(!jwt) return null;
  if(_sb && jwt===_sbJwt) return _sb;
  var lib=window.supabase;
  if(!lib || !lib.createClient) return null;
  _sbJwt=jwt;
  _sb=lib.createClient(SUPA_URL, SUPA_KEY, {
    auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false},
    global:{ headers:{ Authorization:'Bearer '+jwt } }
  });
  return _sb;
}

/* ── Login (D-07): nur MasterToken ──────────────────────────────
 * Tauscht den Code via rpc/argus_exchange_code gegen ein JWT.
 * Antworten OHNE is_master=true werden abgewiesen — NICHTS wird
 * gespeichert (kein sessionStorage-Schreiben im Abweisungspfad). */
async function doLogin(raw){
  var clean=(raw||'').replace(/[\s\-]/g,'').toUpperCase();
  if(clean.length<8){ setLoginError('Bitte vollständigen MasterToken eingeben.'); return; }
  setLoginError('');
  var btn=$('loginbtn'); if(btn){ btn.disabled=true; btn.textContent='Prüfe…'; }
  try{
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean })
    });
    var data=await resp.json();   /* ungültiger Code = HTTP 200 + {error:…} */
    if(!data || !data.jwt){
      setLoginError(data && data.error ? data.error : 'Ungültiger oder verbrauchter Code.');
      return;
    }
    if(data.is_master !== true){
      /* Abweisung OHNE Speicherung — die Leitungs-Seite akzeptiert nur den MasterToken. */
      setLoginError('Nur mit MasterToken — dieser Code hat keine Leitungs-Berechtigung.');
      return;
    }
    sessionStorage.setItem('argusl_jwt', data.jwt);
    sessionStorage.setItem('argusl_jwt_exp', String(data.exp*1000));
    state.section='zugaenge';     /* D-10: direkt in den ersten Bereich */
    render();
    loadSection();
  }catch(e){
    setLoginError('Keine Verbindung — bitte erneut versuchen.');
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='Anmelden'; }
  }
}
function setLoginError(msg){ var e=$('loginerr'); if(e) e.textContent=msg||''; }
function doLogout(){ sessionStorage.clear(); location.reload(); }

/* ── Navigation / Router ───────────────────────────────────────── */
var SECTIONS=[
  { id:'zugaenge',   label:'Zugänge' },
  { id:'einsaetze',  label:'Einsatzprotokolle' },
  { id:'protokoll',  label:'Protokoll' }
];
function sideNav(){
  var h='<nav class="side"><div class="sh">Bereiche</div>';
  SECTIONS.forEach(function(s){
    h+='<div class="it'+(state.section===s.id?' on':'')+'" data-nav="'+s.id+'">'+esc(s.label)+'</div>';
  });
  /* Sichtbar gesperrte Zone (D-09): bewusst KEIN data-action, KEIN Klick-Verhalten.
   * Diese Funktionen kommen erst in Phase 7 (nach DSB-Votum). */
  h+='<div class="lockedsec"><div class="sh">Phase 7 · nach DSB</div>';
  h+='<div class="locked"><span>Identitäten</span><span>🔒</span></div>';
  h+='<div class="locked"><span>Audit-Log</span><span>🔒</span></div>';
  h+='</div></nav>';
  return h;
}
function render(){
  var app=$('app');
  var logged=!!sessionJwt();
  $('logoutbtn').style.display = logged ? '' : 'none';
  if(!logged){
    app.innerHTML=vLogin();
    return;
  }
  var h='<div class="layout">'+sideNav()+'<main class="main">';
  if(state.section==='zugaenge')       h+=secZugaenge();
  else if(state.section==='einsaetze') h+=secEinsaetze();
  else if(state.section==='protokoll') h+=secProtokoll();
  h+='</main></div>';
  app.innerHTML=h;
}
function loadSection(){
  if(state.section==='zugaenge')       loadZugaenge();
  else if(state.section==='einsaetze') loadEinsaetze();
  else if(state.section==='protokoll') loadProtokoll();
}

/* ── Login-View ────────────────────────────────────────────────── */
function vLogin(){
  var h='<div class="loginwrap"><div class="loginbox">';
  h+='<div class="arg-logo">ARGUS</div>';
  h+='<h1 style="text-align:center">Leitung</h1>';
  h+='<div class="hint" style="text-align:center">Anmeldung nur mit MasterToken.<br>Die Sitzung endet mit dem Schließen des Tabs.</div>';
  h+='<label class="fieldlab" for="logininp">MasterToken</label>';
  h+='<input id="logininp" placeholder="XXXX-XXXX" autocomplete="off" spellcheck="false" style="font-family:var(--mono);letter-spacing:2px;text-transform:uppercase">';
  h+='<div class="modalrow" style="justify-content:stretch;gap:8px">';
  h+='<button class="btn ghost" data-action="pastetoken" style="flex:1">📋 Einfügen</button>';
  h+='<button class="btn" id="loginbtn" data-action="login" style="flex:2">Anmelden</button>';
  h+='</div>';
  h+='<div class="lerr" id="loginerr"></div>';
  h+='</div></div>';
  return h;
}

/* ── Bereich „Zugänge" (D-11) ───────────────────────────────────
 * Portierung der Admin-Panel-Logik der Feld-App, erweitert um
 * 24-h-Codes und die Code-Sperre (revoked-Flag, Migration 0003). */
var _praes=null, _tokens=null, _zugErr=null;

/* Code-/Token-Erzeugung — 1:1 aus der Feld-App portiert */
function genShortCode(){
  var AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function blk(){var s='';for(var i=0;i<4;i++)s+=AL[Math.floor(Math.random()*AL.length)];return s;}
  return blk()+'-'+blk();
}
function genToken(){ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a,function(b){return b.toString(16).padStart(2,'0');}).join(''); }

/* Wurzel-URL der Feld-App: das Segment „docs/<datei>" aus dem eigenen
 * Pfad entfernen — die Leitungs-Seite liegt selbst unter docs/. */
function feldAppRoot(){
  return location.origin + location.pathname.replace(/docs\/[^\/]*$/,'');
}

async function loadZugaenge(){
  _praes=null; _tokens=null; _zugErr=null;
  if(state.section==='zugaenge') render();
  var cl=sb();
  if(!cl){ _zugErr='Sitzung abgelaufen — bitte neu anmelden.'; if(state.section==='zugaenge') render(); return; }
  try{
    var pr=await cl.from('praesidien').select('id,name').order('name');
    if(pr.error){ _zugErr=pr.error.message||'Präsidien nicht lesbar'; }
    else{
      _praes=pr.data||[];
      var tk=await cl.from('access_tokens').select('short_code,label,is_master,temporary,ttl_hours,single_use,used_at,revoked,praesidium_id');
      if(tk.error){ _zugErr=tk.error.message||'Zugänge nicht lesbar'; }
      else{ _tokens=tk.data||[]; }
    }
  }catch(e){ _zugErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(state.section==='zugaenge') render();
}

function tokenArt(t){
  if(t.is_master) return 'MasterToken';
  if(t.single_use) return 'Einmalig';
  if(t.temporary) return '24 h';
  return 'Dauerhaft';
}
function tokenStatus(t){
  if(t.revoked) return '<span class="pill red">GESPERRT</span>';
  if(t.single_use && t.used_at) return '<span class="pill gray">verbraucht</span>';
  return '<span class="pill green">aktiv</span>';
}
function tokenRows(list){
  var h='<div class="tablewrap"><table><thead><tr><th>Code</th><th>Art</th><th>Bezeichnung</th><th>Status</th><th></th></tr></thead><tbody>';
  list.forEach(function(t){
    h+='<tr>';
    h+='<td class="mono" style="font-weight:600;white-space:nowrap">'+esc(t.short_code||'—')+'</td>';
    h+='<td>'+esc(tokenArt(t))+'</td>';
    h+='<td>'+esc(t.label||'')+'</td>';
    h+='<td>'+tokenStatus(t)+'</td>';
    if(t.is_master){
      /* Selbstaussperrung verhindern: MasterToken-Zeilen sind hier NICHT sperrbar. */
      h+='<td class="hint">MasterToken — Sperrung nur direkt in der Datenbank</td>';
    }else if(!t.short_code){
      h+='<td></td>';
    }else if(t.revoked){
      h+='<td><button class="btn ghost" data-action="togglerevoke" data-sc="'+esc(t.short_code)+'" data-rev="1">Entsperren</button></td>';
    }else{
      h+='<td><button class="btn warn" data-action="togglerevoke" data-sc="'+esc(t.short_code)+'" data-rev="0">Sperren</button></td>';
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function secZugaenge(){
  var h='<div class="mh"><h2>Zugänge</h2><button class="btn ghost" data-action="zugreload">↻ Aktualisieren</button></div>';
  if(_zugErr){
    h+='<div class="card" style="border-color:var(--t1)"><div style="color:var(--t1);font-weight:600">Abruf fehlgeschlagen</div><div class="hint" style="margin-top:4px">'+esc(_zugErr)+'</div></div>';
    return h;
  }
  if(_praes===null || _tokens===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
    return h;
  }
  if(!_praes.length){
    h+='<div class="card"><p class="hint" style="margin:0">Keine Präsidien angelegt.</p></div>';
  }
  var used={};
  _praes.forEach(function(p){
    var list=_tokens.filter(function(t){ return t.praesidium_id===p.id; });
    list.forEach(function(t){ used[t.short_code||('tok'+Math.random())]=true; });
    h+='<div class="card">';

/* Link erstellen (Portierung adminlink-Handler der Feld-App):
 * Einmalig = immer neuer Insert; Dauerhaft/24 h = vorhandenen passenden,
 * NICHT gesperrten Code anbieten, sonst neu anlegen. */
async function makeLink(pid, pname, kind){
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var sc=null;
  if(kind==='once'){
    sc=genShortCode();
    var ins=await cl.from('access_tokens').insert({token:genToken(),praesidium_id:pid,is_master:false,label:pname+' Einmal-Link',short_code:sc,temporary:true,ttl_hours:24,single_use:true,used_at:null}).select('short_code').single();
    if(ins.error||!ins.data){ toast('Konnte Einmal-Code nicht anlegen'+(ins.error?' · '+ins.error.message:'')); return; }
    sc=ins.data.short_code;   /* bestätigter Code aus der DB */
  }else{
    var wantTemp=(kind==='temp');
    var rows=(_tokens||[]).filter(function(t){
      return t.praesidium_id===pid && !t.single_use && !t.is_master && !t.revoked && !!t.temporary===wantTemp;
    });
    if(rows.length && rows[0].short_code){
      sc=rows[0].short_code;
    }else{
      var ins2=await cl.from('access_tokens').insert({token:genToken(),praesidium_id:pid,is_master:false,label:pname+(wantTemp?' 24-h-Code':' Dauerhaft-Code'),short_code:genShortCode(),temporary:wantTemp,ttl_hours:(wantTemp?24:null),single_use:false,used_at:null}).select('short_code').single();
      if(ins2.error||!ins2.data){ toast('Konnte Code nicht anlegen'+(ins2.error?' · '+ins2.error.message:'')); return; }
      sc=ins2.data.short_code;
    }
  }
  var url=feldAppRoot()+'#code='+sc;
  var lbl=kind==='once'?'Einmal-Link (24 h)':(kind==='temp'?'24-h-Link':'Dauerhaft-Link');
  try{ await navigator.clipboard.writeText(url); toast(lbl+' kopiert ✓'); }
  catch(e){ await promptModal(lbl+' — '+pname+' (kopieren):', url); }
  loadZugaenge();
}

/* Code sperren/entsperren (D-11): revoked-Flag direkt per Master-JWT. */
async function toggleRevoke(sc, isRevoked){
  var msg=isRevoked
    ? 'Code '+sc+' wieder entsperren? Er ist danach am Feldgerät wieder einlösbar.'
    : 'Code '+sc+' sperren? Geräte mit diesem Code verlieren den Zugang beim nächsten Start bzw. bei Wiederverbindung (ab App-Version 0.23).';
  var ok=await confirmModal(msg, isRevoked?'Entsperren':'Sperren');
  if(!ok) return;
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var r=await cl.from('access_tokens').update({revoked:!isRevoked}).eq('short_code',sc);
  if(r.error){ toast('Änderung fehlgeschlagen: '+(r.error.message||'unbekannt')); return; }
  toast(isRevoked?'Code entsperrt':'Code gesperrt');
  loadZugaenge();
}

/* ── Bereich „Einsatzprotokolle" (D-12, D-01, D-02, D-03) ──────── */
var _eins=null, _einsErr=null;
var _detail=null;   /* {ccpId, data:{ccps,patients,checklists}} — geöffnetes Protokoll */

/* Frist-Einstufung — 1:1 aus der Feld-App portiert (04.8-05, JSC 10/10):
 * 'abgelaufen' (Frist <= jetzt) · 'bald' (< 24 h entfernt) · 'ok' ·
 * null (keine Frist gesetzt). */
function fristStatus(purgeAfter, now){
  if(purgeAfter==null) return null;
  if(now==null) now=nowMs();
  if(+purgeAfter <= now) return 'abgelaufen';
  if(+purgeAfter - now < 86400000) return 'bald';
  return 'ok';
}

/* Triage-Kategorien (nur funktionale Farben — Anzeige im Protokoll) */
var CATS={
  T1:{label:'T-1',bg:'var(--t1)',fg:'#fff'},
  T2:{label:'T-2',bg:'var(--t2)',fg:'#3A2C00'},
  T3:{label:'T-3',bg:'var(--t3)',fg:'#fff'},
  T5:{label:'T-5',bg:'var(--t5)',fg:'#fff'}
};

  ['a5','Rollen besetzt & allen bekannt?'],['a6','Materialplatz zentral & genug Material?'],['a7','Genug Personal?'],
  ['sec','BETRIEB – Schleife'],
  ['b1','Durchatmen'],['b2','Lagebild aktuell?'],['b3','Abgleich Patientenliste?'],

/* Kürzel-Pflicht (D-01): einmal je Sitzung abfragen, danach aus sessionStorage. */
async function ensureKuerzel(){
  var k=sessionStorage.getItem('argusl_kuerzel');
  if(k && k.trim()) return k.trim();
  var inp=await promptModal('Bediener-Kürzel (z. B. Streife / Name) — für das Zugriffs-Protokoll erforderlich:','');
  if(inp===null || !inp.trim()) return null;
  k=inp.trim();
  sessionStorage.setItem('argusl_kuerzel', k);
  return k;
}

async function loadEinsaetze(){
  _eins=null; _einsErr=null;
  if(state.section==='einsaetze') render();
  var cl=sb();
  if(!cl){ _einsErr='Sitzung abgelaufen — bitte neu anmelden.'; if(state.section==='einsaetze') render(); return; }
  try{
    var r=await cl.rpc('argus_governance_einsaetze');
    if(r.error){ _einsErr=r.error.message||'Abruf fehlgeschlagen'; }
    else{ _eins=Array.isArray(r.data)?r.data:[]; }
  }catch(e){ _einsErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(state.section==='einsaetze') render();

/* Gruppierung: ein Verbund (merge_group_id) = ein Einsatz. */
function einsatzGroups(){
  var groups={}, order=[];
  (_eins||[]).forEach(function(e){
    var k=e.merge_group_id || e.ccp_id || '?';
    if(!groups[k]){
      groups[k]={ key:k, ccp_id:e.ccp_id, kennungen:[], einsatz_typ:e.einsatz_typ,
        closed_at:e.closed_at, purge_after:e.purge_after, photo_purge_after:e.photo_purge_after,
        patient_count:0, photo_count:0, checklist_count:0 };
      order.push(k);
    }
    var g=groups[k];
    if(e.kennung && g.kennungen.indexOf(e.kennung)<0) g.kennungen.push(e.kennung);
    g.patient_count+=(+e.patient_count||0);
    g.photo_count+=(+e.photo_count||0);
    g.checklist_count+=(+e.checklist_count||0);
    if(e.closed_at!=null && (g.closed_at==null || +e.closed_at>+g.closed_at)) g.closed_at=e.closed_at;
    if(e.purge_after!=null && (g.purge_after==null || +e.purge_after>+g.purge_after)) g.purge_after=e.purge_after;
    if(e.photo_purge_after!=null && (g.photo_purge_after==null || +e.photo_purge_after>+g.photo_purge_after)) g.photo_purge_after=e.photo_purge_after;
  });
  return { groups:groups, order:order };
}

function typLabel(t){
  if(t==='einsatz') return 'Einsatz';
  if(t==='uebung') return 'Übung';
  return t ? esc(t) : '—';
}

  h+='<span class="mono" style="font-size:16px;font-weight:600">CCP '+esc(g.kennungen.join(' + ')||'?')+'</span>';
  h+='<span class="pill gray">'+typLabel(g.einsatz_typ)+'</span>';
  h+='<span class="hint">abgeschlossen: '+fmtMs(g.closed_at)+'</span>';
  h+='</div>';
  h+='<div class="hint" style="margin-top:6px">'+g.patient_count+' Patient(en) · '+g.photo_count+' Foto(s) · '+g.checklist_count+' Checkliste(n)</div>';
  if(st==='abgelaufen'){
    h+='<div class="hint" style="margin-top:6px;color:var(--t1);font-weight:600">Protokoll-Frist abgelaufen ('+fmtMs(g.purge_after)+') — Löschung steht an.</div>';
  }else if(st==='bald'){
    h+='<div class="hint" style="margin-top:6px;color:var(--t1);font-weight:600">Protokoll-Frist läuft ab: '+fmtMs(g.purge_after)+'</div>';
  }else{
    h+='<div class="hint" style="margin-top:6px">Protokoll-Frist (Löschung): '+fmtMs(g.purge_after)+'</div>';
  }
  if(fst==='abgelaufen'){
    h+='<div class="hint">Foto-Frist: abgelaufen ('+fmtMs(g.photo_purge_after)+') — Fotos sind endgültig gelöscht.</div>';
  }else{
    h+='<div class="hint">Foto-Frist (endgültige Löschung): '+fmtMs(g.photo_purge_after)+'</div>';
  }
  /* D-02: Fotos hart — bewusst KEINE Verlängerungs-UI für die Foto-Frist. */
  h+='<div class="hint" style="margin-top:4px">Fotos werden 72 Std nach Abschluss endgültig gelöscht — KEINE Verlängerung. Beweisbedarf: Sicherung durch die zuständige Stelle innerhalb der 72 Std.</div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">';
  h+='<button class="btn" data-action="openproto" data-ccpid="'+esc(g.ccp_id)+'">Protokoll öffnen</button>';
  h+='<button class="btn ghost" data-action="extendfrist" data-ccpid="'+esc(g.ccp_id)+'" data-kennung="'+esc(g.kennungen.join(' + ')||'?')+'" data-frist="'+(+g.purge_after||0)+'">⏱ Protokoll-Frist +72 h verlängern (mit Begründung)</button>';
  h+='</div>';
  h+='</div>';
  return h;
}

function secEinsaetze(){
  if(_detail) return vProtokollDetail();
  var h='<div class="mh"><h2>Einsatzprotokolle</h2><button class="btn ghost" data-action="einsreload">↻ Aktualisieren</button></div>';
  h+='<div class="card"><div class="hint" style="margin:0">Jeder Aufruf eines Einsatzprotokolls wird mit Kürzel und Zeitpunkt protokolliert. Der Übergabe-Export beim Abschluss ist der dauerhafte Weg in die Trägerdokumentation — die Protokolle hier sind ein Durchgangsspeicher mit Löschfrist.</div></div>';
  if(_einsErr){
    h+='<div class="card" style="border-color:var(--t1)"><div style="color:var(--t1);font-weight:600">Abruf fehlgeschlagen</div><div class="hint" style="margin-top:4px">'+esc(_einsErr)+'</div></div>';
    return h;
  }
  if(_eins===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
    return h;
  }
  var gg=einsatzGroups();
  if(!gg.order.length){
    h+='<div class="card"><p class="hint" style="margin:0">Keine Einsatzprotokolle vorhanden.<br>Hier erscheinen Einsätze, sobald sie am Feldgerät abgeschlossen wurden (bis zum Ablauf ihrer Löschfrist).</p></div>';
    return h;
  }
  /* Wiedervorlage (D-09): abgelaufene oder < 24 h laufende Protokoll-Fristen oben. */
  var now=nowMs();
  var wieder=gg.order.filter(function(k){ var s=fristStatus(gg.groups[k].purge_after, now); return s==='abgelaufen'||s==='bald'; });
  var normal=gg.order.filter(function(k){ return wieder.indexOf(k)<0; });
  if(wieder.length){
    h+='<div class="wieder"><div class="wt">Wiedervorlage — Frist abgelaufen / läuft ab</div>';
    h+='<div class="hint" style="margin-bottom:10px">Frist nur mit Begründung verlängern oder Löschung geschehen lassen — der Übergabe-Export beim Abschluss ist der dauerhafte Weg.</div>';
    wieder.forEach(function(k){ h+=einsatzCard(gg.groups[k], now, true); });
    h+='</div>';
  }
  if(normal.length){
    if(wieder.length) h+='<div class="sech">Weitere Einsätze</div>';
    normal.forEach(function(k){ h+=einsatzCard(gg.groups[k], now, false); });
  }
  return h;
}

/* Protokoll öffnen (D-01): Hinweis-Modal → Kürzel-Pflicht → protokollierter RPC. */
async function openProtokoll(ccpId){
  var ok=await confirmModal('Jeder Aufruf eines Einsatzprotokolls wird protokolliert (Kürzel + Zeitpunkt). Fortfahren?','Fortfahren');
  if(!ok) return;
  var k=await ensureKuerzel();
  if(!k){ toast('Ohne Kürzel kein Protokoll-Abruf'); return; }
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  toast('Lade Einsatzprotokoll…');
  var r;
  try{ r=await cl.rpc('argus_governance_protokoll',{p_ccp_id:ccpId,p_kuerzel:k}); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error){ toast('Abruf fehlgeschlagen: '+(r.error.message||'keine Verbindung')); return; }
  _detail={ ccpId:ccpId, data:r.data||{} };
  render();
}

function vitCompact(v){
  if(!v || typeof v!=='object') return '—';
  var parts=[];
  [['af','AF'],['hf','HF'],['rr','RR'],['spo2','SpO2'],['avpu','AVPU'],['pain','Schmerz']].forEach(function(f){
    var val=v[f[0]];
    if(val!=null && String(val).trim()!=='') parts.push(f[1]+' '+esc(String(val)));
  });
  return parts.length ? parts.join(' · ') : '—';
}
function injCompact(p){
  var parts=[];
  if(Array.isArray(p.inj)) p.inj.forEach(function(i){ if(i && (i.r||i.a)) parts.push(esc(String(i.r||'?'))+': '+esc(String(i.a||'?'))); });
  if(p.injury && String(p.injury).trim()!=='') parts.push(esc(String(p.injury)));
  return parts.length ? parts.join(' · ') : '—';
}
function patStatusLabel(s){
  if(s==='gpa') return 'abtransportiert (gPA)';
  if(s==='active') return 'aktiv';
  return s ? esc(String(s)) : '—';
}

        var st=items[it[0]]||{};
        h+='<div style="font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--surf2)">';
        h+=(st.done?'<span style="color:var(--t3);font-weight:700">✓</span>':'<span class="hint">○</span>')+' '+esc(it[1]);
        if(st.note && String(st.note).trim()!=='') h+='<div class="hint" style="margin-left:18px">Notiz: '+esc(String(st.note))+'</div>';

      });

/* Foto-Einzelabruf (Lazy-Load, eigener Protokoll-Eintrag foto_view) */
async function showFoto(pid, num){

  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:12px;cursor:pointer';
  ov.innerHTML='<img src="'+photo+'" alt="Patientenfoto" style="max-width:100%;max-height:78%;object-fit:contain;border-radius:8px">'+
    '<div style="color:#cfd6df;font-size:12.5px;text-align:center;max-width:480px">Patient Nr. '+esc(num||'?')+' · Dieser Abruf wurde protokolliert ('+esc(k)+', '+esc(ts)+' Uhr).</div>'+
    '<div style="position:absolute;top:12px;right:16px;color:#fff;font-size:30px;line-height:1;font-weight:300">✕</div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); });
}

/* Protokoll-Frist +72 h (D-03): Pflicht-Begründung mit Leer-Abweisung,
 * Bestätigung mit Frist-Vorschau + Export-Hinweis, wirkt auf den Verbund. */
async function extendFrist(ccpId, kennung, frist){
  var k=await ensureKuerzel();
  if(!k){ toast('Ohne Kürzel keine Verlängerung'); return; }
  var grund=null, msg='Begründung (Pflicht): Warum muss das Einsatzprotokoll über die Frist hinaus aufbewahrt werden?';
  for(;;){
    var inp=await promptModal(msg,'');
    if(inp===null) return;   /* abgebrochen */
    if(inp.trim()){ grund=inp.trim(); break; }
    msg='Begründung darf nicht leer sein — bitte den Grund angeben (Pflichtfeld):';
  }
  var neu=Math.max(nowMs(), +frist||0)+72*3600000;   /* Vorschau — verbindlich rechnet der Server identisch */
  var ok=await confirmModal('Protokoll-Frist für CCP '+kennung+' um 72 Std verlängern — neue Frist: '+fmtMs(neu)+'. Die Foto-Frist bleibt unverändert (Fotos werden nicht verlängert). Bei dauerhaftem Bedarf: Export an die zuständige Stelle statt wiederholter Verlängerung.','+72 h verlängern');
  if(!ok) return;
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var r;
  try{ r=await cl.rpc('argus_extend_protokoll_frist',{p_ccp_id:ccpId,p_kuerzel:k,p_grund:grund,p_stunden:72}); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error){ toast('Verlängerung fehlgeschlagen: '+(r.error.message||'keine Verbindung')); return; }
  var nf=r.data && r.data.purge_after;
  toast('Frist verlängert'+(nf?' — bis '+fmtMs(nf):''));
  loadEinsaetze();
}

/* ── Bereich „Protokoll" (D-13): governance_log + purge_log ─────
 * Reine Anzeige — Zugriffe/Verlängerungen und Lösch-Läufe (inhaltsfrei). */
var _glog=null, _glogErr=null, _plog=null, _plogErr=null;

async function loadProtokoll(){
  _glog=null; _glogErr=null; _plog=null; _plogErr=null;
  if(state.section==='protokoll') render();
  var cl=sb();
  if(!cl){ _glogErr='Sitzung abgelaufen — bitte neu anmelden.'; if(state.section==='protokoll') render(); return; }
  try{
    var lg=await cl.from('governance_log')
      .select('at,ccp_id,patient_id,kuerzel,action,begruendung,neue_frist')
      .order('at',{ascending:false}).limit(200);
    if(lg.error){ _glogErr=lg.error.message||'Protokoll nicht lesbar'; }
    else{ _glog=lg.data||[]; }
    var pg=await cl.from('purge_log')
      .select('at,ccp_id,kennung,reason,patient_count,photo_count,checklist_count')
      .order('at',{ascending:false}).limit(100);
    if(pg.error){ _plogErr=pg.error.message||'Lösch-Protokoll nicht lesbar'; }
    else{ _plog=pg.data||[]; }
  }catch(e){ _glogErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(state.section==='protokoll') render();
}

function actionLabel(a){
  if(a==='foto_view') return 'Foto-Abruf';
  if(a==='protokoll_view') return 'Einsatzprotokoll-Aufruf';
  if(a==='frist_verlaengert') return 'Frist verlängert';
  return a ? esc(String(a)) : '?';
}
function purgeReasonLabel(r){
  if(r==='frist') return 'Frist abgelaufen';
  if(r==='inaktiv') return 'Inaktivität';
  if(r==='foto_72h') return 'Foto-72-h-Löschung';
  return r ? esc(String(r)) : '?';
}

function secProtokoll(){
  var h='<div class="mh"><h2>Protokoll</h2><button class="btn ghost" data-action="protoreload">↻ Aktualisieren</button></div>';
  /* Zugriffe & Verlängerungen */
  h+='<div class="sech" style="margin-top:0">Zugriffe &amp; Verlängerungen'+(_glog?' ('+_glog.length+')':'')+'</div>';
  if(_glogErr){
    h+='<div class="card" style="border-color:var(--t1)"><div class="hint" style="color:var(--t1)">'+esc(_glogErr)+'</div></div>';
  }else if(_glog===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
  }else if(!_glog.length){
    h+='<div class="card"><p class="hint" style="margin:0">Noch keine Einträge.<br>Hier erscheint jeder Einsatzprotokoll-Aufruf, jeder Foto-Abruf und jede Frist-Verlängerung (Kürzel + Zeitpunkt).</p></div>';
  }else{
    h+='<div class="card">';
    _glog.forEach(function(l){
      var subj='';
      if(l.patient_id!=null) subj='Patient '+esc(String(l.patient_id).slice(0,10))+'…';
      if(l.ccp_id) subj+=(subj?' · ':'')+'CCP '+esc(String(l.ccp_id).slice(0,8))+'…';
      h+='<div style="padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px">';
      h+='<div><span class="mono">'+fmtMs(l.at)+'</span> · <b>'+esc(l.kuerzel||'—')+'</b> · '+actionLabel(l.action)+(subj?' · '+subj:'')+'</div>';
      if(l.action==='frist_verlaengert'){
        h+='<div class="hint" style="margin-top:2px">Begründung: '+esc(l.begruendung||'—')+(l.neue_frist!=null?' · neue Frist: '+fmtMs(l.neue_frist):'')+'</div>';
      }
      h+='</div>';
    });
    h+='</div>';
  }
  /* Lösch-Läufe (inhaltsfrei) */
  h+='<div class="sech">Lösch-Läufe'+(_plog?' ('+_plog.length+')':'')+'</div>';
  if(_plogErr){
    h+='<div class="card" style="border-color:var(--t1)"><div class="hint" style="color:var(--t1)">'+esc(_plogErr)+'</div></div>';
  }else if(_plog===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
  }else if(!_plog.length){
    h+='<div class="card"><p class="hint" style="margin:0">Noch keine Lösch-Läufe.<br>Hier wird jede automatische Löschung dokumentiert (Zeitpunkt, Kennung, Grund, Zähler) — ohne Inhalte.</p></div>';
  }else{
    h+='<div class="tablewrap"><table><thead><tr><th>Zeitpunkt</th><th>CCP</th><th>Grund</th><th>Patienten</th><th>Fotos</th><th>Checklisten</th></tr></thead><tbody>';
    _plog.forEach(function(l){
      h+='<tr>';
      h+='<td class="mono" style="white-space:nowrap">'+fmtIso(l.at)+'</td>';
      h+='<td class="mono">'+esc(l.kennung||'—')+'</td>';
      h+='<td>'+purgeReasonLabel(l.reason)+'</td>';
      h+='<td>'+esc(String(l.patient_count!=null?l.patient_count:'—'))+'</td>';
      h+='<td>'+esc(String(l.photo_count!=null?l.photo_count:'—'))+'</td>';
      h+='<td>'+esc(String(l.checklist_count!=null?l.checklist_count:'—'))+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  }
  return h;
}

/* ── Klick-Dispatcher ──────────────────────────────────────────── */
document.addEventListener('click', async function(e){
  var nav=e.target.closest('[data-nav]');
  if(nav){
    state.section=nav.getAttribute('data-nav');
    _detail=null;   /* geöffnetes Protokoll beim Bereichswechsel schließen */
    render(); loadSection();
    return;
  }
  var el=e.target.closest('[data-action]');
  if(!el) return;
  var a=el.getAttribute('data-action');
  if(a==='logout'){ doLogout(); return; }
  if(a==='login'){ var li=$('logininp'); await doLogin(li?li.value:''); return; }
  if(a==='pastetoken'){
    var pi=$('logininp');
    try{
      var txt=await navigator.clipboard.readText();
      if(pi) pi.value=(txt||'').trim();
      await doLogin(txt||'');
    }catch(err){ setLoginError('Zwischenablage nicht lesbar — bitte Token eintippen.'); }
    return;
  }
  if(a==='zugreload'){ loadZugaenge(); return; }
  if(a==='mklink'){
    await makeLink(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'', el.getAttribute('data-kind'));
    return;
  }
  if(a==='togglerevoke'){
    await toggleRevoke(el.getAttribute('data-sc'), el.getAttribute('data-rev')==='1');
    return;
  }
  if(a==='einsreload'){ _detail=null; loadEinsaetze(); return; }
  if(a==='openproto'){ await openProtokoll(el.getAttribute('data-ccpid')); return; }
  if(a==='closeproto'){ _detail=null; render(); return; }
  if(a==='protophoto'){ await showFoto(el.getAttribute('data-pid'), el.getAttribute('data-num')); return; }
  if(a==='extendfrist'){
    await extendFrist(el.getAttribute('data-ccpid'), el.getAttribute('data-kennung')||'?', el.getAttribute('data-frist'));
    return;
  }
  if(a==='protoreload'){ loadProtokoll(); return; }
});
$('logininp') && $('logininp').focus();
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='logininp'){
    doLogin(document.activeElement.value);
  }
});

/* Start: abgelaufene/fehlende Sitzung → Login, sonst direkt Zugänge (D-10) */
render();
if(sessionJwt()) loadSection();
</script>
