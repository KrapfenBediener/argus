<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS · FLZ</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../assets/icon-flz-192.png">
<link rel="apple-touch-icon" href="../assets/icon-flz-180.png">
<meta name="apple-mobile-web-app-title" content="ARGUS FLZ">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
  /* Optik 1:1 nach docs/UI-AUSBLICK.html (PC — FLZ-Lagedashboard), Fonts lokal */
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-400.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-500.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-600.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-700.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-600.woff2) format('woff2')}
  :root{
    --bg:#fff; --surf:#f6f7f8; --surf2:#eef0f2; --line:#d9dde1;
    --tx:#16181a; --mut:#5d6368;
    --t1:#C62828; --t2:#F2B600; --t3:#2E7D32; --t5:#1b1d20; --t5b:#3a3d41;
    --prio:#E65100; --ready:#1565C0; --acc:#1f2530;
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--surf);color:var(--tx);font-family:var(--sans);line-height:1.5;font-size:14px}
  button{font-family:var(--sans);cursor:pointer;border:0}
  input{font-family:var(--sans);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--tx);width:100%}
  input:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
  .mono{font-family:var(--mono)}
  /* Topbar — wie Mockup: Schiefer, Punkt, eine Zeile */
  .topbar{background:var(--acc);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;position:sticky;top:0;z-index:50}
  .topbar .dot{width:9px;height:9px;border-radius:50%;background:#ffffff55;flex:0 0 auto}
  .topbar .dot.ok{background:var(--t3)}
  .topbar .dot.off{background:var(--t1)}
  .topbar .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;white-space:nowrap}
  .topbar .stand{opacity:.85;font-size:12px}
  .topbar button{background:#ffffff1d;color:#fff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600}
  .topbar button:hover{background:#ffffff30}
  /* Hauptfläche — Mockup .main */
  .main{padding:14px;max-width:920px;margin:0 auto;width:100%}
  .keeprow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mut)}
  .keeprow input{width:18px;height:18px;margin:0}
  /* CCP-Raster — Karten selbst im Baustein-Block (Muster A, Phase 6.8) */
  .lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  /* Hinweis-Note — Mockup .note */
  .note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ready);border-radius:10px;padding:11px 14px;margin:14px 0 0;font-size:13px}
  .note.err{border-left-color:var(--t1);color:var(--t1);font-weight:600;margin:0 0 12px}
  .empty{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;color:var(--mut);font-size:13px}
  /* Login */
  .loginwrap{min-height:calc(100vh - 40px);display:flex;align-items:flex-start;justify-content:center;padding:60px 14px}
  .loginbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px;max-width:380px;width:100%;box-shadow:0 6px 22px rgba(0,0,0,.06)}
  .loginbox h1{font-size:18px;margin:0 0 4px}
  .arg-logo{width:52px;height:52px;border-radius:13px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin:0 auto 14px;letter-spacing:1px}
  .hint{font-size:12px;color:var(--mut)}
  .fieldlab{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
  .lerr{color:var(--t1);font-size:12.5px;font-weight:600;margin-top:10px;min-height:18px}
  .btn{background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
  .btn:hover{filter:brightness(1.25)}
  .btn[disabled]{opacity:.5;cursor:default}
  /* 6.8-BAUSTEINE-ANFANG */
  /* Geteilt mit der Verwaltung (Drift-Test): Klassen der Bausteine umgebungsBand,
   * summenLeiste, karteA. Hintergründe über Variablen (Großbild überschreibt nur diese). */
  .uband{padding:8px 14px;font-weight:700;font-size:13px;letter-spacing:.3px;line-height:1.35;border-left:10px solid transparent}
  .uband.u-echt{background:#39404b;color:#fff;border-left-color:var(--t1)}
  .uband.u-schulung{background:#F2B600;color:#1b1d20;border-left-color:#1b1d20}
  .uband.u-unbekannt{background:#c9cdd2;color:#1b1d20;border-left-color:#6b7178}
  /* Summenleiste D6.8-03: sechs große Kacheln + schmale Nebenzeile */
  .sumbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0 0 6px}
  .sumbar .sum{background:var(--bg);border-radius:10px;padding:12px 6px 10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  /* Infokacheln (abtransportiert, offene CCPs): nur umrandet, ohne Füllung, in der Textfarbe des Modus */
  .sumbar .sum.info{background:transparent;border:2px solid var(--tx);color:var(--tx);box-shadow:none}
  .sumbar .n{font-family:var(--mono);font-weight:700;font-size:38px;line-height:1.05;color:inherit}
  .sumbar .l{font-size:13px;font-weight:700;color:inherit}
  .sumneben{font-size:12.5px;color:var(--mut);margin:0 0 12px;padding:0 2px}
  .sumneben b{font-family:var(--mono);font-weight:600;color:var(--tx)}
  /* Kartenmuster A D6.8-02: 2-px-Rahmen, dunkles Kopfband, Kategorien, Metazeile */
  .ka{background:var(--bg);border:2px solid var(--acc);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .kb{background:var(--acc);color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 10px;padding:7px 10px;font-weight:700;font-size:14px;line-height:1.3}
  .kb.alt{background:#6b7178}
  .kb.rot{background:var(--t1)}
  .kb .kbl{min-width:0;overflow-wrap:anywhere}
  .kbr{flex:0 0 auto;margin-left:auto;font-weight:600;font-size:12px;white-space:nowrap}
  .ka .geo{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
  .ka .ked{cursor:pointer;font-size:13px;opacity:.85;margin-left:4px}
  .kz{display:flex;gap:5px;padding:9px 10px 5px}
  .kz .k{flex:1;border-radius:6px;text-align:center;color:#fff;padding:6px 0 5px}
  .kz .k .n{display:block;font-family:var(--mono);font-weight:700;font-size:22px;line-height:1.05}
  .kz .k .l{font-size:10px;font-weight:600;opacity:.95}
  .kmeta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:3px 10px 8px;font-size:12px;color:var(--mut)}
  .kmeta b{font-family:var(--mono);font-weight:600;color:var(--tx)}
  /* Verbund: je Mitglied eine Standortzeile (eine Patientenliste, mehrere Orte) */
  .vmem{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);padding:5px 10px;border-top:1px dashed var(--line)}
  .vmem .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vmem .ked{margin-left:auto}
  /* 6.8-BAUSTEINE-ENDE */
  /* Lage-eigene Klassen (Phase 6.8, D6.8-01): Band-Bereich und Auswahlbildschirm */
  .ubar{position:sticky;top:var(--toph,37px);z-index:40;display:flex;align-items:stretch;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .ubar .uband{flex:1;display:flex;align-items:center;min-width:0}
  .ubar .btn{border-radius:0;padding:8px 16px;white-space:nowrap}
  .uband.u-wahl{background:var(--surf2);color:var(--tx);border-left-color:var(--acc)}
  .pblock{margin:16px 0 6px}
  .pblock > h2{margin:0 0 10px;padding:7px 12px;font-size:14px;font-weight:700;letter-spacing:.3px;border-radius:6px;border-left:10px solid transparent}
  .pblock.u-echt > h2{background:#39404b;color:#fff;border-left-color:var(--t1)}
  .pblock.u-schulung > h2{background:#F2B600;color:#1b1d20;border-left-color:#1b1d20}
  .pblock.u-unbekannt > h2{background:#c9cdd2;color:#1b1d20;border-left-color:#6b7178}
  .pblock .phint{font-size:12px;color:var(--mut);margin:-4px 0 8px}
  .pblock .pleer{font-size:13px;color:var(--mut);padding:4px 2px}
  .ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ptile{min-height:72px;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--acc);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
  .ptile:hover{background:var(--surf2)}
  .ptile .pn{font-weight:700;font-size:15px;line-height:1.25}
  .ptile .pz{font-size:12px;color:var(--mut)}
  .ptile .pz b{font-family:var(--mono);font-size:15px;color:var(--tx)}
  .ptile .pz .pt1 b{color:var(--t1)}
  .ptile.leer{border-color:var(--line);border-style:dashed}
  .ptile.leer .pn{color:var(--mut)}
  /* 6.8-SKIZZE */
  /* D6.8-06 Lageskizze (Inline-SVG, kein Kartendienst): Farben über Variablen,
   * funktioniert damit auch im Großbild. */
  .skab{margin:18px 0 0}
  .skab h3{margin:0;font-size:14px;font-weight:700;letter-spacing:.3px;color:var(--tx)}
  .skkopf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
  .skizze{display:block;width:100%;height:auto;max-height:75vh}
  .skizze .skrahmen{fill:var(--bg);stroke:var(--line);stroke-width:1}
  .skizze text{font-family:var(--mono);font-weight:700;font-size:12px}
  .skizze .sknord{fill:var(--mut);font-family:var(--sans);font-size:13px}
  .skp circle{stroke:#fff;stroke-width:2}
  .skp text{fill:#fff;font-size:11px}
  .sk-t1 circle{fill:var(--t1)}
  .sk-t2 circle{fill:var(--t2)}
  .sk-t3 circle{fill:var(--t3)}
  .sk-t5 circle{fill:var(--t5)}
  .sk-leer circle{fill:var(--bg);stroke:var(--mut)}
  .sk-grau circle{fill:#9aa1a8}
  .sk-t2 text{fill:#1b1d20}
  .sk-leer text{fill:var(--tx)}
  .skmass line{stroke:var(--tx);stroke-width:3}
  .skmass text{fill:var(--tx);font-family:var(--sans);font-size:13px;font-weight:700;stroke:var(--bg);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
  .skizze .sklab{fill:var(--tx);font-family:var(--sans);font-size:13px;font-weight:600;stroke:var(--bg);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
  .skdist line{stroke:var(--mut);stroke-width:1.5;stroke-dasharray:5 4}
  .skizze .skdl{fill:var(--mut);font-family:var(--sans);font-size:12px;font-weight:600;stroke:var(--bg);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
  .skhinw{font-size:13px;color:var(--tx);margin-top:6px}
  .skohne{font-size:12.5px;color:var(--mut);margin-top:6px}
  .skleer{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--mut)}
  .skwarn{background:#FFF4D1;border:1px solid #E0B84A;border-left:5px solid #F2B600;border-radius:10px;color:#3A2C00;font-size:13.5px;padding:12px 14px}
  .skwarn b{font-weight:700}
  .skohne.skwarn{margin-top:8px;padding:9px 12px}
  .sklegende{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-top:6px}
  .sklegende i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
  .sklegende .lg-t1{background:var(--t1)}
  .sklegende .lg-t2{background:var(--t2)}
  .sklegende .lg-t3{background:var(--t3)}
  .sklegende .lg-t5{background:var(--t5)}
  .sklegende .lg-leer{background:var(--bg);border-color:var(--mut)}
  .sklegende .lg-grau{background:#9aa1a8}
  /* 6.8-KARTE */
  /* Kartenmodul (Passform karte-config.js): Leaflet-Karte statt Skizze. Eigener
   * Stapelkontext, damit Leaflet-Ebenen (z-index bis 1000) unter Kopfzeile und Band
   * bleiben. Kacheln werden nie eingefärbt/invertiert (auch nicht im Großbild). */
  .kschalter{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
  .kschalter button{background:var(--bg);color:var(--tx);font-size:12px;font-weight:600;padding:4px 12px}
  .kschalter button + button{border-left:1px solid var(--line)}
  .kschalter button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .kartehalter{position:relative;z-index:0;isolation:isolate}
  .karte{height:440px;border:1px solid var(--line);border-radius:10px;background:#e8eaed;font-family:var(--sans)}
  .karte .leaflet-tooltip.kartelab{font-family:var(--sans);font-size:13px;font-weight:600;color:#16181a;background:#fff;border:1px solid #9aa1a8;border-radius:6px;padding:2px 7px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .karte .leaflet-control-attribution{font-family:var(--sans);font-size:11px}
  .karte .leaflet-control-scale-line{font-family:var(--sans);font-weight:600}
  .kfehl{font-size:12.5px;color:var(--mut);margin:0 0 6px}
  /* 6.8-GROSSBILD */
  /* D6.8-05 Großbild für Leitstand-Bildschirm/Beamer. Zwei Teile: body.gross = Größen
   * (große Zahlen, breites Raster) in beiden Farbschemata; body.gross.ggedaempft = gedämpftes
   * Farbschema: nur der Seitenhintergrund wird ein ruhiges Off-White, alles andere (weiße
   * CCP-Karten mit dunklem Kopfband, Summenleiste, veraltet, Skizze, Karte) bleibt exakt wie
   * in der Normalansicht. Ohne ggedaempft bleibt das helle Normaldesign (Umschalter
   * „Großbild: hell | gedämpft“, Wahl in localStorage). Nur eigene Regeln mit body.gross —
   * der geteilte Baustein-Block bleibt unverändert. */
  body.gross .main{max-width:none;padding:18px 22px}
  body.gross .lgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  body.gross .kb{font-size:22px;padding:9px 12px}
  body.gross .kbr{font-size:20px}
  body.gross .kz .k .n{font-size:44px}
  body.gross .kz .k .l{font-size:14px}
  body.gross .kmeta{font-size:15px}
  body.gross .sumbar .n{font-size:48px}
  body.gross .sumbar .l{font-size:15px}
  body.gross .sumneben{font-size:16px}
  body.gross .uband{font-size:18px}
  body.gross .skab h3{font-size:18px}
  body.gross .karte{height:62vh}
  body.gross .karte .leaflet-tooltip.kartelab{font-size:15px}
  body.gross .kschalter button{font-size:14px}
  body.gross .kfehl{font-size:15px}
  body.gross .sklegende,body.gross .skohne{font-size:15px}
  body.gross .skwarn{font-size:16px}
  body.gross .skhinw{font-size:15px}
  body.gross .skizze .sklab{font-size:15px}
  body.gross .skizze .skdl{font-size:14px}
  /* Gedämpft: Off-White (wärmer/grauer als Weiß, 1,2:1 zur weißen Karte). Die weißen Karten
   * heben sich durch ihren 2-px-Rahmen in Schiefer ab; die hellen Linien von Karte, Kartenschalter
   * und Skizze würden auf Off-White verschwinden und bekommen ein mittleres Grau. */
  body.gross.ggedaempft{--surf:#E9E7E1}
  body.gross.ggedaempft .karte{border-color:#9aa1a8}
  body.gross.ggedaempft .kschalter{border-color:#9aa1a8}
  body.gross.ggedaempft .skizze .skrahmen{stroke:#9aa1a8}
  /* Umschalter „Großbild: hell | gedämpft“ in der Kopfzeile (nur im Großbild sichtbar) */
  .topbar .gthema{display:inline-flex;align-items:center;gap:4px}
  .topbar .gthema .gtl{font-size:12px;opacity:.85}
  .topbar .gthema button[aria-pressed="true"]{background:#fff;color:var(--acc)}
  /* Wachhalte-Zustand in der Kopfzeile (sichtbarer Fallback, Pitfall 7) */
  .topbar .wach{display:inline-flex;align-items:center;gap:8px;font-size:12px;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
  .topbar .wach .wt{overflow:hidden;text-overflow:ellipsis}
  .topbar .wach .wt.warn{color:#F2B600;font-weight:600}
  .topbar .wach .wt.ok{opacity:.85}
  @media(max-width:720px){ .sumbar{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media(max-width:560px){ .lgrid{grid-template-columns:1fr 1fr} .ptiles{grid-template-columns:1fr 1fr} .main{padding:10px} }
</style>
</head>
<body>
<div class="topbar">
  <span class="dot" id="statdot"></span>
  <span class="tt" id="toptitle">ARGUS · FLZ</span>
  <span class="right">
    <span class="stand" id="stattxt"></span>
    <span class="wach" id="wachtxt"></span>
    <span id="gthema" class="gthema" style="display:none"><span class="gtl">Großbild:</span><button id="gthell" data-action="gthema" data-thema="hell" aria-pressed="false" title="Großbild hell">hell</button><button id="gtgedaempft" data-action="gthema" data-thema="gedaempft" aria-pressed="true" title="Großbild gedämpft">gedämpft</button></span>
    <button id="grossbtn" data-action="gross" style="display:none" title="Großbild für Leitstand/Beamer. Browser-Vollbild: Ctrl+Cmd+F (Mac) bzw. F11 (Windows)">Großbild</button>
    <button id="logoutbtn" data-action="logout" style="display:none">Abmelden</button>
  </span>
</div>
<div id="app"></div>
<script src="../config.js"></script>
<script src="../karte-config.js"></script>
<script src="../vendor/leaflet/leaflet.js"></script>
<script>
"use strict";

/* ============================================================
 * ARGUS · Lageübersicht — read-only Beobachter-Seite für FLZ/ILS (Stufe a)
 * Optik nach dem Mockup docs/UI-AUSBLICK.html („PC — FLZ-Lagedashboard"),
 * seit Phase 6.8: Auswahl Echtbetrieb/Schulung je Präsidium, Umgebungsband,
 * Summenleiste, CCP-Karten im Kopfband-Muster (A), Hinweis-Note unten.
 * Zugang nur mit Beobachter-Code (Observer-JWT, Migration 0005);
 * Zahlen ausschließlich aus dem Aggregat-RPC argus_lage — die
 * Seite kennt keine Patientendaten. Sitzung flüchtig
 * (sessionStorage); Pull/Polling alle 20 s, kein Realtime.
 * ============================================================ */

/* Backend-Konfiguration zentral aus ../config.js (Phase 4.11, D-01).
 * Kein supabase.js nötig: die Seite spricht genau zwei RPCs per fetch. */
var _cfg = window.ARGUS_CONFIG || null;
var _configError = !(_cfg && typeof _cfg.url==='string' && _cfg.url.indexOf('https://')===0 && _cfg.anonKey);
var SUPA_URL = _configError ? '' : _cfg.url;
var SUPA_KEY = _configError ? '' : _cfg.anonKey;

var POLL_MS = 20000;          /* 20 s — Diskretionsentscheid (Spanne 15–30 s) */
var _timer = null;
var _data = null;             /* letzte erfolgreiche argus_lage-Antwort */
var _lastOkAt = null;         /* ms des letzten erfolgreichen Polls */
var _offline = false;
var _polling = false;

/* ── Hilfsfunktionen ─────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function nowMs(){ return Date.now(); }
/* HTML-Escaping JEDES dynamischen Werts — kennung/ort kommen von Feld-Geräten. */
function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtClock(ms){
  return new Date(+ms).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function fmtHM(ms){
  return new Date(+ms).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

/* ── Phase 6.8: reine Bausteine (geteilt mit der Verwaltung — Drift-Test in tests/verwaltung.test.cjs) ──
 * Ab hier bis zum Abschnittsende: keine Globals außer TAFEL, LAGE_SCHWELLE_MS,
 * esc() und fmtHM(); Zeit und Daten kommen nur als Parameter. Die mit
 * „geteilt“ markierten Funktionen werden byte-gleich in die Verwaltung kopiert. */
/* geteilt — D6.8-02: Buchstabiertafel wie im Funkspruch der Feld-App
 * (Literal zeichengleich, Drift-Test gegen index.html). */
var TAFEL={A:'Anton',B:'Berta',C:'Cäsar',D:'Dora',E:'Emil',F:'Friedrich',G:'Gustav',H:'Heinrich',I:'Ida',J:'Julius',K:'Kaufmann',L:'Ludwig',M:'Martha',N:'Nordpol',O:'Otto',P:'Paula',Q:'Quelle',R:'Richard',S:'Samuel',T:'Theodor',U:'Ulrich',V:'Viktor',W:'Wilhelm',X:'Xanthippe',Y:'Ypsilon',Z:'Zacharias'};
/* geteilt — D6.8-04: ab 3 min ohne Lebenszeichen wird das Kopfband grau (Owner justiert). */
var LAGE_SCHWELLE_MS = 180000;
/* geteilt — D6.8-02: Kennung → Funkname („A“ → „Anton“, „A/E“ → „Anton/Emil“);
 * unbekannt → Rohwert. Kein Escaping — der Aufrufer escaped. */
function kennungFunk(k){
  if(k===null || k===undefined || k==='') return '';
  return String(k).split('/').map(function(teil){
    var t=teil.trim(), u=t.toUpperCase();
    return TAFEL[u] || t;
  }).join('/');
}
/* geteilt — D6.8-01: Umgebung eines Präsidiums. Das Flag praesidien.schulung
 * gewinnt; ohne Flag nur POSITIVE Schulungs-Erkennung über das Namensmuster
 * („… — Schulung“, „Schulungsumgebung“), sonst „unbekannt“ — nie still „echt“. */
function umgebungVon(p){
  if(p && typeof p.schulung==='boolean') return p.schulung ? 'schulung' : 'echt';
  var n=String((p && p.name) || '');
  if(/\s—\s*Schulung$/.test(n) || n==='Schulungsumgebung') return 'schulung';
  return 'unbekannt';
}
/* geteilt — D6.8-01: Präsidium der Sitzung (FLZ-Zugang/Beobachter) über die beim
 * Login gespeicherte praesidium_id; Altsitzungen ohne id per Namensabgleich;
 * ohne Präsidienliste nur Namensheuristik. */
function sitzungsPraesidium(pid, pname, praesidien){
  var liste=Array.isArray(praesidien) ? praesidien : [], hit=null, i;
  if(pid){ for(i=0;i<liste.length;i++){ if(liste[i] && liste[i].id===pid){ hit=liste[i]; break; } } }
  if(!hit && pname){ for(i=0;i<liste.length;i++){ if(liste[i] && liste[i].name===pname){ hit=liste[i]; break; } } }
  if(hit) return {id:hit.id, name:hit.name, umgebung:umgebungVon(hit)};
  return {id:pid||'', name:pname||'', umgebung:umgebungVon({name:pname})};
}
/* D6.8-01: Auswahlkacheln des Masters — JEDES Präsidium der Liste (auch ohne
 * offene CCPs), Zählwerte aus der Lage; CCPs eines nicht gelisteten Präsidiums
 * ergeben Einträge aus den Lagedaten (Umgebung nur per Namensmuster). */
function lageAuswahl(ccps, praesidien){
  var out={echt:[], schulung:[], unbekannt:[]}, idx={}, order=[];
  (Array.isArray(praesidien) ? praesidien : []).forEach(function(p){
    if(!p || idx['k'+p.id]) return;
    idx['k'+p.id]={e:{id:p.id, name:p.name||'', ccps:0, t1:0}, u:umgebungVon(p)};
    order.push(idx['k'+p.id]);
  });
  (ccps||[]).forEach(function(c){
    var id=c.praesidium_id||'', x=idx['k'+id];
    if(!x){
      x={e:{id:id, name:c.praesidium_name||'', ccps:0, t1:0}, u:umgebungVon({name:c.praesidium_name})};
      idx['k'+id]=x; order.push(x);
    }
    x.e.ccps++; x.e.t1+=(+c.t1||0);
  });
  order.forEach(function(x){ out[x.u].push(x.e); });
  ['echt','schulung','unbekannt'].forEach(function(b){
    out[b].sort(function(a,z){ return String(a.name).localeCompare(String(z.name),'de'); });
  });
  return out;
}
/* D6.8-01: nur die CCPs des gewählten Präsidiums. */
function ccpsFuer(ccps, pid){
  return (ccps||[]).filter(function(c){ return (c.praesidium_id||'')===(pid||''); });
}
/* geteilt — D6.8-02: Verbund-/Solo-Gruppen in Lieferreihenfolge. Solo-Schlüssel
 * mit praesidium_id qualifiziert (Kennungen sind nur je Präsidium eindeutig);
 * n = laufende Verbund-Nummer ab 1, Einzel-CCPs 0. */
function lageGruppen(ccps){
  var idx={}, out=[], vn=0;
  (ccps||[]).forEach(function(c){
    var key=c.verbund_gruppe || ('solo-'+(c.praesidium_id||'')+'-'+c.kennung);
    var g=idx['k'+key];
    if(!g){ g={key:key, verbund:!!c.verbund_gruppe, n:0, members:[]}; idx['k'+key]=g; out.push(g); }
    g.members.push(c);
  });
  out.forEach(function(g){ if(g.verbund) g.n=++vn; });
  return out;
}
/* geteilt — D6.8-03: Summen (robust gegen Strings/null); pat = T1+T2+T3+T5+abtransportiert. */
function lageSummen(list){
  var s={t1:0,t2:0,t3:0,t5:0,gpa:0,prio:0,ready:0,pat:0,ccps:0};
  (list||[]).forEach(function(c){
    s.t1+=(+c.t1||0); s.t2+=(+c.t2||0); s.t3+=(+c.t3||0); s.t5+=(+c.t5||0);
    s.gpa+=(+c.gpa||0); s.prio+=(+c.prio||0); s.ready+=(+c.ready||0);
  });
  s.pat=s.t1+s.t2+s.t3+s.t5+s.gpa;

/* geteilt — D6.8-04: Aktualität eines CCP. Feld-Präsenz-Fallback: ohne den
 * 0032-Schlüssel zuletzt_gesehen → modus 'ohne' und NIE grau (Patientenstempel
 * sind kein Lebenszeichen). Mit Schlüssel: Alter = Server-stand + Zeit seit dem
 * Poll − jüngster Stempel (nicht die PC-Uhr); grau ab > schwelleMs. */
function ccpAktualitaet(c, standMs, seitPollMs, schwelleMs){
  function zahl(v){
    if(typeof v==='number') return isFinite(v) ? v : null;
    if(typeof v==='string' && v.trim()!=='' && isFinite(+v)) return +v;
    return null;
  }
  c=c||{};
  var la=zahl(c.letzte_aenderung);
  if(!('zuletzt_gesehen' in c)) return {modus:'ohne', t:la, alt:false, min:null};
  var hb=zahl(c.zuletzt_gesehen), t=null;
  if(hb!==null) t=hb;
  if(la!==null && (t===null || la>t)) t=la;
  if(t===null) return {modus:'mit', t:null, alt:true, min:null};
  var alter=Math.max(0, (+standMs||0) + Math.max(0, +seitPollMs||0) - t);
  return {modus:'mit', t:t, alt:alter>schwelleMs, min:Math.floor(alter/60000)};
}
/* geteilt — D6.8-04: Aktualität einer Gruppe (Verbund) = frischestes Mitglied;
 * modus 'mit', sobald mindestens ein Mitglied den 0032-Schlüssel trägt. */
function gruppenAktualitaet(members, standMs, seitPollMs, schwelleMs){
  function zahl(v){
    if(typeof v==='number') return isFinite(v) ? v : null;
    if(typeof v==='string' && v.trim()!=='' && isFinite(+v)) return +v;
    return null;
  }
  var la=null, zg=null, hat=false;
  (members||[]).forEach(function(c){
    if(!c) return;
    var a=zahl(c.letzte_aenderung);
    if(a!==null && (la===null || a>la)) la=a;
    if('zuletzt_gesehen' in c){
      hat=true;
      var g=zahl(c.zuletzt_gesehen);
      if(g!==null && (zg===null || g>zg)) zg=g;
    }
  });
  var syn={letzte_aenderung:la};
  if(hat) syn.zuletzt_gesehen=zg;
  return ccpAktualitaet(syn, standMs, seitPollMs, schwelleMs);
}
/* geteilt — D6.8-04: Alterstext fürs Kopfband. */

/* ── Sitzung: sessionStorage (Standard, flüchtig) + Opt-in „Angemeldet bleiben" ──
 * Schlüssel arguslg_jwt / arguslg_jwt_exp / arguslg_pname / arguslg_pid / arguslg_global / arguslg_admin.
 * Standard: Tab zu = Sitzung weg. Opt-in (Owner 2026-10-14): mit gesetztem
 * arguslg_keep werden die Sitzungsschlüssel zusätzlich in localStorage gespiegelt
 * und beim nächsten Öffnen wiederhergestellt — bis zum Ablauf des JWT (Master:
 * 30 Tage), bis „Abmelden" oder bis der Server mit 401 ablehnt (Sofortsperre).
 * Explizite Schlüsselliste statt Präfix-Scan: Leitungs- und Lage-Seite teilen
 * sich denselben Origin (localStorage), argusl_ ist Präfix von arguslg_. */
var SESS_KEYS=['arguslg_jwt','arguslg_jwt_exp','arguslg_pname','arguslg_pid','arguslg_global','arguslg_admin','arguslg_keep'];
function sessWipeLocal(){ try{ SESS_KEYS.forEach(function(k){ localStorage.removeItem(k); }); }catch(e){} }
function sessRestore(){   /* Tab frisch, aber persistierte Sitzung vorhanden → übernehmen */
  try{
    if(sessionStorage.getItem('arguslg_jwt')) return;
    if(localStorage.getItem('arguslg_keep')!=='1' || !localStorage.getItem('arguslg_jwt')) return;
    SESS_KEYS.forEach(function(k){ var v=localStorage.getItem(k); if(v!=null) sessionStorage.setItem(k,v); });
  }catch(e){}
}
function sessMirror(){    /* Opt-in aktiv → Sitzung nach localStorage spiegeln (nur bei Änderung) */
  try{
    if(sessionStorage.getItem('arguslg_keep')!=='1') return;
    if(localStorage.getItem('arguslg_jwt')===sessionStorage.getItem('arguslg_jwt')) return;
    SESS_KEYS.forEach(function(k){ var v=sessionStorage.getItem(k); if(v!=null) localStorage.setItem(k,v); });
  }catch(e){}
}
function sessionJwt(){
  sessRestore();
  var jwt=sessionStorage.getItem('arguslg_jwt');
  var exp=parseInt(sessionStorage.getItem('arguslg_jwt_exp')||'0',10);
  if(!jwt||!exp) return null;
  if(exp<=nowMs()){ sessionStorage.clear(); sessWipeLocal(); return null; }
  sessMirror();
  return jwt;
}
function doLogout(msg){
  sessionStorage.clear(); sessWipeLocal();
  wachAus();   /* D6.8-05: Wachhalten endet mit der Sitzung; die Großbild-Vorliebe bleibt stehen */
  karteAbbauen(); _karteFehler=false;
  if(_timer){ clearInterval(_timer); _timer=null; }
  _data=null; _lastOkAt=null; _offline=false; _praesidien=null; _praesAt=0;

}

/* ── Login: Beobachter-Code → Observer-JWT ──────────────────────
 * rpc/argus_exchange_observer_code weist MasterToken und normale
 * Feld-Codes serverseitig ab ('Kein Beobachter-Code'). */
async function doLogin(raw){
  if(_configError){ setLoginError('Konfiguration fehlt (config.js) — kein Backend verbunden.'); return; }
  var clean=(raw||'').replace(/[\s\-]/g,'').toUpperCase();
  if(clean.length<8){ setLoginError('Bitte vollständigen Beobachter-Code eingeben.'); return; }
  setLoginError('');
  /* Opt-in „Angemeldet bleiben": Flag in der Sitzung; sessionJwt() spiegelt dann
   * nach localStorage. Ohne Häkchen: evtl. alte persistierte Sitzung löschen. */
  var keep=!!($('keepme') && $('keepme').checked);
  try{ sessionStorage.setItem('arguslg_keep', keep?'1':''); }catch(e){}
  if(!keep) sessWipeLocal();
  var btn=$('loginbtn'); if(btn){ btn.disabled=true; btn.textContent='Prüfe…'; }
  try{
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_observer_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean })
    });
    var data=await resp.json();   /* ungültiger Code = HTTP 200 + {error:…} */
    var isAdm=false;
    if(!data || !data.jwt){
      /* FLZ-Zugang (0023, = Admin-Rolle): denselben Code gegen
       * argus_exchange_admin_code versuchen → Lage des eigenen Präsidiums
       * (argus_lage hat seit 0013 einen Admin-Zweig). Erst wenn auch das
       * scheitert, den ursprünglichen Fehler zeigen. */
      var firstErr=(data && data.error) ? data.error : 'Ungültiger oder verbrauchter Code.';
      var resp2=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_admin_code',{
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
        body:JSON.stringify({ code:clean })
      });
      var data2=null; try{ data2=await resp2.json(); }catch(e){}
      if(!data2 || !data2.jwt){ setLoginError(firstErr); return; }
      data=data2; isAdm=true;
    }
    sessionStorage.setItem('arguslg_jwt', data.jwt);
    sessionStorage.setItem('arguslg_jwt_exp', String(data.exp*1000));
    sessionStorage.setItem('arguslg_pname', data.praesidium_name||'');
    /* Phase 6.8 (D6.8-01): Umgebung über praesidien.schulung — dazu die
     * praesidium_id der Sitzung merken (Master: leer, er wählt selbst). */
    sessionStorage.setItem('arguslg_pid', data.praesidium_id||'');
    /* Master-Login (0021): flz=true → präsidienübergreifender Global-Modus. */
    sessionStorage.setItem('arguslg_global', data.flz ? '1' : '');
    /* FLZ-Zugang: eigenes Präsidium, read-only; Ort-Korrektur (observer-only RPC) aus. */
    sessionStorage.setItem('arguslg_admin', isAdm ? '1' : '');
    render();
    startPolling();
  }catch(e){
    setLoginError('Keine Verbindung — bitte erneut versuchen.');
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='Anmelden'; }
  }
}
function setLoginError(msg){ var e=$('loginerr'); if(e) e.textContent=msg||''; }

/* ── Polling: rpc/argus_lage ────────────────────────────────────
 * Erfolg → Zahlen + „Stand HH:MM:SS"; Fehler → letzte Zahlen
 * WEITER anzeigen + roter Punkt „Keine Verbindung". 401/abgelaufene
 * Sitzung → zurück zum Login. */
async function poll(){
  if(_polling) return;
  var jwt=sessionJwt();
  if(!jwt){ doLogout('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  /* Präsidienliste fehlt noch (Abruf gescheitert) → höchstens einmal je Minute neu versuchen */
  if(_praesidien===null && nowMs()-_praesAt>60000) loadPraesidien();
  _polling=true;
  try{
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_lage',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+jwt },
      body:'{}'
    });
    if(resp.status===401){ doLogout('Sitzung abgelaufen — bitte neu anmelden.'); return; }
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    var data=await resp.json();
    if(!data || !Array.isArray(data.ccps)) throw new Error('Unerwartete Antwort');
    _data=data; _lastOkAt=nowMs(); _offline=false;
  }catch(e){
    _offline=true;
  }finally{
    _polling=false;
    render();
  }
}
function startPolling(){
  if(_timer) clearInterval(_timer);
  loadPraesidien();   /* nicht awaiten — die Lage kommt unabhängig davon */
  poll();

}
window.addEventListener('online', function(){ if(sessionJwt()) poll(); });
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && sessionJwt()) poll();
  /* D6.8-05: Der Browser gibt die Wake-Lock-Sperre bei verdecktem Tab frei →
   * beim Zurückkehren neu anfordern. Scheitert das ohne Nutzergeste (Safari, A3),
   * bleibt „nicht möglich“ mit Knopf „Wachhalten wieder aktivieren“ stehen. */
  if(document.visibilityState==='visible' && _wlWanted && !_wl) wachAn();
});

/* ── Präsidienliste (Phase 6.8, D6.8-01) ─────────────────────────
 * GET praesidien (id, name, schulung) mit dem Sitzungs-JWT — RLS anon_read,
 * genau wie die Feld-App. Grundlage für Echtbetrieb/Schulung und für Kacheln
 * auch ohne offene CCPs. Fehler → _praesidien bleibt null (Fallback über die
 * Namen aus den Lagedaten), NIE Logout. */
var _praesidien = null, _praesAt = 0;
async function loadPraesidien(){
  var jwt=sessionJwt(); if(!jwt) return;
  _praesAt=nowMs();
  try{
    var resp=await fetch(SUPA_URL+'/rest/v1/praesidien?select=id,name,schulung&order=name',{
      headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer '+jwt }
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    var d=await resp.json();
    if(Array.isArray(d) && sessionJwt()===jwt){ _praesidien=d; render(); }
  }catch(e){ /* bleibt null — nächster Versuch im Poll */ }
}

/* ── Großbild (Phase 6.8, D6.8-05) ─────────────────────────────────
 * Umschalter „Großbild“ für Leitstand-Bildschirm/Beamer: gedämpftes Off-White, große
 * Zahlen, breites Raster (CSS-Block 6.8-GROSSBILD) und Bildschirm-Wachhalten per
 * Screen Wake Lock, wo verfügbar. Die Vorliebe liegt als Anzeige-Einstellung in
 * localStorage (arguslg_gross) und ist NICHT Teil der Sitzung: Anmeldedauer
 * unverändert, kein Eingriff in JWT, Ablauf, Abmelden oder Polling.
 * Wake Lock nur im sicheren Kontext (HTTPS); fehlt die API oder scheitert die
 * Anforderung, sagt die Kopfzeile es sichtbar — der Modus selbst läuft weiter.
 * Nach dem Neuladen wird NICHT automatisch angefordert (keine Nutzergeste):
 * Zustand „aus“ mit Knopf „Wachhalten aktivieren“. */
var _wl=null, _wlWanted=false, _wlZustand='', _wlBusy=false;
/* rein: Zustand → Hinweistext in der Kopfzeile */
function wachText(z){
  if(z==='an') return 'Bildschirm bleibt an';
  if(z==='nicht verfügbar' || z==='nicht möglich') return 'Bildschirm bleibt nicht automatisch an — Energiesparen am Rechner prüfen';
  if(z==='unterbrochen') return 'Wachhalten unterbrochen';
  if(z==='aus') return 'Wachhalten aus';
  return '';
}
/* rein: Zustand → Knopf (nur feste Texte) */
function wachKnopf(z){
  if(z==='unterbrochen' || z==='nicht möglich') return '<button class="wachbtn" data-action="wachan">Wachhalten wieder aktivieren</button>';
  if(z==='aus') return '<button class="wachbtn" data-action="wachan">Wachhalten aktivieren</button>';
  return '';
}
function grossVorliebe(){ try{ return localStorage.getItem('arguslg_gross')==='1'; }catch(e){ return false; } }
/* Farbschema des Großbilds: nur 'hell' oder 'gedaempft' (Standard), ebenfalls Anzeige-Vorliebe.
 * Der frühere gespeicherte Wert 'dunkel' (und jeder andere) wird als 'gedaempft' gelesen. */
function grossThema(){ try{ return localStorage.getItem('arguslg_gross_thema')==='hell' ? 'hell' : 'gedaempft'; }catch(e){ return 'gedaempft'; } }
function grossThemaSetzen(t){
  t = (t==='hell') ? 'hell' : 'gedaempft';
  try{ localStorage.setItem('arguslg_gross_thema', t); }catch(e){}
  grossAnwenden(true);
}
/* Zustandsanzeige in der Kopfzeile — Text escaped, Knopf aus festen Texten */
function wachZeigen(){
  var w=$('wachtxt'); if(!w) return;
  var t=wachText(_wlZustand);
  var cls=(_wlZustand==='an') ? ' ok' : ((_wlZustand==='aus' || !_wlZustand) ? '' : ' warn');
  w.innerHTML=(t ? '<span class="wt'+cls+'">'+esc(t)+'</span>' : '')+wachKnopf(_wlZustand);
  w.title=t;
}
function wachSetzen(z){ _wlZustand=z||''; wachZeigen(); }
/* Großbild anwenden (Start/render). Nur angemeldet: Login-Maske bleibt hell. */
function grossAnwenden(angemeldet){
  var an=!!angemeldet && grossVorliebe();
  var th=grossThema();
  document.body.classList.toggle('gross', an);
  document.body.classList.toggle('ggedaempft', an && th==='gedaempft');
  var tw=$('gthema'), td=$('gtgedaempft'), thl=$('gthell');
  if(tw) tw.style.display=an ? '' : 'none';
  if(td) td.setAttribute('aria-pressed', th==='gedaempft' ? 'true' : 'false');
  if(thl) thl.setAttribute('aria-pressed', th==='hell' ? 'true' : 'false');
  var b=$('grossbtn');
  if(b){ b.style.display=angemeldet ? '' : 'none'; b.textContent=an ? 'Normalansicht' : 'Großbild'; }
  if(an && !_wlWanted && !_wlZustand) _wlZustand='aus';
  if(!an && !_wlWanted) _wlZustand='';
  wachZeigen();
}
/* Klick „Großbild“/„Normalansicht“ (Nutzergeste → Wake Lock darf angefordert werden) */
function grossUmschalten(){
  var an=!grossVorliebe();
  try{ if(an) localStorage.setItem('arguslg_gross','1'); else localStorage.removeItem('arguslg_gross'); }catch(e){}
  if(an) wachAn(); else wachAus();
  grossAnwenden(true);
}
/* MDN-Muster: anfordern, release beobachten, bei visibilitychange neu anfordern */
async function wachAn(){
  _wlWanted=true;
  if(!('wakeLock' in navigator)){ wachSetzen('nicht verfügbar'); return; }
  if(_wl){ wachSetzen('an'); return; }
  if(_wlBusy) return;
  _wlBusy=true;
  try{
    var sperre=await navigator.wakeLock.request('screen');
    if(!_wlWanted){ sperre.release(); return; }   /* inzwischen ausgeschaltet */
    _wl=sperre;
    sperre.addEventListener('release', function(){
      if(_wl===sperre) _wl=null;
      if(_wlWanted) wachSetzen('unterbrochen');
    });
    wachSetzen('an');
  }catch(e){
    if(_wlWanted) wachSetzen('nicht möglich');
  }finally{
    _wlBusy=false;
  }
}
function wachAus(){
  _wlWanted=false;
  var sperre=_wl; _wl=null;
  if(sperre){ try{ sperre.release(); }catch(e){} }
  wachSetzen('');
}

/* ── Lageskizze (Phase 6.8, D6.8-06) ───────────────────────────────
 * Schlichte SVG-Skizze der CCP-Standorte aus den erfassten Koordinaten
 * (argus_lage lat/lng, seit 0009). Die Skizze selbst ruft nichts ab; sie ist der
 * Rückfall des Kartenmoduls (unten), wenn keine Passform eingetragen ist oder der
 * Kartendienst nicht erreichbar ist. Keine automatische Ausreißer-Entfernung (würde die Lage
 * verfälschen); die Maßstabsleiste macht Ausreißer sichtbar. Alles rein/testbar. */
/* rein: Lagefarbe einer Gruppe — veraltet grau, sonst schwerste Kategorie */
function lageFarbe(s, alt){
  s=s||{};
  if(alt) return 'grau';
  if((+s.t1||0)>0) return 't1';
  if((+s.t2||0)>0) return 't2';
  if((+s.t3||0)>0) return 't3';
  if((+s.t5||0)>0) return 't5';
  return 'leer';
}
/* rein: Koordinate als Zahl — Zahl oder numerischer Text (numeric kommt je nach
 * Backend/Proxy auch als Text an), sonst null. */
function koordZahl(v){
  if(typeof v==='number') return isFinite(v) ? v : null;
  if(typeof v==='string' && v.trim()!=='' && isFinite(+v)) return +v;
  return null;
}
/* rein: Luftlinie in Metern (Haversine) */
function distanzM(la1, ln1, la2, ln2){
  var R=6371000, r=Math.PI/180;
  var a=Math.sin((la2-la1)*r/2), b=Math.sin((ln2-ln1)*r/2);
  var h=a*a+Math.cos(la1*r)*Math.cos(la2*r)*b*b;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(h)));
}
/* rein: Entfernung als Text — auf 10 m gerundet, ab 1 km mit Komma */
function distText(m){
  m=+m;
  if(!isFinite(m) || m<0) return '';
  if(m<10) return '< 10 m';
  var r=Math.round(m/10)*10;
  if(r>=1000) return (m/1000).toFixed(1).replace('.',',')+' km';
  return r+' m';
}
/* rein: äquirektangulär um die mittlere Breite, Norden oben, gleichmäßiger
 * Maßstab, Mindestausdehnung 0.0009° (~100 m), 12 % Rand, zentriert. */
function skizzeProjektion(pts, W, H, pad){
  var ok=[];
  (pts||[]).forEach(function(p){
    if(!p) return;
    var la=koordZahl(p.lat), ln=koordZahl(p.lng);
    if(la===null || ln===null || Math.abs(la)>90 || Math.abs(ln)>180 || (la===0 && ln===0)) return;
    ok.push({lat:la, lng:ln, ref:p});
  });
  if(!ok.length) return {punkte:[], meterProPx:null};
  var lat0=ok.reduce(function(s,p){ return s+p.lat; },0)/ok.length;
  var k=Math.cos(lat0*Math.PI/180), MIN=0.0009;
  var xs=ok.map(function(p){ return p.lng*k; }), ys=ok.map(function(p){ return -p.lat; });
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  var sx=Math.max(x1-x0, MIN)*1.12, sy=Math.max(y1-y0, MIN)*1.12;
  var s=Math.min((W-2*pad)/sx, (H-2*pad)/sy), cx=(x0+x1)/2, cy=(y0+y1)/2;
  return {
    punkte: ok.map(function(p,i){ return {x:W/2+(xs[i]-cx)*s, y:H/2+(ys[i]-cy)*s, lat:p.lat, lng:p.lng, ref:p.ref}; }),
    meterProPx: 111320/s
  };
}
/* rein: größte „runde“ Länge, die in maxPx passt */
function massstab(meterProPx, maxPx){
  var mpp=+meterProPx;
  if(meterProPx===null || !isFinite(mpp) || !(mpp>0)) return null;
  var stufen=[10,20,50,100,200,500,1000,2000,5000,10000], m=null, i;
  for(i=0;i<stufen.length;i++){ if(stufen[i]/mpp<=(+maxPx||0)) m=stufen[i]; }
  if(m===null) return {m:10, px:10/mpp, text:'10 m'};
  return {m:m, px:m/mpp, text: m>=1000 ? (m/1000)+' km' : m+' m'};
}
/* rein: Skizze als HTML. Ein Punkt je Mitglied mit gültigen Koordinaten, Farbe je
 * Gruppe (Verbund-Mitglieder teilen sie), grau bei veraltetem Stand. Jede
 * Zeichenkette über esc(), jede Zahl über toFixed(1); kein img/foreignObject/Verweis. */
function skizzeSvg(gruppen, akts, W, H){
  gruppen=gruppen||[]; akts=akts||[]; W=+W||640; H=+H||360;
  function n(v){ return (+v||0).toFixed(1); }
  var pts=[], farben=[];
  gruppen.forEach(function(g, gi){
    var m=(g && g.members) || [];
    farben[gi]=lageFarbe(lageSummen(m), !!(akts[gi] && akts[gi].alt));
    m.forEach(function(c){ c=c||{}; pts.push({lat:c.lat, lng:c.lng, c:c, gi:gi}); });
  });
  var pr=skizzeProjektion(pts, W, H, 28);
  if(!pr.punkte.length){
    var nc=pts.length;
    return '<div class="skleer skwarn"><b>Keine Koordinaten erfasst</b> — '+
      (nc ? 'bei '+nc+(nc===1 ? ' CCP' : ' CCPs')+' liegt kein Standort vor. ' : 'es gibt keine offenen CCPs. ')+
      'Die Feld-App speichert den Standort einmalig beim Eröffnen eines CCP, und nur wenn das Gerät den Standort freigibt (iPhone: Einstellungen › ARGUS › Standort). '+
      'Die Skizze erscheint, sobald ein CCP mit Standort eröffnet wird.</div>';
  }
  var drin=pr.punkte.map(function(p){ return p.ref; });
  var ohne=pts.filter(function(p){ return drin.indexOf(p)<0; });
  var P=pr.punkte, kanten=[], gesehen={};
  /* Abstandslinie je Punkt zum nächsten CCP (ohne Doppelte); nur wo Platz für die Beschriftung ist */
  P.forEach(function(a, i){
    var best=-1, bd=Infinity;
    P.forEach(function(b, k){
      if(i===k) return;
      var d=distanzM(a.lat, a.lng, b.lat, b.lng);
      if(d>=1 && d<bd){ bd=d; best=k; }
    });
    if(best<0) return;
    var key=Math.min(i,best)+'-'+Math.max(i,best);
    if(gesehen[key]) return;
    gesehen[key]=1;
    var b2=P[best];
    if(Math.sqrt((a.x-b2.x)*(a.x-b2.x)+(a.y-b2.y)*(a.y-b2.y))>=60) kanten.push({a:a, b:b2, m:bd});
  });
  var h='<svg class="skizze" viewBox="0 0 '+n(W)+' '+n(H)+'" role="img" aria-label="Lageskizze">';
  h+='<rect class="skrahmen" x="0.5" y="0.5" width="'+n(W-1)+'" height="'+n(H-1)+'" rx="8.0"/>';
  h+='<text class="sknord" x="'+n(W-14)+'" y="'+n(24)+'" text-anchor="end">N ↑</text>';
  kanten.forEach(function(k){
    h+='<g class="skdist"><line x1="'+n(k.a.x)+'" y1="'+n(k.a.y)+'" x2="'+n(k.b.x)+'" y2="'+n(k.b.y)+'"/>'+
      '<text class="skdl" x="'+n((k.a.x+k.b.x)/2)+'" y="'+n((k.a.y+k.b.y)/2-5)+'" text-anchor="middle">'+esc(distText(k.m))+'</text></g>';
  });
  P.forEach(function(p){
    var c=p.ref.c, f=farben[p.ref.gi]||'leer';
    h+='<g class="skp sk-'+f+'"><title>CCP '+esc(kennungFunk(c.kennung))+(c.ort?' · '+esc(c.ort):'')+'</title>'+
      '<circle cx="'+n(p.x)+'" cy="'+n(p.y)+'" r="11.0"/>'+
      '<text x="'+n(p.x)+'" y="'+n(p.y+4)+'" text-anchor="middle">'+esc(String(c.kennung||'').slice(0,2))+'</text></g>';
  });
  /* Beschriftung direkt am Punkt („CCP Anton · Ort“): rechts, bei Platzmangel links;
   * übereinanderliegende Labels werden um je 14 px nach unten versetzt. */
  var platziert=[];
  P.slice().sort(function(a, b){ return a.y-b.y; }).forEach(function(p){
    var c=p.ref.c, ort=String(c.ort||'');
    if(ort.length>24) ort=ort.slice(0,23)+'…';
    var t='CCP '+kennungFunk(c.kennung)+(ort ? ' · '+ort : '');
    var w=t.length*7, platzR=W-6-(p.x+16), platzL=p.x-16-6;
    var rechts=(w<=platzR) || (platzR>=platzL);
    var x0=rechts ? p.x+16 : p.x-16-w, x1=x0+w, y=p.y+4, guard=0, kollidiert;
    do{
      kollidiert=false;
      platziert.forEach(function(q){ if(Math.abs(q.y-y)<14 && q.x0<x1 && x0<q.x1) kollidiert=true; });
      if(kollidiert) y+=14;
    }while(kollidiert && ++guard<40);
    if(y>H-6) y=H-6;
    platziert.push({x0:x0, x1:x1, y:y});
    h+='<text class="sklab" x="'+n(rechts ? p.x+16 : p.x-16)+'" y="'+n(y)+'" text-anchor="'+(rechts ? 'start' : 'end')+'">'+esc(t)+'</text>';
  });
  var ms=massstab(pr.meterProPx, W/4);
  if(ms){
    var mx=16, my=H-16;
    h+='<g class="skmass">'+
      '<line x1="'+n(mx)+'" y1="'+n(my)+'" x2="'+n(mx+ms.px)+'" y2="'+n(my)+'"/>'+
      '<line x1="'+n(mx)+'" y1="'+n(my-6)+'" x2="'+n(mx)+'" y2="'+n(my+1)+'"/>'+
      '<line x1="'+n(mx+ms.px)+'" y1="'+n(my-6)+'" x2="'+n(mx+ms.px)+'" y2="'+n(my+1)+'"/>'+
      '<text x="'+n(mx)+'" y="'+n(my-10)+'">'+esc(ms.text)+'</text></g>';
  }
  h+='</svg>';
  h+='<div class="skhinw"><strong>Schematische Lageskizze</strong> — keine Straßenkarte. Norden oben, Abstände maßstäblich (Luftlinie nach den erfassten Standorten)'+
    (kanten.length ? '; gestrichelt: Entfernung zum jeweils nächsten CCP' : '')+'.</div>';
  if(ohne.length){
    h+='<div class="skohne skwarn">Ohne Koordinaten: '+ohne.map(function(p){ return 'CCP '+esc(kennungFunk(p.c.kennung)); }).join(', ')+' — nicht auf der Skizze.</div>';
  }
  return h;
}

/* ── Kartenmodul „Passform“ (Owner-Entscheid 19.10.2026, ändert D6.8-06) ──────────
 * Echte Straßenkarte als austauschbares Modul: ../karte-config.js setzt
 * window.ARGUS_KARTE (Kachel-Adresse, Quellenhinweis, maxZoom). Die Seite selbst
 * enthält KEINE Kachel-Adresse. Leaflet kommt lokal aus ../vendor/leaflet/.
 * Rückfall auf die SVG-Lageskizze: Passform fehlt/null/ungültig, keine
 * Koordinaten, Leaflet nicht geladen, Wahl „Skizze“ oder Dienst nicht erreichbar.
 * Datenschutz: Der Kartendienst sieht IP und Ausschnitt, nie Zahlen/Kennungen/Orte —
 * Punkte und Beschriftungen zeichnet die Seite selbst. */
var KARTE_N = 4;             /* scheitern die ersten N Kacheln alle → Lageskizze */
var KARTE_WARTE_MS = 8000;   /* bis dahin muss mindestens eine Kachel geladen sein */
/* rein: Passform prüfen und normalisieren — null, wenn unbrauchbar. Kachel-Adresse
 * nur https:// oder Pfad auf demselben Server, mit {z}/{x}/{y}, ohne Leer-/Steuerzeichen;
 * Quellenhinweis ist Pflicht. Referrer: nur Origin oder keiner (nie der Seitenname, D-06). */
function karteKonfig(k){
  if(!k || typeof k!=='object' || Array.isArray(k)) return null;
  var u=k.kachelUrl, q=k.quelle;
  if(typeof u!=='string' || typeof q!=='string' || !q.trim()) return null;
  if(!/^(https:\/\/[^\/\s"'<>]+|\/(?!\/))[^\s"'<>]*$/.test(u)) return null;
  if(u.indexOf('{z}')<0 || u.indexOf('{x}')<0 || u.indexOf('{y}')<0) return null;
  var qu=(typeof k.quelleUrl==='string' && /^https:\/\/[^\s"'<>]+$/.test(k.quelleUrl)) ? k.quelleUrl : '';
  var mz=(typeof k.maxZoom==='number' && k.maxZoom%1===0 && k.maxZoom>=1 && k.maxZoom<=22) ? k.maxZoom : 19;
  return {kachelUrl:u, quelle:q.trim(), quelleUrl:qu, maxZoom:mz, referrerPolicy: k.referrerPolicy==='no-referrer' ? 'no-referrer' : 'origin'};
}
/* rein: Karte oder Skizze? */
function karteModus(konfig, nKoord, wahl, fehler, bibliothekDa){
  return (konfig && nKoord>0 && wahl!=='skizze' && !fehler && bibliothekDa) ? 'karte' : 'skizze';
}
/* rein: Rückfall-Zustand aus Kachel-Ereignissen ('start' | 'load' | 'fehler' | 'zeit').
 * Eine geladene Kachel entscheidet für die Karte; alle ersten n fehlerhaft oder
 * Zeitablauf ohne Kachel → aus (Lageskizze). Entschieden bleibt entschieden. */
function kachelRueckfall(z, ereignis, n){
  if(!z || ereignis==='start') return {ok:false, fehler:0, aus:false};
  if(z.ok || z.aus) return {ok:z.ok, fehler:z.fehler, aus:z.aus};
  if(ereignis==='load') return {ok:true, fehler:0, aus:false};
  if(ereignis==='fehler'){ var f=z.fehler+1; return {ok:false, fehler:f, aus:f>=(+n||1)}; }
  if(ereignis==='zeit') return {ok:false, fehler:z.fehler, aus:true};
  return {ok:false, fehler:z.fehler, aus:false};
}
/* rein: Kartenpunkte wie die Skizze — ein Punkt je Mitglied mit gültigen Koordinaten,
 * Lagefarbe je Gruppe (grau bei veraltet), Label „CCP Anton · Ort“ (gekürzt, escaped:
 * Leaflet setzt Tooltips als HTML). ohne = escapte Namen der CCPs ohne Koordinaten. */
function karteMarker(gruppen, akts){
  var punkte=[], ohne=[];
  akts=akts||[];
  (gruppen||[]).forEach(function(g, gi){
    var m=(g && g.members) || [];
    var farbe=lageFarbe(lageSummen(m), !!(akts[gi] && akts[gi].alt));
    m.forEach(function(c){
      c=c||{};
      var la=koordZahl(c.lat), ln=koordZahl(c.lng), name='CCP '+kennungFunk(c.kennung);
      if(la===null || ln===null || Math.abs(la)>90 || Math.abs(ln)>180 || (la===0 && ln===0)){ ohne.push(esc(name)); return; }
      var ort=String(c.ort||'');
      if(ort.length>24) ort=ort.slice(0,23)+'…';
      punkte.push({key:(c.praesidium_id||'')+'-'+c.kennung, lat:la, lng:ln, farbe:farbe, label:esc(name+(ort ? ' · '+ort : ''))});
    });
  });
  return {punkte:punkte, ohne:ohne};
}
/* rein: Lagefarbe → Kreisfarben (Werte wie die Palette in :root) */
function karteFarbe(f){
  var t={t1:'#C62828', t2:'#F2B600', t3:'#2E7D32', t5:'#1b1d20', grau:'#9aa1a8'};
  return t[f] ? {fuell:t[f], rand:'#ffffff'} : {fuell:'#ffffff', rand:'#5d6368'};
}
/* rein: Ausschnitt — ein Punkt (oder alle gleich) → Mitte mit Zoom ≤ 16, sonst
 * Grenzen für fitBounds mit Max-Zoom ≤ 17 (nie über maxZoom des Dienstes). */
function karteAusschnitt(punkte, maxZoom){
  var p=punkte||[], mz=(+maxZoom>0) ? +maxZoom : 19;
  if(!p.length) return null;
  var la0=Infinity, la1=-Infinity, ln0=Infinity, ln1=-Infinity;
  p.forEach(function(q){
    la0=Math.min(la0, q.lat); la1=Math.max(la1, q.lat);
    ln0=Math.min(ln0, q.lng); ln1=Math.max(ln1, q.lng);
  });
  if(la0===la1 && ln0===ln1) return {mitte:[la0, ln0], zoom:Math.min(16, mz)};
  return {grenzen:[[la0, ln0], [la1, ln1]], maxZoom:Math.min(17, mz)};
}
/* rein: Quellenhinweis der Passform als Leaflet-Attribution (escaped) */
function karteQuelleHtml(k){
  k=k||{};
  var q=esc(k.quelle||'');
  return k.quelleUrl ? '<a href="'+esc(k.quelleUrl)+'" target="_blank" rel="noopener noreferrer">'+q+'</a>' : q;
}
/* rein: kleiner Schalter „Karte / Skizze“ neben der Überschrift */
function karteSchalter(aktiv){
  function b(w, t){ return '<button data-action="kartewahl" data-wahl="'+w+'" aria-pressed="'+(aktiv===w ? 'true' : 'false')+'">'+t+'</button>'; }
  return '<span class="kschalter" role="group" aria-label="Darstellung">'+b('karte', 'Karte')+b('skizze', 'Skizze')+'</span>';
}
/* rein: Kartenabschnitt — leerer Halter, in den karteNachRender() die (bestehende)
 * Leaflet-Karte einhängt; Legende; CCPs ohne Koordinaten namentlich. */
function karteAbschnitt(km, schalter){
  km=km||{punkte:[], ohne:[]};
  var h='<section class="skab"><div class="skkopf"><h3>Lagekarte</h3>'+(schalter||'')+'</div>';
  h+='<div id="kartehalter" class="kartehalter" aria-label="Lagekarte"></div>';
  h+='<div class="sklegende"><span><i class="lg-t1"></i>T1</span><span><i class="lg-t2"></i>T2</span>'+
    '<span><i class="lg-t3"></i>T3</span><span><i class="lg-t5"></i>T5</span><span><i class="lg-leer"></i>leer</span>'+
    '<span><i class="lg-grau"></i>grau = veraltet</span><span>Maßstab unten links · Kartenquelle unten rechts</span></div>';
  if(km.ohne && km.ohne.length) h+='<div class="skohne skwarn">Ohne Koordinaten: '+km.ohne.join(', ')+' — nicht auf der Karte.</div>';
  return h+'</section>';
}

/* Kartenzustand: die Leaflet-Karte wird EINMAL erzeugt und beim Polling nur in den
 * neuen Halter umgehängt (kein Flackern, kein Neuladen der Kacheln); Marker werden
 * aktualisiert, der Ausschnitt nur beim ersten Mal bzw. bei Präsidiumswechsel gesetzt. */
var _karte=null, _karteFehler=false, _karteSoll=null;
function karteWahlGet(){ try{ return sessionStorage.getItem('arguslg_kartewahl')||''; }catch(e){ return ''; } }
function karteWahlSet(w){ try{ sessionStorage.setItem('arguslg_kartewahl', w==='skizze' ? 'skizze' : 'karte'); }catch(e){} }
function karteAbbauen(){
  var k=_karte; _karte=null;
  if(!k) return;
  if(k.timer) clearTimeout(k.timer);
  if(k.ro){ try{ k.ro.disconnect(); }catch(e){} }
  try{ k.map.remove(); }catch(e){}
  if(k.el.parentNode) k.el.parentNode.removeChild(k.el);
}
function karteMarkerSetzen(punkte){
  var alt=_karte.marker, neu={};
  punkte.forEach(function(p){
    var f=karteFarbe(p.farbe), m=alt[p.key];
    var stil={radius:10, weight:3, color:f.rand, fillColor:f.fuell, fillOpacity:1, opacity:1};
    if(m){
      m.setLatLng([p.lat, p.lng]);
      m.setStyle(stil);
      if(m.getTooltip() && m.getTooltip().getContent()!==p.label) m.setTooltipContent(p.label);
    }else{
      stil.interactive=false;
      m=L.circleMarker([p.lat, p.lng], stil).bindTooltip(p.label, {permanent: true, direction:'right', offset:[12, 0], className:'kartelab', opacity:1});
      m.addTo(_karte.map);
    }
    neu[p.key]=m;
  });
  Object.keys(alt).forEach(function(key){ if(!neu[key]) _karte.map.removeLayer(alt[key]); });
  _karte.marker=neu;
}
function karteEinpassen(punkte){
  var a=karteAusschnitt(punkte, _karte.maxZoom);
  if(!a) return;
  if(a.mitte) _karte.map.setView(a.mitte, a.zoom, {animate:false});
  else _karte.map.fitBounds(a.grenzen, {paddingTopLeft:[40, 40], paddingBottomRight:[190, 40], maxZoom:a.maxZoom, animate:false});
  _karte.eingepasst=true;
}
/* nach jedem render(): Karte in #kartehalter einhängen (bzw. einmalig erzeugen) */
function karteNachRender(){
  var halter=$('kartehalter'), s=_karteSoll;
  if(!halter || !s || !window.L) return;
  var k=s.konfig;
  if(_karte && _karte.url!==k.kachelUrl) karteAbbauen();
  if(!_karte){
    var el=document.createElement('div');
    el.className='karte';
    halter.appendChild(el);
    var map=L.map(el, {scrollWheelZoom:false});
    map.attributionControl.setPrefix(false);
    L.control.scale({imperial:false}).addTo(map);
    var schicht=L.tileLayer(k.kachelUrl, {maxZoom:k.maxZoom, attribution: karteQuelleHtml(k), referrerPolicy: k.referrerPolicy});
    var neu={map:map, el:el, url:k.kachelUrl, maxZoom:k.maxZoom, marker:{}, pid:null, eingepasst:false, timer:null, ro:null};
    var z=kachelRueckfall(null, 'start', KARTE_N);
    var ereignis=function(e){
      if(_karte!==neu) return;
      z=kachelRueckfall(z, e, KARTE_N);
      if(z.ok && neu.timer){ clearTimeout(neu.timer); neu.timer=null; }
      if(z.aus){ _karteFehler=true; karteAbbauen(); render(); }
    };
    schicht.on('tileload', function(){ ereignis('load'); });
    schicht.on('tileerror', function(){ ereignis('fehler'); });
    neu.timer=setTimeout(function(){ neu.timer=null; ereignis('zeit'); }, KARTE_WARTE_MS);
    if(window.ResizeObserver){ neu.ro=new ResizeObserver(function(){ map.invalidateSize({pan:false}); }); neu.ro.observe(el); }
    schicht.addTo(map);
    _karte=neu;
  }else if(_karte.el.parentNode!==halter){
    halter.appendChild(_karte.el);
    _karte.map.invalidateSize({pan:false});
  }
  karteMarkerSetzen(s.punkte);
  if(_karte.pid!==s.pid || !_karte.eingepasst){ karteEinpassen(s.punkte); _karte.pid=s.pid; }
}

/* ── Rendering — Bausteine 1:1 aus dem Mockup ──────────────────── */
function viewLogin(){
  var h='<div class="loginwrap"><div class="loginbox">';
  h+='<div class="arg-logo">ARGUS</div>';
  h+='<h1>FLZ · Lageübersicht</h1>';
  h+='<div class="hint">Read-only Ansicht für FLZ/ILS — anonyme Zahlen je CCP. Zugang mit FLZ-Zugang (eigenes Präsidium) oder MasterToken (alle Präsidien).</div>';
  if(_configError) h+='<div class="lerr">Konfiguration fehlt (config.js) — kein Backend verbunden.</div>';
  h+='<label class="fieldlab" for="logininp">Zugangscode</label>';
  h+='<input id="logininp" placeholder="XXXX-XXXX" autocomplete="off" spellcheck="false" style="font-family:var(--mono);letter-spacing:2px;text-transform:uppercase">';
  h+='<label class="keeprow"><input type="checkbox" id="keepme"> Angemeldet bleiben — nur auf diesem Gerät (bis zum Ablauf des Zugangs, max. 30 Tage; „Abmelden" beendet es)</label>';
  h+='<div style="display:flex;gap:8px;margin-top:14px">';
  h+='<button class="btn" id="loginbtn" data-action="login" style="flex:2">Anmelden</button>';
  h+='</div>';
  h+='<div class="lerr" id="loginerr"></div>';
  h+='</div></div>';
  return h;
}
/* Verbindungs-/Offline-Hinweis über jeder Ansicht */
function verbindungsNote(){
  if(_offline && _lastOkAt) return '<div class="note err">Keine Verbindung — letzte Zahlen von '+fmtHM(_lastOkAt)+'. Es wird weiter versucht…</div>';
  if(_offline) return '<div class="note err">Keine Verbindung — Zahlen können nicht geladen werden. Es wird weiter versucht…</div>';
  return '';
}
/* Phase 6.8 (D6.8-01): Master ohne Auswahl → Auswahlbildschirm; sonst genau
 * EIN Präsidium. Eine gemischte Ansicht über mehrere Präsidien gibt es nicht. */
function viewLage(){
  if(isGlobal() && !pselGet()) return viewAuswahl();
  return viewPraesidium(isGlobal() ? pselGet() : '');
}
/* Auswahl (nur Master): Kacheln aus der Präsidienliste, Zahlen aus der Lage. */
function viewAuswahl(){
  var h='<div class="ubar"><div class="uband u-wahl">Auswahl · Präsidium wählen</div></div>';
  h+='<div class="main">'+verbindungsNote();
  if(_data){
    h+=auswahlKacheln(lageAuswahl(_data.ccps, _praesidien));
    if(_praesidien===null) h+='<div class="note">Präsidienliste noch nicht geladen — gezeigt werden nur Präsidien mit offenen CCPs. Es wird weiter versucht…</div>';
    h+='<div class="note">Je Präsidium eine eigene Ansicht — Echtbetrieb und Schulung werden nie gemischt. Anonyme Übersichtszahlen — keine Personendaten.</div>';
  }else if(!_offline){
    h+='<div class="empty">Wird geladen…</div>';
  }
  return h+'</div>';
}
/* Präsidiumsansicht. Master: gewähltes Präsidium (bleibt gewählt, auch ohne
 * offene CCPs) + „Präsidium wechseln“. FLZ-Zugang/Beobachter: eigenes Präsidium,
 * Server liefert ohnehin nur dieses; Umgebung über die gespeicherte praesidium_id. */
function viewPraesidium(pid){
  var glob=isGlobal(), all=_data ? _data.ccps : [], list, sp, i;
  if(glob){
    list=ccpsFuer(all, pid);
    var pn='';
    for(i=0;i<list.length;i++){ if(list[i].praesidium_name){ pn=list[i].praesidium_name; break; } }
    sp=sitzungsPraesidium(pid, pn, _praesidien);
  }else{
    list=all;
    var spid='', spn='';
    try{ spid=sessionStorage.getItem('arguslg_pid')||''; spn=sessionStorage.getItem('arguslg_pname')||''; }catch(e){}
    sp=sitzungsPraesidium(spid, spn || (_data && _data.praesidium_name) || '', _praesidien);
  }
  var h='<div class="ubar">'+umgebungsBand(sp.umgebung, sp.name);
  if(glob) h+='<button class="btn" data-action="pwechsel">Präsidium wechseln</button>';
  h+='</div>';
  h+='<div class="main">'+verbindungsNote();
  if(_data){
    var ohneAkt=false;
    if(list.length){
      h+=summenLeiste(lageSummen(list));
      /* D6.8-04: Alter = Server-stand + Zeit seit dem letzten erfolgreichen Poll
       * (nicht die PC-Uhr); grau erst ab LAGE_SCHWELLE_MS und nur mit 0032-Feld. */
      var gruppen=lageGruppen(list), vn=0, seitPoll=_lastOkAt ? nowMs()-_lastOkAt : 0;
      gruppen.forEach(function(g){ if(g.verbund) vn++; });
      list.forEach(function(c){ if(!('zuletzt_gesehen' in c)) ohneAkt=true; });
      /* Ort-Korrektur nur für Alt-Beobachter (argus_lage_set_ort ist observer-only;
       * beim Master wäre die Kennung präsidienübergreifend mehrdeutig). */
      var opts={ortEdit: !isGlobal() && !isAdminSess(), geoKlick:true, vnTotal:vn};
      /* einmal berechnet — Karten und Lageskizze zeigen dieselbe Aktualität */
      var akts=gruppen.map(function(g){ return gruppenAktualitaet(g.members, _data.stand, seitPoll, LAGE_SCHWELLE_MS); });
      h+='<div class="lgrid">';
      gruppen.forEach(function(g, gi){
        h+=karteA(g, akts[gi], opts);
      });
      h+='</div>';
      /* Kartenmodul (Owner-Entscheid 19.10., ändert D6.8-06): Straßenkarte nur über die
       * Passform karte-config.js. Leer/ungültig, ohne Koordinaten, ohne Leaflet, bei Wahl
       * „Skizze“ oder nicht erreichbarem Dienst → SVG-Lageskizze aus den Koordinaten. */
      var kk=karteKonfig(window.ARGUS_KARTE), km=karteMarker(gruppen, akts), wahl=karteWahlGet();
      var kartenFaehig=!!(kk && km.punkte.length && window.L);
      var modus=karteModus(kk, km.punkte.length, wahl, _karteFehler, !!window.L);
      var schalter=kartenFaehig ? karteSchalter(modus) : '';
      if(modus==='karte'){
        h+=karteAbschnitt(km, schalter);
        _karteSoll={pid:(glob ? pid : sp.id)||'', konfig:kk, punkte:km.punkte};
      }else{
        var sk=skizzeSvg(gruppen, akts, 640, 360);
        h+='<section class="skab"><div class="skkopf"><h3>Lageskizze</h3>'+schalter+'</div>';
        if(kartenFaehig && _karteFehler && wahl!=='skizze') h+='<div class="kfehl">Karte nicht erreichbar — Lageskizze</div>';
        h+=sk;
        if(sk.indexOf('<svg')>=0){
          h+='<div class="sklegende"><span><i class="lg-t1"></i>T1</span><span><i class="lg-t2"></i>T2</span>'+
            '<span><i class="lg-t3"></i>T3</span><span><i class="lg-t5"></i>T5</span><span><i class="lg-leer"></i>leer</span>'+
            '<span><i class="lg-grau"></i>grau = veraltet</span><span>Norden oben · Maßstab unten links</span></div>';
        }
        h+='</section>';
      }
    }else{
      h+='<div class="empty">Keine offenen CCPs in diesem Präsidium.</div>';
    }
    h+='<div class="note">Anonyme Übersichtszahlen — keine Personendaten. Keine Patientendetails, keine Namen/Fotos, nur Zahlen je Kategorie. Aktualisiert sich automatisch.'+
      (ohneAkt ? ' Aktualitätsanzeige folgt nach dem Server-Update — bis dahin zeigt jede Karte die letzte Änderung.' : '')+'</div>';
  }else if(!_offline){
    h+='<div class="empty">Wird geladen…</div>';
  }
  return h+'</div>';
}
/* Global-Modus = MasterToken-Login (0021): alle Präsidien lesbar, read-only, Kennungen
 * NICHT präsidiumseindeutig → Auswahl je Präsidium (Phase 6.8), kein Ort-Editieren. */
function isGlobal(){ try{ return sessionStorage.getItem('arguslg_global')==='1'; }catch(e){ return false; } }
/* FLZ-Zugang-Sitzung (0023): eigenes Präsidium, read-only — kein argus_lage_set_ort (observer-only). */
function isAdminSess(){ try{ return sessionStorage.getItem('arguslg_admin')==='1'; }catch(e){ return false; } }
/* Präsidiums-Auswahl im Global-Modus ('' = noch keine Auswahl → Auswahlbildschirm) — Sitzungsmerker, nicht persistiert. */
function pselGet(){ try{ return sessionStorage.getItem('arguslg_psel')||''; }catch(e){ return ''; } }
function pselSet(pid){ try{ sessionStorage.setItem('arguslg_psel', pid||''); }catch(e){} }
function render(){
  var loggedIn=!!sessionJwt();
  var lb=$('logoutbtn'); if(lb) lb.style.display=loggedIn?'':'none';
  grossAnwenden(loggedIn);   /* D6.8-05: Anzeige-Vorliebe, unabhängig von der Sitzungsdauer */
  /* Topbar: ARGUS · FLZ · Rolle — Umgebung und Präsidium stehen im Band darunter (D6.8-01) */
  var tt=$('toptitle');
  if(tt){
    tt.textContent='ARGUS · FLZ'+(loggedIn?(isGlobal()?' · Master':(isAdminSess()?' · FLZ-Zugang':' · Beobachter')):'');
  }
  var dot=$('statdot'), txt=$('stattxt');
  if(dot && txt){
    if(!loggedIn){ dot.className='dot'; txt.textContent=''; }
    else if(_offline){ dot.className='dot off'; txt.textContent=_lastOkAt?('letzte Zahlen '+fmtHM(_lastOkAt)):'keine Verbindung'; }
    else if(_lastOkAt){ dot.className='dot ok'; txt.textContent='Stand: '+fmtClock(_lastOkAt); }
    else { dot.className='dot'; txt.textContent='lädt…'; }
  }
  /* Band-Bereich klebt direkt unter der Topbar → deren Höhe als Abstand */
  var tb=document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--toph', tb.offsetHeight+'px');
  _karteSoll=null;   /* setzt viewPraesidium(), wenn die Karte gezeigt wird */
  $('app').innerHTML = loggedIn ? viewLage() : viewLogin();
  karteNachRender();
  if(!loggedIn){ var li=$('logininp'); if(li) li.focus(); }
}

/* ── Events ────────────────────────────────────────────────────── */
/* Mini-Feedback (kein natives alert) für den Koordinaten-Klick */
function flash(msg){
  var f=document.createElement('div');
  f.textContent=msg;
  f.style.cssText='position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--acc);color:#fff;border-radius:9px;padding:9px 16px;font-size:13px;z-index:99;box-shadow:0 4px 18px rgba(0,0,0,.25)';
  document.body.appendChild(f);
  setTimeout(function(){ if(f.parentNode)f.parentNode.removeChild(f); },2200);
}
/* Ort-Eingabe (Migration 0010): Mini-Modal, kein natives prompt */
function ortPrompt(kennung, current){
  return new Promise(function(resolve){
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(22,24,26,.45);z-index:98;display:flex;align-items:center;justify-content:center;padding:16px';
    ov.innerHTML='<div style="background:#fff;color:#16181a;border-radius:14px;padding:18px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)">'+
      '<div style="font-weight:600;margin-bottom:10px">Ort/Objekt für CCP '+esc(kennungFunk(kennung))+'</div>'+
      '<input id="ortinp" value="'+esc(current||'')+'" maxlength="120" placeholder="z. B. Stadthalle, Halle 2" style="margin-bottom:12px;background:#fff;color:#16181a">'+
      '<div style="display:flex;gap:8px"><button class="btn" data-m="ok" style="flex:1">Speichern</button>'+
      '<button class="btn" data-m="no" style="flex:1;background:var(--surf2);color:var(--tx)">Abbrechen</button></div>'+
      '<p class="hint" style="margin:10px 0 0">Wird protokolliert und erscheint auf allen Geräten dieses Einsatzes.</p></div>';
    document.body.appendChild(ov);
    var inp=ov.querySelector('#ortinp'); inp.focus(); inp.select();
    function done(v){ if(ov.parentNode)ov.parentNode.removeChild(ov); resolve(v); }
    ov.addEventListener('click',function(e){
      var m=e.target.closest('[data-m]');
      if(m){ done(m.getAttribute('data-m')==='ok'?inp.value:null); }
      else if(e.target===ov){ done(null); }
    });
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') done(inp.value); });
  });
}
async function setOrt(kennung, current){
  var jwt=sessionJwt(); if(!jwt) return;
  var v=await ortPrompt(kennung, current);
  if(v===null) return;
  try{
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_lage_set_ort',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+jwt },
      body:JSON.stringify({ p_kennung:kennung, p_ort:v })
    });
    if(resp.status===401){ doLogout('Sitzung abgelaufen — bitte neu anmelden.'); return; }
    var d=await resp.json();
    if(resp.ok && d && d.ok){ flash('Ort gespeichert ✓ (protokolliert)'); poll(); }
    else flash('Speichern fehlgeschlagen'+(d&&d.message?': '+d.message:''));
  }catch(e){ flash('Keine Verbindung — Ort nicht gespeichert'); }
}
document.addEventListener('click', function(e){
  var b=e.target.closest('[data-action]');
  if(!b) return;
  var a=b.getAttribute('data-action');
  if(a==='login'){ var li=$('logininp'); doLogin(li?li.value:''); }
  if(a==='pselect'){ pselSet(b.getAttribute('data-pid')||''); render(); window.scrollTo(0,0); return; }
  if(a==='pwechsel'){ pselSet(''); loadPraesidien(); render(); window.scrollTo(0,0); return; }
  if(a==='logout'){ doLogout(); }
  if(a==='gross'){ grossUmschalten(); return; }
  if(a==='gthema'){ grossThemaSetzen(b.getAttribute('data-thema')); return; }
  if(a==='wachan'){ wachAn(); return; }
  if(a==='kartewahl'){
    var kw=b.getAttribute('data-wahl')==='skizze' ? 'skizze' : 'karte';
    karteWahlSet(kw);
    if(kw==='karte') _karteFehler=false;
    render(); return;
  }
  if(a==='editort'){ setOrt(b.getAttribute('data-kennung'), b.getAttribute('data-ort')||''); }
  if(a==='copygeo'){
    var txt=b.getAttribute('data-lat')+', '+b.getAttribute('data-lng');
    try{
      navigator.clipboard.writeText(txt).then(function(){ flash('Koordinaten kopiert: '+txt); },
        function(){ flash('Koordinaten: '+txt); });
    }catch(err){ flash('Koordinaten: '+txt); }
  }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='logininp'){
    doLogin(document.activeElement.value);
  }
});

/* Start: vorhandene gültige Sitzung → direkt Lage + Polling, sonst Login */
render();
if(sessionJwt()) startPolling();
</script>
