<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS · Leitung</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../ARGUS_Icon.png">
<style>
  /* Selbst gehostete Schriften (kein externes CDN) */
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-400.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-500.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-600.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-700.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-600.woff2) format('woff2')}
  :root{
    --bg:#fff; --surf:#f6f7f8; --surf2:#eef0f2; --line:#d9dde1;
    --tx:#16181a; --mut:#5d6368;
    --t1:#C62828; --t2:#F2B600; --t3:#2E7D32; --t5:#1b1d20; --t5b:#3a3d41;
    --prio:#E65100; --ready:#1565C0; --acc:#1f2530;
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--surf);color:var(--tx);font-family:var(--sans);line-height:1.5;font-size:14px}
  button{font-family:var(--sans);cursor:pointer;border:0}
  input,textarea{font-family:var(--sans);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--tx);width:100%}
  input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
  select{font-family:var(--sans);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;color:var(--tx)}
  select:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
  .mono{font-family:var(--mono)}
  /* Topbar (Schiefer = Chrome) */
  .topbar{background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;position:sticky;top:0;z-index:50}
  .topbar .brand{font-weight:700;letter-spacing:1px;font-size:16px}
  .topbar .brand small{font-weight:400;letter-spacing:0;opacity:.75;margin-left:8px;font-size:12px}
  .topbar button{background:#ffffff1d;color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600}
  .topbar button:hover{background:#ffffff30}
  /* Layout: Seitennavigation + Inhalt */
  .layout{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100vh - 46px)}
  .side{background:#fff;border-right:1px solid var(--line);padding:14px 12px}
  .side .sh{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:4px 2px 8px}
  .side .it{padding:9px 11px;border-radius:8px;font-size:13.5px;margin-bottom:3px;cursor:pointer;user-select:none}
  .side .it:hover{background:var(--surf2)}
  .side .it.on{background:var(--acc);color:#fff}
  .side .it.on:hover{background:var(--acc)}
  .side .lockedsec{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line)}
  .side .lockedsec .sh{color:var(--mut)}
  .side .locked{padding:9px 11px;border-radius:8px;font-size:13.5px;margin-bottom:3px;color:var(--mut);opacity:.5;cursor:not-allowed;user-select:none;display:flex;justify-content:space-between;align-items:center}
  .side .locked:hover{background:none}
  .main{padding:20px 22px 60px;max-width:1100px;width:100%}
  .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .mh h2{margin:0;font-size:18px}
  /* Bausteine */
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px}
  .hint{font-size:12px;color:var(--mut)}
  .sech{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
  /* Einklappbare Karten/Blöcke (Owner-Wunsch 2026-06-12: weniger Scrollen) */
  .cardhead{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .cardhead .chev{flex:0 0 auto;color:var(--mut);font-size:10px;display:inline-block;transition:transform .15s}
  .cardhead.open .chev{transform:rotate(90deg)}
  .cardhead .ctitle{font-weight:600;font-size:15px}
  .cardhead .csum{color:var(--mut);font-size:12px;font-weight:400;margin-left:auto;white-space:nowrap}
  .sech.fold{cursor:pointer;user-select:none}
  .sech.fold .chev{display:inline-block;font-size:9px;margin-right:5px;transition:transform .15s}
  .sech.fold.open .chev{transform:rotate(90deg)}
  /* Druck (Übergabe-Export): nur den Inhalt, keine Navigation/Buttons */
  @media print{
    .side,.topbar,.btn,.mh button{display:none!important}
    body{background:#fff}
    .layout{display:block}
    /* AT-MIST-Druckmodus (Paket 3): nur das Karten-Overlay drucken */
    body[data-atmist-print] .layout{display:none!important}
    body[data-atmist-print] #atmist-print-overlay{display:block!important}
  }
  /* AT-MIST-Overlay nur im Druckmodus sichtbar */
  #atmist-print-overlay{display:none}
  .btn{background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
  .btn:hover{filter:brightness(1.25)}
  .btn.ghost{background:var(--surf2);color:var(--tx)}
  .btn.ghost:hover{filter:none;background:var(--line)}
  .btn.warn{background:var(--t1)}
  .btn[disabled]{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--surf2);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .tablewrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
  .pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .pill.gray{background:var(--surf2);color:var(--mut)}
  .pill.red{background:var(--t1)}
  .pill.green{background:var(--t3)}
  /* Login */
  .loginwrap{min-height:calc(100vh - 46px);display:flex;align-items:flex-start;justify-content:center;padding:60px 14px}
  .loginbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px;max-width:380px;width:100%;box-shadow:0 6px 22px rgba(0,0,0,.06)}
  .loginbox h1{font-size:18px;margin:0 0 4px}
  .arg-logo{width:52px;height:52px;border-radius:13px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin:0 auto 14px;letter-spacing:1px}
  .fieldlab{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
  .lerr{color:var(--t1);font-size:12.5px;font-weight:600;margin-top:10px;min-height:18px}
  /* Modal */
  .modalov{position:fixed;inset:0;background:rgba(15,21,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
  .modalbx{background:#fff;border-radius:13px;padding:20px 18px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .modalmsg{font-size:14px;margin-bottom:14px;white-space:pre-wrap}
  .modalrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  /* Toast */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--acc);color:#fff;font-weight:600;padding:11px 20px;border-radius:30px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:2000;max-width:90%}
  .toast.show{opacity:1}
  /* Wiedervorlage */
  .wieder{border:1px solid var(--t1);border-left:5px solid var(--t1);border-radius:11px;background:#fff;padding:14px;margin-bottom:14px}
  .wieder .wt{color:var(--t1);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  @media(max-width:760px){
    .layout{grid-template-columns:1fr}
    .side{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
    .side .sh{width:100%;margin:2px}
    .side .it,.side .locked{margin-bottom:0}
    .side .lockedsec{margin-top:0;padding-top:0;border-top:0;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
    .main{padding:14px}
  }
</style>
</head>

  <span class="brand">ARGUS<small>· Leitung</small></span>

<script>
"use strict";

/* ============================================================
 * ARGUS · Leitung — Governance-Oberfläche (Desktop)
 * Alle Inhalte ausschließlich nach Anmeldung mit MasterToken
 * (is_master-JWT). Die Seite selbst enthält keine Daten.
 * Sitzung bewusst flüchtig: sessionStorage, kein Verlauf.
 * ============================================================ */

/* ── Inline-QR-Generator (Plan 04.14-03, Task 1; ersetzt 04.14-03) ───
 * Erprobter, breit eingesetzter QR-Encoder INLINE (kein externes CDN, kein npm).
 * Library: qrcode-generator von Kazuhiko Arase
 *   Quelle: https://github.com/kazuhikoarase/qrcode-generator
 *   Lizenz: MIT (frei verwendbar; Copyright (c) 2009 Kazuhiko Arase)
 * Supply-Chain-Sichtung (T-0414-11): kompakte, unveränderte Portierung des
 *   bekannten qrcode-generator-Kerns (Byte-Modus, automatische Versions-/
 *   Maskenwahl) — keine Netz-Requests, keine eval/Function-Konstrukte.
 *
 * Öffentliche API (unverändert für Task 2):
 *   drawQR(targetEl, text)  — rendert einen scannbaren QR als <canvas>.
 * ──────────────────────────────────────────────────────────────────── */
(function(){
/* === qrcode-generator (Kazuhiko Arase, MIT) — kompakter Kern === */
var qrcode=function(){
  var qrcode=function(typeNumber,errorCorrectionLevel){
    var PAD0=0xEC,PAD1=0x11;
    var _typeNumber=typeNumber;
    var _errorCorrectionLevel=QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules=null,_moduleCount=0,_dataCache=null,_dataList=[];
    var _this={};
    var makeImpl=function(test,maskPattern){
      _moduleCount=_typeNumber*4+17;
      _modules=function(moduleCount){
        var modules=new Array(moduleCount);
        for(var row=0;row<moduleCount;row+=1){
          modules[row]=new Array(moduleCount);
          for(var col=0;col<moduleCount;col+=1){ modules[row][col]=null; }
        }
        return modules;
      }(_moduleCount);
      setupPositionProbePattern(0,0);
      setupPositionProbePattern(_moduleCount-7,0);
      setupPositionProbePattern(0,_moduleCount-7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test,maskPattern);
      if(_typeNumber>=7){ setupTypeNumber(test); }
      if(_dataCache==null){ _dataCache=createData(_typeNumber,_errorCorrectionLevel,_dataList); }
      mapData(_dataCache,maskPattern);
    };
    var setupPositionProbePattern=function(row,col){
      for(var r=-1;r<=7;r+=1){
        if(row+r<=-1||_moduleCount<=row+r) continue;
        for(var c=-1;c<=7;c+=1){
          if(col+c<=-1||_moduleCount<=col+c) continue;
          if((0<=r&&r<=6&&(c==0||c==6))||(0<=c&&c<=6&&(r==0||r==6))||(2<=r&&r<=4&&2<=c&&c<=4)){
            _modules[row+r][col+c]=true;
          }else{ _modules[row+r][col+c]=false; }
        }
      }
    };
    var getBestMaskPattern=function(){
      var minLostPoint=0,pattern=0;
      for(var i=0;i<8;i+=1){
        makeImpl(true,i);
        var lostPoint=QRUtil.getLostPoint(_this);
        if(i==0||minLostPoint>lostPoint){ minLostPoint=lostPoint; pattern=i; }
      }
      return pattern;
    };
    var setupTimingPattern=function(){
      for(var r=8;r<_moduleCount-8;r+=1){ if(_modules[r][6]!=null) continue; _modules[r][6]=(r%2==0); }
      for(var c=8;c<_moduleCount-8;c+=1){ if(_modules[6][c]!=null) continue; _modules[6][c]=(c%2==0); }
    };
    var setupPositionAdjustPattern=function(){
      var pos=QRUtil.getPatternPosition(_typeNumber);
      for(var i=0;i<pos.length;i+=1){
        for(var j=0;j<pos.length;j+=1){
          var row=pos[i],col=pos[j];
          if(_modules[row][col]!=null) continue;
          for(var r=-2;r<=2;r+=1){
            for(var c=-2;c<=2;c+=1){
              if(r==-2||r==2||c==-2||c==2||(r==0&&c==0)){ _modules[row+r][col+c]=true; }
              else{ _modules[row+r][col+c]=false; }
            }
          }
        }
      }
    };
    var setupTypeNumber=function(test){
      var bits=QRUtil.getBCHTypeNumber(_typeNumber);
      for(var i=0;i<18;i+=1){ var mod=(!test&&((bits>>i)&1)==1); _modules[Math.floor(i/3)][i%3+_moduleCount-8-3]=mod; }
      for(var i=0;i<18;i+=1){ var mod=(!test&&((bits>>i)&1)==1); _modules[i%3+_moduleCount-8-3][Math.floor(i/3)]=mod; }
    };
    var setupTypeInfo=function(test,maskPattern){
      var data=(_errorCorrectionLevel<<3)|maskPattern;
      var bits=QRUtil.getBCHTypeInfo(data);
      for(var i=0;i<15;i+=1){
        var mod=(!test&&((bits>>i)&1)==1);
        if(i<6){ _modules[i][8]=mod; }else if(i<8){ _modules[i+1][8]=mod; }else{ _modules[_moduleCount-15+i][8]=mod; }
      }
      for(var i=0;i<15;i+=1){
        var mod=(!test&&((bits>>i)&1)==1);
        if(i<8){ _modules[8][_moduleCount-i-1]=mod; }else if(i<9){ _modules[8][15-i-1+1]=mod; }else{ _modules[8][15-i-1]=mod; }
      }
      _modules[_moduleCount-8][8]=(!test);
    };
    var mapData=function(data,maskPattern){
      var inc=-1,row=_moduleCount-1,bitIndex=7,byteIndex=0;
      var maskFunc=QRUtil.getMaskFunction(maskPattern);
      for(var col=_moduleCount-1;col>0;col-=2){
        if(col==6) col-=1;
        while(true){
          for(var c=0;c<2;c+=1){
            if(_modules[row][col-c]==null){
              var dark=false;
              if(byteIndex<data.length){ dark=(((data[byteIndex]>>>bitIndex)&1)==1); }
              var mask=maskFunc(row,col-c);
              if(mask){ dark=!dark; }
              _modules[row][col-c]=dark;
              bitIndex-=1;
              if(bitIndex==-1){ byteIndex+=1; bitIndex=7; }
            }
          }
          row+=inc;
          if(row<0||_moduleCount<=row){ row-=inc; inc=-inc; break; }
        }
      }
    };
    var createBytes=function(buffer,rsBlocks){
      var offset=0,maxDcCount=0,maxEcCount=0;
      var dcdata=new Array(rsBlocks.length),ecdata=new Array(rsBlocks.length);
      for(var r=0;r<rsBlocks.length;r+=1){
        var dcCount=rsBlocks[r].dataCount,ecCount=rsBlocks[r].totalCount-dcCount;
        maxDcCount=Math.max(maxDcCount,dcCount);
        maxEcCount=Math.max(maxEcCount,ecCount);
        dcdata[r]=new Array(dcCount);
        for(var i=0;i<dcdata[r].length;i+=1){ dcdata[r][i]=0xff&buffer.getBuffer()[i+offset]; }
        offset+=dcCount;
        var rsPoly=QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly=qrPolynomial(dcdata[r],rsPoly.getLength()-1);
        var modPoly=rawPoly.mod(rsPoly);
        ecdata[r]=new Array(rsPoly.getLength()-1);
        for(var i=0;i<ecdata[r].length;i+=1){ var modIndex=i+modPoly.getLength()-ecdata[r].length; ecdata[r][i]=(modIndex>=0)?modPoly.getAt(modIndex):0; }
      }
      var totalCodeCount=0;
      for(var i=0;i<rsBlocks.length;i+=1){ totalCodeCount+=rsBlocks[i].totalCount; }
      var data=new Array(totalCodeCount),index=0;
      for(var i=0;i<maxDcCount;i+=1){ for(var r=0;r<rsBlocks.length;r+=1){ if(i<dcdata[r].length){ data[index]=dcdata[r][i]; index+=1; } } }
      for(var i=0;i<maxEcCount;i+=1){ for(var r=0;r<rsBlocks.length;r+=1){ if(i<ecdata[r].length){ data[index]=ecdata[r][i]; index+=1; } } }
      return data;
    };
    var createData=function(typeNumber,errorCorrectionLevel,dataList){
      var rsBlocks=QRRSBlock.getRSBlocks(typeNumber,errorCorrectionLevel);
      var buffer=qrBitBuffer();
      for(var i=0;i<dataList.length;i+=1){ var data=dataList[i]; buffer.put(data.getMode(),4); buffer.put(data.getLength(),QRUtil.getLengthInBits(data.getMode(),typeNumber)); data.write(buffer); }
      var totalDataCount=0;
      for(var i=0;i<rsBlocks.length;i+=1){ totalDataCount+=rsBlocks[i].dataCount; }
      if(buffer.getLengthInBits()>totalDataCount*8){ throw 'code length overflow. ('+buffer.getLengthInBits()+'>'+totalDataCount*8+')'; }
      if(buffer.getLengthInBits()+4<=totalDataCount*8){ buffer.put(0,4); }
      while(buffer.getLengthInBits()%8!=0){ buffer.putBit(false); }
      while(true){ if(buffer.getLengthInBits()>=totalDataCount*8) break; buffer.put(PAD0,8); if(buffer.getLengthInBits()>=totalDataCount*8) break; buffer.put(PAD1,8); }
      return createBytes(buffer,rsBlocks);
    };
    _this.addData=function(data,mode){
      mode=mode||'Byte';
      var newData=null;
      switch(mode){ case 'Byte': newData=qr8BitByte(data); break; default: throw 'mode:'+mode; }
      _dataList.push(newData); _dataCache=null;
    };
    _this.isDark=function(row,col){ if(row<0||_moduleCount<=row||col<0||_moduleCount<=col){ throw row+','+col; } return _modules[row][col]; };
    _this.getModuleCount=function(){ return _moduleCount; };
    _this.make=function(){
      if(_typeNumber<1){
        var typeNumber=1;
        for(;typeNumber<40;typeNumber++){
          var rsBlocks=QRRSBlock.getRSBlocks(typeNumber,_errorCorrectionLevel);
          var buffer=qrBitBuffer();
          for(var i=0;i<_dataList.length;i++){ var data=_dataList[i]; buffer.put(data.getMode(),4); buffer.put(data.getLength(),QRUtil.getLengthInBits(data.getMode(),typeNumber)); data.write(buffer); }
          var totalDataCount=0;
          for(var i=0;i<rsBlocks.length;i++){ totalDataCount+=rsBlocks[i].dataCount; }
          if(buffer.getLengthInBits()<=totalDataCount*8) break;
        }
        _typeNumber=typeNumber;
      }
      makeImpl(false,getBestMaskPattern());
    };
    return _this;
  };
  // ---------------------------------------------------------------------
  var qr8BitByte=function(data){
    var _mode=1<<2,_bytes=qrcode.stringToBytes(data),_this={};
    _this.getMode=function(){ return _mode; };
    _this.getLength=function(){ return _bytes.length; };
    _this.write=function(buffer){ for(var i=0;i<_bytes.length;i+=1){ buffer.put(_bytes[i],8); } };
    return _this;
  };
  var QRMode={MODE_8BIT_BYTE:1<<2};
  var QRErrorCorrectionLevel={L:1,M:0,Q:3,H:2};
  var QRMaskPattern={PATTERN000:0,PATTERN001:1,PATTERN010:2,PATTERN011:3,PATTERN100:4,PATTERN101:5,PATTERN110:6,PATTERN111:7};
  var QRUtil=function(){
    var PATTERN_POSITION_TABLE=[[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],[6,30,58,86],[6,34,62,90],[6,28,50,72,94],[6,26,50,74,98],[6,30,54,78,102],[6,28,54,80,106],[6,32,58,84,110],[6,30,58,86,114],[6,34,62,90,118],[6,26,50,74,98,122],[6,30,54,78,102,126],[6,26,52,78,104,130],[6,30,56,82,108,134],[6,34,60,86,112,138],[6,30,58,86,114,142],[6,34,62,90,118,146],[6,30,54,78,102,126,150],[6,24,50,76,102,128,154],[6,28,54,80,106,132,158],[6,32,58,84,110,136,162],[6,26,54,82,110,138,166],[6,30,58,86,114,142,170]];
    var G15=(1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0);
    var G18=(1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0);
    var G15_MASK=(1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1);
    var _this={};
    var getBCHDigit=function(data){ var digit=0; while(data!=0){ digit+=1; data>>>=1; } return digit; };

/* ---- drawQR: rendert einen scannbaren QR als <canvas> in targetEl ---- */
window.drawQR=function(targetEl, text){
  try{
    var qr=qrcode(0,'M');          /* Typ 0 = automatische Versionswahl, ECC Level M */
    qr.addData(String(text),'Byte');
    qr.make();
    var count=qr.getModuleCount();
    var quiet=4;                   /* Quiet-Zone: 4 Module (Spec-konform) */
    var target=Math.min(256, (targetEl&&targetEl.offsetWidth)||256);
    var msize=Math.max(3, Math.floor(target/(count+2*quiet)));
    var cw=(count+2*quiet)*msize;
    var cv=document.createElement('canvas');
    cv.width=cw; cv.height=cw;
    cv.style.cssText='display:block;image-rendering:pixelated;max-width:100%;height:auto';
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,cw);
    ctx.fillStyle='#000';
    for(var r=0;r<count;r+=1){ for(var c=0;c<count;c+=1){ if(qr.isDark(r,c)){ ctx.fillRect((c+quiet)*msize,(r+quiet)*msize,msize,msize); } } }
    if(targetEl){ targetEl.innerHTML=''; targetEl.appendChild(cv); }
    return cv;
  }catch(e){
    if(targetEl){ targetEl.textContent='QR konnte nicht erzeugt werden'; }
    return null;
  }
};

 * PFLEGE: diese Konstante auf die öffentliche Installadresse der ARGUS-Feld-App
 * setzen (z. B. "https://argus.example.de"). Bewusst NICHT die geheime
 * Leitungs-URL (D-06). Leer lassen = QR zeigt Hinweis statt Link. */
var APP_INSTALL_URL = 'https://krapfenbediener.github.io/argus';

/* buildGastDeepLink(short_code) → <APP_INSTALL_URL>/index.html#code=<sc>
 * Der Feld-App unterstützt #code= BEREITS (index.html, wird hier NICHT geändert). */
function buildGastDeepLink(sc){
  if(!APP_INSTALL_URL) return '';
  return APP_INSTALL_URL.replace(/\/+$/,'')+'/index.html#code='+encodeURIComponent(sc);
}

/* showGastQrModal(sc, label) — zeigt QR + Klartext-Code nach Gast-Code-Ausgabe.
 * Kein natives alert/confirm/prompt — In-App-Modal (Projektkonvention). */
function showGastQrModal(sc, label){
  var link=buildGastDeepLink(sc);
  var qrHtml='';

  }else{
    qrHtml='<div class="hint" style="margin:8px 0;color:var(--t1)">App-Adresse nicht hinterlegt — QR nicht verfügbar. Bitte APP_INSTALL_URL in der Leitungs-Seite setzen.</div>';
  }

/* ── Hilfsfunktionen ─────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function nowMs(){ return Date.now(); }
/* HTML-Escaping JEDES dynamischen Werts — Daten kommen aus gemeinsam
 * beschreibbaren Tabellen (Kennungen, Labels, Begründungen von Feld-Geräten). */
function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* de-DE-Datumsformat für bigint-Millisekunden (Muster govFmt der Feld-App) */
function fmtMs(ms){
  if(ms==null) return '—';
  return new Date(+ms).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr';
}
/* timestamptz (ISO-String, z. B. purge_log.at) ebenfalls de-DE */
function fmtIso(s){
  if(!s) return '—';
  var d=new Date(s);
  if(isNaN(d.getTime())) return esc(String(s));
  return d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr';
}
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },2200);
}

function modalBase(innerHtml){

}
function confirmModal(msg, okLabel){
  return new Promise(function(resolve){
    var ov=modalBase('<div class="modalmsg">'+esc(msg)+'</div>'+
      '<div class="modalrow"><button class="btn ghost" data-m="no">Abbrechen</button>'+
      '<button class="btn" data-m="yes">'+esc(okLabel||'OK')+'</button></div>');
    ov.addEventListener('click',function(e){
      var b=e.target.closest('[data-m]');
      if(b){ ov.remove(); resolve(b.getAttribute('data-m')==='yes'); }
      else if(e.target===ov){ ov.remove(); resolve(false); }
    });
  });
}
function promptModal(msg, def){
  return new Promise(function(resolve){
    var ov=modalBase('<div class="modalmsg">'+esc(msg)+'</div>'+
      '<input id="modalinp" value="'+esc(def||'')+'">'+
      '<div class="modalrow"><button class="btn ghost" data-m="no">Abbrechen</button>'+
      '<button class="btn" data-m="yes">OK</button></div>');
    var inp=ov.querySelector('#modalinp'); inp.focus(); inp.select();
    function done(ok){ var v=inp.value; ov.remove(); resolve(ok?v:null); }
    ov.addEventListener('click',function(e){
      var b=e.target.closest('[data-m]');
      if(b){ done(b.getAttribute('data-m')==='yes'); }
      else if(e.target===ov){ done(false); }
    });
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') done(true); });
  });
}

/* ── Sitzung (D-07): sessionStorage, bewusst flüchtig ───────────
 * Schlüssel argusl_jwt / argusl_jwt_exp. Tab zu = Sitzung weg.
 * Abgelaufene Sitzung führt zurück zum Login. */
function sessionJwt(){
  var jwt=sessionStorage.getItem('argusl_jwt');
  var exp=parseInt(sessionStorage.getItem('argusl_jwt_exp')||'0',10);
  if(!jwt||!exp) return null;
  if(exp<=nowMs()){ sessionStorage.clear(); return null; }
  return jwt;
}
function sb(){
  var jwt=sessionJwt();
  if(!jwt) return null;
  if(_sb && jwt===_sbJwt) return _sb;
  var lib=window.supabase;
  if(!lib || !lib.createClient) return null;
  _sbJwt=jwt;
  _sb=lib.createClient(SUPA_URL, SUPA_KEY, {
    auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false},
    global:{ headers:{ Authorization:'Bearer '+jwt } }
  });
  return _sb;
}

 * scheitert, wird die Abweisung gezeigt.
 * Wichtig: argus_exchange_admin_code NUR aufrufen, wenn Master-Versuch
 * wirklich keinen Master ergab — Doppel-Log vermeiden.
 * NICHTS wird im Abweisungspfad in sessionStorage gespeichert. */
async function doLogin(raw){
  /* Ohne Config liefe der fetch relativ gegen den eigenen Origin (kryptischer
   * 404) — daher hier hart abfangen, Hinweis steht auch in der Login-Ansicht. */
  if(_configError){ setLoginError('Konfiguration fehlt (config.js) — kein Backend verbunden.'); return; }
  var clean=(raw||'').replace(/[\s\-]/g,'').toUpperCase();
  if(clean.length<8){ setLoginError('Bitte vollständigen Zugangs-Token eingeben.'); return; }
  setLoginError('');
  var btn=$('loginbtn'); if(btn){ btn.disabled=true; btn.textContent='Prüfe…'; }
  try{
    /* ── 1. Master-Versuch (argus_exchange_code) ── */
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean })
    });
    var data=await resp.json();   /* ungültiger Code = HTTP 200 + {error:…} */

    if(data && data.jwt && data.is_master===true){
      /* ── Master-Pfad: alles wie bisher ── */
      sessionStorage.setItem('argusl_jwt', data.jwt);
      sessionStorage.setItem('argusl_jwt_exp', String(data.exp*1000));
      sessionStorage.setItem('argusl_role', 'master');
      state.section='zugaenge';     /* D-10: direkt in den ersten Bereich */
      render();
      loadSection();
      return;
    }

    /* ── 2. Admin-Versuch (argus_exchange_admin_code) ──
     * Nur wenn Master-Versuch kein Master-JWT geliefert hat —
     * vermeidet Doppel-Log im governance_log. */
    var resp2=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_admin_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean })
    });
    var data2=await resp2.json();

    if(data2 && data2.jwt){
      /* ── Admin-Pfad ── */
      sessionStorage.setItem('argusl_jwt', data2.jwt);
      sessionStorage.setItem('argusl_jwt_exp', String(data2.exp*1000));
      sessionStorage.setItem('argusl_role', 'admin');
      sessionStorage.setItem('argusl_padmin', data2.praesidium_id||'');
      sessionStorage.setItem('argusl_padmin_name', data2.praesidium_name||'');
      state.section='admin-zugang'; /* Direkteinstieg für Admin */
      render();
      loadSection();
      return;
    }

    /* ── 3. Pro-Person-Versuch (argus_exchange_person_code, Plan 05-03) ──
     * Erst NACHDEM Master- und Admin-Versuch fehlgeschlagen sind. Ein
     * Person-Code an argus_exchange_code liefert dank CR-02-Härtung (Plan 01)
     * bereits einen Fehler statt eines is_master-JWT — der Master-Versuch
     * scheitert also korrekt zuerst. Der Person-Token trägt die USBNK, damit
     * Leitungs-Seiten-Aktionen personenscharf protokolliert werden (D-08). */
    var resp3=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_person_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean })
    });
    var data3=await resp3.json();

    if(data3 && data3.jwt){
      var prole=(data3.argus_role||'').toLowerCase();
      sessionStorage.setItem('argusl_jwt', data3.jwt);
      sessionStorage.setItem('argusl_jwt_exp', String(data3.exp*1000));
      /* USBNK als Sitzungs-Kürzel (Actor) — erscheint in Governance-/Audit-Aktionen */
      sessionStorage.setItem('argusl_kuerzel', data3.usbnk||'');
      if(prole==='master'){
        sessionStorage.setItem('argusl_role', 'master');
        state.section='zugaenge';     /* volle Master-Ansicht */
      }else if(prole==='admin'){
        sessionStorage.setItem('argusl_role', 'admin');
        sessionStorage.setItem('argusl_padmin', data3.praesidium_id||'');
        sessionStorage.setItem('argusl_padmin_name', data3.praesidium_name||'');
        state.section='admin-zugang'; /* reduzierte Admin-Ansicht */
      }else{
        /* flz / normal: in Phase 5 (noch) keine Leitungs-Seiten-Ansicht.
         * Anmeldung akzeptieren, aber freundlichen Hinweis zeigen — KEINE
         * kaputte/leere Master-Ansicht rendern. */
        sessionStorage.setItem('argusl_role', prole||'normal');
        state.section='noview';
      }
      render();
      loadSection();
      return;
    }

    /* ── Abweisung — KEIN sessionStorage-Schreiben ── */
    setLoginError('Nur mit Master-, Admin- oder Pro-Person-Token — dieser Code hat keine Leitungs-Berechtigung.');
  }catch(e){
    setLoginError('Keine Verbindung — bitte erneut versuchen.');
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='Anmelden'; }
  }
}
function setLoginError(msg){ var e=$('loginerr'); if(e) e.textContent=msg||''; }

/* ── Bereich „Zugänge" (D-11) ───────────────────────────────────
 * Portierung der Admin-Panel-Logik der Feld-App, erweitert um
 * 24-h-Codes und die Code-Sperre (revoked-Flag, Migration 0003). */
var _praes=null, _tokens=null, _zugErr=null;

/* Einklapp-Zustand je Karte/Block (Owner-Wunsch 2026-06-12). Persistenz in
 * sessionStorage — überlebt Bereichswechsel, endet mit der Sitzung. */
var _collapsed={};
try{ _collapsed=JSON.parse(sessionStorage.getItem('arguslt_collapsed')||'{}')||{}; }catch(e){ _collapsed={}; }
function isCollapsed(key, defCollapsed){ return (key in _collapsed) ? !!_collapsed[key] : !!defCollapsed; }
function toggleCard(key, defCollapsed){
  _collapsed[key]=!isCollapsed(key, defCollapsed);
  try{ sessionStorage.setItem('arguslt_collapsed', JSON.stringify(_collapsed)); }catch(e){}
  render();
}
/* Filter/Sortierung für die Zugänge-Tabellen (Owner-Wunsch 2026-06-12).
 * Rein clientseitig auf den geladenen _tokens; bei aktivem Filter werden
 * die Karten zwangsweise aufgeklappt, sonst wäre das Ergebnis unsichtbar. */
var _zugFilter={art:'alle',status:'alle',sort:'neu'};
function zugFilterActive(){ return _zugFilter.art!=='alle' || _zugFilter.status!=='alle'; }
function tokenArtKey(t){
  if(t.observer) return 'beobachter';
  if(t.is_admin) return 'admin';
  if(t.is_master) return 'master';
  if(t.gast) return 'gast';
  if(t.single_use) return 'einmal';
  return 'dauerhaft';
}
function tokenStatusKey(t){
  if(t.revoked) return 'gesperrt';
  if(t.single_use && t.used_at) return 'verbraucht';
  if(t.gast && t.expires_at && t.expires_at<=Date.now()) return 'abgelaufen';
  return 'aktiv';
}
function tokenMatches(t){
  if(_zugFilter.art!=='alle'    && tokenArtKey(t)!==_zugFilter.art) return false;
  if(_zugFilter.status!=='alle' && tokenStatusKey(t)!==_zugFilter.status) return false;
  return true;
}
function sortTokens(list){
  var l=list.slice();
  l.sort(function(a,b){
    var ta=Date.parse(a.created_at||'')||0, tb=Date.parse(b.created_at||'')||0;
    return _zugFilter.sort==='alt' ? ta-tb : tb-ta;
  });
  return l;
}
function zugSel(field, opts){
  var h='<select data-action="zugfilter" data-field="'+field+'">';
  opts.forEach(function(o){
    h+='<option value="'+o[0]+'"'+(_zugFilter[field]===o[0]?' selected':'')+'>'+o[1]+'</option>';
  });
  return h+'</select>';
}

/* Klickbarer Karten-Kopf; def=1 → standardmäßig zugeklappt.
 * forceOpen überstimmt den Merker (aktiver Filter klappt alles auf). */
function foldHead(key, defCollapsed, title, summary, forceOpen){
  var open=(forceOpen!==undefined) ? !!forceOpen : !isCollapsed(key, defCollapsed);
  return '<div class="cardhead'+(open?' open':'')+'" data-action="togglecard" data-key="'+esc(key)+'" data-def="'+(defCollapsed?'1':'0')+'">'
       + '<span class="chev">▶</span><span class="ctitle">'+title+'</span>'
       + (summary?'<span class="csum">'+summary+'</span>':'')
       + '</div>';
}

/* Code-/Token-Erzeugung — 1:1 aus der Feld-App portiert */
function genShortCode(){
  /* WR-02 (04.14 Code-Review): kryptografisch statt Math.random. Das Alphabet hat
     32 Zeichen (Zweierpotenz) → b%32 ist bias-frei (256/32=8). Konsistent zu genToken. */
  var AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var a=new Uint8Array(8); crypto.getRandomValues(a);
  var s='';for(var i=0;i<8;i++){ if(i===4)s+='-'; s+=AL[a[i]%32]; }
  return s;
}
function genToken(){ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a,function(b){return b.toString(16).padStart(2,'0');}).join(''); }

/* Wurzel-URL der Feld-App: das Segment „docs/<datei>" aus dem eigenen
 * Pfad entfernen — die Leitungs-Seite liegt selbst unter docs/. */
function feldAppRoot(){
  return location.origin + location.pathname.replace(/docs\/[^\/]*$/,'');
}

async function loadZugaenge(){
  _praes=null; _tokens=null; _zugErr=null;
  if(state.section==='zugaenge') render();
  var cl=sb();
  if(!cl){ _zugErr='Sitzung abgelaufen — bitte neu anmelden.'; if(state.section==='zugaenge') render(); return; }
  try{
    var pr=await cl.from('praesidien').select('id,name,schulung').order('name');
    if(pr.error){ _zugErr=pr.error.message||'Präsidien nicht lesbar'; }
    else{
      _praes=pr.data||[];
      var tk=await cl.from('access_tokens').select('short_code,label,is_master,is_admin,temporary,ttl_hours,single_use,used_at,revoked,praesidium_id,observer,created_at,gast,expires_at');
      if(tk.error){ _zugErr=tk.error.message||'Zugänge nicht lesbar'; }
      else{ _tokens=tk.data||[]; }
    }
  }catch(e){ _zugErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(state.section==='zugaenge') render();
}

function tokenArt(t){
  if(t.observer) return 'Beobachter (FLZ)';
  if(t.is_admin) return 'Admin';
  if(t.is_master) return 'MasterToken';
  if(t.gast) return 'Gast (24 h)';
  if(t.single_use) return 'Einmalig';
  if(t.temporary) return '24 h';
  return 'Dauerhaft';
}
function tokenStatus(t){
  if(t.revoked) return '<span class="pill red">GESPERRT</span>';
  if(t.single_use && t.used_at) return '<span class="pill gray">verbraucht</span>';
  if(t.gast && t.expires_at && t.expires_at<=Date.now()) return '<span class="pill gray">abgelaufen</span>';
  if(t.gast && t.expires_at){
    var hrs=Math.max(0,Math.ceil((t.expires_at-Date.now())/3600000));
    return '<span class="pill green">aktiv · noch '+hrs+' h</span>';
  }
  return '<span class="pill green">aktiv</span>';
}
function tokenRows(list){
  var h='<div class="tablewrap"><table><thead><tr><th>Code</th><th>Art</th><th>Bezeichnung</th><th>Status</th><th></th></tr></thead><tbody>';
  list.forEach(function(t){
    h+='<tr>';
    h+='<td class="mono" style="font-weight:600;white-space:nowrap">'+esc(t.short_code||'—')+'</td>';
    h+='<td>'+esc(tokenArt(t))+'</td>';
    h+='<td>'+esc(t.label||'')+'</td>';
    h+='<td>'+tokenStatus(t)+'</td>';
    if(t.is_master){
      /* Selbstaussperrung verhindern: MasterToken-Zeilen sind hier NICHT sperrbar. */
      h+='<td class="hint">MasterToken — Sperrung nur direkt in der Datenbank</td>';
    }else if(!t.short_code){
      h+='<td></td>';
    }else if(t.revoked){
      h+='<td><button class="btn ghost" data-action="togglerevoke" data-sc="'+esc(t.short_code)+'" data-rev="1">Entsperren</button></td>';
    }else{
      var btnHtml='<div style="display:flex;gap:6px;flex-wrap:wrap">';
      if(t.gast && !t.revoked){
        btnHtml+='<button class="btn ghost" data-action="showgastqr" data-sc="'+esc(t.short_code)+'" data-lbl="'+esc(t.label||'')+'" title="QR anzeigen">QR</button>';
      }
      btnHtml+='<button class="btn warn" data-action="togglerevoke" data-sc="'+esc(t.short_code)+'" data-rev="0">Sperren</button>';
      btnHtml+='</div>';
      h+='<td>'+btnHtml+'</td>';
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function secZugaenge(){
  var h='<div class="mh"><h2>Zugänge</h2><span style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn ghost" data-action="provision">Schulungs-Präsidien anlegen/prüfen</button>'+
    '<button class="btn ghost" data-action="zugreload">↻ Aktualisieren</button></span></div>';
  /* Filter-/Sortier-Leiste (wirkt auf alle Karten; aktiver Filter klappt auf) */
  h+='<div class="card" style="padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  h+='<span class="hint" style="margin:0">Filter:</span>';
  h+=zugSel('art',[['alle','Alle Arten'],['dauerhaft','Dauerhaft'],['einmal','Einmalig'],['gast','Gast (24 h)'],['beobachter','Beobachter (FLZ)'],['admin','Admin'],['master','MasterToken']]);
  h+=zugSel('status',[['alle','Jeder Status'],['aktiv','aktiv'],['gesperrt','gesperrt'],['verbraucht','verbraucht'],['abgelaufen','abgelaufen']]);
  h+='<span class="hint" style="margin:0 0 0 8px">Sortierung:</span>';
  h+=zugSel('sort',[['neu','Neueste zuerst'],['alt','Älteste zuerst']]);
  if(zugFilterActive()) h+='<button class="btn ghost" data-action="zugfilterreset" style="margin-left:auto">✕ Filter zurücksetzen</button>';
  h+='</div>';
  if(_zugErr){
    h+='<div class="card" style="border-color:var(--t1)"><div style="color:var(--t1);font-weight:600">Abruf fehlgeschlagen</div><div class="hint" style="margin-top:4px">'+esc(_zugErr)+'</div></div>';
    return h;
  }
  if(_praes===null || _tokens===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
    return h;
  }
  if(!_praes.length){
    h+='<div class="card"><p class="hint" style="margin:0">Keine Präsidien angelegt.</p></div>';
  }
  var used={};
  _praes.forEach(function(p){
    var list=_tokens.filter(function(t){ return t.praesidium_id===p.id; });
    list.forEach(function(t){ used[t.short_code||('tok'+Math.random())]=true; });
    var shown=sortTokens(list.filter(tokenMatches));
    var nRev=list.filter(function(t){return t.revoked;}).length;
    var sum=zugFilterActive()
      ? shown.length+' von '+list.length+' Code'+(list.length===1?'':'s')
      : list.length+' Code'+(list.length===1?'':'s')+(nRev?' · '+nRev+' gesperrt':'');
    var key='zug-'+p.id;
    var open=zugFilterActive() || !isCollapsed(key, true);
    h+='<div class="card">';
    h+=foldHead(key, true, esc(p.name), sum, open);
    if(open){
      h+='<div class="hint" style="margin:8px 0 8px">Zugangs-Link erstellen &amp; kopieren:</div>';
      h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
      h+='<button class="btn ghost" data-action="mklink" data-pid="'+esc(p.id)+'" data-pname="'+esc(p.name)+'" data-kind="perm">Dauerhaft-Link</button>';
      h+='<button class="btn ghost" data-action="mklink" data-pid="'+esc(p.id)+'" data-pname="'+esc(p.name)+'" data-kind="once">Einmal-Link</button>';
      h+='<button class="btn ghost" data-action="mkgast" data-pid="'+esc(p.id)+'" data-pname="'+esc(p.name)+'">Gast-Code (24 h)</button>';
      h+='<button class="btn ghost" data-action="mkobserver" data-pid="'+esc(p.id)+'" data-pname="'+esc(p.name)+'">Beobachter-Zugang (FLZ)</button>';
      h+='<button class="btn ghost" data-action="mkadmin" data-pid="'+esc(p.id)+'" data-pname="'+esc(p.name)+'">Admin-Token</button>';
      if(p.schulung){
        h+='<button class="btn warn" data-action="mkreset" data-pid="'+esc(p.id)+'" data-pname="'+esc(p.name)+'" style="margin-left:auto">Übungs-Präsidium leeren</button>';
      }
      h+='</div>';
      h+= shown.length ? tokenRows(shown)
        : '<div class="hint">'+(list.length?'Keine Codes passend zum Filter.':'Noch keine Codes für dieses Präsidium.')+'</div>';
    }
    h+='</div>';
  });
  var rest=_tokens.filter(function(t){ return !_praes.some(function(p){return p.id===t.praesidium_id;}); });
  if(rest.length){
    var restShown=sortTokens(rest.filter(tokenMatches));
    var restOpen=zugFilterActive() || !isCollapsed('zug-rest', true);
    h+='<div class="card">';
    h+=foldHead('zug-rest', true, 'Weitere Zugänge',
      (zugFilterActive()? restShown.length+' von ':'')+rest.length+' Code'+(rest.length===1?'':'s'), restOpen);
    if(restOpen) h+='<div style="margin-top:8px">'+(restShown.length?tokenRows(restShown):'<div class="hint">Keine Codes passend zum Filter.</div>')+'</div>';
    h+='</div>';

/* Frist-Einstufung — 1:1 aus der Feld-App portiert (04.8-05, JSC 10/10):
 * 'abgelaufen' (Frist <= jetzt) · 'bald' (< 24 h entfernt) · 'ok' ·
 * null (keine Frist gesetzt). */
function fristStatus(purgeAfter, now){
  if(purgeAfter==null) return null;
  if(now==null) now=nowMs();
  if(+purgeAfter <= now) return 'abgelaufen';
  if(+purgeAfter - now < 86400000) return 'bald';
  return 'ok';
}

/* Gruppierung: ein Verbund (merge_group_id) = ein Einsatz. */
function einsatzGroups(){
  var groups={}, order=[];
  (_eins||[]).forEach(function(e){
    var k=e.merge_group_id || e.ccp_id || '?';
    if(!groups[k]){
      groups[k]={ key:k, ccp_id:e.ccp_id, kennungen:[], einsatz_typ:e.einsatz_typ,
        closed_at:e.closed_at, purge_after:e.purge_after, photo_purge_after:e.photo_purge_after,
        exported_at:e.exported_at||null,
        patient_count:0, photo_count:0, checklist_count:0 };
      order.push(k);
    }
    var g=groups[k];
    if(e.kennung && g.kennungen.indexOf(e.kennung)<0) g.kennungen.push(e.kennung);
    if(e.exported_at && (!g.exported_at || e.exported_at>g.exported_at)) g.exported_at=e.exported_at;
    g.patient_count+=(+e.patient_count||0);
    g.photo_count+=(+e.photo_count||0);
    g.checklist_count+=(+e.checklist_count||0);
    if(e.closed_at!=null && (g.closed_at==null || +e.closed_at>+g.closed_at)) g.closed_at=e.closed_at;
    if(e.purge_after!=null && (g.purge_after==null || +e.purge_after>+g.purge_after)) g.purge_after=e.purge_after;
    if(e.photo_purge_after!=null && (g.photo_purge_after==null || +e.photo_purge_after>+g.photo_purge_after)) g.photo_purge_after=e.photo_purge_after;
  });
  return { groups:groups, order:order };
}

  }else{
    h+='<div class="hint">Foto-Frist (endgültige Löschung): '+fmtMs(g.photo_purge_after)+'</div>';

  h+='<div class="hint" style="margin-top:4px">Fotos werden 72 Std nach Abschluss endgültig gelöscht — KEINE Verlängerung. Beweisbedarf: Sicherung durch die zuständige Stelle innerhalb der 72 Std.</div>';

  h+='<button class="btn" data-action="openproto" data-ccpid="'+esc(g.ccp_id)+'">Protokoll öffnen</button>';
  h+='<button class="btn ghost" data-action="extendfrist" data-ccpid="'+esc(g.ccp_id)+'" data-kennung="'+esc(g.kennungen.join(' + ')||'?')+'" data-frist="'+(+g.purge_after||0)+'">⏱ Protokoll-Frist +72 h verlängern (mit Begründung)</button>';
  h+='</div>';
  h+='</div>';
  return h;
}

function secEinsaetze(){
  if(_detail) return vProtokollDetail();
  var h='<div class="mh"><h2>Einsatzprotokolle</h2><button class="btn ghost" data-action="einsreload">↻ Aktualisieren</button></div>';
  h+='<div class="card"><div class="hint" style="margin:0">Jeder Aufruf eines Einsatzprotokolls wird mit Kürzel und Zeitpunkt protokolliert. Der Übergabe-Export beim Abschluss ist der dauerhafte Weg in die Trägerdokumentation — die Protokolle hier sind ein Durchgangsspeicher mit Löschfrist.</div></div>';
  if(_einsErr){
    h+='<div class="card" style="border-color:var(--t1)"><div style="color:var(--t1);font-weight:600">Abruf fehlgeschlagen</div><div class="hint" style="margin-top:4px">'+esc(_einsErr)+'</div></div>';
    return h;
  }
  if(_eins===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
    return h;
  }
  var gg=einsatzGroups();
  if(!gg.order.length){
    h+='<div class="card"><p class="hint" style="margin:0">Keine Einsatzprotokolle vorhanden.<br>Hier erscheinen Einsätze, sobald sie am Feldgerät abgeschlossen wurden (bis zum Ablauf ihrer Löschfrist).</p></div>';
    return h;
  }
  /* Wiedervorlage (D-09): abgelaufene oder < 24 h laufende Protokoll-Fristen oben. */
  var now=nowMs();
  var wieder=gg.order.filter(function(k){ var s=fristStatus(gg.groups[k].purge_after, now); return s==='abgelaufen'||s==='bald'; });
  var normal=gg.order.filter(function(k){ return wieder.indexOf(k)<0; });
  if(wieder.length){
    h+='<div class="wieder"><div class="wt">Wiedervorlage — Frist abgelaufen / läuft ab</div>';
    h+='<div class="hint" style="margin-bottom:10px">Frist nur mit Begründung verlängern oder Löschung geschehen lassen — der Übergabe-Export beim Abschluss ist der dauerhafte Weg.</div>';
    wieder.forEach(function(k){ h+=einsatzCard(gg.groups[k], now, true); });
    h+='</div>';
  }
  if(normal.length){
    if(wieder.length) h+='<div class="sech">Weitere Einsätze</div>';
    normal.forEach(function(k){ h+=einsatzCard(gg.groups[k], now, false); });
  }
  return h;
}

/* Übergabe-Export über die Leitung (Paket 2, 2026-06-13): JSON-Download der
 * Protokolldaten + Status exported_at (argus_mark_export, protokolliert als
 * 'protokoll_export'). Ersetzt den entfallenen Export-Schritt der Feld-App;
 * das Badge „noch nicht exportiert" in der Liste ist das Sicherheitsnetz
 * vor der 72-h-Löschung. */
async function exportProtokoll(){
  if(!_detail) return;
  var k=await ensureKuerzel();
  if(!k){ toast('Ohne Kürzel kein Export'); return; }
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var d=_detail.data||{};
  var kenn=(Array.isArray(d.ccps)?d.ccps:[]).map(function(c){return c.kennung||'?';}).join('+')||'CCP';
  var payload={ exportiert:new Date().toISOString(), quelle:'ARGUS Leitungs-Oberfläche',
    ccps:d.ccps||[], patients:d.patients||[], checklists:d.checklists||[] };
  try{
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='argus-uebergabe-CCP-'+kenn+'-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ toast('Export fehlgeschlagen'); return; }
  try{
    var r=await cl.rpc('argus_mark_export',{p_ccp_id:_detail.ccpId,p_kuerzel:k});
    if(!r.error){ toast('Übergabe-Export erstellt ✓ (protokolliert)'); loadEinsaetze(); }
    else toast('Export erstellt — Status konnte nicht gespeichert werden');
  }catch(e){ toast('Export erstellt — Status konnte nicht gespeichert werden'); }
}

async function openProtokoll(ccpId){
  var ok=await confirmModal('Jeder Aufruf eines Einsatzprotokolls wird protokolliert (Kürzel + Zeitpunkt). Fortfahren?','Fortfahren');
  if(!ok) return;
  var k=await ensureKuerzel();
  if(!k){ toast('Ohne Kürzel kein Protokoll-Abruf'); return; }
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  toast('Lade Einsatzprotokoll…');
  var r;
  try{ r=await cl.rpc('argus_governance_protokoll',{p_ccp_id:ccpId,p_kuerzel:k}); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error){ toast('Abruf fehlgeschlagen: '+(r.error.message||'keine Verbindung')); return; }
  _detail={ ccpId:ccpId, data:r.data||{} };
  render();
}

function vitCompact(v){
  if(!v || typeof v!=='object') return '—';
  var parts=[];
  [['af','AF'],['hf','HF'],['rr','RR'],['spo2','SpO2'],['avpu','AVPU'],['pain','Schmerz']].forEach(function(f){
    var val=v[f[0]];
    if(val!=null && String(val).trim()!=='') parts.push(f[1]+' '+esc(String(val)));
  });
  return parts.length ? parts.join(' · ') : '—';
}
function injCompact(p){
  var parts=[];
  if(Array.isArray(p.inj)) p.inj.forEach(function(i){ if(i && (i.r||i.a)) parts.push(esc(String(i.r||'?'))+': '+esc(String(i.a||'?'))); });
  if(p.injury && String(p.injury).trim()!=='') parts.push(esc(String(p.injury)));
  return parts.length ? parts.join(' · ') : '—';
}
function patStatusLabel(s){
  if(s==='gpa') return 'abtransportiert (gPA)';
  if(s==='active') return 'aktiv';
  return s ? esc(String(s)) : '—';
}

/* AT-MIST-Druckansicht (Paket 3): druckbare Karten je Patient aus dem bereits
 * geladenen Protokoll (_detail.data.patients) — KEIN API-Aufruf, KEINE Fotos
 * (argus_governance_protokoll liefert ohnehin kein photo-Feld, nur has_photo).
 * Vorlage: exportPrintCard der Feld-App; fehlende Helper (fmtDur/ageStr/pno/
 * Maßnahmen-Labels) als Inline-Varianten portiert. */
function vAtmistPrint(){
  var d=_detail && _detail.data;
  if(!d) return;
  var pats=Array.isArray(d.patients)?d.patients:[];
  if(!pats.length){ toast('Keine Patientendaten (mehr) vorhanden.'); return; }
  var ccps=Array.isArray(d.ccps)?d.ccps:[];
  var kenn=ccps.map(function(c){return c.kennung||'?';}).sort().join(', ')||'?';
  /* row()-Helper — 1:1 aus exportPrintCard der Feld-App */
  function row(letter,label,val){
    return '<div style="display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line)">'+
      '<span class="mono" style="width:22px;height:22px;border-radius:6px;background:var(--acc);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+letter+'</span>'+
      '<div style="flex:1;min-width:0"><div style="font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700">'+label+'</div>'+
      '<div style="font-size:13.5px;line-height:1.4">'+val+'</div></div></div>';
  }
  /* Inline-Helper (in der Leitungs-Seite nicht vorhanden — bewusst lokal) */
  function pno(p){ return esc(String(p.num!=null?p.num:'?'))+(p.ccp?' <span style="font-size:13px;color:var(--mut)">('+esc(String(p.ccp))+')</span>':''); }
  function fmtDur(ms){
    if(ms==null||ms<0) return '—';
    var m=Math.floor(ms/60000);
    return (m>=60?Math.floor(m/60)+' h ':'')+(m%60)+' min';
  }
  function ageStr(ms){
    if(!ms) return '—';
    return new Date(+ms).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';
  }
  /* Maßnahmen-Labels der Feld-App (TXG flach): p.tx ist ein Objekt {feldId:true} */
  var TXL={seiten:'Seitenlage',wendl:'Wendl/Güdel',larynx:'Larynxtubus',intub:'ET-Intubation',konio:'Koniotomie',
    chest:'Chest Seal',entlast:'Entlastungspkt.',drainage:'Thoraxdrainage',
    druck:'Druckverband',tampon:'Tamponade',haemo:'Hämostatikum',becken:'Beckenschlinge',zugang:'i.v./i.o.',
    txa:'TXA',medo:'Meds andere',waerme:'Wärmeerhalt',schiene:'Schienung',hws:'HWS-Immo.'};
  var now=nowMs();
  /* TQ-Referenzzeitpunkt je CCP: das Protokoll existiert nur für ABGESCHLOSSENE
   * Einsätze und kann Tage später gedruckt werden — "now - tq_start" wäre dann
   * medizinisch irreführend ("TQ seit 53 h"). Referenz ist daher closed_at des
   * zugehörigen CCP (Fallback now, falls die Row unerwartet offen wäre). */
  var ccpClose={}; ccps.forEach(function(c){ if(c&&c.id&&c.closed_at)ccpClose[c.id]=+c.closed_at; });
  var h='<div style="padding:12px"><div style="font-weight:700;font-size:15px;margin-bottom:2px">AT-MIST · CCP '+esc(kenn)+'</div>';
  h+='<div style="font-size:11.5px;color:var(--mut);margin-bottom:10px">Einsatzprotokoll · gedruckt '+new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr · '+pats.length+' Patient(en) · ohne Fotos</div>';
  pats.slice().sort(function(a,b){ return (+a.num||0)-(+b.num||0); }).forEach(function(p){
    var c=CATS[p.cat]||null;
    var dim='<span style="color:#9aa0a6;font-style:italic">— nicht erfasst</span>';
    var ap=[]; if(p.age)ap.push(esc(String(p.age))+' J');
    var g=p.gender==='m'?'männl.':(p.gender==='w'?'weibl.':''); if(g)ap.push(g);
    var tp=[];
    /* tq_start: snake_case — Protokoll-Rows kommen roh aus der DB (to_jsonb),
     * NICHT aus dem normalisierten Feld-App-Modell (dort hieße es tqStart).
     * Dauer bis Einsatzende (closed_at), plus absolute Anlagezeit. */
    var tqRef=ccpClose[p.ccp_id]||now;
    if(p.tq_start)tp.push('<b style="color:var(--t1)">TQ angelegt '+ageStr(p.tq_start)+' · '+fmtDur(tqRef-p.tq_start)+' bis Einsatzende</b>');
    if(p.created)tp.push('erfasst '+ageStr(p.created));
    var il=[];
    if(Array.isArray(p.inj))p.inj.forEach(function(it){ if(it)il.push(esc(String(it.r||'?'))+' – '+esc(String(it.a||'?'))); });
    if(p.injury&&String(p.injury).trim())il.push(esc(String(p.injury)));
    var v=(p.vit&&typeof p.vit==='object')?p.vit:{};
    var vp=[['WASB',v.avpu],['AF',v.af],['SpO₂',v.spo2],['HF',v.hf],['RR',v.rr],['Schmerz',v.pain]]
      .filter(function(x){return x[1]!=null&&String(x[1]).trim()!=='';});
    var sVal=vp.length?('<span class="mono">'+vp.map(function(x){return x[0]+' '+esc(String(x[1]));}).join(' · ')+'</span>'):dim;
    if(p.allergies)sVal+='<br><b style="color:var(--t1)">⚠ Allergien: '+esc(String(p.allergies))+'</b>';
    var vlog=Array.isArray(v.log)?v.log:[];
    if(vlog.length){
      /* filter(Boolean): ein null-Eintrag im gemeinsam geschriebenen jsonb-Log
       * darf nicht den gesamten Druck per TypeError abbrechen. */
      sVal+='<div style="margin-top:4px;font-size:11.5px;color:var(--mut)">Verlauf:'+vlog.filter(Boolean).map(function(m){
        var tm=(m&&m.t)?new Date(+m.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'—';
        var parts=[]; if(m.af)parts.push('AF '+esc(String(m.af))); if(m.spo2)parts.push('SpO₂ '+esc(String(m.spo2)));
        if(m.hf)parts.push('HF '+esc(String(m.hf))); if(m.rr)parts.push('RR '+esc(String(m.rr)));
        if(m.avpu)parts.push('WASB '+esc(String(m.avpu))); if(m.pain)parts.push('Schmerz '+esc(String(m.pain)));
        return '<br>'+tm+': '+(parts.join(' · ')||'—');
      }).join('')+'</div>';
    }
    var tl=[]; if(p.tq_start)tl.push('Tourniquet · angelegt '+ageStr(p.tq_start));
    if(p.tx&&typeof p.tx==='object'){
      Object.keys(TXL).forEach(function(k){ if(p.tx[k])tl.push(esc(TXL[k])); });
    }
    h+='<div class="card" style="padding:10px 13px;margin-bottom:10px;page-break-inside:avoid">';
    h+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
       '<span class="mono" style="font-size:18px;font-weight:700">'+pno(p)+'</span>'+
       (c?'<span class="pill" style="background:'+c.bg+';color:'+c.fg+'">'+c.label+'</span>':'<span class="pill gray">'+esc(String(p.cat||'—'))+'</span>')+
       (p.prio?'<span class="pill" style="background:var(--prio);color:#fff">PRIO</span>':'')+
       (p.status==='gpa'?'<span class="pill gray">gPA</span>':'')+
       (p.name&&String(p.name).trim()!==''?'<span style="font-size:12.5px;color:var(--mut)">Name: '+esc(String(p.name))+'</span>':'')+
       '</div>';
    h+='<div style="margin-top:6px">';
    h+=row('A','Alter / Geschlecht', ap.length?ap.join(' · '):dim);
    h+=row('T','Zeiten', tp.length?tp.join(' · '):dim);
    h+=row('M','Mechanismus', (p.moi&&String(p.moi).trim()!=='')?esc(String(p.moi)):dim);
    h+=row('I','Verletzungen', il.length?il.join('<br>'):dim);
    h+=row('S','Befund / Vitalwerte', sVal);
    h+=row('T','Maßnahmen', tl.length?tl.map(function(x){return '▸ '+x;}).join('<br>'):dim);
    h+='</div></div>';
  });
  h+='</div>';
  var overlay=document.getElementById('atmist-print-overlay');
  if(!overlay){ overlay=document.createElement('div'); overlay.id='atmist-print-overlay'; document.body.appendChild(overlay); }
  overlay.innerHTML=h;
  document.body.setAttribute('data-atmist-print','1');
  /* Cleanup erst NACH dem Druck-Snapshot: auf nicht-blockierenden Browsern
   * (iOS/iPadOS Safari) laeuft das Skript hinter window.print() sofort weiter —
   * direktes Entfernen des Attributs druckte die normale Protokollansicht.
   * Daher einmaliger afterprint-Listener; Fallback-Timeout fuer Browser ohne
   * afterprint; try/catch, damit das Attribut bei werfendem print() nicht
   * dauerhaft gesetzt bleibt. */
  var cleaned=false;
  function atmistCleanup(){
    if(cleaned)return; cleaned=true;
    try{ window.removeEventListener('afterprint',atmistCleanup); }catch(e){}
    document.body.removeAttribute('data-atmist-print');
    overlay.innerHTML='';
  }
  window.addEventListener('afterprint',atmistCleanup);
  setTimeout(atmistCleanup,60000);
  try{ window.print(); }
  catch(e){ atmistCleanup(); }
}

/* Foto-Einzelabruf (Lazy-Load, eigener Protokoll-Eintrag foto_view) */
async function showFoto(pid, num){
  var k=await ensureKuerzel();
  if(!k){ toast('Ohne Kürzel kein Foto-Abruf'); return; }
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var r;
  try{ r=await cl.rpc('argus_governance_photo',{p_patient_id:pid,p_kuerzel:k}); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error){ toast('Foto-Abruf fehlgeschlagen: '+(r.error.message||'keine Verbindung')); return; }
  var photo=r.data && r.data.photo;
  if(!photo){ toast('Kein Foto vorhanden — bereits endgültig gelöscht?'); return; }
  /* Sicherheit (Stored-XSS-Härtung): photo ist ein von Feldgeräten geschriebener
   * DB-Wert. Nur strikte data:image-Base64-URIs zulassen und NIE per innerHTML
   * einsetzen (Attribut-Breakout) — Element per DOM bauen, src als Property. */
  if(typeof photo!=='string' || !/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=\s]+$/i.test(photo)){
    toast('Ungültiges Bildformat — Anzeige abgebrochen.'); return;
  }
  var ts=new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:12px;cursor:pointer';
  var img=document.createElement('img');
  img.alt='Patientenfoto';
  img.style.cssText='max-width:100%;max-height:78%;object-fit:contain;border-radius:8px';
  img.src=photo;   /* validiert; als Property gesetzt → kein HTML-Parsing */
  ov.appendChild(img);
  var cap=document.createElement('div');
  cap.style.cssText='color:#cfd6df;font-size:12.5px;text-align:center;max-width:480px';
  cap.textContent='Patient Nr. '+(num||'?')+' · Dieser Abruf wurde protokolliert ('+k+', '+ts+' Uhr).';
  ov.appendChild(cap);
  var xbtn=document.createElement('div');
  xbtn.style.cssText='position:absolute;top:12px;right:16px;color:#fff;font-size:30px;line-height:1;font-weight:300';
  xbtn.textContent='✕';
  ov.appendChild(xbtn);
  document.body.appendChild(ov);
  ov.addEventListener('click',function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); });
}

/* Protokoll-Frist +72 h (D-03): Pflicht-Begründung mit Leer-Abweisung,
 * Bestätigung mit Frist-Vorschau + Export-Hinweis, wirkt auf den Verbund. */
async function extendFrist(ccpId, kennung, frist){
  var k=await ensureKuerzel();
  if(!k){ toast('Ohne Kürzel keine Verlängerung'); return; }
  var grund=null, msg='Begründung (Pflicht): Warum muss das Einsatzprotokoll über die Frist hinaus aufbewahrt werden?';
  for(;;){
    var inp=await promptModal(msg,'');
    if(inp===null) return;   /* abgebrochen */
    if(inp.trim()){ grund=inp.trim(); break; }
    msg='Begründung darf nicht leer sein — bitte den Grund angeben (Pflichtfeld):';
  }
  var neu=Math.max(nowMs(), +frist||0)+72*3600000;   /* Vorschau — verbindlich rechnet der Server identisch */
  var ok=await confirmModal('Protokoll-Frist für CCP '+kennung+' um 72 Std verlängern — neue Frist: '+fmtMs(neu)+'. Die Foto-Frist bleibt unverändert (Fotos werden nicht verlängert). Bei dauerhaftem Bedarf: Export an die zuständige Stelle statt wiederholter Verlängerung.','+72 h verlängern');
  if(!ok) return;
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var r;
  try{ r=await cl.rpc('argus_extend_protokoll_frist',{p_ccp_id:ccpId,p_kuerzel:k,p_grund:grund,p_stunden:72}); }
  catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error){ toast('Verlängerung fehlgeschlagen: '+(r.error.message||'keine Verbindung')); return; }
  var nf=r.data && r.data.purge_after;
  toast('Frist verlängert'+(nf?' — bis '+fmtMs(nf):''));
  loadEinsaetze();
}

async function doMkPerson(){
  var cl=sb(); if(!cl){ toast('Sitzung abgelaufen — bitte neu anmelden.'); return; }
  var usbnkEl=document.getElementById('pers-usbnk');
  var rolleEl=document.getElementById('pers-rolle');
  var praesEl=document.getElementById('pers-praes');
  var labelEl=document.getElementById('pers-label');
  var usbnk=(usbnkEl?usbnkEl.value:'').trim().toUpperCase();
  var rolle=(rolleEl?rolleEl.value:'flz');
  var praesId=(praesEl?praesEl.value:'')||null;
  var lbl=(labelEl?labelEl.value:'').trim();
  if(!usbnk){ toast('USBNK ist erforderlich (D-02).'); return; }
  if((rolle==='admin' || rolle==='normal') && !praesId){ toast('Für diese Rolle ist ein Präsidium erforderlich.'); return; }
  var r;
  try{
    r=await cl.rpc('argus_master_issue_person',{
      p_usbnk: usbnk,
      p_role: rolle,
      p_praesidium_id: praesId||null,
      p_label: lbl||null
    });
  }catch(e){ r={error:{message:'keine Verbindung'}}; }
  if(r.error||!r.data||!r.data.short_code){
    toast('Fehler: '+(r.error?r.error.message:(r.data&&r.data.error?r.data.error:'unbekannt')));
    return;
  }
  var sc=r.data.short_code;
  try{ await navigator.clipboard.writeText(sc); }catch(e){}
  await promptModal('Token ausgegeben (protokolliert in Audit-Log).\nUSBNK: '+usbnk+'\nRolle: '+rolleLabel(rolle)+'\n\nKurz-Code zum Weitergeben (kopieren):', sc);
  toast('Token ausgegeben — Audit-Log-Eintrag person_issue erstellt.');
  /* Felder zurücksetzen */
  if(usbnkEl) usbnkEl.value='';
  if(labelEl) labelEl.value='';
}

    h+=' · '+auditActionLabel(l.action);
    if(ziel) h+=' · '+ziel;
    h+='</div>';
    if(l.detail){
      h+='<div class="hint" style="margin-top:2px">'+esc(l.detail)+'</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  return h;
}

/* ── Bereich „Protokoll" (D-13): governance_log + purge_log ─────
 * Reine Anzeige — Zugriffe/Verlängerungen und Lösch-Läufe (inhaltsfrei). */
var _glog=null, _glogErr=null, _plog=null, _plogErr=null;
/* Filter-Zustand für die Protokoll-Ansicht (Plan 04.14-03, Task 3B) */
var _glogFilter={action:'alle', kuerzel:''};

async function loadProtokoll(){
  _glog=null; _glogErr=null; _plog=null; _plogErr=null;
  if(state.section==='protokoll') render();
  var cl=sb();
  if(!cl){ _glogErr='Sitzung abgelaufen — bitte neu anmelden.'; if(state.section==='protokoll') render(); return; }
  try{
    var lg=await cl.from('governance_log')
      .select('at,ccp_id,patient_id,kuerzel,action,begruendung,neue_frist')
      .order('at',{ascending:false}).limit(200);
    if(lg.error){ _glogErr=lg.error.message||'Protokoll nicht lesbar'; }
    else{ _glog=lg.data||[]; }
    var pg=await cl.from('purge_log')
      .select('at,ccp_id,kennung,reason,patient_count,photo_count,checklist_count')
      .order('at',{ascending:false}).limit(100);
    if(pg.error){ _plogErr=pg.error.message||'Lösch-Protokoll nicht lesbar'; }
    else{ _plog=pg.data||[]; }
  }catch(e){ _glogErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(state.section==='protokoll') render();
}

function actionLabel(a){
  if(a==='foto_view') return 'Foto-Abruf';
  if(a==='protokoll_view') return 'Einsatzprotokoll-Aufruf';
  if(a==='frist_verlaengert') return 'Frist verlängert';
  if(a==='lage_view') return 'Lageansicht-Login (FLZ)';
  if(a==='gast_join') return 'Gast-Code eingelöst';
  if(a==='protokoll_export') return 'Protokoll exportiert';
  /* Plan 04.14-01/03: Admin-Aktionen */
  if(a==='admin_login') return 'Admin-Login';
  if(a==='admin_gast_issue') return 'Admin: Gast-Code ausgegeben';
  if(a==='admin_gast_revoke') return 'Admin: Gast-Code gesperrt';
  return a ? esc(String(a)) : '?';
}
function purgeReasonLabel(r){
  if(r==='frist') return 'Frist abgelaufen';
  if(r==='inaktiv') return 'Inaktivität';
  if(r==='foto_72h') return 'Foto-72-h-Löschung';
  return r ? esc(String(r)) : '?';
}

function secProtokoll(){
  var h='<div class="mh"><h2>Protokoll</h2><button class="btn ghost" data-action="protoreload">↻ Aktualisieren</button></div>';

  /* ── Filter-Leiste (Plan 04.14-03, Task 3B) ── */
  var GLOG_ACTIONS=[
    ['alle','Alle Aktionen'],
    ['protokoll_view','Einsatzprotokoll-Aufruf'],
    ['foto_view','Foto-Abruf'],
    ['frist_verlaengert','Frist verlängert'],
    ['protokoll_export','Protokoll exportiert'],
    ['lage_view','Lageansicht-Login (FLZ)'],
    ['gast_join','Gast-Code eingelöst'],
    ['admin_login','Admin-Login'],
    ['admin_gast_issue','Admin: Gast-Code ausgegeben'],
    ['admin_gast_revoke','Admin: Gast-Code gesperrt']
  ];
  h+='<div class="card" style="padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:0">';
  h+='<span class="hint" style="margin:0">Filter:</span>';
  h+='<select data-action="glogfilter" data-field="action">';
  GLOG_ACTIONS.forEach(function(o){
    h+='<option value="'+o[0]+'"'+(_glogFilter.action===o[0]?' selected':'')+'>'+o[1]+'</option>';
  });
  h+='</select>';
  h+='<input type="text" placeholder="Kürzel…" value="'+esc(_glogFilter.kuerzel)+'" data-action="glogfilter" data-field="kuerzel" style="width:120px;padding:6px 9px;font-size:13px">';
  if(_glogFilter.action!=='alle'||_glogFilter.kuerzel){
    h+='<button class="btn ghost" data-action="glogfilterreset" style="margin-left:auto">✕ Filter zurücksetzen</button>';
  }
  h+='</div>';

  /* Zugriffe & Verlängerungen */
  var glogOpen=!isCollapsed('proto-glog', false);
  /* Gefilterte Liste */
  var glogShown=(_glog||[]).filter(function(l){
    if(_glogFilter.action!=='alle' && l.action!==_glogFilter.action) return false;
    if(_glogFilter.kuerzel && !(l.kuerzel||'').toLowerCase().includes(_glogFilter.kuerzel.toLowerCase())) return false;
    return true;
  });
  var filterActive=_glogFilter.action!=='alle'||!!_glogFilter.kuerzel;
  var glogLabel='Zugriffe &amp; Verlängerungen'+(
    _glog ? (filterActive ? ' ('+glogShown.length+' von '+_glog.length+')' : ' ('+_glog.length+')') : ''
  );
  h+='<div class="sech fold'+(glogOpen?' open':'')+'" style="margin-top:14px" data-action="togglecard" data-key="proto-glog" data-def="0"><span class="chev">▶</span>'+glogLabel+'</div>';
  if(!glogOpen){
    /* zugeklappt */
  }else if(_glogErr){
    h+='<div class="card" style="border-color:var(--t1)"><div class="hint" style="color:var(--t1)">'+esc(_glogErr)+'</div></div>';
  }else if(_glog===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
  }else if(!glogShown.length){
    h+='<div class="card"><p class="hint" style="margin:0">'+(filterActive?'Keine Einträge passend zum Filter.':'Noch keine Einträge.<br>Hier erscheint jeder Einsatzprotokoll-Aufruf, jeder Foto-Abruf und jede Frist-Verlängerung (Kürzel + Zeitpunkt).')+'</p></div>';
  }else{
    h+='<div class="card">';
    glogShown.forEach(function(l){
      var subj='';
      if(l.patient_id!=null) subj='Patient '+esc(String(l.patient_id).slice(0,10))+'…';
      if(l.ccp_id) subj+=(subj?' · ':'')+'CCP '+esc(String(l.ccp_id).slice(0,8))+'…';
      h+='<div style="padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px">';
      h+='<div><span class="mono">'+fmtMs(l.at)+'</span> · <b>'+esc(l.kuerzel||'—')+'</b> · '+actionLabel(l.action)+(subj?' · '+subj:'')+'</div>';
      if(l.action==='frist_verlaengert'){
        h+='<div class="hint" style="margin-top:2px">Begründung: '+esc(l.begruendung||'—')+(l.neue_frist!=null?' · neue Frist: '+fmtMs(l.neue_frist):'')+'</div>';
      }
      h+='</div>';
    });
    h+='</div>';
  }
  /* Lösch-Läufe (inhaltsfrei) */
  var plogOpen=!isCollapsed('proto-plog', false);
  h+='<div class="sech fold'+(plogOpen?' open':'')+'" data-action="togglecard" data-key="proto-plog" data-def="0"><span class="chev">▶</span>Lösch-Läufe'+(_plog?' ('+_plog.length+')':'')+'</div>';
  if(!plogOpen){
    /* zugeklappt */
  }else if(_plogErr){
    h+='<div class="card" style="border-color:var(--t1)"><div class="hint" style="color:var(--t1)">'+esc(_plogErr)+'</div></div>';
  }else if(_plog===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
  }else if(!_plog.length){
    h+='<div class="card"><p class="hint" style="margin:0">Noch keine Lösch-Läufe.<br>Hier wird jede automatische Löschung dokumentiert (Zeitpunkt, Kennung, Grund, Zähler) — ohne Inhalte.</p></div>';
  }else{
    h+='<div class="tablewrap"><table><thead><tr><th>Zeitpunkt</th><th>CCP</th><th>Grund</th><th>Patienten</th><th>Fotos</th><th>Checklisten</th></tr></thead><tbody>';
    _plog.forEach(function(l){
      h+='<tr>';
      h+='<td class="mono" style="white-space:nowrap">'+fmtIso(l.at)+'</td>';
      h+='<td class="mono">'+esc(l.kennung||'—')+'</td>';
      h+='<td>'+purgeReasonLabel(l.reason)+'</td>';
      h+='<td>'+esc(String(l.patient_count!=null?l.patient_count:'—'))+'</td>';
      h+='<td>'+esc(String(l.photo_count!=null?l.photo_count:'—'))+'</td>';
      h+='<td>'+esc(String(l.checklist_count!=null?l.checklist_count:'—'))+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  }
  return h;
}

/* ── Bereich „Admin-Lage" (Plan 04.14-02, Admin-Pfad) ─────────────
 * Anonyme Lage des eigenen Präsidiums via argus_lage() (kein Parameter —
 * der RPC liest admin_praesidium_id() aus dem JWT). Render-Muster wie
 * docs/lage-*.html: Summen-Kacheln + CCP-Karten in Triage-Farben.
 * Auto-Refresh alle 20 s; Intervall beim Bereichswechsel/Logout sauber clearen. */
var _adminLageData=null, _adminLageErr=null, _adminLageTimer=null;

function secAdminLage(){
  var pname=esc(sessionStorage.getItem('argusl_padmin_name')||'');
  var h='<div class="mh"><h2>Lage — '+pname+'</h2>';
  h+='<button class="btn ghost" data-action="adminlagereload">↻ Aktualisieren</button></div>';
  if(_adminLageErr){
    h+='<div class="card" style="border-color:var(--t1)"><div style="color:var(--t1);font-weight:600">Abruf fehlgeschlagen</div>';
    h+='<div class="hint" style="margin-top:4px">'+esc(_adminLageErr)+'</div></div>';
    return h;
  }
  if(_adminLageData===null){
    h+='<div class="card"><p class="hint" style="margin:0">Wird geladen…</p></div>';
    return h;
  }
  var ccps=Array.isArray(_adminLageData.ccps) ? _adminLageData.ccps : [];
  var stand=_adminLageData.stand ? fmtMs(_adminLageData.stand) : '—';
  h+='<div class="hint" style="margin-bottom:10px">Stand: '+stand+'</div>';
  if(!ccps.length){
    h+='<div class="card"><p class="hint" style="margin:0">Keine aktiven CCPs in diesem Präsidium.</p></div>';
    return h;
  }
  /* Summen-Zeile */
  var s={t1:0,t2:0,t3:0,t5:0,gpa:0,prio:0,ready:0};
  ccps.forEach(function(c){
    s.t1+=(+c.t1||0); s.t2+=(+c.t2||0); s.t3+=(+c.t3||0); s.t5+=(+c.t5||0);
    s.gpa+=(+c.gpa||0); s.prio+=(+c.prio||0); s.ready+=(+c.ready||0);
  });
  var pat=s.t1+s.t2+s.t3+s.t5+s.gpa;
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">';
  h+='<div class="card" style="padding:9px 14px;flex:1;min-width:90px;text-align:center"><div style="font-family:var(--mono);font-weight:700;font-size:20px">'+ccps.length+'</div><div class="hint">aktive CCPs</div></div>';
  h+='<div class="card" style="padding:9px 14px;flex:1;min-width:90px;text-align:center"><div style="font-family:var(--mono);font-weight:700;font-size:20px">'+pat+'</div><div class="hint">Patienten</div></div>';
  h+='<div class="card" style="padding:9px 14px;flex:1;min-width:90px;text-align:center"><div style="font-family:var(--mono);font-weight:700;font-size:20px;color:var(--t1)">'+s.t1+'</div><div class="hint">T-1</div></div>';
  h+='<div class="card" style="padding:9px 14px;flex:1;min-width:90px;text-align:center"><div style="font-family:var(--mono);font-weight:700;font-size:20px;color:var(--prio)">'+s.prio+'</div><div class="hint">Prio-Transport</div></div>';
  h+='<div class="card" style="padding:9px 14px;flex:1;min-width:90px;text-align:center"><div style="font-family:var(--mono);font-weight:700;font-size:20px;color:var(--mut)">'+s.gpa+'</div><div class="hint">gPA</div></div>';
  h+='</div>';
  /* CCP-Karten */
  ccps.forEach(function(c){
    var total=(+c.t1||0)+(+c.t2||0)+(+c.t3||0)+(+c.t5||0)+(+c.gpa||0);
    h+='<div class="card" style="margin-bottom:10px">';
    h+='<div style="font-weight:600;font-size:14px;margin-bottom:8px">CCP '+esc(c.kennung||'?')+(c.ort?' · '+esc(c.ort):'')+' <span class="hint" style="font-weight:400;font-size:12px">'+total+' Pat.</span></div>';
    h+='<div style="display:flex;gap:4px;margin-bottom:8px">';
    h+='<div style="flex:1;border-radius:6px;text-align:center;background:var(--t1);color:#fff;padding:5px 0"><div style="font-family:var(--mono);font-weight:700;font-size:15px;line-height:1">'+(+c.t1||0)+'</div><div style="font-size:9px;opacity:.95">T1</div></div>';
    h+='<div style="flex:1;border-radius:6px;text-align:center;background:var(--t2);color:#3A2C00;padding:5px 0"><div style="font-family:var(--mono);font-weight:700;font-size:15px;line-height:1">'+(+c.t2||0)+'</div><div style="font-size:9px;opacity:.95">T2</div></div>';
    h+='<div style="flex:1;border-radius:6px;text-align:center;background:var(--t3);color:#fff;padding:5px 0"><div style="font-family:var(--mono);font-weight:700;font-size:15px;line-height:1">'+(+c.t3||0)+'</div><div style="font-size:9px;opacity:.95">T3</div></div>';
    h+='<div style="flex:1;border-radius:6px;text-align:center;background:var(--t5);border:1px solid var(--t5b);color:#fff;padding:5px 0"><div style="font-family:var(--mono);font-weight:700;font-size:15px;line-height:1">'+(+c.t5||0)+'</div><div style="font-size:9px;opacity:.95">T5</div></div>';
    h+='</div>';
    h+='<div class="hint">Prio-Transport <b>'+(+c.prio||0)+'</b> · transportfertig <b>'+(+c.ready||0)+'</b> · gPA <b>'+(+c.gpa||0)+'</b></div>';
    h+='</div>';
  });
  h+='<p class="hint">Anonyme Übersichtszahlen — keine Patientendetails, keine Namen/Fotos. Aktualisiert sich automatisch alle 20 s.</p>';
  return h;
}
async function loadAdminLage(){
  _adminLageData=null; _adminLageErr=null;
  if(state.section==='admin-lage') render();
  /* Auto-Refresh starten (Intervall sauber clearen falls schon läuft) */
  if(_adminLageTimer){ clearInterval(_adminLageTimer); _adminLageTimer=null; }
  await _doAdminLagePoll();
  _adminLageTimer=setInterval(_doAdminLagePoll, 20000);
}
async function _doAdminLagePoll(){
  var cl=sb();
  if(!cl){
    _adminLageErr='Sitzung abgelaufen — bitte neu anmelden.';
    if(state.section==='admin-lage') render();
    if(_adminLageTimer){ clearInterval(_adminLageTimer); _adminLageTimer=null; }
    return;
  }
  try{
    var r=await cl.rpc('argus_lage');
    if(r.error){ _adminLageErr=r.error.message||'Abruf fehlgeschlagen'; }
    else{ _adminLageData=r.data||null; _adminLageErr=null; }
  }catch(e){ _adminLageErr='Abruf fehlgeschlagen — keine Verbindung?'; }
  if(state.section==='admin-lage') render();
}
/* Intervall beim Bereichswechsel/Logout sauber clearen */
function clearAdminLageTimer(){
  if(_adminLageTimer){ clearInterval(_adminLageTimer); _adminLageTimer=null; }
}

/* ── Klick-Dispatcher ──────────────────────────────────────────── */
document.addEventListener('click', async function(e){
  var nav=e.target.closest('[data-nav]');
  if(nav){
    clearAdminLageTimer();   /* Lage-Intervall beim Bereichswechsel sauber clearen */
    state.section=nav.getAttribute('data-nav');
    _detail=null;   /* geöffnetes Protokoll beim Bereichswechsel schließen */
    render(); loadSection();
    return;
  }
  var el=e.target.closest('[data-action]');
  if(!el) return;
  var a=el.getAttribute('data-action');
  if(a==='logout'){ clearAdminLageTimer(); doLogout(); return; }
  if(a==='login'){ var li=$('logininp'); await doLogin(li?li.value:''); return; }
  if(a==='pastetoken'){
    var pi=$('logininp');
    try{
      var txt=await navigator.clipboard.readText();
      if(pi) pi.value=(txt||'').trim();
      await doLogin(txt||'');
    }catch(err){ setLoginError('Zwischenablage nicht lesbar — bitte Token eintippen.'); }
    return;
  }
  if(a==='zugreload'){ loadZugaenge(); return; }
  if(a==='togglecard'){ toggleCard(el.getAttribute('data-key'), el.getAttribute('data-def')==='1'); return; }
  if(a==='zugfilterreset'){ _zugFilter={art:'alle',status:'alle',sort:_zugFilter.sort}; render(); return; }
  if(a==='mklink'){
    await makeLink(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'', el.getAttribute('data-kind'));
    return;
  }
  if(a==='mkobserver'){
    await makeObserver(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'');
    return;
  }
  if(a==='mkgast'){
    await makeGast(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'');
    return;
  }
  if(a==='provision'){ await makeProvision(); return; }
  if(a==='protoexport'){ await exportProtokoll(); return; }
  if(a==='protoprint'){ window.print(); return; }
  if(a==='atmistprint'){ vAtmistPrint(); return; }
  if(a==='togglerevoke'){
    await toggleRevoke(el.getAttribute('data-sc'), el.getAttribute('data-rev')==='1');
    return;
  }
  if(a==='einsreload'){ _detail=null; loadEinsaetze(); return; }
  if(a==='openproto'){ await openProtokoll(el.getAttribute('data-ccpid')); return; }
  if(a==='closeproto'){ _detail=null; render(); return; }
  if(a==='protophoto'){ await showFoto(el.getAttribute('data-pid'), el.getAttribute('data-num')); return; }
  if(a==='extendfrist'){
    await extendFrist(el.getAttribute('data-ccpid'), el.getAttribute('data-kennung')||'?', el.getAttribute('data-frist'));
    return;
  }
  if(a==='protoreload'){ loadProtokoll(); return; }
  if(a==='mkadmin'){
    await makeAdmin(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'');
    return;
  }
  if(a==='mkadmingast'){ await makeAdminGast(); return; }
  if(a==='adminrevoke'){
    await makeAdminRevoke(el.getAttribute('data-sc'));
    return;
  }
  if(a==='adminlagereload'){
    _adminLageData=null; _adminLageErr=null;
    if(state.section==='admin-lage') render();
    await _doAdminLagePoll();
    return;
  }
  /* Plan 04.14-03: neue Aktionen */
  if(a==='mkreset'){
    await makeReset(el.getAttribute('data-pid'), el.getAttribute('data-pname')||'');
    return;
  }
  if(a==='showgastqr'){
    showGastQrModal(el.getAttribute('data-sc'), el.getAttribute('data-lbl')||'');
    return;
  }
  if(a==='glogfilterreset'){
    _glogFilter={action:'alle',kuerzel:''};
    render();
    return;
  }
  /* ── Identitäten-Aktionen (Plan 05-03) ── */
  if(a==='mkperson'){ await doMkPerson(); return; }
  if(a==='usbnksearch'){ await doUsbnkSearch(); return; }
  if(a==='personrole'){
    await doPersonRole(
      el.getAttribute('data-sc'),
      el.getAttribute('data-usbnk')||'',
      el.getAttribute('data-role')||'',
      el.getAttribute('data-pid')||null
    );
    return;
  }
  if(a==='personrevoke'){
    await doPersonRevoke(el.getAttribute('data-sc'), el.getAttribute('data-usbnk')||'');
    return;
  }
  /* ── Audit-Log-Aktionen (Plan 05-03) ── */
  if(a==='auditreload'){
    _audit=null; _auditErr=null;
    if(state.section==='audit') render();
    await loadAudit();
    return;
  }
  if(a==='auditfilterreset'){
    _auditFilter={action:'alle',usbnk:''};
    render();
    return;
  }
});
/* Filter-/Sortier-Selects (Zugänge): Auswahl übernehmen und neu rendern */
document.addEventListener('change', function(e){
  var el=e.target.closest('select[data-action="zugfilter"]');
  if(el){ _zugFilter[el.getAttribute('data-field')]=el.value; render(); return; }

  var gl=e.target.closest('select[data-action="glogfilter"]');

  var al=e.target.closest('select[data-action="auditfilter"]');

  var ro=e.target.closest('select#pers-rolle');

document.addEventListener('input', function(e){

$('logininp') && $('logininp').focus();
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='logininp'){
    doLogin(document.activeElement.value);
  }
});

/* Start: abgelaufene/fehlende Sitzung → Login, sonst direkt Zugänge (D-10) */
render();
if(sessionJwt()) loadSection();
