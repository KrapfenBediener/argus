function isStandalone(){
  return window.navigator.standalone===true ||
         window.matchMedia('(display-mode: standalone)').matches;
}

function sb(){
  /* JWT wird manuell verwaltet (Phase 4): bei jedem Aufruf prüfen, ob sich das
   * gespeicherte JWT geändert hat (z. B. nach Code-Eingabe oder stiller
   * Verlängerung). Wenn ja → Client neu erstellen, Realtime-Abo trennen. */
  var currentJwt = localStorage.getItem('argus_jwt');
  if(_sb && currentJwt === _sbJwt) return _sb;
  if(!window.supabaseLib || !window.supabaseLib.createClient) return _sb;
  if(_channel){ try{_channel.unsubscribe();}catch(e){} _channel=null; }
  _sbJwt = currentJwt;
  var headers = currentJwt ? { Authorization:'Bearer '+currentJwt } : {};
  _sb = window.supabaseLib.createClient(SUPA_URL, SUPA_KEY, {
    auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false},
    global:{ headers: headers }
  });
  /* Realtime separat authentifizieren, sonst greift die RLS-Trennung (Phase 4)
   * nicht für postgres_changes. */
  if(currentJwt && _sb.realtime && _sb.realtime.setAuth){ try{ _sb.realtime.setAuth(currentJwt); }catch(e){} }
  return _sb;
}

function applyMeta(row){
  if(!row) return;
  if(typeof row.master_medic==='string') masterMedic=row.master_medic;
  if(typeof row.kennung==='string' && row.kennung) _ccpKennung=row.kennung;
  if('merge_group_id' in row) _mergeGroupId=row.merge_group_id||null;
  if('merge_request_from' in row) _mergeReqFrom=row.merge_request_from||null;
  /* ccpMerged (Präfix-Anzeige) wird in loadPatients aus der Gruppengröße abgeleitet. */
}
async function openOrCreateCCP(){
  var client=sb(); if(!client) return false;
  if(_ccpId){
    var r=await client.from('ccps').select('*').eq('id',_ccpId).single();
    if(r.data){applyMeta(r.data);return true;}
  }
  /* Einzigartigen Join-Token generieren */
  var tokenArr=new Uint8Array(16);
  crypto.getRandomValues(tokenArr);
  var joinToken=Array.from(tokenArr,function(b){return b.toString(16).padStart(2,'0');}).join('');
  /* Nächste freie Kennung im Präsidium vergeben (A, B, C, …), damit mehrere
   * CCPs unterscheidbar sind. Einzel-CCP bleibt 'A'. */
  var usedK=[];
  try{
    var ex=await client.from('ccps').select('kennung').eq('praesidium_id',_praesidiumId||'00000000-0000-0000-0000-000000000000').is('closed_at',null);
    if(ex.data) ex.data.forEach(function(c){if(c.kennung)usedK.push(c.kennung);});
  }catch(e){}
  var myK=nextFreeKennung(usedK);
  var ins=await client.from('ccps').insert({
    kennung:myK, ort:'', master_medic:operator||'', merged:false,
    join_token:joinToken, praesidium_id:_praesidiumId||null
  }).select().single();
  if(ins.data){
    _ccpId=ins.data.id; _ccpKennung=myK;
    localStorage.setItem('argus_ccp_id',_ccpId);
    localStorage.setItem('argus_invite',joinToken);
    return true;
  }
  return false;
}
function subscribeRealtime(){

        var n=payload&&payload.new;
        if(n && state.edit && n.id===state.edit.id){
          var lb=n.locked_by, la=n.locked_at||0, fresh=(nowMs()-la)<LOCK_TTL;
          if(state.readonly){
            /* Wartender: Sperre frei geworden (Bearbeiter raus / abgelaufen) → übernehmen */
            if(!lb || !fresh || lb===operator){
              acquirePatientLock(state.edit).then(function(){ render(); toast("Patient frei — du kannst jetzt bearbeiten"); });
            }else{ state.edit.lockedBy=lb; state.edit.lockedAt=la; }
          }else if(state.edit.lockedBy===operator && lb && lb!==operator && fresh){
            /* Bearbeiter: fremde Übernahme (MasterMedic) sofort erkennen */
            state.readonly=true; state.edit.lockedBy=lb; state.edit.lockedAt=la;
            render(); toast("Sperre durch "+lb+" übernommen");
          }
        }
        return;
      }
      if(state.view==='checklist') return;
      await loadPatients(); render();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ccps',
        filter:'id=eq.'+_ccpId}, function(p){applyMeta(p.new);render();checkIncomingMergeRequest();})
    .subscribe();
}

/* ── Geräte-Freischaltungen: welche Präsidien darf dieses Gerät sehen ──────
 * Liste {p:praesidium_id, exp:ms|0}. exp=0 = dauerhaft, sonst Ablaufzeitpunkt.
 * Master-Geräte (_isMaster) umgehen die Filterung und sehen alle Präsidien. */
function getUnlocked(){
  var arr=[]; try{ arr=JSON.parse(localStorage.getItem('argus_unlocked')||'[]'); }catch(e){ arr=[]; }
  if(!Array.isArray(arr)) arr=[];
  var now=nowMs(); var live=arr.filter(function(u){return u&&u.p&&(!u.exp||u.exp>now);});
  if(live.length!==arr.length){ try{localStorage.setItem('argus_unlocked',JSON.stringify(live));}catch(e){} }
  return live;
}
function isUnlocked(pid){ if(_isMaster) return true; return getUnlocked().some(function(u){return u.p===pid;}); }
async function consumeSingleUse(td){
  /* Einmal-Code nach erfolgreicher Einlösung als verbraucht markieren */
  if(td && td.single_use && !td.used_at && td.short_code){
    try{ await sb().from('access_tokens').update({used_at:nowMs()}).eq('short_code',td.short_code).is('used_at',null); }catch(e){}
  }
}
function genShortCode(){
  var AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function blk(){var s='';for(var i=0;i<4;i++)s+=AL[Math.floor(Math.random()*AL.length)];return s;}
  return blk()+'-'+blk();
}
function genToken(){ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a,function(b){return b.toString(16).padStart(2,'0');}).join(''); }
function addUnlock(pid, ttlHours){
  if(!pid) return;
  var arr=getUnlocked().filter(function(u){return u.p!==pid;});
  arr.push({p:pid, exp: ttlHours? (nowMs()+ttlHours*3600000) : 0});
  try{localStorage.setItem('argus_unlocked',JSON.stringify(arr));}catch(e){}
}
async function validateInviteToken(token){
  var client=sb(); if(!client) return null;
  var clean=token.replace(/[\s\-]/g,'').toUpperCase();
  /* Kein join in diesem Query — join via .single() + PGRST116-Fehler
   * schlägt in Supabase JS v2 geräuschlos fehl. Stattdessen:
   * 1) Token ohne Join holen (maybeSingle → nie PGRST116)
   * 2) Presidiumsname separat nachladen */
  var fields='token,praesidium_id,is_master,label,short_code,temporary,ttl_hours,single_use,used_at';
  var row=null;
  try{
    if(clean.length===8){
      var sc=clean.slice(0,4)+'-'+clean.slice(4);
      var rs=await client.from('access_tokens').select(fields).eq('short_code',sc).maybeSingle();
      if(!rs.error && rs.data) row=rs.data;
    }
    if(!row && token.trim().length>=16){
      var r=await client.from('access_tokens').select(fields).eq('token',token.trim()).maybeSingle();
      if(!r.error && r.data) row=r.data;
    }
  }catch(e){ return null; }
  if(!row) return null;
  if(row.single_use && row.used_at) return null;
  /* Presidiumsname separat holen (einfacher JOIN-lose Abfrage) */
  if(row.praesidium_id){
    try{
      var pr=await client.from('praesidien').select('id,name').eq('id',row.praesidium_id).maybeSingle();
      if(!pr.error && pr.data) row.praesidien=pr.data;
    }catch(e){}
  }
  return row;
}
/* ── Phase 4: Code gegen signiertes JWT tauschen ───────────────────────────
 * Ruft den DB-RPC argus_exchange_code (security definer, pgjwt+Vault) auf.
 * Der RPC validiert den 8-stelligen Code, signiert ein JWT mit praesidium_id /
 * is_master / exp und markiert Einmal-Codes serverseitig als verbraucht.
 * Pseudonymität bleibt gewahrt — kein Name, keine E-Mail, keine UID im JWT. */
async function exchangeCode(code){
  var clean=code.replace(/[\s\-]/g,'').toUpperCase();
  if(clean.length<8) return null;
  try{
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean })
    });
    var data=await resp.json();            /* ungültiger Code = HTTP 200 + {error:…} */
    if(!data || !data.jwt) return null;
    localStorage.setItem('argus_jwt', data.jwt);
    localStorage.setItem('argus_jwt_exp', String(data.exp*1000)); /* ms */
    localStorage.setItem('argus_code', clean);                    /* für stille Verlängerung */
    return {
      praesidium_id: data.praesidium_id,
      is_master: !!data.is_master,
      praesidien: data.praesidium_name ? { id:data.praesidium_id, name:data.praesidium_name } : null,
      short_code: clean.slice(0,4)+'-'+clean.slice(4),
      temporary: data.ttl_seconds < (30*24*3600),
      ttl_hours: Math.round(data.ttl_seconds/3600),
      single_use: false   /* serverseitig bereits verbraucht */
    };
  }catch(e){ return null; }
}
/* Stille JWT-Verlängerung: wenn Restlaufzeit < 7 Tage und online → mit dem
 * gespeicherten Code ein frisches JWT holen. Nutzer merkt nichts.
 * Bei Einmal-/24-h-Codes schlägt der Re-Exchange ggf. fehl → kein Problem,
 * das JWT läuft dann ab und der Nutzer gibt seinen Code neu ein. */
async function refreshJwtIfNeeded(){
  if(!navigator.onLine) return;
  var jwt=localStorage.getItem('argus_jwt');
  var exp=parseInt(localStorage.getItem('argus_jwt_exp')||'0',10);
  if(!jwt||!exp) return;
  if(exp-nowMs() > 7*24*3600*1000) return; /* noch frisch */
  var storedCode=localStorage.getItem('argus_code')||'';
  if(!storedCode) return;
  var result=await exchangeCode(storedCode);
  if(result && _ccpId && sb()) subscribeRealtime();
}
/* Freischaltung über einen Code (von Hand eingegeben oder eingefügt). Tauscht den
 * Code gegen ein JWT (exchangeCode) und schaltet das Präsidium frei. */
async function doUnlock(rawCode){
  var uc2=(rawCode||'').replace(/[\s\-]/g,'').toUpperCase();
  if(uc2.length<8){toast("Bitte vollständigen Code eingeben (Format: XXXX-XXXX)");return;}
  toast("Prüfe Code…");
  var uv=await exchangeCode(uc2);
  if(!uv){toast("Ungültiger oder abgelaufener Code");return;}
  localStorage.setItem('argus_verified','true');
  if(uv.is_master){
    _isMaster=true; localStorage.setItem('argus_is_master','true');
    toast("Master-Zugang freigeschaltet");
  } else if(uv.praesidium_id){
    addUnlock(uv.praesidium_id, uv.temporary?(uv.ttl_hours||24):null);
    await consumeSingleUse(uv);
    toast(uv.temporary?"Freigeschaltet (24 h)":"Dauerhaft freigeschaltet");
  } else {
    toast("Code ohne Präsidium"); return;
  }
  var pru=await sb().from('praesidien').select('id,name').order('name');
  _praesidienList=pru.data||[];
  render();
}
/* Zieht einen Freischalt-Code aus beliebigem Text — sowohl aus einem ganzen Link
 * (#code=XXXX-YYYY) als auch aus einem bloßen Code. */
function codeFromText(t){
  t=(t||'').trim();
  /* 1) ganzer Link: #code=XXXX-YYYY */
  var m=t.match(/[#&]code=([A-Za-z0-9]{4}-?[A-Za-z0-9]{4})/i);
  if(m) return m[1].toUpperCase();
  /* 2) ein Code-Token mit Bindestrich irgendwo im Text (XXXX-YYYY) */
  var m2=t.match(/(^|[^A-Za-z0-9])([A-Za-z0-9]{4}-[A-Za-z0-9]{4})([^A-Za-z0-9]|$)/);
  if(m2) return m2[2].toUpperCase();
  /* 3) bloßer Code NUR, wenn der gesamte (bereinigte) Text exakt 8 alnum ist
   *    — verhindert Fehlgriffe bei eingefügten Sätzen. */
  var clean=t.replace(/[\s\-]/g,'');
  if(/^[A-Za-z0-9]{8}$/.test(clean)) return clean.toUpperCase();
  return '';
}

/* Doppelnummer-Erkennung: aktive Patienten mit gleicher (Kennung, Nummer) im
 * selben CCP. Kann entstehen, wenn mehrere Geräte (v. a. offline) unabhängig
 * nummerieren. Es wird NICHT automatisch umnummeriert (Nummer steht auf der
 * Haut) — nur sichtbar markiert, damit das Team physisch nachzieht. */
function dupNumKeys(){
  var cnt={}, dup={};
  patients.forEach(function(p){
    if(p.status!=='active') return;
    var k=(p.ccp||'A')+'|'+p.num;

  return dup;
}

/* ── Echtes CCP-Zusammenführen (geräteübergreifend über Supabase) ──────────
 * Datenmodell: ccps.merge_group_id (gemeinsame Gruppe), ccps.merge_request_from
 * (Handshake). A initiiert → B bestätigt. A bleibt MasterMedic. Keine
 * Umnummerierung; der beitretende CCP bekommt die nächste freie Kennung und
 * schreibt seine eigenen Patienten darauf um. */
function nextFreeKennung(usedArr){
  var L="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(var i=0;i<L.length;i++){ if(usedArr.indexOf(L[i])===-1) return L[i]; }
  return "Z";
}
async function realMergeRequest(targetId){
  var client=sb(); if(!client||!_ccpId) return false;
  /* Die Gruppe entsteht erst, wenn B bestätigt (sonst würde die Selbstheilung
   * die Ein-Mitglied-Gruppe sofort wieder auflösen). Hier nur die Anfrage. */
  try{await client.from('ccps').update({merge_request_from:_ccpId,merge_request_at:nowMs()}).eq('id',targetId);}catch(e){return false;}
  return true;
}
/* Direktes Zusammenführen ohne Bestätigung — für die Schulungsumgebung, wo die
 * Ziel-CCPs fiktive MasterMedics ohne Gerät haben (Ein-Personen-Demo). */
async function realMergeDirect(targetId){
  var client=sb(); if(!client||!_ccpId) return false;
  var grp=_mergeGroupId||_ccpId;
  if(!_mergeGroupId){ _mergeGroupId=grp; try{await client.from('ccps').update({merge_group_id:grp,merged:true}).eq('id',_ccpId);}catch(e){} }
  var tgt; try{ tgt=(await client.from('ccps').select('*').eq('id',targetId).single()).data; }catch(e){}
  if(!tgt) return false;
  var used=[]; try{ var gm=await client.from('ccps').select('kennung').eq('merge_group_id',grp); if(gm.data) gm.data.forEach(function(c){if(c.kennung)used.push(c.kennung);}); }catch(e){}
  var tk=tgt.kennung||'B';
  if(used.indexOf(tk)!==-1){ tk=nextFreeKennung(used); try{await client.from('patients').update({ccp:tk}).eq('ccp_id',targetId);}catch(e){} }
  try{await client.from('ccps').update({merge_group_id:grp,kennung:tk,merged:true,merge_request_from:null,merge_request_at:null}).eq('id',targetId);}catch(e){}
  return true;
}
async function realMergeAccept(fromId){
  var client=sb(); if(!client||!_ccpId) return false;
  var src; try{ src=(await client.from('ccps').select('*').eq('id',fromId).single()).data; }catch(e){}
  if(!src) return false;
  var grp=src.merge_group_id||src.id;
  /* belegte Kennungen der Gruppe sammeln, nächste freie wählen */
  var used=[]; try{ var gm=await client.from('ccps').select('kennung').eq('merge_group_id',grp); if(gm.data) gm.data.forEach(function(c){if(c.kennung)used.push(c.kennung);}); }catch(e){}
  if(used.indexOf(src.kennung||'A')===-1) used.push(src.kennung||'A');
  var newK = (used.indexOf(_ccpKennung)===-1 && _ccpKennung) ? _ccpKennung : nextFreeKennung(used);
  /* eigene Patienten auf die neue Kennung umschreiben */
  await loadPatients();
  for(var i=0;i<patients.length;i++){ if(!patients[i].demo && patients[i].ccp!==newK){ patients[i].ccp=newK; await savePatient(patients[i]); } }
  _ccpKennung=newK; _mergeGroupId=grp;
  try{await client.from('ccps').update({merge_group_id:grp,kennung:newK,merged:true,merge_request_from:null,merge_request_at:null}).eq('id',_ccpId);}catch(e){}
  /* Auch den anfragenden CCP (A) der Gruppe zuordnen, falls noch nicht geschehen */
  if(!src.merge_group_id){ try{await client.from('ccps').update({merge_group_id:grp,merged:true}).eq('id',fromId);}catch(e){} }
  return true;
}
async function realMergeDecline(){

async function realMergeLeave(){
  var client=sb(); if(!client||!_ccpId) return;
  var grp=_mergeGroupId;
  _mergeGroupId=null;
  try{
    /* Ganze Gruppe auflösen, damit alle CCPs wieder eigenständig und erneut
     * zusammenführbar sind (sonst behielten die anderen eine tote Gruppen-ID). */
    if(grp){ await client.from('ccps').update({merge_group_id:null,merged:false}).eq('merge_group_id',grp); }
    else { await client.from('ccps').update({merge_group_id:null,merged:false}).eq('id',_ccpId); }
  }catch(e){}

}

/* Schulungsumgebung: erkennt, ob seit dem letzten „Zurücksetzen" etwas verändert wurde.
 * Originalzustand = genau 6 CCPs A–F (unmerged/offen, Demo-Master-Medics), nur Demo-
 * Patienten (id-Präfix "seed", aktiv, ohne Name). _schulDirty: -1 unbekannt, 0 sauber, 1 verändert. */
async function loadSchulDirty(){
  _schulDirty=-1;
  if(_praesidiumName!=='Schulungsumgebung' || !_isMaster) return;
  var c=sb(); if(!(c && _praesidiumId)) return;
  try{
    var cr=await c.from('ccps').select('id,kennung,merged,merge_group_id,closed_at,master_medic').eq('praesidium_id',_praesidiumId);
    var ccps=cr.data||[];
    var open=ccps.filter(function(x){return !x.closed_at;});
    var kenn=open.map(function(x){return x.kennung;}).sort().join('');
    var structPristine = ccps.length===6 && open.length===6 && kenn==='ABCDEF'
      && open.every(function(x){ return !x.merged && !x.merge_group_id && DEMO_MEDICS.indexOf(x.master_medic)>=0; });
    if(!structPristine){ _schulDirty=1; return; }
    var pr=await c.from('patients').select('id,status,name').in('ccp_id',open.map(function(x){return x.id;}));
    var pats=pr.data||[];
    var patPristine = pats.every(function(p){ return String(p.id||'').indexOf('seed')===0 && p.status==='active' && !p.name; });
    _schulDirty = patPristine ? 0 : 1;
  }catch(e){ _schulDirty=-1; }
}

  try{ var lk=await sList("ccp_pat_"); for(var i=0;i<lk.length;i++){ var pp=await sGet(lk[i]); if(pp && !pp.demo) await sDel(lk[i]); } }catch(e){}

/* Offline-Robustheit: lokal noch nicht synchronisierte Patienten in die
 * Cloud-Liste einmischen und — wenn online — nachschieben. Konfliktlösung per
 * 'updated'-Zeitstempel (jüngere Version gewinnt). So überschreibt ein Reconnect
 * keine offline erfassten/bearbeiteten Patienten mehr. */
async function flushPendingPatients(arr, client, ccpIds){
  var byId={}; arr.forEach(function(p){byId[p.id]=p;});
  var keys=await sList("ccp_pat_");
  for(var i=0;i<keys.length;i++){
    var lp=await sGet(keys[i]);
    if(!lp || lp.demo || lp.training || !lp._dirty) continue;
    /* nur Patienten des aktuellen CCP(-Verbunds) berücksichtigen */
    if(lp.ccpId && ccpIds && ccpIds.indexOf(lp.ccpId)===-1) continue;
    var cloudP=byId[lp.id];
    if(cloudP && (cloudP.updated||0) >= (lp.updated||0)){
      delete lp._dirty; await sSet("ccp_pat_"+lp.id, lp);   /* Cloud ist aktueller */
      continue;
    }
    var pushed=false;
    try{ var lrow=patToRow(lp); delete lrow.locked_by; delete lrow.locked_at; var r=await client.from('patients').upsert(lrow); if(!r.error) pushed=true; }catch(e){}
    if(pushed){ delete lp._dirty; await sSet("ccp_pat_"+lp.id, lp); }
    byId[lp.id]=normalize(lp);   /* immer anzeigen, auch wenn Upload (noch) scheitert */
  }
  arr.length=0;
  Object.keys(byId).forEach(function(k){ arr.push(byId[k]); });
}
async function loadPatients(){
  var client=sb();
  if(client && _ccpId){
    try{
      var ccpIds=[_ccpId];
      if(_mergeGroupId){
        var g=await client.from('ccps').select('id').eq('merge_group_id',_mergeGroupId);
        if(g.data && g.data.length>1){ ccpIds=g.data.map(function(c){return c.id;}); }
        else { /* allein in der Gruppe → Gruppe selbstheilend verlassen */
          _mergeGroupId=null;
          try{await client.from('ccps').update({merge_group_id:null,merged:false}).eq('id',_ccpId);}catch(e2){}
        }
      }
      var realMerged = ccpIds.length>1;
      var q = realMerged
        ? await client.from('patients').select('*').in('ccp_id',ccpIds)
        : await client.from('patients').select('*').eq('ccp_id',_ccpId);
      if(!q.error && q.data){
        var arr=q.data.map(patFromRow);
        await flushPendingPatients(arr, client, ccpIds);
        ccpMerged = realMerged || _demoMerged;
        if(_demoMerged){
          var keys2=await sList("ccp_pat_");
          for(var i=0;i<keys2.length;i++){var pd=await sGet(keys2[i]);if(pd&&pd.demo)arr.push(normalize(pd));}
        }
        if(_training){
          var keysT=await sList("ccp_pat_");
          for(var iT=0;iT<keysT.length;iT++){var pt=await sGet(keysT[iT]);if(pt&&pt.training)arr.push(normalize(pt));}
        }
        arr.sort(function(a,b){var ca=a.ccp||"A",cb=b.ccp||"A";if(ca!==cb)return ca<cb?-1:1;return a.num-b.num;});
        patients=arr; return;
      }
    }catch(e){}
  }
  var keys=await sList("ccp_pat_");var arr=[];
  for(var i=0;i<keys.length;i++){var p=await sGet(keys[i]);if(p){if(p.demo&&!_demoMerged)continue;if(p.training&&!_training)continue;arr.push(normalize(p));}}
  arr.sort(function(a,b){var ca=a.ccp||"A",cb=b.ccp||"A";if(ca!==cb)return ca<cb?-1:1;return a.num-b.num;});
  patients=arr;
}
function normalize(p){
  if(!p.vit)p.vit={};if(!p.tx)p.tx={};if(!p.inj)p.inj=[];
  if(p.pupRe===undefined)p.pupRe="";if(p.pupLi===undefined)p.pupLi="";
  if(!p.ccp)p.ccp="A";

async function savePatient(p){
  p.updated=nowMs();
  /* Welchem CCP gehört dieser Patient? Für offline angelegte/bearbeitete
   * Datensätze festhalten, damit sie später in den RICHTIGEN CCP hochgehen. */
  if(!p.ccpId && _ccpId) p.ccpId=_ccpId;
  /* Durability zuerst: lokal sichern und optimistisch als „offen" markieren.
   * Erst nach erfolgreichem Cloud-Schreiben wird die Markierung gelöscht. */
  if(!p.demo && !p.training) p._dirty=true;
  await sSet("ccp_pat_"+p.id,p);
  if(p.demo || p.training) return;
  var client=sb();
  if(client && _ccpId){
    try{
      /* Sperr-Spalten NICHT über die Datenspeicherung schreiben — sonst könnte
       * ein Bearbeiter eine vom MasterMedic übernommene Sperre durch bloßes
       * Weitertippen zurückerobern. Sperren laufen ausschließlich über pushLock. */
      var row=patToRow(p); delete row.locked_by; delete row.locked_at;
      var r=await client.from('patients').upsert(row);
      if(!r.error){ delete p._dirty; await sSet("ccp_pat_"+p.id,p); }
    }catch(e){}
  }
}
/* ── Patienten-Sperre (Soft-Lock gegen Doppelbearbeitung) ──────────────────
 * Beim Öffnen wird ein Patient für den eigenen Bediener gesperrt. Andere
 * sehen ihn dann schreibgeschützt. Ein Heartbeat hält die Sperre frisch;
 * nach LOCK_TTL ohne Lebenszeichen läuft sie automatisch ab. Der MasterMedic
 * kann eine fremde Sperre per Override übernehmen. */
var LOCK_TTL = 45000; /* 45 s Ablauf nach letztem Lebenszeichen */
var _lockBeat = 0;
function isMasterMedic(){ return !!((operator && masterMedic && operator===masterMedic) || _isMaster); }
function lockInfo(p){
  if(!p||!p.lockedBy||!p.lockedAt) return {locked:false,by:null,mine:false,age:Infinity};
  var age=nowMs()-p.lockedAt;
  return {locked:age<LOCK_TTL, by:p.lockedBy, mine:(p.lockedBy===operator), age:age};
}
/* Schreibt ausschließlich die Sperr-Spalten (getrennt von der Datenspeicherung).
 * So bleibt die Sperre eine eigene, klar steuerbare Größe. */
async function pushLock(p){
  var client=sb();
  if(client && _ccpId && p && !p.demo){
    try{ await client.from('patients').update({locked_by:p.lockedBy||null, locked_at:p.lockedAt||null}).eq('id',p.id); }catch(e){}
  }
}
async function acquirePatientLock(p){

  state.readonly=false; _lockBeat=nowMs();

}
async function releasePatientLock(){

  }
}

/* ── Übergabe-Karte (gPA): Vorlese-Modus in AT-MIST-Reihenfolge ──────────────
 * Reine Darstellung bereits erfasster Daten. Nichts wird übertragen, kein
 * Drittsystem, kein PZC/QR/Foto. Ausgecheckte Patienten sind gesperrt; zum
 * Korrigieren „↩ Zurückholen". MDR-neutral (keine neue klinische Ausgabe). */
function vHandover(p,c){
  function amRow(letter,label,valueHtml,first){
    return '<div style="display:flex;gap:11px;padding:12px 0'+(first?'':';border-top:1px solid var(--line)')+'">'+
      '<span class="mono" style="width:32px;height:32px;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+letter+'</span>'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700">'+label+'</div>'+
      '<div style="font-size:16px;font-weight:600;line-height:1.35;margin-top:2px">'+valueHtml+'</div></div></div>';
  }
  function vc(l,v){return '<div style="background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 8px"><div style="font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px">'+l+'</div><div class="mono" style="font-size:15px;font-weight:700;margin-top:1px">'+(v?esc(v):'—')+'</div></div>';}
  var dim='<span style="color:#9aa0a6;font-weight:400;font-style:italic">— nicht erfasst</span>';

  /* A — Alter / Geschlecht (optional, Pseudonymität) */
  var ap=[]; if(p.age)ap.push(esc(p.age)+' J'); var g=p.gender==='m'?'männl.':(p.gender==='w'?'weibl.':''); if(g)ap.push(g);
  var aVal=ap.length?ap.join(' · '):dim;
  /* T — Zeiten (automatisch) */
  var tp=[];
  if(p.tqStart)tp.push('<span style="color:var(--t1);font-weight:700">Tourniquet liegt seit '+fmtDur(nowMs()-p.tqStart)+'</span>');
  if(p.created)tp.push('<span style="font-size:13px;color:var(--mut);font-weight:400">erfasst '+ageStr(p.created)+'</span>');
  var tVal=tp.length?tp.join('<br>'):dim;
  /* M — Mechanismus (aus MOI/Unfallhergang) */
  var mVal=p.moi?esc(p.moi):dim;
  /* I — Verletzungen */
  var il=[]; (p.inj||[]).forEach(function(it){il.push(esc(it.r)+' – '+esc(it.a));}); if(p.injury)il.push(esc(p.injury));
  var iVal=il.length?il.join('<br>'):dim;
  /* S — Befund / Vitalwerte: nur erhobene Werte; PFC-Verlauf einklappbar (Default zu) */
  var v=p.vit||{};
  var vpairs=[['WASB',v.avpu],['AF',v.af],['SpO₂',v.spo2],['HF',v.hf],['RR',v.rr],['Schmerz',v.pain]].filter(function(x){return x[1]!=null&&x[1]!=='';});
  var sVal;
  if(vpairs.length){
    sVal='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px">'+vpairs.map(function(x){return vc(x[0],x[1]);}).join('')+'</div>';
  }else{
    sVal='<div style="margin-top:4px;font-weight:600;color:var(--mut)">Keine Vitalwerte erhoben</div>';
  }
  if(p.allergies)sVal+='<div style="margin-top:7px;color:var(--t1);font-weight:600;font-size:13.5px">⚠ Allergien: '+esc(p.allergies)+'</div>';
  var vlog=(p.vit&&Array.isArray(p.vit.log))?p.vit.log:[];
  if(vlog.length){
    sVal+='<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12.5px;color:var(--mut);font-weight:600">Verlauf — '+vlog.length+' protokollierte Messung'+(vlog.length>1?'en':'')+'</summary>'+
      '<div style="margin-top:5px;border:1px solid var(--line);border-radius:8px;overflow:hidden">';
    vlog.forEach(function(m){
      var tm=m.t?new Date(m.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'—';
      var parts=[];
      if(m.af)parts.push('AF '+esc(m.af)); if(m.spo2)parts.push('SpO₂ '+esc(m.spo2));
      if(m.hf)parts.push('HF '+esc(m.hf)); if(m.rr)parts.push('RR '+esc(m.rr));
      if(m.avpu)parts.push('WASB '+esc(m.avpu)); if(m.pain)parts.push('Schmerz '+esc(m.pain));
      sVal+='<div style="display:flex;gap:8px;padding:6px 9px;border-top:1px solid var(--line);font-size:12px"><span class="mono" style="font-weight:700;flex-shrink:0">'+tm+'</span><span style="color:var(--mut)">'+(parts.join(' · ')||'—')+'</span></div>';
    });
    sVal+='</div></details>';
  }
  /* T — Maßnahmen (Treatment) */
  var tl=[];
  if(p.tqStart)tl.push('Tourniquet · '+fmtDur(nowMs()-p.tqStart));
  TXG.forEach(function(grp){grp[1].forEach(function(f){ if(p.tx&&p.tx[f[0]]) tl.push(esc(f[1])); });});

function resizePhoto(file,maxEdge,quality){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);var img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.naturalWidth||img.width,hh=img.naturalHeight||img.height;
      var s=Math.min(1,maxEdge/Math.max(w,hh));
      var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(hh*s));
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
      cv.getContext("2d").drawImage(img,0,0,cw,ch);
      try{resolve(cv.toDataURL("image/jpeg",quality));}catch(e){reject(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("img"));};
    img.src=url;
  });
}

function confirmModal(msg,okLabel){

      '<div class="row" style="margin-top:16px">'+

      '<button class="prim mc-ok" style="flex:1;margin:0;background:var(--ready)">'+esc(okLabel||"OK")+'</button></div></div>';
    document.body.appendChild(ov);
    function done(v){if(ov.parentNode)ov.parentNode.removeChild(ov);resolve(v);}
    ov.querySelector(".mc-cancel").addEventListener("click",function(){done(false);});
    ov.querySelector(".mc-ok").addEventListener("click",function(){done(true);});
    ov.addEventListener("click",function(e){if(e.target===ov)done(false);});
  });
}

  if(_trainCelebrate || _trainStep>=TRAIN_LESSONS.length || _trainStep<_trainMax) return;
  var L=TRAIN_LESSONS[_trainStep], ok=false;
  if(L.adv){ try{ ok=!!L.adv(); }catch(e){ ok=false; } }

/* Spotlight: 4 Abdunkel-Rechtecke um das Ziel-Element (robust, ohne z-index-Tricks). */
var _trainSpotStep=-1;
function trainRect(id,x,y,w,h){
  var d=document.getElementById(id);
  if(!d){ d=document.createElement('div'); d.id=id; d.style.position='fixed'; d.style.zIndex='8000'; d.style.background='rgba(16,20,26,.58)'; d.style.pointerEvents='none'; document.body.appendChild(d); }

/* Scrollt das Ziel mittig in den Bereich ÜBER dem Panel (sonst sitzt es dahinter versteckt). */
function trainScrollTo(target){
  try{
    var r=target.getBoundingClientRect();
    var avail=Math.max(140, window.innerHeight-235);
    var delta=(r.top + r.height/2) - (avail/2);
    if(window.scrollBy) window.scrollBy({top:delta, behavior:'smooth'});
  }catch(e){}
}
function trainSpotlight(target){
  if(!target){ trainClearSpot(); _trainSpotStep=-1; return; }
  if(_trainSpotStep!==_trainStep){ _trainSpotStep=_trainStep; trainScrollTo(target); }
  var r=target.getBoundingClientRect(), pad=6;
  var x=Math.max(0,r.left-pad), y=Math.max(0,r.top-pad), w=r.width+2*pad, h=r.height+2*pad;
  var vw=window.innerWidth, vh=window.innerHeight;
  trainRect('train-dt',0,0,vw,y);
  trainRect('train-db',0,y+h,vw,Math.max(0,vh-(y+h)));
  trainRect('train-dl',0,y,x,h);
  trainRect('train-dr',x+w,y,Math.max(0,vw-(x+w)),h);
  var ring=document.getElementById('train-ring');
  if(!ring){ ring=document.createElement('div'); ring.id='train-ring'; ring.style.position='fixed'; ring.style.zIndex='8001'; ring.style.pointerEvents='none'; ring.style.borderRadius='12px'; ring.style.boxShadow='0 0 0 3px #6A1B9A,0 0 0 9px rgba(106,27,154,.30)'; document.body.appendChild(ring); }
  ring.style.left=x+'px'; ring.style.top=y+'px'; ring.style.width=w+'px'; ring.style.height=h+'px';
}

  var ap=document.getElementById('app'); if(ap)ap.style.paddingBottom='230px';

        '<div style="font-size:14.5px;color:#33373b;margin-top:6px;line-height:1.45">Gut gemacht — du kannst es jederzeit erneut starten.</div></div>'+

function introOverlay(){

      '</div>'+

/* ── Update-Erkennung ──────────────────────────────────────────────────────
 * Prüft per version.json (network-only, nie gecacht), ob serverseitig eine
 * neuere Version bereitliegt. Falls ja: dezenter Banner mit „Jetzt aktualisieren".
 * Läuft beim Start und bei jedem Sichtbarwerden (deckt iOS-Resume ab, wo kein
 * echter Ladevorgang stattfindet). Nutzer-initiiert — unterbricht nie mitten
 * in der Bearbeitung. */
function showUpdateBanner(v){
  if(document.getElementById('updbar')) return;
  var b=document.createElement('div'); b.id='updbar';
  b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:var(--acc,#1f2530);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 -2px 12px rgba(0,0,0,.25)';
  b.innerHTML='<span style="flex:1">Neue Version'+(v?(' v'+esc(v)):'')+' verfügbar.</span>'+
    '<button id="updbtn" style="background:#fff;color:#1f2530;border:0;border-radius:8px;padding:8px 14px;font-weight:700">Jetzt aktualisieren</button>';
  document.body.appendChild(b);
  document.getElementById('updbtn').addEventListener('click',updateNow);
}
async function updateNow(){
  try{ if(navigator.serviceWorker){ var r=await navigator.serviceWorker.getRegistration(); if(r) await r.update(); } }catch(e){}
  location.reload();
}
async function checkForUpdate(){
  if(!navigator.onLine) return;
  try{
    var r=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    var d=await r.json();
    if(d && d.version && d.version!==APP_VERSION) showUpdateBanner(d.version);
  }catch(e){}
}

document.addEventListener("click",async function(e){

  }
  if(a==="adminlink"){
    if(!_isMaster){toast("Nur MasterToken");return;}
    var apid=el.getAttribute("data-pid"), apname=el.getAttribute("data-pname"), akind=el.getAttribute("data-kind");

      if(ins.error||!ins.data){ toast("Konnte Einmal-Code nicht anlegen"+(ins.error?' · '+ins.error.message:'')); return; }
      asc=ins.data.short_code; /* bestätigter Code aus der DB */
    }else{
      var wantTemp=(akind==="temp");

      var arows=(ars.data||[]).filter(function(t){return !t.single_use;});

      if(!apick||!apick.short_code){toast("Kein passender Code für dieses Präsidium");return;}

    }

          await consumeSingleUse(valid);
          _praesidiumId=valid.praesidium_id;

/* Sperr-Heartbeat (alle 5 s, nur im Patienten-View). Behandelt beide Rollen:
 *  • Bearbeiter: hält die eigene Sperre frisch; erkennt eine fremde Übernahme.
 *  • Wartender (readonly): erkennt, wenn die Sperre frei wird (Bearbeiter raus
 *    oder 45 s ohne Lebenszeichen) und übernimmt dann automatisch.
 * Re-rendert nur bei echtem Rollenwechsel (sonst Fokusverlust beim Tippen). */
setInterval(async function(){
  if(state.view!=="patient"||!state.edit) return;
  var client=sb();
  if(!(client && _ccpId)) return;
  var r; try{ r=await client.from('patients').select('locked_by,locked_at').eq('id',state.edit.id).single(); }catch(e){ return; }
  if(!r||!r.data) return;
  var lb=r.data.locked_by, la=r.data.locked_at||0, fresh=(nowMs()-la)<LOCK_TTL;
  if(state.readonly){
    /* Wartender: Sperre frei (niemand / abgelaufen / wieder ich) → übernehmen */
    if(!lb || !fresh || lb===operator){
      await acquirePatientLock(state.edit); render();
      toast("Patient frei — du kannst jetzt bearbeiten");
    }else{ state.edit.lockedBy=lb; state.edit.lockedAt=la; }
    return;
  }
  /* Bearbeiter: fremde Übernahme erkennen */
  if(state.edit.lockedBy===operator && lb && lb!==operator && fresh){
    state.readonly=true; state.edit.lockedBy=lb; state.edit.lockedAt=la;
    render(); toast("Sperre durch "+lb+" übernommen"); return;
  }
  /* Keepalive höchstens alle 15 s, und nur solange wir die Sperre noch halten. */
  if(state.edit.lockedBy===operator && nowMs()-_lockBeat > 15000){
    _lockBeat=nowMs(); state.edit.lockedAt=nowMs();
    try{ await client.from('patients').update({locked_at:state.edit.lockedAt}).eq('id',state.edit.id).eq('locked_by',operator); }catch(e){}
  }
},5000);

  /* Erstinstallation erkennen — VOR allem anderen, solange die Geräte-Ablage noch
   * leer ist. Ein bestehender Nutzer (irgendwelche ARGUS-Daten vorhanden) bekommt

   * spätere Freischaltung für ein weiteres Präsidium ändert das nicht. */
  var introSeen=localStorage.getItem('argus_intro_seen');
  var hadData=!!(operator||localStorage.getItem('argus_verified')||localStorage.getItem('argus_unlocked')||localStorage.getItem('argus_jwt')||localStorage.getItem('argus_seen_version')||localStorage.getItem('argus_ccp_id'));
  window._pendingIntro = (!introSeen && !hadData);
  if(!introSeen && hadData){ try{localStorage.setItem('argus_intro_seen','1');}catch(e){} }

  /* „Was ist neu"-Hinweis: einmalig pro Version. Wird für bestehende Nutzer
   * angezeigt (auch beim ersten Lauf mit sichtbarer Version), nicht für eine
   * brandneue Erstinstallation. Läuft unabhängig vom späteren View-Pfad. */
  var seenV=localStorage.getItem('argus_seen_version');
  var existingUser=!!(localStorage.getItem('argus_jwt')||localStorage.getItem('argus_unlocked')||localStorage.getItem('argus_verified'));
  localStorage.setItem('argus_seen_version',APP_VERSION);
  if(seenV ? (seenV!==APP_VERSION) : existingUser){ setTimeout(function(){ whatsNewModal(seenV); },700); }

  /* ── Zugangsprüfung (nur einmalig beim ersten Start) ─────────────
   * argus_verified = true  →  einmal freigeschaltet, dauerhaft Zugang
   * Einladungslink         →  einmalige Registrierung, danach verified
   * Nichts von beidem      →  gesperrter Bildschirm
   * ──────────────────────────────────────────────────────────────── */
  var verified=localStorage.getItem('argus_verified');
  var urlToken=extractInviteToken();
  var urlCode=extractInviteCode();
  _praesidiumId   = localStorage.getItem('argus_praesidium_id')||null;
  _praesidiumName = localStorage.getItem('argus_praesidium_name')||'';
  _isMaster       = localStorage.getItem('argus_is_master')==='true';

  /* ── Freischalt-Link mit 8-stelligem Code (#code=) ──────────────── */
  if(urlCode){
    if(!isStandalone()){
      /* Browser (noch nicht installiert): Install-Screen anzeigen. Der Code steht
       * bereits im Link — KEIN DB-Read (anon darf access_tokens nicht mehr lesen;
       * Lücke aus Phase 4 geschlossen). Eingelöst wird erst im Standalone. */
      var ucClean=urlCode.replace(/[\s\-]/g,'').toUpperCase();
      state.installShortCode = ucClean.length>=8 ? ucClean.slice(0,4)+'-'+ucClean.slice(4,8) : urlCode;
      state.installTokenFull=urlCode;
      $("clock").textContent=new Date().toLocaleTimeString("de-DE");
      state.view='install'; render(); return;
    } else {
      /* Installierte PWA: echter Eintritt → JWT holen (Einmal-Code wird jetzt
       * serverseitig verbraucht). */
      var cdata=await exchangeCode(urlCode);
      if(cdata){
        localStorage.setItem('argus_verified','true'); verified='true';
        history.replaceState(null,'',window.location.pathname);
        if(cdata.is_master){ localStorage.setItem('argus_is_master','true'); _isMaster=true; }
        else if(cdata.praesidium_id){
          addUnlock(cdata.praesidium_id, cdata.temporary?(cdata.ttl_hours||24):null);
          _praesidiumId=cdata.praesidium_id;
          _praesidiumName=(cdata.praesidien&&cdata.praesidien.name)||'';
          localStorage.setItem('argus_praesidium_id',_praesidiumId);
          localStorage.setItem('argus_praesidium_name',_praesidiumName);
        }
      }
    }
  }
  /* ── Einladungslink mit 32-Zeichen-Token (#inv=, Install-Flow) ──── */
  else if(urlToken){
    var tokenData=await validateInviteToken(urlToken);
    if(tokenData){
      if(!isStandalone()){
        state.installShortCode=tokenData.short_code||urlToken.slice(0,8).toUpperCase();
        state.installTokenFull=urlToken;
        $("clock").textContent=new Date().toLocaleTimeString("de-DE");
        state.view='install'; render(); return;
      }
      localStorage.setItem('argus_verified','true'); verified='true';
      localStorage.setItem('argus_invite',urlToken);
      history.replaceState(null,'',window.location.pathname);
      if(tokenData.is_master){ localStorage.setItem('argus_is_master','true'); _isMaster=true; }
      else if(tokenData.praesidium_id){
        addUnlock(tokenData.praesidium_id, tokenData.temporary?(tokenData.ttl_hours||24):null);
        await consumeSingleUse(tokenData);
        _praesidiumId=tokenData.praesidium_id;
        _praesidiumName=(tokenData.praesidien&&tokenData.praesidien.name)||'';
        localStorage.setItem('argus_praesidium_id',_praesidiumId);
        localStorage.setItem('argus_praesidium_name',_praesidiumName);
      }
    }
  }

  /* Präsidienliste laden (für die Landingpage) */
  if(sb()){
    var prlAll=await sb().from('praesidien').select('id,name').order('name');
    _praesidienList=prlAll.data||[];
  }

  /* ── Phase-4-Migration: Altgerät ohne JWT → einmalige Code-Neueingabe ────
   * Geräte mit altem Zugang (verified / unlocked / master), aber ohne JWT
   * werden zur Code-Eingabe geführt. Danach 30 Tage Ruhe. URL-Links
   * (#code= / #inv=) umgehen die Migration (werden oben verarbeitet). */
  var hasLegacyAccess = (verified==='true' || getUnlocked().length>0 || _isMaster) && !localStorage.getItem('argus_jwt');
  if(hasLegacyAccess && !urlCode && !urlToken){
    localStorage.removeItem('argus_verified');
    localStorage.removeItem('argus_unlocked');
    localStorage.removeItem('argus_praesidium_id');
    localStorage.removeItem('argus_praesidium_name');
    localStorage.removeItem('argus_is_master');
    _praesidiumId=null; _praesidiumName=''; _isMaster=false;
    $("clock").textContent=new Date().toLocaleTimeString("de-DE");
    state.view='praesidium'; render(); return;
  }

  /* ── Zugriffsgate (strikt): Master ODER (gültiges JWT UND mind. ein
   *    freigeschaltetes Präsidium). Sonst → Landingpage mit Freischalt-
   *    Button (Fehlerfall ist „Code eingeben"). ──── */
  var hasAccess = _isMaster || (!!localStorage.getItem('argus_jwt') && getUnlocked().length>0);
  if(!hasAccess || !_praesidiumId || !isUnlocked(_praesidiumId)){
    $("clock").textContent=new Date().toLocaleTimeString("de-DE");
    state.view='praesidium'; render(); return;
  }

  /* Ab hier: Nutzer ist freigeschaltet — JWT ggf. still verlängern, dann
   * letzten CCP wiederherstellen */
  await refreshJwtIfNeeded();
  var storedCcp=localStorage.getItem('argus_ccp_id');
  if(storedCcp) _ccpId=storedCcp;

  await loadMeta();
  await loadPatients();
  await loadChecklist();
  await loadOpenCcpCount();
  if(_ccpId && sb()) subscribeRealtime();
  $("clock").textContent=new Date().toLocaleTimeString("de-DE");
  render();
  maybeShowIntro();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    try{ reg.update(); }catch(e){}
  }).catch(function(e) {});
}

/* Update-Erkennung beim Start und bei jedem Sichtbarwerden (iOS-Resume zeigt
 * die App ohne echten Ladevorgang → ohne diese Prüfung bliebe man auf alt). */
checkForUpdate();
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible') checkForUpdate();
});

/* Wiederverbindung: offline erfasste/bearbeitete Patienten nachschieben und
 * JWT ggf. auffrischen. loadPatients() mischt offene lokale Änderungen ein und
 * lädt sie hoch (siehe flushPendingPatients). */
window.addEventListener('online', function(){
  refreshJwtIfNeeded();
  checkForUpdate();
  if(_ccpId && sb()){ loadPatients().then(function(){ render(); }); }
});
</script>
