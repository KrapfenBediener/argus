    state.view='praesidium'; render(); return;
  }

  /* ── Zugriffsgate (strikt): Master ODER (gültiges JWT UND mind. ein
   *    freigeschaltetes Präsidium). Sonst → Landingpage mit Freischalt-
   *    Button (Fehlerfall ist „Code eingeben"). ──── */
  var hasAccess = _isMaster || (!!accessGet('argus_jwt') && getUnlocked().length>0);
  if(!hasAccess || !_praesidiumId || !isUnlocked(_praesidiumId)){
    $("clock").textContent=new Date().toLocaleTimeString("de-DE");
    state.view='praesidium'; render(); return;
  }

  /* Ab hier: Nutzer ist freigeschaltet — JWT ggf. still verlängern, dann
   * letzten CCP wiederherstellen */
  /* JWT muss zum aktiven Präsidium passen (Sammelcode mit zwei Präsidien) —
   * sonst scheitert jeder Schreibzugriff still an der RLS. */
  if(!ensureJwtFor(_praesidiumId) && navigator.onLine && accessGet('argus_code') && !(_argusRole&&_usbnk)){
    /* 0024: fehlendes JWT online nachholen — Twin mit p_scope='schulung' */
    var _sjwt=accessGet('argus_jwt'), _sexp=accessGet('argus_jwt_exp'), _scode=accessGet('argus_code');
    var _re=null; try{ _re=await Promise.race([exchangeCode(_scode, _praesidiumSchulung?'schulung':'echt'), new Promise(function(r){ setTimeout(function(){ r(null); }, 2500); })]); }catch(e){}
    if(!(_re && _re.praesidium_id===_praesidiumId)){ try{ if(_sjwt){ accessSet('argus_jwt',_sjwt); accessSet('argus_jwt_exp',_sexp||'0'); accessSet('argus_code',_scode||''); } }catch(e){} }
  }
  if(!ensureJwtFor(_praesidiumId)){
    removeUnlock(_praesidiumId);
    toast("Zugang für „"+(_praesidiumName||'dieses Präsidium')+"“ passt nicht zum gespeicherten Code — bitte Code einmal neu eingeben");
    $("clock").textContent=new Date().toLocaleTimeString("de-DE");
    state.view='praesidium'; render(); return;
  }
  /* JWT still verlängern. B3: nur warten, wenn er schon abgelaufen ist — und dann höchstens 2,5 s; sonst im Hintergrund. */
  var _jexp=parseInt(accessGet('argus_jwt_exp')||'0',10)||0;
  if(_jexp>nowMs()){ try{ refreshJwtIfNeeded(); }catch(e){} }
  else { await Promise.race([Promise.resolve(refreshJwtIfNeeded()).catch(function(){}), new Promise(function(r){ setTimeout(r, 2500); })]); }
  try{ probeSchema(3); }catch(e){}   /* Schema-/Uhr-Probe (D6.5-18/-07) — fire-and-forget, KEIN await */
  if(_revokedLocked) return;   /* Re-Exchange hat die Code-Sperre erkannt → init hier beenden */
  checkRevokedCode();          /* fire-and-forget (KEIN await) — der Start wartet nie auf den Re-Check */
  var storedCcp=localStorage.getItem('argus_ccp_id');
  if(storedCcp) _ccpId=storedCcp;
  try{ if(state.view==='start') lageStartWeiche(true); }catch(e){}   /* Phase 6.11 (D6.11-13): ohne gemerkte Lage ins Menü „Lage auswählen“ */
  try{ ccpVorlaeufigPruefen(); }catch(e){}   /* Phase 6.10: offline eröffneter CCP bleibt bis zum Nachreichen „vorläufig“ */

  try{ flushLatePatients(); }catch(e){}   /* Nachzügler verlassener/abgeschlossener CCPs (Hintergrund, nie blockierend) */
  /* Opportunistischer Purge-Lauf — Fallback zu pg_cron (z. B. pausiertes
   * Free-Tier-Projekt, das erst durch App-Traffic aufwacht). Fire-and-forget. */
  try{ if(sb()) sb().rpc('argus_run_purge').then(function(){},function(){}); }catch(e){}

  /* B3 (Plan 06.5-10): Die Netz-Schritte des Starts laufen als EINE Kette im Hintergrund, auf die der Start
   * höchstens ~3 s wartet (jeder Schritt ist zusätzlich per qt() begrenzt). Im Funkloch erscheint die App
   * dadurch mit dem lokalen Stand; die Kette rendert nach ihrem Ende nach. */
  var _bootChain=(async function(){
    /* Offline gequeueter Einsatz-Abschluss? Jetzt (online) nachziehen. */
    await flushPendingClose();
    await loadMeta();
    try{ ensureMeshSecret(sb()); }catch(e){}   /* Phase 6.7 (D6.7-10): CCP-Geheimnis nachladen — ohne await (Local-first) */
    refreshSchulungFlag();   /* fire-and-forget — localStorage-Wert trägt bis dahin */
    /* Abschluss-Erkennung (a) App-Start: wurde der Einsatz abgeschlossen, während
     * dieses Gerät weg war? → Hinweis-Modal + cleanupClosedEinsatz() (über
     * handleRemoteClose; loadMeta()→applyMeta() prüft denselben Zustand). */
    await checkClosedEinsatz();
    await loadPatients();
  })().catch(function(){});
  var _bootCount=loadOpenCcpCount().catch(function(){});
  var _bootDone=false;
  await Promise.race([Promise.all([_bootChain,_bootCount]).then(function(){ _bootDone=true; }), new Promise(function(r){ setTimeout(r, 2000); })]);
  if(!_bootDone){
    /* Funkloch/langsames Netz: nach 2 s die App mit dem lokalen Stand zeigen (kein leerer Bildschirm),
     * die Kette läuft weiter und rendert nach ihrem Ende nach. */
    if(!patients.length){ try{ var _lr=await readLocalPatients(); if(!patients.length){ _tombs=_lr.tombs; patients=_lr.arr; } }catch(e){} }
    try{ $("clock").textContent=new Date().toLocaleTimeString("de-DE"); render(); }catch(e){}
    Promise.all([_bootChain,_bootCount]).then(function(){ try{ render(); }catch(e){} });
  }
  try{ await ensureDeviceNo(sb()); }catch(e){}   /* Gerätenummer früh aus Speicher/Server holen → instantes Anlegen hat sie parat (Claim: qt-begrenzt) */
  try{ meshStart(); }catch(e){}   /* Phase 6.7: Mesh in der Hülle starten (PWA: meshNative null → sofort zurück) */
  try{ prefetchNum(); }catch(e){}                /* erste Online-Nummer vorab reservieren */
  await loadChecklist();
  if(_ccpId && sb()) subscribeRealtime();
  $("clock").textContent=new Date().toLocaleTimeString("de-DE");
  render();
  try{ runLocalPurge(); }catch(e){}   /* lokale Löschfristen nach dem Start (Hintergrund) */
  maybeShowIntro();
})();

/* Hülle: WKWebView kennt keinen Service Worker unter capacitor://; sw.js ist
 * nicht gebündelt (Plan 06.6-02). PWA: unverändert. */
if ('serviceWorker' in navigator && !isNativeShell()) {
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    try{ reg.update(); }catch(e){}
  }).catch(function(e) {});
}

/* Update-Erkennung beim Start und bei jedem Sichtbarwerden (iOS-Resume zeigt
 * die App ohne echten Ladevorgang → ohne diese Prüfung bliebe man auf alt). */
checkForUpdate();

/* Realtime-Selbstheilung (Bugfix 2026-06-13, Feldtest-Feedback): iOS beendet
 * im Hintergrund den WebSocket. Beim Resume blieb der TOTE Channel in _channel
 * stehen — subscribeRealtime() verweigerte wegen des _channel-Guards den
 * Neuaufbau, und auch der online-Handler abonnierte nie neu. Folge: keine
 * Live-Updates mehr („gefühlt lokaler Modus") bis zum CCP-Wechsel, dessen
 * Pfade den Channel zufällig aufräumen. Heilung: Channel hart trennen, neu
 * abonnieren, danach Abschluss-Check + Daten-Nachladen (Catch-up für alles,
 * was während des toten Channels passiert ist). */
function healRealtime(){
  if(!_ccpId || _training || !sb()) return;
  if(_channel){ try{_channel.unsubscribe();}catch(e){} _channel=null; }
  subscribeRealtime();
  checkClosedEinsatz().then(function(closed){
    if(closed || !_ccpId) return;
    loadPatients().then(function(){ render(); });
  });
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState!=='visible'){ try{ meshVorPause(); }catch(e){} return; }   /* Quick 261021: Sendepuffer in die Nachlaufzeit */
  _netProbeAt=0;   /* Befund 7b/7c: nach dem Vordergrund beim nächsten Wächter-Takt sofort prüfen (nicht erst nach 20 s) */
  checkForUpdate();
  healRealtime();
  try{ refreshJwtIfNeeded(); }catch(e){}   /* Phase 6.10 (D6.10-15): Anmeldung auch beim Vordergrund still verlängern (fire-and-forget, wirft intern nie) */
  try{ deviceHeartbeat(); }catch(e){}   /* Lebenszeichen sofort nach Rückkehr in den Vordergrund */
  try{ meshStart(); meshStartBald(); }catch(e){}   /* Phase 6.7 (D6.7-08): Mesh nach Rückkehr in den Vordergrund neu starten (iOS trennt im Hintergrund); Befund E: Nachholen in 2 s statt im 15-s-Takt */
  try{ runLocalPurge(); }catch(e){}   /* Fristen prüfen, wenn die App wieder sichtbar wird */
  try{ if(state.view==='start') lageWahlPruefen(); }catch(e){}   /* Phase 6.11 (D6.11-13): gemerkte Lage inzwischen abgeschlossen? */
});

/* Wiederverbindung: offline erfasste/bearbeitete Patienten nachschieben und
 * JWT ggf. auffrischen. loadPatients() mischt offene lokale Änderungen ein und
 * lädt sie hoch (siehe flushPendingPatients). */
window.addEventListener('online', function(){
  try{ if(!_netUp) netProbeLauf(); }catch(e){}   /* Befund 7b: galt das Gerät als offline, bestätigt die Probe sofort und stößt die Kette an (die Flushes unten kehren bei _netUp false noch leer zurück) */
  try{ if(!_mesh.such.mitNetz) meshSuchStop(); }catch(e){}   /* Phase 6.10 (06.10-07): mit Netz kein Suchmodus — außer die Beitrittsliste ist offen (Befund 7a) */
  refreshJwtIfNeeded();
  checkRevokedCode();    /* Reconnect: Code-Sperre nachprüfen (fire-and-forget, offline-Guard intern) */
  checkForUpdate();
  flushPendingClose();   /* offline gequeueten Einsatz-Abschluss nachziehen */
  try{ flushLatePatients(); }catch(e){}   /* Nachzügler nachreichen */
  try{ flushHerkunft(); }catch(e){}   /* Herkunftsprotokoll nachreichen */
  try{ ensureMeshSecret(sb()); }catch(e){}   /* Phase 6.7 (D6.7-10): CCP-Geheimnis nachladen */
  try{ meshGatewayFlush(); }catch(e){}   /* Phase 6.7 (D6.7-04): Gateway sofort — Offenes aus dem Mesh hochladen */
  try{ meshStart(); meshStartBald(); }catch(e){}   /* Phase 6.7: Mesh ggf. nachstarten (Gerätenummer/Geheimnis jetzt verfügbar); Befund E: Nachholen in 2 s */
  try{ probeSchema(1); }catch(e){}   /* Schema-/Uhr-Probe nach Reconnect */
  try{ if(_schemaV>=37) nachreichenKette(); }catch(e){}   /* Phase 6.10 (R6.10-07): Lage → CCP → Geräte → Patienten → Abschluss */
  try{ deviceHeartbeat(); }catch(e){}   /* Lebenszeichen nach Reconnect */
  try{ flushPendingLeave(); }catch(e){}   /* vorgemerkte Abmeldung nachreichen */
  try{ ensureDeviceNo(sb()); }catch(e){}   /* Gerätenummer nach Reconnect sichern */
  try{ prefetchNum(true); }catch(e){}      /* nächste Online-Nummer sofort vorab holen (nicht auf Wächter-Bestätigung warten) */
  try{ if(sb()) sb().rpc('argus_run_purge').then(function(){},function(){}); }catch(e){}
  /* Channel nach Netz-Rückkehr IMMER neu aufbauen (toter Socket, s. o.) —
   * healRealtime übernimmt Abschluss-Check + Nachladen. */
  healRealtime();
});

/* #4 — Aktiver Verbindungs-Wächter (2026-10-14): iOS-PWAs feuern 'online' nach
 * dem Flugmodus oft spät oder gar nicht → die App hing gefühlt zu lange im
 * „lokalen Modus". Statt auf das Event zu warten, pingen wir aktiv (kurzer
 * version.json-Fetch mit hartem 3-s-Timeout) und reparieren bei der RÜCKKEHR
 * sofort (Heal + Flush). Gepingt wird NUR, wenn Erholung plausibel nötig ist
 * (offline geglaubt oder noch nicht synchronisierte Daten) → keine Dauerlast im
 * Normalbetrieb. */
var _netUp = (typeof navigator==='undefined') || navigator.onLine!==false;
var _netProbing=false, _netProbeAt=0;
/* Messrunde 1 (Befund 6a): In der Hülle liegt version.json GEBÜNDELT — der Ping gelang dort immer, _netUp blieb true, und
 * netLikelyUp hing allein an navigator.onLine (true, sobald irgendeine Schnittstelle steht: Mobilfunk ohne App-Daten, VPN,
 * AWDL). Ein Gerät ohne WLAN zeigte „🟢 Echtzeit-Modus“, verhielt sich im Mesh als Gateway (hb online, meshGatewayFlush,
 * loadPatients-Online-Zweig, MasterMedic-Regel „online entscheidet der Server“) und lud doch nichts hoch. Die Hülle prüft
 * jetzt die echte Server-Erreichbarkeit: POST auf die RPC argus_server_time (ohne Anmeldung 200, nur apikey; derselbe Host
 * wie alle Datenaufrufe), 3 s, no-store. Nicht der Health-Endpunkt des Anmeldedienstes: der fehlt im schlanken Eigenbetrieb
 * (PostgreSQL + PostgREST, SELF-HOSTING §2) — die Hülle hielte sich dort dauerhaft für offline. Die PWA pingt unverändert
 * ./version.json (Same-Origin, zeigt Netz zum Hosting). */
var NET_PROBE_PATH='/rest/v1/rpc/argus_server_time';
var NET_PROBE_IDLE_MS=20000;   /* Hülle: auch ohne Offenes alle 20 s prüfen (ein falsches „online“ korrigiert sich sonst nie) */
function netProbeZiel(){
  if(isNativeShell() && SUPA_URL) return {url:SUPA_URL+NET_PROBE_PATH, headers:{apikey:SUPA_KEY, 'Content-Type':'application/json'}, method:'POST', body:'{}'};
  return {url:'./version.json?ping='+Date.now(), headers:null};
}
function netProbe(){
  return new Promise(function(resolve){
    var done=false, ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    var to=setTimeout(function(){ if(!done){ done=true; try{ctrl&&ctrl.abort();}catch(e){} resolve(false); } },3000);
    var z=netProbeZiel(), opt={cache:'no-store',signal:ctrl?ctrl.signal:undefined};
    if(z.headers) opt.headers=z.headers;
    if(z.method){ opt.method=z.method; opt.body=z.body; }
    fetch(z.url,opt)
      .then(function(r){ if(!done){ done=true; clearTimeout(to); resolve(!!(r&&r.ok)); } })
      .catch(function(){ if(!done){ done=true; clearTimeout(to); resolve(false); } });
  });
}
/* Messrunde 1 (Befund 7b): Offenes, das ein Gerät mit Netz nachreichen muss (Warteschlangen CCP/Lage/Verbund/MasterMedic) —
 * hält den Wächter wach wie offene Patientensätze. Wirft nie. */
function nachreichOffen(){
  try{ return ccpPendingLesen().length>0 || lagePendingLesen().length>0 || verbundPendingLesen().length>0 || !!mmPendingLesen(); }catch(e){ return false; }
}
var NET_KETTE_RETRY_MS=30000;   /* Befund 7b: Sicherheitsnetz — mit Netz und Offenem die Nachreich-Kette spätestens alle 30 s erneut anstoßen */
function netWaechterTick(){
  if(_training || _netProbing) return;
  var pendingLeave=leavePending(), huelle=isNativeShell();   /* vorgemerkte Abmeldung hält den Wächter auch ohne aktiven CCP wach */
  /* Befund 7c: Die Hülle prüft auch OHNE CCP (Startseite) — sonst blieb ein falsches „online“ (navigator.onLine true ohne
   * Netz) bis zum ersten CCP stehen, Eröffnen und „CCP beitreten“ liefen in Server-Zeitlimits (bis 10 s) und der Suchmodus startete nie. */
  if(!huelle && !_ccpId && !pendingLeave && !(_lateN>0)) return;
  var pending=pendingLeave || _lateN>0 || nachreichOffen(); try{ pending=pending||patients.some(function(p){return p._dirty;}); }catch(e){}   /* _lateN: fremde _dirty-Nachzügler */
  var now=rawNowMs();
  if(_netUp && navigator.onLine!==false){
    if(!pending){
      /* alles gut → PWA: kein Ping nötig. Hülle (Befund 6a): im Vordergrund alle NET_PROBE_IDLE_MS gegen den Server prüfen —
       * schlägt die Probe fehl, fällt _netUp (unten) und der Banner wechselt auf 🔴. */
      if(!huelle || document.hidden || now-_netProbeAt<NET_PROBE_IDLE_MS) return;
    }else if(!document.hidden && _schemaV>=37 && nachreichOffen() && now-_ketteAt>=NET_KETTE_RETRY_MS){
      try{ nachreichenKette(); }catch(e){}   /* Befund 7b: ein gescheiterter erster Lauf blieb sonst bis zum nächsten online-Ereignis liegen */
    }
  }
  netProbeLauf();
}
/* Probe jetzt (Wächter-Takt, online-Ereignis, Vordergrund). Rückkehr (false → true) repariert sofort und stößt die
 * Nachreich-Kette an (Befund 7b: nicht erst über probeSchema → RPC → Kette). Wirft nie. */
function netProbeLauf(){
  if(_netProbing) return;
  _netProbing=true; _netProbeAt=rawNowMs();
  netProbe().then(function(up){
    _netProbing=false;
    if(up && !_netUp){
      _netUp=true;                 /* Verbindung zurück → sofort reparieren, nicht aufs 'online'-Event warten */
      try{ render(); }catch(e){}   /* Banner sofort auf 🟢 */
      try{ refreshJwtIfNeeded(); }catch(e){}
      try{ if(_sb && _sb.realtime && _sb.realtime.setAuth && currentJwt) _sb.realtime.setAuth(currentJwt); }catch(e){}
      try{ if(_schemaV>=37) nachreichenKette(); }catch(e){}   /* Befund 7b: Lage → CCP → Geräte → Verbund → Patienten → Abschluss sofort */
      try{ healRealtime(); }catch(e){}
      try{ flushPendingClose(); }catch(e){}
      try{ flushLatePatients(); }catch(e){}
      try{ probeSchema(1); }catch(e){}
      try{ loadMeta().then(function(){ return loadPatients(); }).then(function(){ try{render();}catch(e){} }); }catch(e){}
      try{ checkForUpdate(); }catch(e){}
      try{ prefetchNum(); }catch(e){}
      try{ flushPendingLeave(); }catch(e){}
      try{ meshGatewayFlush(); }catch(e){}   /* Befund 7b: Gateway — Offenes aus dem Mesh sofort hochladen */
      try{ deviceHeartbeat(); }catch(e){}
    } else {
      var was=_netUp; _netUp=up;
      if(was!==up){ try{ render(); }catch(e){} }   /* Banner sofort auf 🔴/🟢 umstellen; Startseite startet dabei den Suchmodus (Befund 7c) */
    }
  });
}
setInterval(netWaechterTick,4000);
/* Lebenszeichen (Phase 6.5): nur Vordergrund + aktiver CCP (Guards in deviceHeartbeat). Der
 * MasterMedic holt zusätzlich alle 10 s die Geräteliste (Anzeige übernimmt das 3,5-s-Render). */
setInterval(function(){ try{ deviceHeartbeat(); }catch(e){} try{ meshStart(); }catch(e){} }, HB_INTERVAL_MS);   /* Phase 6.7: Mesh-Start nachholen, sobald Gerätenummer/Geheimnis vorliegen (in der PWA ein Leeraufruf) */
setInterval(function(){ try{ pollDevices(); }catch(e){} }, 10000);
/* B7 (Plan 06.5-10): Schema-Re-Probe — wurde die Migration erst nach dem App-Start eingespielt (oder lief die Probe
 * im Funkloch ins Leere), bliebe _schemaV sonst bis zum nächsten Neustart zu niedrig. Alle 3 min, solange v<37 und Verbindung vermutet.
 * Bis v37 (Phase 6.10: Nachreichen offline eröffneter CCPs, Präsidiums-Schlüssel) — laufende Geräte erkennen 0037 ohne Neustart. */
setInterval(function(){ try{ if(_schemaV<37 && netLikelyUp() && !document.hidden && !_revokedLocked && sb() && accessGet('argus_jwt')) probeSchema(1); }catch(e){} }, 180000);
/* Phase 6.10 (D6.10-15): Anmeldung periodisch still verlängern (alle 30 min; offline/frisch kehrt refreshJwtIfNeeded sofort zurück). */
setInterval(function(){ try{ if(!_training && !document.hidden && !_revokedLocked) Promise.resolve(refreshJwtIfNeeded()).catch(function(){}); }catch(e){} }, 1800000);
/* Nachzügler (Phase 6.5): nur solange fremde/abgeschlossene _dirty-Patienten lokal liegen (_lateN). */
setInterval(function(){ try{ if(_lateN>0) flushLatePatients(); }catch(e){} }, 60000);
/* Lokale Löschfristen (alle 5 min) + gebündeltes Herkunftsprotokoll (höchstens 1/min). */
setInterval(runLocalPurge, 300000);
setInterval(flushHerkunft, 60000);
setTimeout(runLocalPurge, 4000);   /* auch wenn der Start früh endet (Präsidium/Sperre) */
</script>
