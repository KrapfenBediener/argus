    'Funkspruch: Kennung jetzt in der deutschen Buchstabiertafel (CCP Anton), Ort ohne Zusatz, Tourniquets nicht mehr Teil der Meldung.'

  '0.34.0': [
    'Gerätestatus im CCP: Der MasterMedic sieht im Hauptmenü, welche Geräte verbunden, außer Reichweite, abgemeldet oder verlassen sind und wie viele Patienten dort noch offen sind.',
    'CCP bewusst verlassen und wieder beitreten: Beim Zurückgehen aus dem Hauptmenü fragt ARGUS nach; wer wieder beitritt, behält seine Gerätenummer.',
    'Abgleich pro Feldgruppe: Ändern zwei Geräte gleichzeitig verschiedene Dinge am selben Patienten (z. B. Prio und Vitalwerte), bleiben beide Änderungen erhalten. Echte Konflikte zeigt ARGUS dem MasterMedic mit dem überschriebenen Stand.',
    'Verworfene Patienten kommen nicht mehr zurück und lassen sich vom MasterMedic mit „Rückholen“ wiederherstellen. Geht die Uhr eines Geräts falsch, wird der Versatz erkannt und herausgerechnet.',
    'Abschluss mit Vollständigkeitsprüfung: Der Dialog zeigt, von welchen Geräten noch Daten fehlen. Wer beim Abschluss offline war, reicht seine Patienten bis 24 Stunden danach nach; nicht übertragene Daten werden lokal nach festen Fristen gelöscht.',

    'Geführtes Training um „Funkspruch“ und „CCP verlassen / wieder beitreten“ ergänzt.'

  '0.33.22': [
    'Sofort-Optionen nach dem Anlegen (Prio, TQ, Foto): Änderungen in schneller Folge gingen verloren, und ein Foto über die Sofort-Option wurde nicht gespeichert, weil die Ansicht im Hintergrund neu aufgebaut wurde, während die Kamera offen war. Beides behoben (Feedback Einsatztrainer PP Einsatz).'
  ],
  '0.33.21': [
    'Ein Dauercode schaltet jetzt Echtbetrieb UND Schulungsumgebung des Präsidiums frei (kein zweiter Code mehr nötig). Beim Freischalten holt ARGUS beide Zugänge, beim Wechsel im Präsidium-Picker wird automatisch umgeschaltet. Geräte, die vorher freigeschaltet wurden, holen den fehlenden Zugang beim nächsten Start online nach.'
  ],
  '0.33.20': [
    'Schulungsumgebung: „Neue CCP eröffnen" scheiterte auf Geräten, die Echtbetrieb und Schulung mit zwei Codes freigeschaltet hatten — die App schrieb mit dem Zugang des zuletzt eingegebenen Codes, der Server lehnte ab, die App sagte nur „Abgebrochen". ARGUS merkt sich jetzt je Präsidium den passenden Zugang und schaltet beim Wechsel um. Fehlt er, wird einmalig der Code abgefragt.',
    'Server-Fehler beim CCP-Anlegen werden jetzt im Klartext angezeigt statt als „Abgebrochen".'
  ],
  '0.33.19': [
    'Schulung auf Android: Nach „OK" im Ort-Dialog erschien derselbe Dialog erneut (ein Geister-Tipp traf den darunterliegenden Knopf „Neue CCP eröffnen"). Dialoge fangen diesen Nach-Tipp jetzt ab — gilt für alle Eingabe- und Auswahl-Dialoge.'
  ],
  '0.33.18': [
    'Android, zweiter Schritt: Eingabe-Dialoge (CCP-Name, Tourniquet-Uhrzeit) sitzen jetzt oben und springen beim Auf-/Zuklappen der Tastatur nicht mehr; ein Tipp daneben bricht nicht mehr ab — Abbrechen nur noch über den Knopf.'
  ],
  '0.33.17': [
    'Android-Fehler behoben: „OK" in Eingabe-Dialogen (z. B. CCP-Name bei der Eröffnung) wurde beim Zuklappen der Tastatur als „Abbrechen" gewertet. Der erste Tipp auf OK zählt jetzt zuverlässig; Enter bestätigt ebenfalls.'
  ],
  '0.33.16': [
    'AT-MIST-Übergabekarte fachlich korrigiert: Das Tourniquet steht jetzt vollständig unter „T — Maßnahmen" (Anlageort, Anlagezeit und laufende Dauer in Rot). „T — Zeiten" zeigt nur noch den Zeitpunkt der Erfassung. Gilt für Karte, Übergabe-Export und Protokolldruck der Leitung.'
  ],
  '0.33.15': [
    '„Neue CCP eröffnen" abbrechen führt jetzt immer zurück auf den Startbildschirm des Präsidiums (statt in eine zufällige offene CCP). Der bisherige CCP bleibt über „Aktive CCP fortsetzen" erreichbar.'
  ],
  '0.33.14': [
    'Nach der Rückkehr ins Netz bekommen neu angelegte Patienten wieder die normale fortlaufende Nummer („A-7") statt der Gerätenummer — ein hängender Hintergrund-Aufruf konnte die Nummern-Reservierung dauerhaft blockieren.'
  ],
  '0.33.13': [
    'Statusanzeige ehrlich: „🟢 Echtzeit-Modus" erscheint nur noch bei echter Verbindung — offline steht sofort „🔴 Lokaler Modus".',
    '„Neue CCP eröffnen" lässt sich jetzt wirklich abbrechen: „Abbrechen" bei der Ort-Abfrage legt KEINEN CCP mehr an, der bisherige CCP bleibt erhalten (auch im Training).'
  ],
  '0.33.12': [
    'Offline-Freeze behoben: Keine Aktion wartet mehr auf das Netz. Speichern, Prio, TQ, Kategorie, Abtransport, Patient öffnen — alles sofort, auch offline. Der Abgleich mit der Cloud läuft im Hintergrund.',
    'Nummern wie vorgesehen: online fortlaufend „A-7" (die nächste Nummer wird im Hintergrund vorab bereitgehalten — kein Warten, keine Sprünge). Nur offline erfasste Patienten tragen die Gerätenummer, z. B. „A-8-2".'
  ],
  '0.33.11': [
    'Patienten anlegen ist jetzt sofort — auch offline. Die App wartet beim Sichten nie mehr auf das Netz (local-first): Nummer und Speichern passieren lokal, der Abgleich läuft im Hintergrund.',
    'Nummern eindeutig ohne Warten: Jedes Gerät zählt lokal. Einzelgerät bleibt „A-7"; ein zweites Gerät im selben CCP zeigt „A-7-2" (Gerätenummer). So nie doppelte Nummern, online wie offline.'
  ],
  '0.33.10': [
    'Keine doppelten Nummern mehr bei mehreren Geräten im Offline-Betrieb: Online vergibt der Server die Nummer wie bisher („A-7"). Offline erfasste Patienten tragen zusätzlich die Gerätenummer („A-7-2") — so können zwei Geräte nie dieselbe Nummer vergeben, und man erkennt offline erfasste Patienten. Ersteller = Gerät 1, Beitritte 2, 3 …'
  ],
  '0.33.9': [
    'Checkliste jetzt pro CCP getrennt: Einträge aus einem CCP erscheinen nicht mehr fälschlich in anderen CCPs (vorher lag die Checkliste unter einem gemeinsamen Speicher).',
    '„CCP zusammenführen" liegt jetzt auf der CCP-Hauptseite — direkt bei „CCP abschließen" (nicht mehr versteckt in der Übersicht).'
  ],
  '0.33.8': [
    'Schnellere Rückkehr aus dem Offline-Modus: Die App wartet nicht mehr nur auf das (auf iPhones oft träge) „online"-Signal, sondern prüft die Verbindung aktiv und synchronisiert bei Rückkehr sofort.'
  ],
  '0.33.7': [
    'Geführtes Training verbessert: CCP-Eröffnung spielt jetzt Benennung und (simulierte) Standorterfassung mit durch; ein „‹ vorherige Lektion"-Knopf erlaubt den Rücksprung; und die Sofort-Optionen (Prio, TQ, Foto, öffnen, Verwerfen) werden einzeln gezeigt.'
  ],
  '0.33.6': [
    'CCP-Auswahl klarer: Die Örtlichkeit steht jetzt als gut lesbare Hauptzeile, die Kennung (CCP A/B/…) als kompaktes Badge daneben.',
    '„CCPs zusammenführen" ist nicht mehr versteckt: prominenter Knopf (statt blassem Link) in der Patientenübersicht beim MasterMedic.'
  ],
  '0.33.5': [
    'Doppelte laufende Nummern im Offline-Betrieb behoben: Jedes Gerät reserviert jetzt vorab einen eigenen Nummernblock und vergibt laufende Nummern daraus. Dadurch können zwei Geräte im selben CCP auch ohne Verbindung keine Nummer mehr doppelt vergeben. (Nebeneffekt: Bei mehreren Geräten können die Nummern Sprünge haben — das ist gewollt und verhindert Dubletten.)'
  ],
  '0.33.4': [
    'Übergabe-Karte präziser: Unter „T — Maßnahmen" steht das Tourniquet jetzt mit Anlageort (z. B. „Bein li") und Anlagezeit — statt der doppelten Dauer-Angabe. Die laufende TQ-Dauer bleibt rot unter „T — Zeiten". Gilt auch für den Protokoll-Druck der Leitung.'
  ],
  '0.33.3': [
    'Aufräum- und Qualitätssicherungs-Release: die Schulungs-Startseite lädt etwas schneller, und im Hintergrund sichern jetzt automatisierte Prüfungen die App gegen Rückschritte ab. An der Bedienung ändert sich nichts.'
  ],
  '0.33.2': [
    'Geführtes Training: „Zurück zur Startseite" am Ende (nach der Übergabe-Karte) funktioniert jetzt zuverlässig — der ‹-Knopf war markiert, ließ sich aber nicht antippen. Und die Lektion „Patienten öffnen" markiert auf dem Handy die immer sichtbare obere Kachel-Reihe, statt dass untere Schaltflächen hinter dem Hinweisfenster verschwinden.'
  ],
  '0.33.1': [
    'Geführtes Training — Feinschliff: Auf schmalen Displays werden jetzt auch mehrere markierte Schaltflächen sauber ins Bild gescrollt (vorher konnten untere Buttons hinter dem Hinweisfenster verschwinden). Die Foto-Erklärung sitzt jetzt direkt in der Patientenmaske, und der Schritt „CCP abschließen" zeigt den passenden Knopf.'
  ],
  '0.33.0': [
    'Schulungsumgebung steuern mit einem klaren Schalter: Ist die Umgebung leer, legt „Schulungsumgebung befüllen" ein Demo-Szenario an (6 CCPs mit Beispiel-Patienten); ist sie gefüllt, entfernt „Schulungsumgebung leeren" alle Übungsdaten. Ersetzt das frühere „Schulung zurücksetzen".',
    'Die Schulungs-Steuerung steht jetzt auch der Admin-Rolle zur Verfügung — nicht mehr nur dem MasterUser; eine Anmeldung auf der Leitungs-Seite ist dafür nicht nötig.'
  ],
  '0.32.4': [
    'Geführtes Training robuster: Wenn man während einer Lektion unerwartet „zurück" tippt, verhakt sich das Intro nicht mehr. Statt blind weiterzulaufen, zeigt der Coach einen Rückkehr-Hinweis — sobald man wieder in der passenden Ansicht ist, geht es am selben Schritt weiter.'
  ],
  '0.32.3': [
    'Geführtes Training: In der Lektion „Patienten öffnen" wurde die obere Zähl-Reihe fälschlich abgedunkelt statt hervorgehoben. Das Highlighting markiert jetzt wieder sauber alle drei Wege (Zähl-Kacheln, Farb-Buttons, „Alle Patienten").'
  ],
  '0.32.2': [
    'Sicherheits-Härtung der Foto-Anzeige: Patientenfotos werden vor der Anzeige streng als Bildformat geprüft. Funktional ändert sich nichts — gültige Fotos werden wie gewohnt angezeigt.'
  ],
  '0.32.1': [
    'Geführtes Training erweitert: eine neue Lektion erklärt die automatische Standort-Erfassung des CCP (per GPS beim Eröffnen) und wie die Leitung/FLZ den CCP dadurch als Koordinate in der Lage sieht.',
    'Kleine Drehbuch-Korrektur: In der Patientenübersicht sind jetzt alle drei Wege zur Patientenliste markiert (Zähl-Kacheln, Farb-Buttons, „Alle Patienten").'
  ],
  '0.32.0': [
    'Persönliche Anmeldung: Ein Freischalt-Feld genügt — ARGUS erkennt automatisch, ob es ein persönlicher oder ein Gruppen-Code ist. Nach dem Login erscheint dein Präsidium direkt.',
    'Echtbetrieb oder Schulung: Beim Anmelden wählst du mit zwei großen Reitern, in welchem Modus du arbeitest. Standard ist Echtbetrieb; der Schulungsreiter zeigt einen unübersehbaren gelben Banner — damit ist klar, dass keine echten Patientendaten eingegeben werden.',
    'Echtbetrieb und Schulungsumgebung sind strikt getrennt — ein versehentliches Vermischen ist nicht möglich.'
  ],
  '0.31.0': [
    'Patientenfotos sind jetzt dauerhaft verfügbar — der Kamera-Button erscheint auf allen Geräten, ohne dass die Leitung Fotos erst je Einsatz freischalten muss. Fotos dienen weiterhin nur der Wiedererkennung (statt Name) und werden 72 Std nach Einsatzende automatisch gelöscht.'
  ],
  '0.30.0': [
    'Erfassen nach tacSTART ist wieder geführt: Schritt für Schritt durch die Vorsichtung (gehfähig? → Atmung → Atemfrequenz → Puls → Befehle) bis zur Kategorie — wie aus den früheren Versionen gewohnt. Die Direktzuordnung bleibt als Ausnahme erreichbar.'
  ],
  '0.28.1': [
    'Korrekturen aus dem Code-Review: AT-MIST-Druck der Leitung zeigt die Tourniquet-Zeit jetzt zuverlässig (mit Anlagezeit und Dauer bis Einsatzende); Schulungs-Reset-Dialog nennt das jeweilige Präsidium.'
  ],
  '0.28.0': [

    'Jedes Präsidium kann eine eigene Schulungsumgebung erhalten — Training und Reset stehen dort automatisch zur Verfügung (Anlage über die Leitung).',

  '0.27.2': [
    'Training repariert: Der TQ-Dialog (Zeitpunkt + Extremität) erschien in der Tourniquet-Lektion unter der Abdunklung und war halb blockiert — Fenster liegen jetzt immer über dem Trainings-Spotlight.'
  ],
  '0.27.1': [

    'Nach jeder Erfassung erscheinen die Sofort-Optionen (Prio/TQ/Foto/öffnen/Verwerfen) als Pop-up mit „Nächsten Patienten erfassen" — danach wie gewohnt unten verfügbar.',
    'Lageansicht (FLZ): Verbünde erscheinen als EINE kompakte Karte mit Gesamtzahlen (eine gemeinsame Patientenliste) — je Mitglieds-CCP bleibt die Standort-Zeile.',

  '0.27.0': [

    'tacSTART startet direkt bei „gehfähig?" — der Vorschalt-Schritt „Kritische Blutung?" ist entfernt (die Versorgung ist zu diesem Zeitpunkt bereits erfolgt).',
    'Foto-Schnellaktion: Direkt nach der Erfassung lässt sich beim zuletzt angelegten Patienten ein Foto aufnehmen — ohne Umweg.',

  '0.26.1': [
    'TQ-Anzeige klarer: „TQ (Bein re) läuft seit 12:34 min — tippen zum Stoppen" statt des missverständlichen „TQ läuft · 12:34 — stoppen".',

    'Lageansicht: Das FLZ kann die Ortsbezeichnung eines CCP nachtragen (✏️, protokolliert); mehrere Verbünde werden als „VERBUND 1/2" unterschieden.'
  ],
  '0.26.0': [
    'Nummern heißen jetzt überall Kennung-Nummer (z. B. A-12) — genau so auf die Haut schreiben. Beim Zusammenführen von CCPs muss nichts mehr umbeschriftet werden.',

  '0.25.1': [

  '0.24.0': [

  '0.23.0': [

  '0.22.0': [
    'Sparsame Namenserfassung: Am Namensfeld und an den Freitextfeldern stehen jetzt kurze Hinweise — Name nur erfassen, wenn für Versorgung/Übergabe nötig; keine Namen Dritter in Freitexten.',
    'Patientenliste zeigt konsequent Nummern statt Namen — die Nummer identifiziert den Patienten (pseudonym). Auf der Übergabekarte und im Übergabe-Export erscheint der Name weiterhin, wenn erfasst.'

  '0.21.1': [
    'Foto-Governance (nur Leitungs-Geräte mit MasterUser-Token): Fotos ausgecheckter Patienten und abgeschlossener Einsätze sind jetzt in einem geschützten Bereich einsehbar — jeder Abruf wird protokolliert. Foto-Fristen lassen sich dort nur mit Begründung um je 72 Std verlängern.'

  '0.21.0': [
    'Fotos erlauben (MasterMedic): Patientenfotos sind jetzt standardmäßig aus. Die Leitung schaltet sie je Einsatz in der Patientenübersicht ein — erst dann erscheint der Kamera-Button auf allen Geräten.',

  '0.20.0': [
    'Einsatz abschließen (MasterMedic): In der Patientenübersicht beendest du den Einsatz — mit optionalem Übergabe-Export: alle Patienten als Datei (JSON) plus druckbare AT-MIST-Gesamtansicht.',

  '0.18.0': [

  '0.17.0': [

  '0.16.2': [

  '0.16.0': [

  '0.7.0': [

/* Messrunde 1 (Befund 7c): Local-first-Budget — auf ein Promise höchstens ms warten. Ergebnis: Wert; null bei Fehler;
 * undefined nach Ablauf (der Aufruf läuft im Hintergrund weiter, der Aufrufer arbeitet lokal weiter). Wirft nie. */
var CCP_ERO_BUDGET_MS=1500;
function budgetWarten(p, ms){
  return new Promise(function(resolve){
    var t=setTimeout(function(){ resolve(undefined); }, ms);
    try{ Promise.resolve(p).then(function(v){ clearTimeout(t); resolve(v); }, function(){ clearTimeout(t); resolve(null); }); }
    catch(e){ clearTimeout(t); resolve(null); }
  });
}

/* ── Einladungs-System ─────────────────────────────────────────────────── */
/* src optional (Phase 6.6: argus://unlock#code=… aus getLaunchUrl/appUrlOpen);
 * ohne Argument wie bisher window.location.hash. */
function extractInviteToken(src){
  var hash=(typeof src==='string')?src:(window.location.hash||'');
  var m=hash.match(/[#&]inv=([a-f0-9]{32})/i);
  return m?m[1]:null;
}
function extractInviteCode(src){
  var hash=(typeof src==='string')?src:(window.location.hash||'');
  var m=hash.match(/[#&]code=([A-Za-z0-9]{4}-?[A-Za-z0-9]{4})/i);
  return m?m[1].toUpperCase():null;
}
/* ── Deep-Link argus://unlock#code=… (Phase 6.6, D6.6-04) ──────────────────
 * launchHashFrom: kanonisches Fragment NUR aus dem validierten Wert
 * (#code=XXXX-XXXX bzw. #inv=<32 hex>) — Fremdinhalt der URL wird verworfen
 * und erreicht weder Hash noch DOM (T-06.6-10). Sonst ''. */
function launchHashFrom(url){
  if(!url || typeof url!=='string') return '';
  var i=url.indexOf('#'); if(i<0) return '';
  var frag=url.slice(i);
  var code=extractInviteCode(frag); if(code) return '#code='+code;
  var tok=extractInviteToken(frag); if(tok) return '#inv='+tok;
  return '';
}
/* Sitzungs-Guard (T-06.6-12): getLaunchUrl() liefert nach einem Reload weiter
 * die Kaltstart-URL und appUrlOpen puffert (retainUntilConsumed) → jede URL
 * wird je Sitzung nur einmal verarbeitet, sonst Reload-Schleife / doppelter
 * Exchange. Liste statt Einzelwert: nach einem Warmstart-Link darf die alte
 * Kaltstart-URL nicht erneut greifen. Ohne sessionStorage: kein Guard, kein Absturz. */
function consumeLaunchUrl(url){
  if(!url) return false;
  /* Nachprüfung 26.10.2026 (N-Web): nie die URL selbst (sie trägt den Code/Token) in sessionStorage — nur einen Digest
   * (FNV-1a 32 Bit über UTF-16-Einheiten, hier eigenständig, damit die Funktion in sich geschlossen bleibt). */
  var d=0x811c9dc5, i, u=''+url;
  for(i=0;i<u.length;i++){ d^=u.charCodeAt(i); d+=(d<<1)+(d<<4)+(d<<7)+(d<<8)+(d<<24); }
  var key='d'+(d>>>0).toString(16)+'.'+u.length;
  try{
    var seen=(sessionStorage.getItem('argus_launch_consumed')||'').split('\n');
    if(seen.indexOf(key)>=0) return false;
    seen.push(key);
    sessionStorage.setItem('argus_launch_consumed', seen.filter(function(x){ return !!x; }).slice(-20).join('\n'));
  }catch(e){}
  return true;
}
/* Warmstart (App läuft, Link kommt per appUrlOpen): Hash setzen + Reload.
 * Bewusst KEIN zweiter Einlösepfad — init() behandelt #code=/#inv= vollständig
 * (exchangeCode, Freischaltung, Schulungs-Zwilling, Master-Flag, Präsidium);
 * ein Reload aus dem Bundle ist offline und sofort (Local-first, aller Zustand
 * liegt persistent). Nur toast(), kein nativer Dialog (D6.6-06). */
function handleIncomingUrl(url){
  var h=launchHashFrom(url);
  if(!h || !consumeLaunchUrl(url)) return;
  try{ history.replaceState(null,'',window.location.pathname+h); }catch(e){ window.location.hash=h.slice(1); }
  toast('Freischalt-Link erkannt — ARGUS lädt neu');
  setTimeout(function(){ location.reload(); },700);
}
/* ── Geräte-Freischaltungen: welche Präsidien darf dieses Gerät sehen ──────
 * Liste {p:praesidium_id, exp:ms|0}. exp=0 = dauerhaft, sonst Ablaufzeitpunkt.
 * Master-Geräte (_isMaster) umgehen die Filterung und sehen alle Präsidien. */
function getUnlocked(){
  var arr=[]; try{ arr=JSON.parse(localStorage.getItem('argus_unlocked')||'[]'); }catch(e){ arr=[]; }
  if(!Array.isArray(arr)) arr=[];
  var now=nowMs(); var live=arr.filter(function(u){return u&&u.p&&(!u.exp||u.exp>now);});
  if(live.length!==arr.length){ try{localStorage.setItem('argus_unlocked',JSON.stringify(live));}catch(e){} }
  return live;

function isUnlocked(pid){ if(_isMaster) return true; return getUnlocked().some(function(u){return u.p===pid;}); }
function removeUnlock(pid){ var arr=getUnlocked().filter(function(u){return u.p!==pid;}); try{localStorage.setItem('argus_unlocked',JSON.stringify(arr));}catch(e){} }

 * Wer Echtbetrieb UND Schulung mit zwei Codes freigeschaltet hatte und dann im

/* ── Phase 6.10 (D6.10-04/-15/-19): Einsatzbereitschaft ohne Netz ─────────────
 * Präsidiums-Schlüssel (nur Entdecken/Beitritt/Anklopfen im Mesh, nie Patientendaten) liegt AUSSCHLIESSLICH in
 * der Zugangsfassade (Hülle: Keychain) unter argus_praes_key = JSON {"<pid>": {keys:[{e,k}], at}}. Geholt nach jeder
 * Anmeldung (sofort) und bei jeder Schema-Probe ≥ 37 (höchstens alle 6 h) — so kommt eine Erneuerung durch die
 * Verwaltung beim nächsten Netzkontakt an. Kein automatischer Ablauf. Eine abgelaufene Anmeldung blockiert offline

var _praesKeyLaedt=false, _praesKeyNachAnmeldung=false;   /* laufender Abruf · nach einer Anmeldung sofort (ohne 6-h-Drossel) holen */
function praesKeyParse(raw){

/* {keys:[{e,k}], at} des Präsidiums oder null; nur gültige Schlüssel (Epoche ≥ 1, 32 Hex klein). */
function praesKeyFuer(raw, pid){
  if(!pid) return null;

/* Holt den Präsidiums-Schlüssel (fire-and-forget, wirft nie, wird nie awaitet). Nur ab Schema 37, mit Präsidium, nie im Training. */
async function ladePraesKey(client){
  try{
    if(_schemaV<37 || !_praesidiumId || _training || !client || _praesKeyLaedt) return false;
    var cur=praesKeyFuer(accessGet('argus_praes_key'), _praesidiumId);
    if(cur && !_praesKeyNachAnmeldung && nowMs()-cur.at < 6*3600000) return false;   /* Drossel 6 h */
    _praesKeyLaedt=true;
    try{
      var r=await qt(client.rpc('argus_praesidium_meshkey', _isMaster ? {p_praesidium_id:_praesidiumId} : {}));
      var d=(r && !r.error) ? r.data : null;
      if(d && d.ok===true && Array.isArray(d.keys)){
        var pid=String(d.praesidium_id||_praesidiumId), tmp={};
        tmp[pid]={keys:d.keys, at:nowMs()};

          m[pid]=gut;
          accessSet('argus_praes_key', JSON.stringify(m));
          _praesKeyNachAnmeldung=false;
          return true;
        }
      }
    }finally{ _praesKeyLaedt=false; }
  }catch(e){}
  return false;
}
/* Rein: Hinweistext zur Einsatzbereitschaft ('' = nichts anzeigen). exp = Ablauf der Anmeldung (ms), hasKey = Schlüssel da. */
function einsatzbereitText(exp, hasKey, now){
  if(!hasKey) return 'Noch nicht einsatzbereit ohne Netz — einmal mit Netz anmelden';
  exp=Number(exp);
  if(!isFinite(exp) || exp<=0) return '';
  var rest=exp-now, TAG=86400000;
  if(rest<=0) return 'Anmeldung abgelaufen — Gerät arbeitet weiter, Hochladen nach dem nächsten Netzkontakt';
  if(rest>7*TAG) return '';
  if(rest<TAG) return 'Anmeldung läuft heute ab — einmal mit Netz öffnen';
  var n=Math.ceil(rest/TAG);
  return 'Anmeldung läuft in '+n+' '+(n===1?'Tag':'Tagen')+' ab — einmal mit Netz öffnen';
}
/* Hinweis für Startseite/Hauptmenü. Schlüssel zählt nur in der Hülle (Mesh) und erst, wenn der Server ihn ausgibt (≥ 37). */
function einsatzbereitHinweis(){
  try{
    if(_training || !_praesidiumId) return '';
    var exp=parseInt(accessGet('argus_jwt_exp')||'0',10)||0;
    var mitKey=!isNativeShell() || _schemaV<37 || !!praesKeyFuer(accessGet('argus_praes_key'), _praesidiumId);
    return einsatzbereitText(exp, mitKey, nowMs());
  }catch(e){ return ''; }
}
function jwtClaims(jwt){
  try{
    var p=(jwt||accessGet('argus_jwt')||'').split('.')[1]; if(!p) return null;
    p=p.replace(/-/g,'+').replace(/_/g,'/'); while(p.length%4) p+='=';
    var bin=atob(p), s=''; for(var i=0;i<bin.length;i++) s+='%'+('00'+bin.charCodeAt(i).toString(16)).slice(-2);
    return JSON.parse(decodeURIComponent(s));
  }catch(e){ return null; }
}
/* Sammelcode (0024): nach dem Echt-Exchange zusätzlich den Schulungs-Zwilling
 * freischalten. Stiller Best-Effort — ohne Twin/offline passiert nichts. Danach
 * das aktive JWT wieder auf das Echt-Präsidium zurückstellen. */
async function unlockTwinFor(code, uv){
  if(!uv || uv.is_master || !uv.praesidium_id) return null;

  try{ tw=await exchangeCode(code,'schulung'); }catch(e){ tw=null; }
  if(tw && tw.praesidium_id && tw.praesidium_id!==uv.praesidium_id){
    addUnlock(tw.praesidium_id, uv.temporary?(uv.ttl_hours||24):null);
  }
  ensureJwtFor(uv.praesidium_id);   /* aktives JWT = Echt-Präsidium (Twin liegt im Map) */
  return tw;
}
/* true = aktives JWT passt zu pid (oder wurde passend umgeschaltet); false = Code neu nötig */
function ensureJwtFor(pid){
  if(!pid || _isMaster) return true;
  if(_argusRole && _usbnk) return true;             /* Person-Sitzung: Scope-Wechsel läuft über Re-Exchange (pickertab) */
  var c=jwtClaims(); if(c && c.praesidium_id===pid) return true;
  if(c && c.is_master) return true;
  var e=pidJwtMap()[pid];
  if(e && e.jwt && (!e.exp || e.exp>nowMs() || !netLikelyUp())){   /* Phase 6.10 (D6.10-15): offline arbeitet auch ein abgelaufener Zugang weiter — Verlängerung beim nächsten Netzkontakt */
    try{

      if(e.code) accessSet('argus_code',e.code);

  }

}
async function consumeSingleUse(td){

/* Zugangscode XXXX-XXXX: kryptografischer Zufall (crypto.getRandomValues) wie in der Verwaltung — Alphabet 32 Zeichen,
 * ein Byte je Zeichen mit & 31 ist gleichverteilt (Sicherheitsprüfung 26.10.2026, Befund 8). */
function genShortCode(){
  var AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var b=new Uint8Array(8); crypto.getRandomValues(b);
  var s=''; for(var i=0;i<8;i++){ s+=AL[b[i]&31]; if(i===3) s+='-'; }
  return s;
}
function genToken(){ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a,function(b){return b.toString(16).padStart(2,'0');}).join(''); }
function addUnlock(pid, ttlHours){

async function validateInviteToken(token){
  var client=sb(); if(!client) return null;
  var clean=token.replace(/[\s\-]/g,'').toUpperCase();
  /* Kein join in diesem Query — join via .single() + PGRST116-Fehler
   * schlägt in Supabase JS v2 geräuschlos fehl. Stattdessen:
   * 1) Token ohne Join holen (maybeSingle → nie PGRST116)
   * 2) Presidiumsname separat nachladen */
  var fields='token,praesidium_id,is_master,label,short_code,temporary,ttl_hours,single_use,used_at';
  var row=null;
  try{
    if(clean.length===8){
      var sc=clean.slice(0,4)+'-'+clean.slice(4);
      var rs=await client.from('access_tokens').select(fields).eq('short_code',sc).maybeSingle();
      if(!rs.error && rs.data) row=rs.data;
    }
    if(!row && token.trim().length>=16){
      var r=await client.from('access_tokens').select(fields).eq('token',token.trim()).maybeSingle();
      if(!r.error && r.data) row=r.data;
    }
  }catch(e){ return null; }
  if(!row) return null;
  if(row.single_use && row.used_at) return null;
  /* Presidiumsname separat holen (einfacher JOIN-lose Abfrage) */
  if(row.praesidium_id){
    try{
      var pr=await client.from('praesidien').select('id,name').eq('id',row.praesidium_id).maybeSingle();
      if(!pr.error && pr.data) row.praesidien=pr.data;
    }catch(e){}
  }
  return row;
}
/* ── Phase 4: Code gegen signiertes JWT tauschen ───────────────────────────
 * Ruft den DB-RPC argus_exchange_code (security definer, pgjwt+Vault) auf.
 * Der RPC validiert den 8-stelligen Code, signiert ein JWT mit praesidium_id /
 * is_master / exp und markiert Einmal-Codes serverseitig als verbraucht.
 * Pseudonymität bleibt gewahrt — kein Name, keine E-Mail, keine UID im JWT. */
var _lastExchangeError=null;   /* Klartext-Fehler des letzten exchangeCode-Aufrufs (z. B. „Code wurde gesperrt") — für die Fehleranzeige statt generischem Text */
/* scope (0024): 'echt' (Default) oder 'schulung' — bei 'schulung' löst der Server den
 * Schulungs-Zwilling des Code-Präsidiums auf und stellt dafür ein eigenes JWT aus.
 * Ein Dauercode schaltet damit Echtbetrieb UND Schulungsumgebung frei. */
async function exchangeCode(code, scope){
  _lastExchangeError=null;
  /* Ohne Config liefe der fetch relativ gegen den eigenen Origin (kryptischer
   * 404) — daher hier hart abfangen mit Klartext-Fehler für die Anzeige. */
  if(_configError){ _lastExchangeError='Konfiguration fehlt (config.js) — kein Backend verbunden'; return null; }
  var clean=code.replace(/[\s\-]/g,'').toUpperCase();
  if(clean.length<8) return null;
  try{
    var body={ code:clean }; if(scope==='schulung') body.p_scope='schulung';
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify(body)
    });
    var data=await resp.json();            /* ungültiger Code = HTTP 200 + {error:…} */
    if(data && data.error) _lastExchangeError=String(data.error);   /* Server-Klartext nicht schlucken */
    if(!data || !data.jwt) return null;
    accessSet('argus_jwt', data.jwt);
    accessSet('argus_jwt_exp', String(data.exp*1000)); /* ms */
    accessSet('argus_code', clean);                    /* für stille Verlängerung */
    storePidJwt(data.praesidium_id, data.jwt, data.exp*1000, clean);   /* je Präsidium merken (Picker-Wechsel) */
    if(data.scope==='schulung') localStorage.setItem('argus_twin_of_'+data.praesidium_id, '1');   /* Merker: Twin-JWT stammt aus Scope-Exchange → Verlängerung mit p_scope */
    _praesKeyNachAnmeldung=true; try{ ladePraesKey(sb()); }catch(e){}   /* Phase 6.10 (D6.10-04): Präsidiums-Schlüssel sofort holen — fire-and-forget (ab Schema 37; sonst holt ihn probeSchema) */
    /* Neuer Zugang aktiv → Schema sofort erkennen (frische Hülle: init endet sonst vor probeSchema(3), _schemaV bliebe bis zu 180 s auf 0).
     * Fire-and-forget, KEIN await — Local-first, blockiert nie. */
    try{ probeSchema(1); }catch(e){}
    return {
      praesidium_id: data.praesidium_id,
      is_master: !!data.is_master,
      praesidien: data.praesidium_name ? { id:data.praesidium_id, name:data.praesidium_name } : null,
      short_code: clean.slice(0,4)+'-'+clean.slice(4),
      temporary: data.ttl_seconds < (30*24*3600),
      ttl_hours: Math.round(data.ttl_seconds/3600),
      single_use: false   /* serverseitig bereits verbraucht */
    };
  }catch(e){ return null; }
}
/* ── Phase 5.1 Plan 03: Pro-Person-Code tauschen (Stufe-1-Sitzung) ──────────
 * Eigener Exchange für is_person-Tokens. Bei Erfolg: JWT + Standard-Felder
 * setzen UND Stufe-1-Sitzungsfelder persistieren.
 * Neue localStorage-Keys: argus_usbnk, argus_role, argus_person_praesidium.
 * Globale: _usbnk, _argusRole.
 * Rückgabe: {usbnk, argus_role, praesidium_id, praesidium_name} oder null.
 * sessionStorage kommt hier NICHT zum Einsatz — die Feld-App nutzt localStorage
 * für offline-persistente Sitzungen (anders als die Leitungs-Seite). */
/* scope: 'echt' (default) oder 'schulung' — für Twin-Scope Re-Exchange (0019).
 * Bei scope='schulung' wird p_scope an die RPC übergeben; die Funktion löst
 * den schulungs_zwilling_id-Twin server-seitig auf (keine Client-Injection).
 * argus_person_praesidium bleibt das ECHT-Präsidium (Ankerpunkt für den Picker);
 * das aktive Präsidium (_praesidiumId) wird vom Aufrufer auf data.praesidium_id gesetzt. */
async function exchangePersonCode(clean, scope){
  _lastExchangeError=null;
  if(_configError){ _lastExchangeError='Konfiguration fehlt (config.js) — kein Backend verbunden'; return null; }
  if(!clean||clean.length<8) return null;
  var effectiveScope=(scope==='schulung')?'schulung':'echt';
  try{
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_person_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:clean, p_scope:effectiveScope })
    });
    var data=await resp.json();
    if(data && data.error) _lastExchangeError=String(data.error);
    if(!data || !data.jwt) return null;
    /* JWT + Standard-Felder (analog exchangeCode) */
    accessSet('argus_jwt', data.jwt);
    accessSet('argus_jwt_exp', String(data.exp*1000));
    accessSet('argus_code', clean);
    /* Stufe-1-Sitzungsfelder */

    localStorage.setItem('argus_role',    data.argus_role||'');

    if(effectiveScope==='echt'){

    return {
      usbnk:           data.usbnk||null,
      argus_role:      data.argus_role||null,
      praesidium_id:   data.praesidium_id||null,
      praesidium_name: data.praesidium_name||null,
      scope:           data.scope||effectiveScope
    };
  }catch(e){ return null; }
}

/* Stille JWT-Verlängerung: wenn Restlaufzeit < 7 Tage und online → mit dem

     * ignorieren, sondern dieselbe Lock-Wirkung wie der Re-Check (D-20). */

  }
  if(result){ _praesKeyNachAnmeldung=true; try{ ladePraesKey(sb()); }catch(e){} }   /* Phase 6.10 (D6.10-04): Erneuerung der Verwaltung mitnehmen */

}
/* ── Phase 4.9: revoked-Re-Check (D-20) ─────────────────────────────────────
 * Gesperrte Codes (revoked-Flag, gesetzt über die Leitungs-Oberfläche) sperren
 * das Gerät beim nächsten Start bzw. Reconnect. Offline blockiert der Re-Check
 * NIEMALS: jede Unsicherheit (offline, Transportfehler, Timeout, unerwartetes
 * Format) wird ignoriert — gesperrt wird ausschließlich bei eindeutigem
 * revoked === true. */
var _revokedLocked=false;   /* Lock bereits ausgelöst → init-Fortsetzung abbrechen, kein Doppel-Modal */
/* Reine Entscheidungsfunktion (JSC-getestet). Eingabe = geparste RPC-Antwort
 * von argus_check_code oder null. Rückgabe:
 *  'lock'   NUR bei eindeutigem revoked === true
 *  'ok'     bei revoked === false (Code existiert und ist nicht gesperrt)
 *  'ignore' bei null/Transportfehler/unerwartetem Format UND bei found === false:
 *           ein gelöschter Code ist KEIN Sperr-Signal — konservativ, um
 *           Fehlaussperrungen zu vermeiden; Sperren läuft ausschließlich
 *           über revoked = true. */
function revokedDecision(resp){
  if(!resp || typeof resp!=='object') return 'ignore';
  if(resp.found===false) return 'ignore';
  if(resp.revoked===true) return 'lock';
  if(resp.revoked===false) return 'ok';
  return 'ignore';
}
/* Lock-Wirkung: Zugangsdaten entfernen, Realtime kappen, Hinweis-Modal,
 * Freischalt-Screen (gleicher Pfad wie fehlender Zugang im init). Wird auch
 * von refreshJwtIfNeeded genutzt, wenn der Re-Exchange mit „Code wurde
 * gesperrt" abgelehnt wird. */
async function applyRevokedLock(){
  if(_revokedLocked) return;
  _revokedLocked=true;
  try{
    accessDel('argus_jwt');
    accessDel('argus_jwt_exp');
    accessDel('argus_code');
    accessDel('argus_praes_key');   /* Phase 6.10 (D6.10-04): gesperrtes Gerät verliert den Präsidiums-Schlüssel beim nächsten Netzkontakt */
    localStorage.setItem('argus_unlocked','[]');   /* Freischaltungen leeren */
    /* Zusätzlich Rollen-/Verified-Reste entfernen — sonst bliebe ein
     * Master-Gerät über argus_is_master trotz Sperrung freigeschaltet. */
    localStorage.removeItem('argus_verified');
    accessDel('argus_is_master');
    localStorage.removeItem('argus_praesidium_id');
    localStorage.removeItem('argus_praesidium_name');
    /* Stufe-1 Person-Sitzungsfelder (Plan 05.1-03) */
    localStorage.removeItem('argus_usbnk');
    localStorage.removeItem('argus_role');
    localStorage.removeItem('argus_person_praesidium');
    /* IN-01: Picker-Modus zurücksetzen — kein nächster Nutzer landet im
     * Schulungs-Reiter des gesperrten Vorgänger-Kontos. */
    localStorage.removeItem('argus_picker_mode');
  }catch(e){}
  _isMaster=false; _praesidiumId=null; _praesidiumName='';
  _usbnk=null; _argusRole=null;
  if(_channel){ try{_channel.unsubscribe();}catch(e){} _channel=null; }   /* Realtime nicht weiter nutzen */
  await confirmModal("Der Zugangscode wurde von der Leitung gesperrt. Bitte neuen Zugangscode anfordern.","OK");
  state.view='praesidium'; render();
}
/* Re-Check (fire-and-forget bei App-Start + online-Event — der Start wartet
 * NIE darauf). Offline-Guard steht VOR dem fetch; kurzes Abort-Timeout, damit
 * ein hängender Request nichts aufhält. Kein Aufruf-Effekt im Training. */
async function checkRevokedCode(){
  var code=null; try{ code=accessGet('argus_code'); }catch(e){}
  if(_configError) return;   /* ohne Config kein RPC (fetch liefe sonst gegen den eigenen Origin) */
  if(!code || navigator.onLine===false || _training) return;   /* NIE blockieren, NIE offline raten */
  var resp=null;
  try{
    var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    var tmr=ctrl?setTimeout(function(){try{ctrl.abort();}catch(e){}},6000):null;
    var r=await fetch(SUPA_URL+'/rest/v1/rpc/argus_check_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:code }),
      signal:ctrl?ctrl.signal:undefined
    });

}
/* Freischaltung über einen Code (von Hand eingegeben oder eingefügt). Tauscht den
 * Code gegen ein JWT (exchangeCode) und schaltet das Präsidium frei. */
async function doUnlock(rawCode){
  if(_configError){toast("⚠️ Konfiguration fehlt (config.js) — kein Backend verbunden");return;}
  var uc2=(rawCode||'').replace(/[\s\-]/g,'').toUpperCase();
  if(uc2.length<8){toast("Bitte vollständigen Code eingeben (Format: XXXX-XXXX)");return;}
  toast("Prüfe Code…");
  var uv=await exchangeCode(uc2);
  if(!uv){
    /* ── Stufe-1-Fallback: Person-Code (Plan 05.1-03, D5.1-02) ──────────────
     * Nur versuchen wenn der erste Exchange kein „gesperrt"-Fehler war.
     * CR-02 in 0015 weist Person-Codes bei argus_exchange_code sauber mit
     * „Pro-Person-Code — nur für die Leitungs-Seite gültig" ab; das ist KEIN
     * Sperr-Fehler — wir versuchen den Person-Exchange. */
    var wasGesperrt=_lastExchangeError && _lastExchangeError.indexOf('gesperrt')>=0;
    if(!wasGesperrt){
      var pv=await exchangePersonCode(uc2);
      if(pv){
        /* Person-Token empfangen: Rolle und Präsidium prüfen */
        var prole=(pv.argus_role||'').toLowerCase();
        if(prole==='master'||prole==='flz'){
          /* master/flz-Person-Tokens sind für die Leitungs-Seite (T-053-04).
           * Im Feld höflich abweisen — kein _isMaster setzen. */
          /* Stufe-1-Felder wieder räumen (kein Halbzustand) */
          try{
            accessDel('argus_jwt');
            accessDel('argus_jwt_exp');
            accessDel('argus_code');
            localStorage.removeItem('argus_usbnk');
            localStorage.removeItem('argus_role');
            localStorage.removeItem('argus_person_praesidium');
          }catch(e){}
          _usbnk=null; _argusRole=null;
          toast("Dieser Zugang ist für die Leitungs-Seite — bitte dort anmelden");
          return;
        }
        if(!pv.praesidium_id){
          toast("Person-Code ohne Präsidium"); return;
        }
        /* normal/admin: Präsidium dauerhaft freischalten (kein TTL — Person-Session) */
        localStorage.setItem('argus_verified','true');
        addUnlock(pv.praesidium_id, null);   /* dauerhaft */
        _praesidiumId=pv.praesidium_id;
        _praesidiumName=pv.praesidium_name||'';
        localStorage.setItem('argus_praesidium_id',_praesidiumId);

/* Zieht einen Freischalt-Code aus beliebigem Text — sowohl aus einem ganzen Link
 * (#code=XXXX-YYYY) als auch aus einem bloßen Code. */
function codeFromText(t){
  t=(t||'').trim();
  /* 1) ganzer Link: #code=XXXX-YYYY */
  var m=t.match(/[#&]code=([A-Za-z0-9]{4}-?[A-Za-z0-9]{4})/i);
  if(m) return m[1].toUpperCase();
  /* 2) ein Code-Token mit Bindestrich irgendwo im Text (XXXX-YYYY) */
  var m2=t.match(/(^|[^A-Za-z0-9])([A-Za-z0-9]{4}-[A-Za-z0-9]{4})([^A-Za-z0-9]|$)/);
  if(m2) return m2[2].toUpperCase();
  /* 3) bloßer Code NUR, wenn der gesamte (bereinigte) Text exakt 8 alnum ist
   *    — verhindert Fehlgriffe bei eingefügten Sätzen. */
  var clean=t.replace(/[\s\-]/g,'');
  if(/^[A-Za-z0-9]{8}$/.test(clean)) return clean.toUpperCase();
  return '';
}

/* Ermittelt die angezeigte Präsidienliste je Reiter und Sitzungstyp.
 * Person-Sitzung (_argusRole gesetzt, _usbnk gesetzt):
 *   Echt-Reiter  → eigenes Echt-Präsidium (argus_person_praesidium)
 *   Schul-Reiter → schulungs_zwilling_id-Twin davon (aus _praesidienList auflösen)
 * Sammelcode/Master:
 *   Echt-Reiter  → nicht-Schulungs-Präsidien im Scope (isUnlocked / _isMaster)
 *   Schul-Reiter → Schulungs-Präsidien im Scope */
function pickerList(tab){
  var isSchulTab=(tab==='schulung');
  var isPersonSession=!!(_argusRole&&_usbnk);
  if(isPersonSession){
    var ownPid=localStorage.getItem('argus_person_praesidium')||'';
    if(!isSchulTab){
      /* Echt: nur eigenes Präsidium */
      return _praesidienList.filter(function(p){return p.id===ownPid && !p.schulung;});
    } else {
      /* Schulung: Twin über schulungs_zwilling_id auflösen */
      var ownEntry=_praesidienList.find(function(p){return p.id===ownPid;});
      if(!ownEntry||!ownEntry.schulungs_zwilling_id) return [];
      var twinId=ownEntry.schulungs_zwilling_id;
      return _praesidienList.filter(function(p){return p.id===twinId && !!p.schulung;});
    }
  }else{
    /* Sammelcode / Master */
    var scope = _isMaster ? _praesidienList : _praesidienList.filter(function(p){return isUnlocked(p.id);});
    return scope.filter(function(p){ return isSchulTab ? !!p.schulung : !p.schulung; });
  }
}

/* ── Phase 6.11 — Lagen (Verdrahtung, D6.11-01/-03/-10) ──────────────────
 * Nur mit Server-Schema ≥ 35; darunter, ohne Präsidium oder ohne Tabelle verhält
 * sich „Neue CCP eröffnen“ exakt wie 0.35.9. Local-first: Eine im Feld eröffnete
 * Lage bekommt eine clientseitige uuid, liegt sofort in der Warteschlange
 * argus_lage_pending und wird idempotent nachgereicht (probeSchema: Start,
 * Reconnect, Netz-Rückkehr). Die Lagen-Liste fällt bei Netzfehlern auf den Cache
 * argus_lagen_<pid> zurück. Speicherfehler brechen nichts. */
var _lageFlushBusy=null;   /* laufender Nachreich-Lauf (Promise) — Sperre gegen Parallelaufrufe */
var _lageAbgelehnt={};     /* id → Meldung, wenn der Server eine Lage abgelehnt hat (für Menü und Eröffnen) */
var _lagenQuelle=null;     /* D6.11-13: Quelle der letzten ladeLagen-Antwort — 'server' | 'cache' | null (nur 'server' darf eine gemerkte Lage verwerfen) */
var _lagenMenue={pid:null, lagen:null, ccps:[], pos:null, laedt:false, quelle:null};   /* D6.11-13: Zustand des Menüs „Lage auswählen“ */
var _lagePruefBusy=false;  /* D6.11-13: Sperre für lageWahlPruefen */
function lagePendingLesen(){

}
function lagePendingSchreiben(arr){
  try{
    if(Array.isArray(arr) && arr.length) localStorage.setItem('argus_lage_pending', JSON.stringify(arr));
    else localStorage.removeItem('argus_lage_pending');
  }catch(e){}
}

/* D6.11-13: gewählte Lage je Präsidium (argus_lage_wahl_<pid>); nur Kennung und Name, keine
 * Patientendaten. Lesen prüft die Form (T-06.11-82); Speicherfehler brechen nichts. */
function lageWahlLesen(pid){
  if(!pid) return null;
  try{
    var o=JSON.parse(localStorage.getItem('argus_lage_wahl_'+pid)||'null');
    if(!o || typeof o!=='object' || typeof o.id!=='string' || !o.id || !lageNameOk(o.name)) return null;

  }catch(e){ return null; }
}
function lageWahlSchreiben(pid, l){
  if(!pid || !l || typeof l!=='object' || typeof l.id!=='string' || !l.id || !lageNameOk(l.name)) return false;
  try{ localStorage.setItem('argus_lage_wahl_'+pid, JSON.stringify({id:l.id, name:lageNameNorm(l.name), vor_ort:!!l.vor_ort})); return true; }catch(e){ return false; }
}
function lageWahlLoeschen(pid){
  if(!pid) return;
  try{ localStorage.removeItem('argus_lage_wahl_'+pid); }catch(e){}
}
/* Abgleich der gemerkten Lage mit einer FRISCHEN Serverliste (nie mit dem Cache, T-06.11-83):
 * 'leer' (nichts gemerkt) | 'lokal' (noch in der Warteschlange) | 'ok' (offen; Name/vor_ort
 * nachgezogen) | 'weg' (abgeschlossen oder unbekannt → gelöscht). */
function lageWahlAbgleich(pid, lagen){
  var w=lageWahlLesen(pid);
  if(!w) return 'leer';
  if(lagePendingLesen().some(function(x){ return x && x.id===w.id; })) return 'lokal';
  var arr=Array.isArray(lagen)?lagen:[];
  for(var i=0;i<arr.length;i++){
    var l=arr[i];
    if(!l || typeof l!=='object' || l.id!==w.id || l.abgeschlossen_at) continue;
    if(lageNameOk(l.name) && (lageNameNorm(l.name)!==w.name || !!l.vor_ort!==w.vor_ort)) lageWahlSchreiben(pid, {id:w.id, name:l.name, vor_ort:l.vor_ort});
    return 'ok';
  }
  lageWahlLoeschen(pid);
  return 'weg';
}

/* Geräteposition kurz und nicht blockierend (T-06.11-41/-44): {lat,lng} oder null, wirft nie.
 * Nur lokal für die Entfernung — nie gespeichert oder übertragen. */
function posHolen(ms){
  ms=ms||2000;
  return new Promise(function(resolve){
    var fertig=false;
    function done(v){ if(fertig) return; fertig=true; resolve(v); }
    try{
      if(!navigator.geolocation){ done(null); return; }
      setTimeout(function(){ done(null); }, ms+300);
      navigator.geolocation.getCurrentPosition(function(p){
        try{ var la=p.coords.latitude, ln=p.coords.longitude; done((isFinite(la) && isFinite(ln)) ? {lat:la, lng:ln} : null); }catch(e){ done(null); }
      }, function(){ done(null); }, {enableHighAccuracy:false, timeout:ms, maximumAge:300000});
    }catch(e){ done(null); }
  });
}

/* Warteschlange nachreichen (idempotent über p_id = clientseitige uuid, T-06.11-42).

 * verworfen. ok → entfernen; ok:false → entfernen + Hinweis; Netz/Timeout → behalten.
 * Rückgabe: Anzahl verbleibender Einträge. Parallelaufrufe teilen sich einen Lauf. */
function flushPendingLagen(){
  if(_lageFlushBusy) return _lageFlushBusy;
  var lauf=(async function(){
    try{
      var arr=lagePendingLesen();
      if(!arr.length) return 0;
      var client=sb();
      if(_schemaV<35 || !client || !netLikelyUp()) return arr.length;
      var weg=0;   /* D6.11-13: nachgereichte/abgelehnte Einträge → Lage-Zeile/Menü neu zeichnen */
      function entfernen(id){ weg++; lagePendingSchreiben(lagePendingLesen().filter(function(x){ return !(x && x.id===id); })); }
      var gut=arr.filter(function(x){ return x && typeof x==='object' && typeof x.id==='string' && x.id && x.praesidium_id && lageNameOk(x.name); });
      if(gut.length!==arr.length) lagePendingSchreiben(gut);   /* Müll verwerfen (synchron, kein await dazwischen) */
      var meine=lagePendingFuer(gut, _praesidiumId);
      for(var i=0;i<meine.length;i++){
        var e=meine[i], nm=lageNameNorm(e.name), r=null;
        try{ r=await qt(client.rpc('argus_einsatzlage_anlegen', {p_id:e.id, p_praesidium_id:e.praesidium_id, p_name:nm})); }catch(x){ r=null; }
        var d=(r && !r.error) ? r.data : null;
        if(d && d.ok===true){ entfernen(e.id); }
        else if(d && d.ok===false){
          entfernen(e.id);
          var mld=String(d.meldung||d.fehler||'abgelehnt');
          _lageAbgelehnt[e.id]=mld;
          try{ var gw=lageWahlLesen(e.praesidium_id); if(gw && gw.id===e.id) lageWahlLoeschen(e.praesidium_id); }catch(x){}   /* D6.11-13: abgelehnte Lage bleibt nicht gewählt */
          if(e.fuer!=='mesh') toast('Lage „'+nm+'“ nicht angelegt: '+mld);   /* 06.10-07: per Mesh übernommene Lage still verwerfen */
        }

      }
      if(weg>0 && typeof state!=='undefined' && state && (state.view==='start'||state.view==='lage')){ try{ render(); }catch(e){} }
    }catch(e){}
    return lagePendingLesen().length;
  })();
  _lageFlushBusy=lauf;

}

/* Signatur einer Gruppe: Foto nur als Länge + Ende (billig, erkennt Neuaufnahmen),
 * alles andere als JSON. */
function groupSig(p, keys){
  return keys.map(function(k){
    var v=p[k];
    if(k==='photo') return (typeof v==='string' && v) ? 'P'+v.length+':'+v.slice(-24) : '';
    return JSON.stringify(v==null?'':v);
  }).join('\u0001');
}
function groupSigs(p, groups){
  var o={};
  Object.keys(groups).forEach(function(g){ o[g]=groupSig(p, groups[g]); });
  return o;
}
/* Welche Gruppen weichen vom zuletzt gespeicherten Stand (p._sig) ab? Ohne _sig: alle. */
function changedGroups(p, groups){
  var cur=groupSigs(p, groups), old=p._sig;
  return Object.keys(groups).filter(function(g){ return !old || old[g]!==cur[g]; });
}
function nextStamp(now, last){ return Math.max(now, (last||0)+1); }
/* Gruppen gs mit Stempel t/Gerät dev versehen. p:1 = noch nicht vom Server bestätigt;
 * b = Basis (der Stempel, auf dem diese Änderung aufbaut) — bleibt bei weiteren
 * unbestätigten Änderungen derselben Gruppe erhalten. */
function stampGroups(p, gs, t, dev){
  if(!p.fts) p.fts={};
  gs.forEach(function(g){
    var o=p.fts[g];
    var b=o ? (o.p ? (o.b||0) : (o.t||0)) : 0;
    p.fts[g]={t:t, d:dev, b:b, p:1};
  });
  return p;
}
/* Upload-Kopie ohne lokale p-Flags; die Quittung "ack" trägt nur t. */
function ftsForUpload(fts){
  var out={};
  Object.keys(fts||{}).forEach(function(k){
    var e=fts[k]; if(!e || typeof e!=='object') return;
    var o={t:e.t};
    if(k!=='ack'){
      if(e.d!==undefined) o.d=e.d;
      if(e.b!==undefined) o.b=e.b;
    }
    out[k]=o;
  });
  return out;
}
/* Bestätigung: p-Flags aller Einträge mit t <= upTo entfernen. */
function clearPending(fts, upTo){
  Object.keys(fts||{}).forEach(function(k){
    var e=fts[k];
    if(e && e.p && (e.t||0)<=(upTo||0)) delete e.p;
  });
  return fts;
}
/* Feldgruppen-Merge Client-Seite (Gegenstück zum Trigger argus_patients_merge, Migration 0025):
 * Basis = Kopie des Serverstands (cloud); je Gruppe gewinnt der jüngere Stempel, bei
 * Gleichstand der Server. Grabstein (D6.5-19): nur die Gruppe del; lokal gewinnt nur mit
 * jüngerem fts.del. Der Inhalt bleibt erhalten und wird auch beim Grabstein normal gemergt,
 * damit ein Rückholen den neuesten Stand bringt. Reine Funktion — verändert weder local noch cloud. */
function mergeGroups(local, cloud, groups){
  function cp(v){ return v===undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  var m=cp(cloud)||{};
  var lf=local.fts||{}, cf=cloud.fts||{};
  m.fts=cp(cf)||{};
  /* Grabstein-Gruppe "del" */
  var tdl=(lf.del && lf.del.t) || 0;
  var tdc=(cf.del && cf.del.t) || cloud.deletedAt || 0;
  if(tdl>tdc){
    m.deletedAt=local.deletedAt||null;
    m.deletedBy=m.deletedAt ? (local.deletedBy||'') : '';
    m.deletedDev=m.deletedAt ? (local.deletedDev==null ? null : local.deletedDev) : null;
    m.fts.del=cp(lf.del);
  }
  /* Inhaltsgruppen */
  Object.keys(groups).forEach(function(g){
    var keys=groups[g];
    var tl;
    if(lf[g] && lf[g].t!=null) tl=lf[g].t;
    else tl=(groupSig(local, keys)!==groupSig(cloud, keys)) ? (local.updated||0) : 0;
    var tc=(cf[g] && cf[g].t!=null) ? cf[g].t : (cloud.updated||0);   /* Befund 6b: ein Serverstempel 0 (Foto-Vormerkung HO-02, foto:{t:0}) zählt 0 wie im Trigger (coalesce) — sonst „gewann“ er über updated, und das Gateway verlor das angeforderte Foto statt es hochzuladen */
    if(tl>tc){
      keys.forEach(function(k){ if(local[k]!==undefined) m[k]=cp(local[k]); });
      m.fts[g]=lf[g] ? cp(lf[g]) : {t:local.updated, d:0};
    }
  });
  /* Quittung für Konflikt-Marker (D6.5-14): lokal jüngere Quittung gewinnt und räumt die Marker ab */
  var ackL=(lf.ack && lf.ack.t) || 0, ackC=(cf.ack && cf.ack.t) || 0;
  if(ackL>ackC){
    m.fts.ack={t:ackL};
    m.conf=(m.conf||[]).filter(function(c){ return (c.at||0)>ackL; });
  }
  m.updated=Math.max(local.updated||0, cloud.updated||0);
  return m;
}
/* Grabstein (D6.5-19): nur die Gruppe del (deleted_*) wird gesetzt. Inhalt, Foto, Tourniquet,
 * Status und Prio bleiben erhalten — Rückholen bringt alles zurück. Verändert p, gibt p zurück. */
function tombstoneMark(p, by, dev, t){
  p.deletedAt=t; p.deletedBy=by; p.deletedDev=dev;
  return p;
}
/* Rückholen (D6.5-19): deleted_* leeren, Stempel "del" neuer als der Grabstein. Nur ein Alt-Grabstein
 * aus 0.34.0/0.34.1 (status 'verworfen', leerer Inhalt) bekommt zusätzlich status 'active' + Stempel st. */
function restoreTombstone(p, t, dev){
  p.deletedAt=null; p.deletedBy=''; p.deletedDev=null;
  var groups=['del'];
  if(p.status==='verworfen'){ p.status='active'; groups.push('st'); }
  stampGroups(p, groups, t, dev);
  return p;
}

/* Uhrversatz (D6.5-07): eine Probe = Hin-und-Rück-Zeit + Versatz Server − Gerät. */
function clockSample(t0, t1, serverMs){ return {rtt:t1-t0, offset:serverMs-(t0+t1)/2}; }
function pickOffset(samples){
  var best=null;
  (samples||[]).forEach(function(s){ if(s && s.rtt<1500 && (best===null || s.rtt<best.rtt)) best=s; });
  return best===null ? null : Math.round(best.offset);
}
function clockHint(offset){
  var a=Math.abs(offset||0);

  var dir=offset<0 ? 'vor' : 'nach';

/* ── Gerätestatus (Phase 6.5, D6.5-01/-15) ─────────────────────────────────
 * Reine Funktionen (Tests extrahieren sie per Name — Hilfen stehen innen).
 * Drei Zustände + abgemeldet: verbunden (< 30 s) / außer Reichweite (unbestätigt) /
 * verlassen (bestätigt) / abgemeldet (MasterMedic-Markierung). */
var HB_INTERVAL_MS = 15000;   /* Lebenszeichen-Takt; der 30-s-Wert in devStatus ist synchron dazu zu halten */
function devStatus(d, now){
  if(d.left_at) return 'verlassen';
  if(d.lost_at && d.lost_at>=(d.last_seen||0)) return 'abgemeldet';   /* neueres Lebenszeichen schlägt die Vermutung */
  return (now-(d.last_seen||0))<30000 ? 'verbunden' : 'ausser_reichweite';   /* 30 s = zwei Beats Toleranz — synchron zu HB_INTERVAL_MS halten */
}
function devLabel(d, now, o){
  o=o||{};
  var st=devStatus(d, now), n=d.open_n|0;
  var nm=(o.merged && d.kennung) ? (d.kennung+'·'+d.device_no) : String(d.device_no);
  var op=d.operator||'';
  var head=nm+(op ? (' '+((o.mm && op===o.mm) ? '★ ' : '')+op) : '')+(o.self ? ' (dieses Gerät)' : '');
  var via=d.via==='mesh' ? ' (Mesh)' : (d.via==='server' ? ' (Server)' : '');   /* D6.7-08: Weg nur bei „verbunden“ */
  var cnt=function(w){ return ' ('+n+' '+(n===1?'Patient':'Patienten')+' '+w+')'; };
  if(st==='verbunden'){
    return head+via+(n>0 ? cnt('offen') : '');
  }
  if(st==='ausser_reichweite'){
    var min=Math.floor((now-(d.last_seen||0))/60000);
    return head+' — außer Reichweite seit '+(min<1 ? 'unter 1 min' : (min+' min'))+(n>0 ? cnt('offen') : '');
  }
  if(st==='abgemeldet') return head+' — abgemeldet'+(n>0 ? cnt('möglicherweise verloren') : '');
  return head+' — verlassen '+(o.hhmm ? o.hhmm(d.left_at) : '')+(n>0 ? cnt('offen') : '');
}
/* D6.9-03: „Geräte im CCP: N“ als eine Zeile (rein, ES5; einziger Global: devStatus).
 * n = Geräte, die den CCP nicht verlassen haben; verlassene zählen nur mit offenen Patienten als Auffälligkeit.
 * stufe: 'rot' (abgemeldet) > 'warn' (außer Reichweite / verlassen mit offenen) > 'ok'. Zähler numerisch (|0). */
function devKurz(rows, now){
  var k={n:0, aus:0, ausOffen:0, abg:0, abgOffen:0, verlN:0, verlOffen:0, stufe:'ok'};
  (rows||[]).forEach(function(d){
    if(!d) return;
    var st=devStatus(d, now), o=d.open_n|0;
    if(st!=='verlassen') k.n++;
    if(st==='ausser_reichweite'){ k.aus++; k.ausOffen+=o; }
    else if(st==='abgemeldet'){ k.abg++; k.abgOffen+=o; }
    else if(st==='verlassen' && o>0){ k.verlN++; k.verlOffen+=o; }
  });
  k.stufe = k.abg>0 ? 'rot' : ((k.aus>0 || k.verlN>0) ? 'warn' : 'ok');
  return k;
}
function devKurzText(k){
  return 'Geräte im CCP: '+k.n+
    (k.aus ? ' · '+k.aus+' außer Reichweite'+(k.ausOffen ? ' ('+k.ausOffen+' '+(k.ausOffen===1?'Patient':'Patienten')+' offen)' : '') : '')+
    (k.abg ? ' · '+k.abg+' abgemeldet'+(k.abgOffen ? ' ('+k.abgOffen+' möglicherweise verloren)' : '') : '')+
    (k.verlN ? ' · '+k.verlN+' verlassen ('+k.verlOffen+' offen)' : '');
}
/* Gerätestand veraltet/unbekannt (Plan 06.5-10, B6): ohne Verbindung oder älter als 30 s
 * (= zwei Beats Toleranz wie devStatus) darf die Liste NICHT als „außer Reichweite" gelesen
 * werden — das Gerät des MasterMedic selbst wäre dann die Ursache, nicht die anderen Geräte. */
function devStale(devicesAt, now, online){
  return !online || !devicesAt || (now-devicesAt)>30000;

/* Dialogtext „CCP verlassen?" (D6.5-02): Gerätenummer + noch nicht synchronisierte Patienten. */
function leaveText(kennung, dev, n, isMM){
  var t='CCP '+kennung+' verlassen?\n\n';
  var sync = n>0 ? (n+' '+(n===1?'Patient':'Patienten')+' noch nicht synchronisiert') : 'alles synchronisiert';
  if(dev>=1) t+='Du bist Gerät '+dev+' · '+sync;

  if(isMM) t+='\n\nDu bist MasterMedic — die Rolle bleibt bei dir, bis jemand sie übernimmt.';
  return t;
}

/* Inventar (D6.7-03): je Patient 8 Stempel in MESH_GROUPS_ORDER + Foto-Flag (nie Bytes, D6.7-06).
 * Übungsdaten (demo/training) verlassen das Gerät nie (T-06.7-06). list = patients.concat(_tombs). */
function meshInventory(list, order){
  function stamp(p, g){
    var e=p.fts && p.fts[g];
    if(e && e.t!=null) return e.t;
    if(g==='del') return p.deletedAt ? (p.updated||0) : 0;
    if(g==='foto' && p._fotoRemote) return 0;   /* HO-02: vorgemerktes Foto ohne Bytes und ohne eigenen Stempel beansprucht nichts */
    return p.updated||0;
  }
  var inv={};
  (list||[]).forEach(function(p){
    if(!p || !p.id || p.demo || p.training) return;
    var s=order.map(function(g){ return stamp(p, g); });
    s.push(p.photo ? 1 : 0);
    inv[p.id]=s;
  });

    var nm=(p.name==null?'':String(p.name)).trim(); if(!nm) return;

  });

    if(lg){ g=gr[lg.id]; if(!g){ g=gr[lg.id]={lage:lg, dist:null, eintraege:[]}; reihe.push(g); } }
    else { if(!ohne) ohne={lage:null, dist:null, eintraege:[]}; g=ohne; }
    g.eintraege.push({ccp:c, dist:d, _i:i});
    if(d!==null && (g.dist===null || d<g.dist)) g.dist=d;
  });
  function nachDist(a, b){
    if(a.dist!==null && b.dist===null) return -1;
    if(a.dist===null && b.dist!==null) return 1;
    if(a.dist!==null && b.dist!==null && a.dist!==b.dist) return a.dist-b.dist;
    return 0;
  }
  reihe.sort(function(a, b){
    var r=nachDist(a, b); if(r) return r;
    if(a.lage.eroeffnet_at!==b.lage.eroeffnet_at) return b.lage.eroeffnet_at-a.lage.eroeffnet_at;
    return a.lage.id<b.lage.id ? -1 : a.lage.id>b.lage.id ? 1 : 0;
  });
  if(ohne) reihe.push(ohne);
  reihe.forEach(function(g){
    g.eintraege.sort(function(a, b){ return nachDist(a, b) || (a._i-b._i); });
    g.eintraege=g.eintraege.map(function(e){ return {ccp:e.ccp, dist:e.dist}; });
  });

}

function verbundHaupt(members){
  if(!members || !members.length) return null;
  for(var i=0;i<members.length;i++){ var m=members[i]; if(m && m.id && m.id===m.merge_group_id) return m; }
  var best=null;
  for(var j=0;j<members.length;j++){
    var c=members[j]; if(!c) continue;
    if(!best){ best=c; continue; }
    var ck=c.kennung?String(c.kennung):null, bk=best.kennung?String(best.kennung):null;
    if(ck!==null && (bk===null || ck<bk)) best=c;
  }
  return best;
}

/* D6.9-08/-09: Gruppenprüfung in loadPatients (rein). ids = ids unter der lokalen Gruppen-id grpAt (null = Abfragefehler),
 * serverGrp = merge_group_id der eigenen Zeile frisch vom Server (undefined = noch nicht gelesen bzw. nicht lesbar).

function verbundPruefung(ownId, grpAt, ids, serverGrp){

  try{await client.from('ccps').update({merge_group_id:grp,merged:true}).in('id', src.merge_group_id ? [_ccpId] : [_ccpId, fromId]);}catch(e){}
  try{ await mmVerbundAngleichen(grp); }catch(e){}   /* 0.37.1: MasterMedic des Haupt-CCP für den ganzen Verbund */

}
/* Offline gequeueten Abschluss nachziehen — aufgerufen im init-Block und im

  var client=sb(); if(!client || !netLikelyUp()) return;   /* Befund 7c: bei bekanntem Offline kein Versuch */

    var r=await qt(client.rpc('argus_close_einsatz',{p_ccp_id:pc.ccpId,p_typ:pc.typ}));
    if(r && !r.error){
      try{ localStorage.removeItem('argus_pending_close'); }catch(e2){}

    }
  }catch(e){}

 * kein Inhalt) und höchstens minütlich gebündelt per argus_log_herkunft gemeldet. Nur ab Schema >= 26.
 * Queue argus_herkunft_q = {"<ccpId>|<weg>[|<fuer>]": {dev, ids:[…]}}, je Schlüssel max. 500 IDs.
 * Phase 6.7 (D6.7-04): Gateway-Herkunft „für Gerät X“ — Weg mesh trägt das Ursprungsgerät fuer im Schlüssel;
 * der RPC bekommt p_fuer nur ab Schema 30, darunter wird mesh als nachgereicht ohne fuer gemeldet. */

function readHerkQ(){

function queueHerkunft(ccpId, weg, ids, fuer, fuerCcp){

}
/* Weg eines Uploads im Hintergrund-Flush: war die Änderung schon länger offen → nachgereicht, sonst direkt. */

    var keys=Object.keys(readHerkQ());
    for(var i=0;i<keys.length;i++){
      var k=keys[i], q0=readHerkQ(), e0=q0[k];
      if(!e0 || !e0.ids || !e0.ids.length){ if(e0){ delete q0[k]; try{ localStorage.setItem('argus_herkunft_q', JSON.stringify(q0)); }catch(e){} } continue; }

      if(d.error){   /* endgültige Server-Antwort (Nachfrist abgelaufen / CCP nicht gefunden / …) → Schlüssel verwerfen */

/* Offline-Robustheit: lokal noch nicht synchronisierte Patienten in die

/* Messrunde 1 (Befund C): Serverstand lokal sichern. Online bestand `patients` aus den Serverzeilen; gespeichert wurden nur

/* Serverstand (Patienten + Grabsteine, nie demo/training) lokal sichern — nacheinander in meshSerial (ein gleichzeitig

function meshOnPeers(ev){

      out:o ? o.out : !!(_mesh.outTry[p.key] && now-_mesh.outTry[p.key]<30000), since:(o && o.state===st) ? o.since : now,
      path:String(p.path||''), temp:!!_mesh.fotoTemp[p.key], epoch:o ? o.epoch : _mesh.epoch};

  Object.keys(praes).forEach(function(k){ if(!prevP[k]) meshInfoSenden(k, now); });   /* 06.10-07: Kurzinfo sofort an neue Präsidiums-Links */

/* Linkplan (D6.10-01, T-06.10-45): Ziele = meshLinkPlan(me, gefunden ∪ verbunden, Epoche, maxOut). Fehlt ein Link,
 * connect({to, channel:'data'}) — höchstens ein neuer je Takt, Backoff 5/10/20/40 s je Ziel (Abweisung „voll“ erscheint
 * nur als ausbleibender Link). Hysterese: ein eigener Link außerhalb des Plans wird nur bei Epochenwechsel oder über
 * maxLinks getrennt, nie wegen kurzem Werbeausfall; eingehende Links trennt der Controller nur für „Ring vor Sehne“: Bin
 * ich voll und will ein sichtbares, nicht verbundenes Gerät mich als Ring-Nachfolger, gebe ich eine eingehende Sehne frei
 * (höchstens alle 10 s) — sonst könnte der Ring reißen. Temporäre Foto-Links regelt meshFotoTempPrune. */
function meshPlanLinks(now){
  var N=_mesh.native, P=MESH_PROTO; if(!N || !_mesh.on || !_mesh.nodeKey) return;

    if(_mesh.linkHold[k]){ if(now<_mesh.linkHold[k]) return; delete _mesh.linkHold[k]; }   /* Nachprüfung 26.10.2026: Fund im Halt (3 Fehlversuche) */

/* Eingang (D6.7-10, T-06.7-30): JSON im try; Präsidiums-/Notweg-Kanal → meshOnPraesMessage; sonst nur über verbundene

function meshOnMessage(ev){

  var authed={};
  Object.keys(_mesh.authed).forEach(function(k){ if(_mesh.authed[k]) authed[k]=true; });
  authed[nk]=true;                                                  /* Ursprungsgerät über einen authentisierten Nachbarn (Weiterleitung) */
  var ids=(_ccpIdsKnown && _ccpIdsKnown.length) ? _ccpIdsKnown : (_ccpId ? [_ccpId] : []);
  var why=meshValidate(msg, {ccps:meshCcpsKarte(Object.keys(_mesh.bund), Object.keys(_mesh.authed)), now:now, authed:authed, ccpIds:ids, bytes:meshBytes(json), order:MESH_GROUPS_ORDER});   /* PE-4 */

function meshSendMap(t, map, to){
