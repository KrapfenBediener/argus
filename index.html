function applyMeta(row){
  if(!row) return;
  if(typeof row.master_medic==='string') masterMedic=row.master_medic;
  if(typeof row.kennung==='string' && row.kennung) _ccpKennung=row.kennung;
  if('merge_group_id' in row) _mergeGroupId=row.merge_group_id||null;
  if('merge_request_from' in row) _mergeReqFrom=row.merge_request_from||null;
  /* ccpMerged (Präfix-Anzeige) wird in loadPatients aus der Gruppengröße abgeleitet. */
}
async function openOrCreateCCP(){
  var client=sb(); if(!client) return false;
  if(_ccpId){
    var r=await client.from('ccps').select('*').eq('id',_ccpId).single();
    if(r.data){applyMeta(r.data);return true;}
  }
  /* Einzigartigen Join-Token generieren */
  var tokenArr=new Uint8Array(16);
  crypto.getRandomValues(tokenArr);
  var joinToken=Array.from(tokenArr,function(b){return b.toString(16).padStart(2,'0');}).join('');
  var ins=await client.from('ccps').insert({
    kennung:'A', ort:'', master_medic:operator||'', merged:false,
    join_token:joinToken, praesidium_id:_praesidiumId||null
  }).select().single();
  if(ins.data){
    _ccpId=ins.data.id;
    localStorage.setItem('argus_ccp_id',_ccpId);
    localStorage.setItem('argus_invite',joinToken);
    return true;
  }
  return false;
}
function subscribeRealtime(){
  var client=sb(); if(!client||!_ccpId||_channel) return;
  _channel=client.channel('ccp-'+_ccpId)
    .on('postgres_changes',{event:'*',schema:'public',table:'patients',
        filter:'ccp_id=eq.'+_ccpId}, async function(){
      if(state.view==='patient'||state.view==='checklist') return;
      await loadPatients(); render();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ccps',
        filter:'id=eq.'+_ccpId}, function(p){applyMeta(p.new);render();checkIncomingMergeRequest();})
    .subscribe();
}

/* ── Einladungs-System ─────────────────────────────────────────────────── */
function extractInviteToken(){
  var hash=window.location.hash||'';
  var m=hash.match(/[#&]inv=([a-f0-9]{32})/i);
  return m?m[1]:null;
}
async function validateInviteToken(token){
  var client=sb(); if(!client) return null;
  var clean=token.replace(/[\s\-]/g,'').toUpperCase();
  var fields='token,praesidium_id,is_master,label,short_code,praesidien(id,name)';
  try{
    /* Short Code (8 Zeichen, z.B. ABCD-1234 → ABCD-1234) */
    if(clean.length===8){
      var sc=clean.slice(0,4)+'-'+clean.slice(4);
      var rs=await client.from('access_tokens').select(fields).eq('short_code',sc).single();
      if(rs.data) return rs.data;
    }
    /* Vollständiger Token (32+ Zeichen) */
    var r=await client.from('access_tokens').select(fields).eq('token',token.trim()).single();
    if(r.data) return r.data;
  }catch(e){}
  /* Legacy-Pfad DEAKTIVIERT (2026-06): Alte Einladungslinks, die über den
   * rohen ccps.join_token ohne Präsidiums-/Freischaltungs-Provisionierung
   * funktioniert haben, sind ab sofort ungültig. Gültiger Zugang nur noch
   * über access_tokens (8-stelliger Kurzcode oder provisionierter Link). */
  return null;
}
function inviteUrl(){
  var token=localStorage.getItem('argus_invite')||'';
  if(!token) return null;
  return window.location.origin+window.location.pathname+'#inv='+token;
}
async function copyInviteLink(){
  var url=inviteUrl();
  if(!url){toast('Kein Einladungslink verfügbar');return;}
  try{
    await navigator.clipboard.writeText(url);
    toast('Einladungslink kopiert ✓');
  }catch(e){
    promptModal('Einladungslink (kopieren):',url);
  }
}

function ccpJoinModal(list){
  return new Promise(function(resolve){
    var ov=document.createElement('div');ov.className='modalov';
    var inner='<div class="modalbx" style="max-width:360px">';
    inner+='<div class="modalmsg" style="margin-bottom:14px">CCP auswählen</div>';
    list.forEach(function(ccp){
      inner+='<button class="mc-ccpjoin card" data-id="'+ccp.id+'" style="width:100%;text-align:left;margin-bottom:10px;cursor:pointer;padding:13px 14px">';
      inner+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">';
      inner+='<span class="mono" style="font-size:18px;font-weight:600">CCP '+esc(ccp.kennung)+'</span>';
      if(ccp.ort) inner+='<span class="hint">'+esc(ccp.ort)+'</span>';
      inner+='</div>';
      inner+='<div class="hint">MasterMedic: '+(ccp.master_medic||'keine')+'</div>';
      inner+='</button>';
    });
    inner+='<button class="ghost mc-cancel" style="width:100%;margin-top:2px">Abbrechen</button>';
    inner+='</div>';
    ov.innerHTML=inner; document.body.appendChild(ov);
    function done(v){if(ov.parentNode)ov.parentNode.removeChild(ov);resolve(v);}
    ov.querySelectorAll('.mc-ccpjoin').forEach(function(btn){
      btn.addEventListener('click',function(){done(btn.getAttribute('data-id'));});
    });
    ov.querySelector('.mc-cancel').addEventListener('click',function(){done(null);});
    ov.addEventListener('click',function(e){if(e.target===ov)done(null);});
  });
}

/* --- Standalone-Persistenz: localStorage-Speicher, wenn kein window.storage vorhanden (z.B. auf dem iPhone) --- */
if (typeof window !== "undefined" && !window.storage) {
  window.storage = {
    get: function(key){ try{ var v = localStorage.getItem(key); return v===null ? null : {value:v, key:key}; }catch(e){ return null; } },
    set: function(key, value){ try{ localStorage.setItem(key, value); }catch(e){} return {key:key, value:value}; },
    delete: function(key){ try{ localStorage.removeItem(key); }catch(e){} return {key:key, deleted:true}; },
    list: function(prefix){ var keys=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(prefix==null || k.indexOf(prefix)===0) keys.push(k); } }catch(e){} return {keys:keys}; }
  };
}

/* ── Echtes CCP-Zusammenführen (geräteübergreifend über Supabase) ──────────
 * Datenmodell: ccps.merge_group_id (gemeinsame Gruppe), ccps.merge_request_from
 * (Handshake). A initiiert → B bestätigt. A bleibt MasterMedic. Keine
 * Umnummerierung; der beitretende CCP bekommt die nächste freie Kennung und
 * schreibt seine eigenen Patienten darauf um. */
function nextFreeKennung(usedArr){
  var L="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(var i=0;i<L.length;i++){ if(usedArr.indexOf(L[i])===-1) return L[i]; }
  return "Z";
}
async function realMergeRequest(targetId){
  var client=sb(); if(!client||!_ccpId) return false;
  /* Die Gruppe entsteht erst, wenn B bestätigt (sonst würde die Selbstheilung
   * die Ein-Mitglied-Gruppe sofort wieder auflösen). Hier nur die Anfrage. */
  try{await client.from('ccps').update({merge_request_from:_ccpId,merge_request_at:nowMs()}).eq('id',targetId);}catch(e){return false;}
  return true;
}
async function realMergeAccept(fromId){
  var client=sb(); if(!client||!_ccpId) return false;
  var src; try{ src=(await client.from('ccps').select('*').eq('id',fromId).single()).data; }catch(e){}
  if(!src) return false;
  var grp=src.merge_group_id||src.id;
  /* belegte Kennungen der Gruppe sammeln, nächste freie wählen */
  var used=[]; try{ var gm=await client.from('ccps').select('kennung').eq('merge_group_id',grp); if(gm.data) gm.data.forEach(function(c){if(c.kennung)used.push(c.kennung);}); }catch(e){}
  if(used.indexOf(src.kennung||'A')===-1) used.push(src.kennung||'A');
  var newK = (used.indexOf(_ccpKennung)===-1 && _ccpKennung) ? _ccpKennung : nextFreeKennung(used);
  /* eigene Patienten auf die neue Kennung umschreiben */
  await loadPatients();
  for(var i=0;i<patients.length;i++){ if(!patients[i].demo && patients[i].ccp!==newK){ patients[i].ccp=newK; await savePatient(patients[i]); } }
  _ccpKennung=newK; _mergeGroupId=grp;
  try{await client.from('ccps').update({merge_group_id:grp,kennung:newK,merged:true,merge_request_from:null,merge_request_at:null}).eq('id',_ccpId);}catch(e){}
  /* Auch den anfragenden CCP (A) der Gruppe zuordnen, falls noch nicht geschehen */
  if(!src.merge_group_id){ try{await client.from('ccps').update({merge_group_id:grp,merged:true}).eq('id',fromId);}catch(e){} }
  return true;
}
async function realMergeDecline(){

}

async function checkIncomingMergeRequest(){
  if(_mergeReqHandling || !_mergeReqFrom) return;
  if(!(operator && masterMedic && operator===masterMedic)) return;
  _mergeReqHandling=true;
  var client=sb(); var fromK='?';
  try{ var s=(await client.from('ccps').select('kennung').eq('id',_mergeReqFrom).single()).data; if(s&&s.kennung) fromK=s.kennung; }catch(e){}
  var ok=await confirmModal("CCP "+fromK+" möchte mit deinem CCP zusammenführen.\n\nDanach seht ihr eine gemeinsame Patientenliste (Nummern mit Präfix). Zusammenführen?","Zusammenführen");
  if(ok){ var fid=_mergeReqFrom; await realMergeAccept(fid); _mergeReqFrom=null; await loadMeta(); await loadPatients(); render(); toast("Zusammengeführt mit CCP "+fromK); }
  else { await realMergeDecline(); }

}

async function loadPatients(){
  var client=sb();
  if(client && _ccpId){
    try{
      var ccpIds=[_ccpId];
      if(_mergeGroupId){
        var g=await client.from('ccps').select('id').eq('merge_group_id',_mergeGroupId);
        if(g.data && g.data.length>1){ ccpIds=g.data.map(function(c){return c.id;}); }
        else { /* allein in der Gruppe → Gruppe selbstheilend verlassen */
          _mergeGroupId=null;
          try{await client.from('ccps').update({merge_group_id:null,merged:false}).eq('id',_ccpId);}catch(e2){}
        }
      }
      var realMerged = ccpIds.length>1;
      var q = realMerged
        ? await client.from('patients').select('*').in('ccp_id',ccpIds)
        : await client.from('patients').select('*').eq('ccp_id',_ccpId);
      if(!q.error && q.data){
        var arr=q.data.map(patFromRow);
        ccpMerged = realMerged || _demoMerged;
        if(_demoMerged){
          var keys2=await sList("ccp_pat_");
          for(var i=0;i<keys2.length;i++){var pd=await sGet(keys2[i]);if(pd&&pd.demo)arr.push(normalize(pd));}
        }
        arr.sort(function(a,b){var ca=a.ccp||"A",cb=b.ccp||"A";if(ca!==cb)return ca<cb?-1:1;return a.num-b.num;});
        patients=arr; return;
      }
    }catch(e){}
  }
  var keys=await sList("ccp_pat_");var arr=[];
  for(var i=0;i<keys.length;i++){var p=await sGet(keys[i]);if(p){if(p.demo&&!_demoMerged)continue;arr.push(normalize(p));}}
  arr.sort(function(a,b){var ca=a.ccp||"A",cb=b.ccp||"A";if(ca!==cb)return ca<cb?-1:1;return a.num-b.num;});
  patients=arr;
}
function normalize(p){
  if(!p.vit)p.vit={};if(!p.tx)p.tx={};if(!p.inj)p.inj=[];
  if(p.pupRe===undefined)p.pupRe="";if(p.pupLi===undefined)p.pupLi="";
  if(!p.ccp)p.ccp="A";
  return p;
}

/* ── Patienten-Sperre (Soft-Lock gegen Doppelbearbeitung) ──────────────────
 * Beim Öffnen wird ein Patient für den eigenen Bediener gesperrt. Andere
 * sehen ihn dann schreibgeschützt. Ein Heartbeat hält die Sperre frisch;
 * nach LOCK_TTL ohne Lebenszeichen läuft sie automatisch ab. Der MasterMedic
 * kann eine fremde Sperre per Override übernehmen. */
var LOCK_TTL = 45000; /* 45 s Ablauf nach letztem Lebenszeichen */
var _lockBeat = 0;
function isMasterMedic(){ return !!((operator && masterMedic && operator===masterMedic) || _isMaster); }
function lockInfo(p){
  if(!p||!p.lockedBy||!p.lockedAt) return {locked:false,by:null,mine:false,age:Infinity};
  var age=nowMs()-p.lockedAt;
  return {locked:age<LOCK_TTL, by:p.lockedBy, mine:(p.lockedBy===operator), age:age};
}
async function acquirePatientLock(p){
  if(!p) return;
  p.lockedBy=operator||"?"; p.lockedAt=nowMs();
  state.readonly=false; _lockBeat=nowMs();
  await savePatient(p);
}
async function releasePatientLock(){
  var p=state.edit;
  if(p && p.lockedBy && p.lockedBy===operator){
    p.lockedBy=null; p.lockedAt=null;
    await savePatient(p);
  }
}
function activeByCat(cat){return patients.filter(function(p){return p.status==="active"&&p.cat===cat;});}
function countCat(cat){return activeByCat(cat).length;}
function countGpa(){return patients.filter(function(p){return p.status==="gpa";}).length;}
function countPrio(){return patients.filter(function(p){return p.status==="active"&&p.prio;}).length;}

function render(){
  $("backbtn").style.display = (state.view==="start"||state.view==="locked"||state.view==="install"||state.view==="praesidium") ? "none" : "flex";
  var titles={locked:"Argus",install:"Argus installieren",praesidium:"Argus",start:"Argus",home:"Argus",checklist:"Checkliste",capture:"Patient erfassen",overview:"Patientenübersicht",catlist:CATS[state.cat?state.cat:"T1"].label,patient:"Patient",help:"Hilfestellungen"};
  $("title").textContent=titles[state.view]||"Argus";
  var v=state.view, h="";
  if(v==="locked")h=vLocked();
  else if(v==="install")h=vInstall();
  else if(v==="praesidium")h=vPraesidium();
  else if(v==="start")h=vStart();
  else if(v==="home")h=vHome();
  else if(v==="checklist")h=vChecklist();
  else if(v==="capture")h=vCapture();
  else if(v==="overview")h=vOverview();
  else if(v==="catlist")h=vCatlist();
  else if(v==="patient")h=vPatient();
  else if(v==="help")h=vHelp();
  $("app").innerHTML=h;
  if(typeof window!=="undefined"&&window.scrollTo)window.scrollTo(0,0);
}
function countbar(){
  var s="";var defs=[["T1",CATS.T1],["T2",CATS.T2],["T3",CATS.T3],["T5",CATS.T5]];
  defs.forEach(function(d){var c=d[1];s+='<div class="cnt" style="background:'+c.bg+';color:'+c.fg+(c.bd?';border:1px solid '+c.bd:'')+'"><span class="n">'+countCat(d[0])+'</span><span class="l">'+c.label+'</span></div>';});
  s+='<div class="cnt" style="background:var(--prio);color:#fff"><span class="n">'+countPrio()+'</span><span class="l">PRIO</span></div>';
  s+='<div class="cnt" style="background:var(--surf2);color:var(--mut)"><span class="n">'+countGpa()+'</span><span class="l">gPA</span></div>';
  return '<div class="countbar">'+s+'</div>';
}

function vOverview(){
  var h=countbar();
  CATORDER.forEach(function(cat){var c=CATS[cat];var n=countCat(cat);
    h+='<button class="bigcat" data-action="opencat" data-cat="'+cat+'" style="background:'+c.bg+';color:'+c.fg+(c.bd?';border:1px solid '+c.bd:'')+'"><span><span class="lab">'+c.label+'</span> <span class="nm">'+c.nm+'</span></span><span class="cc">'+n+'</span></button>';
  });
  h+='<p class="hint" style="text-align:center;margin-top:10px">Kategorie antippen → Patientenliste → Patient antippen</p>';
  if(operator&&masterMedic&&operator===masterMedic){
    h+='<div class="sech">Nur MasterMedic</div>';
    /* Reguläre Präsidien: echtes geräteübergreifendes Zusammenführen.
     * Schulungsumgebung: lokale Demo-Simulation (unten). */
    if(_praesidiumName!=='Schulungsumgebung'){ h+=realMergeUI(); h+=ccpAdminUI(); return h; }
    /* Welche Demo-CCPs sind bereits zusammengeführt? */
    var mergedKeys=[];
    patients.forEach(function(p){if(p.demo&&mergedKeys.indexOf(p.ccp)===-1)mergedKeys.push(p.ccp);});
    mergedKeys.sort();
    /* Welche Demo-CCPs sind noch NICHT zusammengeführt? */
    var availKeys=Object.keys(DEMO_CCPS).filter(function(k){return mergedKeys.indexOf(k)===-1;});
    /* Status-Banner wenn mindestens eine CCP zusammengeführt ist */
    if(ccpMerged&&mergedKeys.length>0){
      h+='<div class="banner" style="margin-bottom:10px"><span>✓</span><div>';
      h+='<span style="font-weight:600">Aktiv: CCP A + CCP '+mergedKeys.join(' + CCP ')+'</span><br>';
      h+='<span class="hint">Nummern mit Buchstaben-Präfix (A-01, '+mergedKeys[0]+'-01 …)</span>';
      h+='</div></div>';
      h+='<button class="ghost" data-action="mergeundo" style="margin-top:0;margin-bottom:8px">Zusammenführung zurücksetzen</button>';
    }
    /* Merge-Button solange noch ungemergde CCPs vorhanden */
    if(availKeys.length>0){
      var btnLabel=ccpMerged?'⇄ Weitere CCP hinzufügen':'⇄ CCPs zusammenführen';
      h+='<button class="ghost" data-action="mergestart" style="margin-top:0">'+btnLabel+'</button>';
      h+='<p class="hint" style="text-align:center;margin-top:5px">'+availKeys.length+' CCP'+( availKeys.length!==1?'s':'')+' verfügbar</p>';
    }
    h+='<div class="sech">Schulung</div>';
    h+='<button class="ghost" data-action="schulreset" style="margin-top:0">🎓 Schulung zurücksetzen (Demo-Patienten neu)</button>';
    h+='<p class="hint" style="text-align:center;margin-top:5px">Löscht aktuelle Patienten und spielt das Übungsszenario neu ein</p>';
    h+=ccpAdminUI();
  }
  return h;
}
function vCatlist(){
  var cat=state.cat,c=CATS[cat];
  var list=activeByCat(cat).sort(function(a,b){
    var ca=a.ccp||"A",cb=b.ccp||"A";
    if(ca!==cb)return ca<cb?-1:1;
    return a.num-b.num;
  });
  var h='<div class="bigcat" style="background:'+c.bg+';color:'+c.fg+(c.bd?';border:1px solid '+c.bd:'')+';margin-bottom:14px"><span><span class="lab">'+c.label+'</span> <span class="nm">'+c.nm+'</span></span><span class="cc">'+list.length+'</span></div>';

  if(readyList.length>0){
    h+='<button class="prim" data-action="checkoutready" data-cat="'+cat+'" style="background:var(--ready);margin:0 0 14px">✓ Alle '+readyList.length+' transportfertigen auschecken → gPA</button>';
  }
  if(list.length===0)h+='<p class="muted" style="text-align:center;padding:20px">keine Patienten in dieser Kategorie</p>';
  list.forEach(function(p){
    h+='<button class="patrow" data-action="openpat" data-id="'+p.id+'"><span class="pnum">'+pno(p)+'</span>'+
      '<span style="flex:1"><span style="font-weight:500">'+(esc(p.name)||"—")+'</span>'+

function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1700);}

function resizePhoto(file,maxEdge,quality){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);var img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.naturalWidth||img.width,hh=img.naturalHeight||img.height;
      var s=Math.min(1,maxEdge/Math.max(w,hh));
      var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(hh*s));
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
      cv.getContext("2d").drawImage(img,0,0,cw,ch);
      try{resolve(cv.toDataURL("image/jpeg",quality));}catch(e){reject(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("img"));};
    img.src=url;
  });
}

function confirmModal(msg,okLabel){
  return new Promise(function(resolve){
    var ov=document.createElement("div");ov.className="modalov";
    ov.innerHTML='<div class="modalbx"><div class="modalmsg">'+esc(msg)+'</div>'+
      '<div class="row" style="margin-top:16px">'+
      '<button class="ghost mc-cancel" style="flex:1;margin:0">Abbrechen</button>'+
      '<button class="prim mc-ok" style="flex:1;margin:0;background:var(--ready)">'+esc(okLabel||"OK")+'</button></div></div>';
    document.body.appendChild(ov);
    function done(v){if(ov.parentNode)ov.parentNode.removeChild(ov);resolve(v);}
    ov.querySelector(".mc-cancel").addEventListener("click",function(){done(false);});
    ov.querySelector(".mc-ok").addEventListener("click",function(){done(true);});
    ov.addEventListener("click",function(e){if(e.target===ov)done(false);});
  });
}
function promptModal(msg,def){
  return new Promise(function(resolve){
    var ov=document.createElement("div");ov.className="modalov";
    ov.innerHTML='<div class="modalbx"><div class="modalmsg">'+esc(msg)+'</div>'+
      '<input class="mc-inp" style="margin-top:12px" value="'+esc(def||"")+'">'+
      '<div class="row" style="margin-top:16px">'+
      '<button class="ghost mc-cancel" style="flex:1;margin:0">Abbrechen</button>'+
      '<button class="prim mc-ok" style="flex:1;margin:0">OK</button></div></div>';
    document.body.appendChild(ov);
    var inp=ov.querySelector(".mc-inp");
    function done(v){if(ov.parentNode)ov.parentNode.removeChild(ov);resolve(v);}
    ov.querySelector(".mc-cancel").addEventListener("click",function(){done(null);});
    ov.querySelector(".mc-ok").addEventListener("click",function(){done(inp.value);});
    ov.addEventListener("click",function(e){if(e.target===ov)done(null);});
    setTimeout(function(){try{inp.focus();}catch(e){}},50);
  });
}
function mergeCcpSelectModal(){
  return new Promise(function(resolve){
    var ov=document.createElement("div");ov.className="modalov";
    var inner='<div class="modalbx" style="max-width:360px">';
    inner+='<div class="modalmsg" style="margin-bottom:14px">Welche CCP zusammenführen?</div>';
    ['B','C'].forEach(function(k){
      var d=DEMO_CCPS[k];
      var already=patients.some(function(p){return p.demo&&p.ccp===k;});
      var t1=d.patients.filter(function(p){return p.cat==="T1";}).length;
      var t2=d.patients.filter(function(p){return p.cat==="T2";}).length;
      var t3=d.patients.filter(function(p){return p.cat==="T3";}).length;
      inner+='<button class="mc-ccpsel card" data-ccp="'+k+'" style="width:100%;text-align:left;margin-bottom:10px;cursor:pointer;padding:13px 14px'+(already?';opacity:.4;pointer-events:none':'')+'">';
      inner+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">';
      inner+='<span class="mono" style="font-size:19px;font-weight:600">CCP '+k+'</span>';
      inner+='<span class="hint">'+esc(d.ort)+'</span>';
      if(already)inner+='<span class="pill" style="background:var(--surf2);color:var(--mut);margin-left:auto">bereits zusammengeführt</span>';
      inner+='</div>';
      inner+='<div style="display:flex;gap:6px;margin-bottom:5px">';
      inner+='<span class="pill" style="background:var(--t1);color:#fff">T-1 × '+t1+'</span>';
      inner+='<span class="pill" style="background:var(--t2);color:#3A2C00">T-2 × '+t2+'</span>';
      inner+='<span class="pill" style="background:var(--t3);color:#fff">T-3 × '+t3+'</span>';
      inner+='</div>';
      inner+='<div class="hint">MasterMedic: '+esc(d.mm)+' · '+d.patients.length+' Patienten</div>';
      inner+='</button>';
    });
    inner+='<button class="ghost mc-cancel" style="width:100%;margin-top:2px">Abbrechen</button>';
    inner+='</div>';
    ov.innerHTML=inner;
    document.body.appendChild(ov);
    function done(v){if(ov.parentNode)ov.parentNode.removeChild(ov);resolve(v);}
    ov.querySelectorAll(".mc-ccpsel").forEach(function(btn){
      btn.addEventListener("click",function(){done(btn.getAttribute("data-ccp"));});
    });
    ov.querySelector(".mc-cancel").addEventListener("click",function(){done(null);});
    ov.addEventListener("click",function(e){if(e.target===ov)done(null);});
  });
}

document.addEventListener("click",async function(e){
  var el=e.target.closest("[data-action]");if(!el)return;
  var a=el.getAttribute("data-action");
  if(a==="back"){await back();return;}
  if(a==="selectpraesidium"){
    _praesidiumId=el.getAttribute("data-pid");
    _praesidiumName=el.getAttribute("data-pname")||'';
    localStorage.setItem('argus_praesidium_id',_praesidiumId);
    localStorage.setItem('argus_praesidium_name',_praesidiumName);
    _ccpId=null; _channel=null;
    localStorage.removeItem('argus_ccp_id');
    await loadPatients(); go("start"); return;
  }
  if(a==="changepraesidium"){
    _praesidiumId=null; _praesidiumName='';
    localStorage.removeItem('argus_praesidium_id');
    localStorage.removeItem('argus_praesidium_name');
    var pr=await sb().from('praesidien').select('id,name').order('name');
    _praesidienList=pr.data||[];
    go("praesidium"); return;
  }
  if(a==="shareinvite"){await copyInviteLink();return;}
  if(a==="checkinvite"){
    var inp=document.getElementById('inv-input');
    var code=inp?inp.value.trim().toUpperCase():'';
    var codeClean=code.replace(/[\s\-]/g,'');
    if(!code||codeClean.length<8){toast("Bitte Code eingeben (Format: XXXX-XXXX)");return;}
    toast("Prüfe Code…");
    var valid=await validateInviteToken(code);
    if(valid){
      localStorage.setItem('argus_verified','true');
      localStorage.setItem('argus_invite',code);
      if(valid.is_master){
        /* MasterToken: Rolle setzen + Präsidienauswahl zeigen */
        _isMaster=true;
        localStorage.setItem('argus_is_master','true');
        localStorage.removeItem('argus_praesidium_id');
        localStorage.removeItem('argus_praesidium_name');
        _praesidiumId=null; _praesidiumName='';
        var prlc=await sb().from('praesidien').select('id,name').order('name');
        _praesidienList=prlc.data||[];
        go("praesidium");
      } else {
        /* Normaler Token: Präsidium setzen und weiter */
        if(valid.praesidium_id){
          _praesidiumId=valid.praesidium_id;
          _praesidiumName=(valid.praesidien&&valid.praesidien.name)||'';
          localStorage.setItem('argus_praesidium_id',_praesidiumId);
          localStorage.setItem('argus_praesidium_name',_praesidiumName);
        }
        await loadMeta();await loadPatients();await loadChecklist();
        subscribeRealtime();
        if(!operator){
          var voinv=await promptModal("Dein Kürzel:","");
          if(voinv&&voinv.trim()){operator=voinv.trim();await setOperatorStore(operator);}
        }
        go("start");
      }
    }else{toast("Ungültiger Code");}
    return;
  }
  if(a==="nav"){go(el.getAttribute("data-view"));return;}
  if(a==="resumeccp"){
    /* Kürzel bekannt, aber MasterMedic noch nicht gesetzt → automatisch übernehmen */
    if(operator && !masterMedic){await setMasterMedic(operator);}
    go("home");return;
  }
  if(a==="newccp"){
    if(!operator){
      var vop=await promptModal("Dein Kürzel (z. B. Name / Streife):","");
      if(vop==null||!vop.trim())return;
      operator=vop.trim();await setOperatorStore(operator);
    }
    /* Immer prüfen — auch bei returning users ohne gespeicherten MasterMedic */
    if(!masterMedic && operator){await setMasterMedic(operator);}
    /* Zugang dauerhaft freischalten (auch wenn vom gesperrten Bildschirm aus) */
    if(!localStorage.getItem('argus_verified')) localStorage.setItem('argus_verified','true');
    if(!_ccpId){toast("Verbinde…");var ok2=await openOrCreateCCP();if(ok2)subscribeRealtime();}
    go("home");return;
  }
  if(a==="joinccp"){
    var client2=sb();
    if(!client2){await confirmModal("Keine Backend-Verbindung.\n\nInternetverbindung prüfen.","OK");return;}
    var jres=await client2.from('ccps').select('*')      .eq('praesidium_id',_praesidiumId||'00000000-0000-0000-0000-000000000000').is('closed_at',null).order('created_at',{ascending:true});
    if(!jres.data||jres.data.length===0){
      await confirmModal("Keine aktiven CCPs gefunden.\n\nEröffne zuerst einen CCP über 'Neue CCP eröffnen'.","OK");return;
    }
    var selId=await ccpJoinModal(jres.data);
    if(!selId) return;
    _ccpId=selId; localStorage.setItem('argus_ccp_id',_ccpId);
    if(!operator){
      var voj=await promptModal("Dein Kürzel:","");
      if(!voj||!voj.trim()) return;
      operator=voj.trim();await setOperatorStore(operator);
    }
    toast("Verbinde mit CCP…");
    await loadMeta();await loadPatients();
    subscribeRealtime();
    go("home");return;
  }
  if(a==="setoperator"){e.preventDefault();var v=await promptModal("Bediener-Kürzel (z. B. Streife / Name):",operator||"");if(v!=null){operator=v.trim();await setOperatorStore(operator);if(!masterMedic&&operator){await setMasterMedic(operator);}render();}return;}
  if(a==="claimmm"){
    e.preventDefault();
    if(!operator){var vo=await promptModal("Erst dein Kürzel angeben:",operator||"");if(vo==null||!vo.trim())return;operator=vo.trim();await setOperatorStore(operator);}
    var okm=await confirmModal(masterMedic?("MasterMedic-Rolle von "+masterMedic+" übernehmen?"):"MasterMedic-Rolle übernehmen?","Übernehmen");
    if(!okm)return;
    await setMasterMedic(operator);render();toast("Du bist jetzt MasterMedic");
    return;
  }
  if(a==="mergestart"){
    var ccpKey=await mergeCcpSelectModal();
    if(!ccpKey)return;
    var demoInfo=DEMO_CCPS[ccpKey];
    var msg="CCP "+ccpKey+" zusammenführen?\n\nStandort: "+demoInfo.ort+"\nMasterMedic: "+demoInfo.mm+"\n"+demoInfo.patients.length+" Patienten\n\nIn der echten Version bestätigt MasterMedic "+demoInfo.mm+" dies auf seinem Gerät.";
    var oks=await confirmModal(msg,"Zusammenführen");
    if(!oks)return;
    await doMergeDemo(ccpKey);render();toast("CCP A + CCP "+ccpKey+" zusammengeführt");
    return;
  }
  if(a==="mergeundo"){
    var oku=await confirmModal("Zusammenführung zurücksetzen? Die Demo-Patienten werden entfernt.","Zurücksetzen");
    if(!oku)return;
    await undoMergeDemo();render();toast("Zusammenführung zurückgesetzt");
    return;
  }
  if(a==="rmergestart"){
    var rmc=sb();
    if(!rmc){await confirmModal("Keine Backend-Verbindung.\n\nInternetverbindung prüfen.","OK");return;}
    var rlst=await rmc.from('ccps').select('*').eq('praesidium_id',_praesidiumId||'00000000-0000-0000-0000-000000000000').is('closed_at',null).order('created_at',{ascending:true});
    var cands=(rlst.data||[]).filter(function(c){return c.id!==_ccpId && !c.merge_group_id;});
    if(!cands.length){await confirmModal("Kein zusammenführbarer CCP im Präsidium gefunden.\n\n(Nur eigenständige, noch nicht zusammengeführte CCPs.)","OK");return;}
    var tgt=await ccpJoinModal(cands);
    if(!tgt)return;
    var okr=await realMergeRequest(tgt);
    if(okr){await loadPatients();render();toast("Anfrage gesendet — warte auf Bestätigung der CCP-Leitung");}
    else toast("Anfrage fehlgeschlagen");
    return;
  }
  if(a==="rmergeleave"){
    var okl=await confirmModal("Zusammenführung auflösen? Dein CCP wird wieder eigenständig.","Auflösen");
    if(!okl)return;
    await realMergeLeave();render();toast("Zusammenführung aufgelöst");
    return;
  }
  if(a==="ccpclose"){
    var okc=await confirmModal("Diesen CCP abschließen?\n\nEr wird aus der Auswahl ausgeblendet, die Daten bleiben erhalten.","Abschließen");
    if(!okc)return;
    var ccx=sb();
    if(ccx&&_ccpId){try{await ccx.from('ccps').update({closed_at:nowMs()}).eq('id',_ccpId);}catch(e){}}
    await leaveCurrentCcp();render();toast("CCP abgeschlossen");go("start");return;
  }
  if(a==="ccpdelete"){
    if(!_isMaster){toast("Nur mit MasterToken-Freischaltung möglich");return;}
    await loadPatients();
    var dn=patients.filter(function(p){return !p.demo;}).length;
    var okd=await confirmModal("CCP endgültig löschen?\n\n"+dn+" Patient(en) werden UNWIDERRUFLICH gelöscht — das kann nicht rückgängig gemacht werden.","Endgültig löschen");
    if(!okd)return;
    var cdx=sb();
    if(cdx&&_ccpId){try{await cdx.from('ccps').delete().eq('id',_ccpId);}catch(e){}} /* CASCADE löscht zugehörige Patienten */
    await leaveCurrentCcp();render();toast("CCP gelöscht");go("start");return;
  }
  if(a==="schulreset"){
    if(_praesidiumName!=='Schulungsumgebung')return;
    var oks2=await confirmModal("Schulung zurücksetzen?\n\nAlle aktuellen Patienten dieses CCP werden gelöscht und das Übungsszenario neu eingespielt.","Zurücksetzen");
    if(!oks2)return;
    var scx=sb(); if(!scx||!_ccpId){toast("Keine Backend-Verbindung");return;}
    toast("Setze zurück…");
    try{await scx.from('patients').delete().eq('ccp_id',_ccpId);}catch(e){}
    _demoMerged=false; await sSet("ccp_merged",false);
    var slk=await sList("ccp_pat_"); for(var si=0;si<slk.length;si++){await sDel(slk[si]);}
    var seed=DEMO_CCPS["B"].patients, st=nowMs();
    for(var sj=0;sj<seed.length;sj++){
      var sp=seed[sj], stq=sp.tqStart?st+sp.tqStart:null;
      var np={id:"p"+st+"_"+sj+Math.floor(Math.random()*1000),num:sp.num,cat:sp.cat,ccp:_ccpKennung,
        prio:sp.prio||false,ready:sp.ready||false,status:"active",
        created:st-(3600000-sj*240000),lastTriage:st-(1800000-sj*120000),tqStart:stq,
        name:"",age:"",gender:"",allergies:"",pupRe:"",pupLi:"",
        vit:Object.assign({af:"",spo2:"",hf:"",rr:"",avpu:"",pain:""},sp.vit||{}),
        tx:{},inj:sp.inj||[],moi:"Übungsfall",injury:"",fr:DEMO_CCPS["B"].mm,notes:sp.notes||"",by:DEMO_CCPS["B"].mm,updated:st};
      await savePatient(np);
    }
    await loadPatients();render();toast("Schulung zurückgesetzt — "+seed.length+" Demo-Patienten");
    return;
  }
  if(a==="tacstart"){state.capMode="tac";state.tacNode="start";state.tacResult=null;render();return;}
  if(a==="tacanswer"){var g=el.getAttribute("data-go");if(g.indexOf("R:")===0){state.tacResult=g.slice(2);}else{state.tacNode=g;}render();return;}
  if(a==="tacconfirm"){var cat=el.getAttribute("data-cat");var num=await addPatient(cat);state.capMode="menu";state.tacResult=null;render();toast("Patient #"+num+" angelegt ("+CATS[cat].label+")");return;}
  if(a==="addcat"){var cat2=el.getAttribute("data-cat");var num2=await addPatient(cat2);render();toast("Patient #"+num2+" angelegt ("+CATS[cat2].label+")");return;}
  if(a==="opencat"){state.cat=el.getAttribute("data-cat");go("catlist");return;}
  if(a==="openpat"){
    var id=el.getAttribute("data-id");await loadPatients();
    state.id=id;state.edit=patients.find(function(p){return p.id===id;});
    if(state.edit){
      var li=lockInfo(state.edit);
      if(li.locked && !li.mine){
        state.readonly=true;                 /* fremd & frisch gesperrt → schreibgeschützt (MasterMedic sieht Override) */
      }else{
        await acquirePatientLock(state.edit); /* frei, abgelaufen oder eigene Sperre → übernehmen */
      }
      state.view="patient";render();
    }
    return;
  }
  if(a==="overridelock"){
    if(!isMasterMedic()){toast("Nur MasterMedic kann übernehmen");return;}
    if(state.edit){await acquirePatientLock(state.edit);toast("Sperre übernommen");render();}
    return;
  }
  if(a==="movecat"){var p=state.edit;p.cat=el.getAttribute("data-cat");p.lastTriage=nowMs();await savePatient(p);render();return;}
  if(a==="prio"){var p2=state.edit;p2.prio=!p2.prio;await savePatient(p2);render();return;}
  if(a==="ready"){var p3=state.edit;p3.ready=!p3.ready;await savePatient(p3);render();return;}
  if(a==="tq"){var p4=state.edit;p4.tqStart=p4.tqStart?null:nowMs();await savePatient(p4);render();return;}
  if(a==="gpa"){var p5=state.edit;p5.status="gpa";p5.lockedBy=null;p5.lockedAt=null;await savePatient(p5);state.readonly=false;await loadPatients();go("overview");toast("Patient #"+p5.num+" → gPA");return;}
  if(a==="checkoutready"){
    var rcat=el.getAttribute("data-cat");
    await loadPatients();
    var rl2=patients.filter(function(p){return p.status==="active"&&p.cat===rcat&&p.ready;});
    if(rl2.length===0){toast("keine transportfertigen Patienten");render();return;}
    var ok=await confirmModal(rl2.length+" transportfertige Patienten ("+CATS[rcat].label+") auschecken → gPA?","Auschecken");
    if(!ok)return;
    for(var ri=0;ri<rl2.length;ri++){rl2[ri].status="gpa";await savePatient(rl2[ri]);}
    await loadPatients();render();toast(rl2.length+" Patienten → gPA");
    return;
  }
  if(a==="delphoto"){var pph=state.edit;if(pph){delete pph.photo;await savePatient(pph);render();toast("Foto entfernt");}return;}
  if(a==="addinj"){var p6=state.edit;var rsel=document.querySelector('[data-field="injRegion"]');var asel=document.querySelector('[data-field="injArt"]');if(rsel&&asel){p6.inj=p6.inj||[];p6.inj.push({r:rsel.value,a:asel.value});await savePatient(p6);render();}return;}
  if(a==="delinj"){var p7=state.edit;var idx=+el.getAttribute("data-idx");p7.inj.splice(idx,1);await savePatient(p7);render();return;}
});
document.addEventListener("change",async function(e){
  var el=e.target.closest("[data-kind]");if(!el)return;
  var kind=el.getAttribute("data-kind"),field=el.getAttribute("data-field");
  if(state.readonly && (kind==="pat"||kind==="vit"||kind==="photo")) return; /* Schreibschutz bei fremder Sperre */
  if(kind==="chk"){var cid=el.getAttribute("data-id");if(!checklist.items[cid])checklist.items[cid]={};
    checklist.items[cid][field]= field==="done"?el.checked:el.value;await saveChecklist();return;}
  if(kind==="hdr"){checklist.hdr[field]=el.value;await saveChecklist();return;}
  if(kind==="pat"&&state.edit){state.edit[field]=el.value;await savePatient(state.edit);return;}
  if(kind==="vit"&&state.edit){state.edit.vit[field]=el.value;await savePatient(state.edit);return;}
  if(kind==="photo"&&state.edit){
    var file=el.files&&el.files[0];if(!file)return;
    toast("Foto wird verarbeitet…");
    try{
      var durl=await resizePhoto(file,640,0.5);
      state.edit.photo=durl;
      await savePatient(state.edit);
      render();toast("Foto gespeichert");
    }catch(err){toast("Foto fehlgeschlagen");}
    return;
  }
});
document.addEventListener("click",async function(e){
  var el=e.target.closest('[data-kind="tx"]');if(!el)return;
  if(state.readonly)return; /* Schreibschutz bei fremder Sperre */
  var f=el.getAttribute("data-field");var p=state.edit;if(!p)return;
  if(!p.tx)p.tx={};p.tx[f]=!p.tx[f];el.classList.toggle("on",p.tx[f]);await savePatient(p);
});

function go(view){state.view=view;if(view==="capture")state.capMode="menu";render();}
async function back(){
  if(state.view==="patient"){await releasePatientLock();state.readonly=false;go("catlist");}
  else if(state.view==="catlist"){go("overview");}
  else if(state.view==="capture"&&state.capMode==="tac"){state.capMode="menu";render();}
  else if(state.view==="home"){go("start");}
  else{go("home");}
}

setInterval(function(){
  $("clock").textContent=new Date().toLocaleTimeString("de-DE");
  document.querySelectorAll(".js-age").forEach(function(n){n.textContent=ageStr(+n.getAttribute("data-ts"));});
  document.querySelectorAll(".js-tq").forEach(function(n){n.textContent=fmtDur(nowMs()-(+n.getAttribute("data-tq")));});
  var tb=document.querySelector('[data-action="tq"]');
  if(tb&&state.edit&&state.edit.tqStart){tb.textContent="TQ läuft · "+fmtDur(nowMs()-state.edit.tqStart)+" — stoppen";}
},1000);
setInterval(async function(){
  if(state.view==="patient"||state.view==="checklist"||state.view==="locked"||state.view==="install"||state.view==="praesidium"||state.view==="start")return;
  await loadMeta();await loadPatients();await loadChecklist();
  await checkIncomingMergeRequest();
  render();
},3500);
/* Sperr-Heartbeat: hält die eigene Sperre frisch und erkennt eine
 * MasterMedic-Übernahme. Läuft nur im Patienten-View; re-rendert NICHT im
 * Normalfall (sonst Fokusverlust beim Tippen), nur wenn die Sperre fremd wird. */
setInterval(async function(){
  if(state.view!=="patient"||!state.edit||state.readonly) return;
  if(state.edit.lockedBy!==operator) return;
  if(nowMs()-_lockBeat <= 15000) return;
  _lockBeat=nowMs();
  var client=sb();
  if(client && _ccpId){
    try{
      var r=await client.from('patients').select('locked_by,locked_at').eq('id',state.edit.id).single();
      if(r.data && r.data.locked_by && r.data.locked_by!==operator && (nowMs()-(r.data.locked_at||0))<LOCK_TTL){
        state.readonly=true; state.edit.lockedBy=r.data.locked_by; state.edit.lockedAt=r.data.locked_at;
        render(); toast("Sperre durch "+r.data.locked_by+" übernommen"); return; /* überschrieben → schreibgeschützt */
      }
    }catch(e){}
  }
  state.edit.lockedAt=nowMs();
  await savePatient(state.edit);
},16000);

(async function init(){
  operator=await getOperator();if(!operator)operator="";

  /* ── Zugangsprüfung (nur einmalig beim ersten Start) ─────────────
   * argus_verified = true  →  einmal freigeschaltet, dauerhaft Zugang
   * Einladungslink         →  einmalige Registrierung, danach verified
   * Nichts von beidem      →  gesperrter Bildschirm
   * ──────────────────────────────────────────────────────────────── */
  var verified=localStorage.getItem('argus_verified');
  var urlToken=extractInviteToken();
  _praesidiumId   = localStorage.getItem('argus_praesidium_id')||null;
  _praesidiumName = localStorage.getItem('argus_praesidium_name')||'';
  _isMaster       = localStorage.getItem('argus_is_master')==='true';

  if(urlToken){
    /* Einladungslink: einmalig validieren und Zugang dauerhaft freischalten */
    var tokenData=await validateInviteToken(urlToken);
    if(tokenData){
      /* Browser (nicht PWA): Installationsseite zeigen */
      if(!isStandalone()){
        state.installShortCode=tokenData.short_code||urlToken.slice(0,8).toUpperCase();
        state.installTokenFull=urlToken;
        $("clock").textContent=new Date().toLocaleTimeString("de-DE");
        state.view='install'; render(); return;
      }
      localStorage.setItem('argus_verified','true');
      localStorage.setItem('argus_invite',urlToken);
      history.replaceState(null,'',window.location.pathname);
      if(tokenData.is_master){
        /* MasterToken: Präsidiensauswahl als nächste Seite */
        localStorage.setItem('argus_is_master','true');
        _isMaster=true;
        var prl=await sb().from('praesidien').select('id,name').order('name');
        _praesidienList=prl.data||[];
        $("clock").textContent=new Date().toLocaleTimeString("de-DE");
        state.view='praesidium'; render(); return;
      } else if(tokenData.praesidium_id){
        /* Normaler Token: Präsidium direkt setzen */
        _praesidiumId=tokenData.praesidium_id;
        _praesidiumName=(tokenData.praesidien&&tokenData.praesidien.name)||'';
        localStorage.setItem('argus_praesidium_id',_praesidiumId);
        localStorage.setItem('argus_praesidium_name',_praesidiumName);
      }
    }else{
      $("clock").textContent=new Date().toLocaleTimeString("de-DE");
      state.view='locked'; render(); return;
    }
  } else if(!verified){
    $("clock").textContent=new Date().toLocaleTimeString("de-DE");
    state.view='locked'; render(); return;
  }

  /* Kein Präsidium gewählt → Auswahl zeigen (für alle Nutzer) */
  if(!_praesidiumId && sb()){
    var prl2=await sb().from('praesidien').select('id,name').order('name');
    _praesidienList=prl2.data||[];
    $("clock").textContent=new Date().toLocaleTimeString("de-DE");
    state.view='praesidium'; render(); return;
  }

  /* Ab hier: Nutzer ist freigeschaltet — letzten CCP wiederherstellen */
  var storedCcp=localStorage.getItem('argus_ccp_id');
  if(storedCcp) _ccpId=storedCcp;

  await loadMeta();
  await loadPatients();
  await loadChecklist();
  if(_ccpId && sb()) subscribeRealtime();
  $("clock").textContent=new Date().toLocaleTimeString("de-DE");
  render();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(e) {});
}
</script>
