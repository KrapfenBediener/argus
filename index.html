/* Geister-Klick-Schutz (Android-Fix III, 2026-10-15): Auf Touch-Geräten feuert
 * der Browser NACH pointerup/touchend noch ein synthetisches „click" — und zwar
 * auf das Element, das in diesem Moment unter dem Finger liegt. Wird der Dialog
 * schon beim Loslassen entfernt, trifft dieser Klick die Seite DARUNTER. In der
 * Schulung liegt dort exakt der vom Coach-Spotlight zentrierte Knopf „Neue CCP
 * eröffnen" → der Handler lief erneut, die Ort-Abfrage erschien wieder, „OK" wirkte
 * wie „Abbrechen". Daher: Dialog erst unsichtbar + über alles legen (fängt den
 * Geister-Klick ab), die Antwort sofort liefern, DOM-Entfernung kurz verzögern. */
function modalDismiss(ov, cb){
  if(ov._dismissed) return; ov._dismissed=true;
  try{ if(document.activeElement && ov.contains(document.activeElement)) document.activeElement.blur(); }catch(e){}
  var kill=function(e){ e.stopPropagation(); e.preventDefault(); };
  ['click','pointerdown','pointerup','touchstart','touchend','mousedown','mouseup'].forEach(function(t){ ov.addEventListener(t,kill,true); });
  ov.style.opacity='0'; ov.style.zIndex='8600'; ov.style.transition='none';
  setTimeout(function(){ if(ov.parentNode)ov.parentNode.removeChild(ov); },450);
  if(cb) cb();
}
function promptModal(msg,def){
  return new Promise(function(resolve){
    var ov=document.createElement("div");ov.className="modalov";
    ov.innerHTML='<div class="modalbx"><div class="modalmsg">'+esc(msg)+'</div>'+
      '<input class="mc-inp" style="margin-top:12px" value="'+esc(def||"")+'">'+
      '<div class="row" style="margin-top:16px">'+
      '<button class="ghost mc-cancel" style="flex:1;margin:0">Abbrechen</button>'+
      '<button class="prim mc-ok" style="flex:1;margin:0">OK</button></div></div>';
    document.body.appendChild(ov);
    /* Android-Fix II (2026-10-15): Dialog mit Eingabefeld OBEN verankern statt
     * zentrieren — die Tastatur verkleinert den Viewport, ein zentrierter Dialog
     * springt beim Auf-/Zuklappen. Auf Android schluckt der erste Tipp oft nur die
     * Tastatur; der zweite landete dann dort, wo „OK" vorher war (Hintergrund). */
    ov.style.alignItems='flex-start'; ov.style.paddingTop='max(10vh,48px)';
    var inp=ov.querySelector(".mc-inp");
    function done(v){ modalDismiss(ov, function(){ resolve(v); }); }
    /* Android-Fix (2026-10-15): Der Tipp auf OK blendet die Tastatur aus, der
     * Dialog rutscht nach, und das click-Ereignis trifft den Hintergrund → wurde
     * als Abbrechen gewertet. Daher: beim ANTIPPEN merken, was gedrückt wurde,
     * und beim Loslassen diese Absicht ausführen; Hintergrund bricht nur ab,
     * wenn der Tipp auch auf dem Hintergrund BEGANN. click bleibt als Fallback. */
    var pressed=null, downOnOv=false;
    ov.querySelector(".mc-ok").addEventListener("pointerdown",function(){pressed="ok";});
    ov.querySelector(".mc-cancel").addEventListener("pointerdown",function(){pressed="cancel";});
    ov.addEventListener("pointerdown",function(e){ pressed=null; downOnOv=(e.target===ov); },true);   /* Capture: Absicht bei jedem neuen Antippen zurücksetzen */
    ov.addEventListener("pointercancel",function(){ pressed=null; });
    ov.addEventListener("pointerup",function(){ if(pressed==="ok")done(inp.value); else if(pressed==="cancel")done(null); pressed=null; });
    ov.querySelector(".mc-cancel").addEventListener("click",function(){done(null);});
    ov.querySelector(".mc-ok").addEventListener("click",function(){done(inp.value);});
    /* KEIN Abbruch per Hintergrund-Tipp bei Eingabe-Dialogen — Abbrechen nur über
     * den Knopf (verhindert jeden Tastatur-Verrutsch-Fehlalarm). */
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); done(inp.value); } });
    setTimeout(function(){try{inp.focus();}catch(e){}},50);
  });
}

  if(a==="movecat"){var p=state.edit;p.cat=el.getAttribute("data-cat");p.lastTriage=nowMs();await savePatient(p);render();return;}
  if(a==="prio"){var p2=state.edit;p2.prio=!p2.prio;await savePatient(p2);render();return;}
  if(a==="ready"){var p3=state.edit;p3.ready=!p3.ready;await savePatient(p3);render();return;}
  if(a==="tq"){
    var p4=state.edit;
    if(p4.tqStart){ p4.tqStart=null; p4.tqSite=null; await savePatient(p4); render(); return; }
    /* TQ-Start-Dialog (Feedback 2026-06-13): TQs sind oft schon VOR Ankunft am

    p4.tqStart=tqr.start; p4.tqSite=tqr.site||null;
    await savePatient(p4); render(); return;
  }
  if(a==="logvit"){
    var pv=state.edit; if(!pv) return;

    var v=pv.vit||{};
    if(!(v.af||v.spo2||v.hf||v.rr||v.avpu||v.pain)){toast("Keine Vitalwerte zum Protokollieren");return;}
    if(!pv.vit) pv.vit={};

  if(a==="reactivate"){var pr=state.edit;pr.status="active";await savePatient(pr);await loadPatients();go("overview");toast("Patient "+pno(pr)+" zurückgeholt → aktiv");return;}
  if(a==="checkoutready"){

/* Sperr-Heartbeat (alle 5 s, nur im Patienten-View). Behandelt beide Rollen:
 *  • Bearbeiter: hält die eigene Sperre frisch; erkennt eine fremde Übernahme.
 *  • Wartender (readonly): erkennt, wenn die Sperre frei wird (Bearbeiter raus
 *    oder 45 s ohne Lebenszeichen) und übernimmt dann automatisch.
 * Re-rendert nur bei echtem Rollenwechsel (sonst Fokusverlust beim Tippen). */
setInterval(async function(){
  if(state.view!=="patient"||!state.edit) return;
  var client=sb();
  if(!(client && _ccpId)) return;
  var r; try{ r=await client.from('patients').select('locked_by,locked_at').eq('id',state.edit.id).single(); }catch(e){ return; }
  if(!r||!r.data) return;
  var lb=r.data.locked_by, la=r.data.locked_at||0, fresh=(nowMs()-la)<LOCK_TTL;
  if(state.readonly){
    /* Wartender: Sperre frei (niemand / abgelaufen / wieder ich) → übernehmen */
    if(!lb || !fresh || lb===operator){
      await acquirePatientLock(state.edit); render();
      toast("Patient frei — du kannst jetzt bearbeiten");
    }else{ state.edit.lockedBy=lb; state.edit.lockedAt=la; }
    return;
  }
  /* Bearbeiter: fremde Übernahme erkennen */
  if(state.edit.lockedBy===operator && lb && lb!==operator && fresh){
    state.readonly=true; state.edit.lockedBy=lb; state.edit.lockedAt=la;
    render(); toast("Sperre durch "+lb+" übernommen"); return;
  }
  /* Keepalive höchstens alle 15 s, und nur solange wir die Sperre noch halten. */
  if(state.edit.lockedBy===operator && nowMs()-_lockBeat > 15000){
    _lockBeat=nowMs(); state.edit.lockedAt=nowMs();
    try{ await client.from('patients').update({locked_at:state.edit.lockedAt}).eq('id',state.edit.id).eq('locked_by',operator); }catch(e){}
  }
},5000);

(async function init(){
  operator=await getOperator();if(!operator)operator="";
  /* Fehlende/kaputte config.js nicht still schlucken: einmaliger Hinweis beim
   * Start (kein natives alert — In-App-Toast). Banner zeigt es dauerhaft. */
  if(_configError){ setTimeout(function(){ toast('⚠️ Konfiguration fehlt (config.js) — kein Backend verbunden'); }, 600); }
  try{ _training=false; _trainStep=0; localStorage.removeItem('argus_training'); localStorage.removeItem('argus_train_step'); }catch(e){}   /* Training NICHT über App-Neustart fortführen */

  /* Erstinstallation erkennen — VOR allem anderen, solange die Geräte-Ablage noch
   * leer ist. Ein bestehender Nutzer (irgendwelche ARGUS-Daten vorhanden) bekommt
   * KEIN Intro (nur stilles Markieren); nur eine echte Neuinstallation. Eine
   * spätere Freischaltung für ein weiteres Präsidium ändert das nicht. */
  var introSeen=localStorage.getItem('argus_intro_seen');
  var hadData=!!(operator||localStorage.getItem('argus_verified')||localStorage.getItem('argus_unlocked')||localStorage.getItem('argus_jwt')||localStorage.getItem('argus_seen_version')||localStorage.getItem('argus_ccp_id'));
  window._pendingIntro = (!introSeen && !hadData);
  if(!introSeen && hadData){ try{localStorage.setItem('argus_intro_seen','1');}catch(e){} }

  /* „Was ist neu"-Hinweis: einmalig pro Version. Wird für bestehende Nutzer
   * angezeigt (auch beim ersten Lauf mit sichtbarer Version), nicht für eine
   * brandneue Erstinstallation. Läuft unabhängig vom späteren View-Pfad. */
  var seenV=localStorage.getItem('argus_seen_version');
  var existingUser=!!(localStorage.getItem('argus_jwt')||localStorage.getItem('argus_unlocked')||localStorage.getItem('argus_verified'));
  localStorage.setItem('argus_seen_version',APP_VERSION);
  if(seenV ? (seenV!==APP_VERSION) : existingUser){ setTimeout(function(){ whatsNewModal(seenV); },700); }

  /* ── Zugangsprüfung (nur einmalig beim ersten Start) ─────────────
   * argus_verified = true  →  einmal freigeschaltet, dauerhaft Zugang
   * Einladungslink         →  einmalige Registrierung, danach verified
   * Nichts von beidem      →  gesperrter Bildschirm
   * ──────────────────────────────────────────────────────────────── */
  var verified=localStorage.getItem('argus_verified');
  var urlToken=extractInviteToken();
  var urlCode=extractInviteCode();
  _praesidiumId   = localStorage.getItem('argus_praesidium_id')||null;
  _praesidiumSchulung = localStorage.getItem('argus_praesidium_schulung')==='1';
  _praesidiumName = localStorage.getItem('argus_praesidium_name')||'';
  _isMaster       = localStorage.getItem('argus_is_master')==='true';
  /* Stufe-1 Person-Sitzung wiederherstellen (Plan 05.1-03) */
  _usbnk     = localStorage.getItem('argus_usbnk')||null;
  _argusRole = localStorage.getItem('argus_role')||null;

  /* ── Freischalt-Link mit 8-stelligem Code (#code=) ──────────────── */
  if(urlCode){
    if(!isStandalone()){
      /* Browser (noch nicht installiert): Install-Screen anzeigen. Der Code steht
       * bereits im Link — KEIN DB-Read (anon darf access_tokens nicht mehr lesen;
       * Lücke aus Phase 4 geschlossen). Eingelöst wird erst im Standalone. */
      var ucClean=urlCode.replace(/[\s\-]/g,'').toUpperCase();
      state.installShortCode = ucClean.length>=8 ? ucClean.slice(0,4)+'-'+ucClean.slice(4,8) : urlCode;
      state.installTokenFull=urlCode;
      $("clock").textContent=new Date().toLocaleTimeString("de-DE");
      state.view='install'; render(); return;
    } else {
      /* Installierte PWA: echter Eintritt → JWT holen (Einmal-Code wird jetzt
       * serverseitig verbraucht). */
      var cdata=await exchangeCode(urlCode);
      if(cdata){
        localStorage.setItem('argus_verified','true'); verified='true';
        history.replaceState(null,'',window.location.pathname);
        if(cdata.is_master){ localStorage.setItem('argus_is_master','true'); _isMaster=true; }
        else if(cdata.praesidium_id){
          addUnlock(cdata.praesidium_id, cdata.temporary?(cdata.ttl_hours||24):null);
          try{ await unlockTwinFor(urlCode, cdata); }catch(e){}   /* 0024: Schulungs-Zwilling mit freischalten */
          _praesidiumId=cdata.praesidium_id;
          _praesidiumName=(cdata.praesidien&&cdata.praesidien.name)||'';
          localStorage.setItem('argus_praesidium_id',_praesidiumId);
          localStorage.setItem('argus_praesidium_name',_praesidiumName);
          refreshSchulungFlag();
        }
      }
    }
  }
  /* ── Einladungslink mit 32-Zeichen-Token (#inv=, Install-Flow) ──── */
  else if(urlToken){
    var tokenData=await validateInviteToken(urlToken);
    if(tokenData){
      if(!isStandalone()){
        state.installShortCode=tokenData.short_code||urlToken.slice(0,8).toUpperCase();
        state.installTokenFull=urlToken;
        $("clock").textContent=new Date().toLocaleTimeString("de-DE");
        state.view='install'; render(); return;
      }
      localStorage.setItem('argus_verified','true'); verified='true';
      localStorage.setItem('argus_invite',urlToken);
      history.replaceState(null,'',window.location.pathname);
      if(tokenData.is_master){ localStorage.setItem('argus_is_master','true'); _isMaster=true; }
      else if(tokenData.praesidium_id){
        addUnlock(tokenData.praesidium_id, tokenData.temporary?(tokenData.ttl_hours||24):null);
        await consumeSingleUse(tokenData);
        _praesidiumId=tokenData.praesidium_id;
        _praesidiumName=(tokenData.praesidien&&tokenData.praesidien.name)||'';
        localStorage.setItem('argus_praesidium_id',_praesidiumId);
        localStorage.setItem('argus_praesidium_name',_praesidiumName);
        refreshSchulungFlag();
      }
    }
  }

  /* Präsidienliste (für die Landingpage; schulungs_zwilling_id für Picker). B3: nie unbegrenzt warten —
   * mit lokalem Cache vom letzten erfolgreichen Abruf: Cache sofort, Abruf im Hintergrund; ohne Cache
   * (Erststart) nur bei vermuteter Verbindung und mit hartem Timeout. */
  var _prlCached=false;
  try{ var _prc=JSON.parse(localStorage.getItem('argus_praesidien_cache')||'null'); if(Array.isArray(_prc) && _prc.length){ _praesidienList=_prc; _prlCached=true; } }catch(e){}
  if(sb() && netLikelyUp()){
    var _prlP=(async function(){
      try{
        var prlAll=await qt(sb().from('praesidien').select('id,name,schulung,schulungs_zwilling_id').order('name'));
        if(prlAll && !prlAll.error && Array.isArray(prlAll.data)){
          _praesidienList=prlAll.data;
          try{ localStorage.setItem('argus_praesidien_cache', JSON.stringify(prlAll.data)); }catch(e){}
        }
      }catch(e){}
    })();
    if(_prlCached){ _prlP.then(function(){ if(state.view==='praesidium'){ try{ render(); }catch(e){} } }); }
    else await _prlP;
  }

  /* ── Phase-4-Migration: Altgerät ohne JWT → einmalige Code-Neueingabe ────
   * Geräte mit altem Zugang (verified / unlocked / master), aber ohne JWT
   * werden zur Code-Eingabe geführt. Danach 30 Tage Ruhe. URL-Links
   * (#code= / #inv=) umgehen die Migration (werden oben verarbeitet). */
  var hasLegacyAccess = (verified==='true' || getUnlocked().length>0 || _isMaster) && !localStorage.getItem('argus_jwt');
  if(hasLegacyAccess && !urlCode && !urlToken){
    localStorage.removeItem('argus_verified');
    localStorage.removeItem('argus_unlocked');
    localStorage.removeItem('argus_praesidium_id');
    localStorage.removeItem('argus_praesidium_name');
    localStorage.removeItem('argus_is_master');
    _praesidiumId=null; _praesidiumName=''; _isMaster=false;
    $("clock").textContent=new Date().toLocaleTimeString("de-DE");
    state.view='praesidium'; render(); return;
  }

  /* ── Zugriffsgate (strikt): Master ODER (gültiges JWT UND mind. ein
   *    freigeschaltetes Präsidium). Sonst → Landingpage mit Freischalt-
   *    Button (Fehlerfall ist „Code eingeben"). ──── */
  var hasAccess = _isMaster || (!!localStorage.getItem('argus_jwt') && getUnlocked().length>0);
  if(!hasAccess || !_praesidiumId || !isUnlocked(_praesidiumId)){
    $("clock").textContent=new Date().toLocaleTimeString("de-DE");
    state.view='praesidium'; render(); return;
  }

  /* Ab hier: Nutzer ist freigeschaltet — JWT ggf. still verlängern, dann
   * letzten CCP wiederherstellen */
  /* JWT muss zum aktiven Präsidium passen (Sammelcode mit zwei Präsidien) —
   * sonst scheitert jeder Schreibzugriff still an der RLS. */
  if(!ensureJwtFor(_praesidiumId) && navigator.onLine && localStorage.getItem('argus_code') && !(_argusRole&&_usbnk)){
    /* 0024: fehlendes JWT online nachholen — Twin mit p_scope='schulung' */
    var _sjwt=localStorage.getItem('argus_jwt'), _sexp=localStorage.getItem('argus_jwt_exp'), _scode=localStorage.getItem('argus_code');
    var _re=null; try{ _re=await Promise.race([exchangeCode(_scode, _praesidiumSchulung?'schulung':'echt'), new Promise(function(r){ setTimeout(function(){ r(null); }, 2500); })]); }catch(e){}
    if(!(_re && _re.praesidium_id===_praesidiumId)){ try{ if(_sjwt){ localStorage.setItem('argus_jwt',_sjwt); localStorage.setItem('argus_jwt_exp',_sexp||'0'); localStorage.setItem('argus_code',_scode||''); } }catch(e){} }
  }
  if(!ensureJwtFor(_praesidiumId)){
    removeUnlock(_praesidiumId);
    toast("Zugang für „"+(_praesidiumName||'dieses Präsidium')+"“ passt nicht zum gespeicherten Code — bitte Code einmal neu eingeben");
    $("clock").textContent=new Date().toLocaleTimeString("de-DE");
    state.view='praesidium'; render(); return;
  }
  /* JWT still verlängern. B3: nur warten, wenn er schon abgelaufen ist — und dann höchstens 2,5 s; sonst im Hintergrund. */
  var _jexp=parseInt(localStorage.getItem('argus_jwt_exp')||'0',10)||0;
  if(_jexp>nowMs()){ try{ refreshJwtIfNeeded(); }catch(e){} }
  else { await Promise.race([Promise.resolve(refreshJwtIfNeeded()).catch(function(){}), new Promise(function(r){ setTimeout(r, 2500); })]); }
  try{ probeSchema(3); }catch(e){}   /* Schema-/Uhr-Probe (D6.5-18/-07) — fire-and-forget, KEIN await */
  if(_revokedLocked) return;   /* Re-Exchange hat die Code-Sperre erkannt → init hier beenden */
  checkRevokedCode();          /* fire-and-forget (KEIN await) — der Start wartet nie auf den Re-Check */
  var storedCcp=localStorage.getItem('argus_ccp_id');
  if(storedCcp) _ccpId=storedCcp;

  try{ flushLatePatients(); }catch(e){}   /* Nachzügler verlassener/abgeschlossener CCPs (Hintergrund, nie blockierend) */
  /* Opportunistischer Purge-Lauf — Fallback zu pg_cron (z. B. pausiertes
   * Free-Tier-Projekt, das erst durch App-Traffic aufwacht). Fire-and-forget. */
  try{ if(sb()) sb().rpc('argus_run_purge').then(function(){},function(){}); }catch(e){}

  /* B3 (Plan 06.5-10): Die Netz-Schritte des Starts laufen als EINE Kette im Hintergrund, auf die der Start
   * höchstens ~3 s wartet (jeder Schritt ist zusätzlich per qt() begrenzt). Im Funkloch erscheint die App
   * dadurch mit dem lokalen Stand; die Kette rendert nach ihrem Ende nach. */
  var _bootChain=(async function(){
    /* Offline gequeueter Einsatz-Abschluss? Jetzt (online) nachziehen. */
    await flushPendingClose();
    await loadMeta();
    refreshSchulungFlag();   /* fire-and-forget — localStorage-Wert trägt bis dahin */
    /* Abschluss-Erkennung (a) App-Start: wurde der Einsatz abgeschlossen, während
     * dieses Gerät weg war? → Hinweis-Modal + cleanupClosedEinsatz() (über
     * handleRemoteClose; loadMeta()→applyMeta() prüft denselben Zustand). */
    await checkClosedEinsatz();
    await loadPatients();
  })().catch(function(){});
  var _bootCount=loadOpenCcpCount().catch(function(){});
  var _bootDone=false;
  await Promise.race([Promise.all([_bootChain,_bootCount]).then(function(){ _bootDone=true; }), new Promise(function(r){ setTimeout(r, 2000); })]);
  if(!_bootDone){
    /* Funkloch/langsames Netz: nach 2 s die App mit dem lokalen Stand zeigen (kein leerer Bildschirm),
     * die Kette läuft weiter und rendert nach ihrem Ende nach. */
    if(!patients.length){ try{ var _lr=await readLocalPatients(); if(!patients.length){ _tombs=_lr.tombs; patients=_lr.arr; } }catch(e){} }
    try{ $("clock").textContent=new Date().toLocaleTimeString("de-DE"); render(); }catch(e){}
    Promise.all([_bootChain,_bootCount]).then(function(){ try{ render(); }catch(e){} });
  }
  try{ await ensureDeviceNo(sb()); }catch(e){}   /* Gerätenummer früh aus Speicher/Server holen → instantes Anlegen hat sie parat (Claim: qt-begrenzt) */
  try{ prefetchNum(); }catch(e){}                /* erste Online-Nummer vorab reservieren */
  await loadChecklist();
  if(_ccpId && sb()) subscribeRealtime();
  $("clock").textContent=new Date().toLocaleTimeString("de-DE");
  render();
  try{ runLocalPurge(); }catch(e){}   /* lokale Löschfristen nach dem Start (Hintergrund) */
  maybeShowIntro();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    try{ reg.update(); }catch(e){}
  }).catch(function(e) {});
}

/* Update-Erkennung beim Start und bei jedem Sichtbarwerden (iOS-Resume zeigt
 * die App ohne echten Ladevorgang → ohne diese Prüfung bliebe man auf alt). */
checkForUpdate();

/* Realtime-Selbstheilung (Bugfix 2026-06-13, Feldtest-Feedback): iOS beendet
 * im Hintergrund den WebSocket. Beim Resume blieb der TOTE Channel in _channel
 * stehen — subscribeRealtime() verweigerte wegen des _channel-Guards den
 * Neuaufbau, und auch der online-Handler abonnierte nie neu. Folge: keine
 * Live-Updates mehr („gefühlt lokaler Modus") bis zum CCP-Wechsel, dessen
 * Pfade den Channel zufällig aufräumen. Heilung: Channel hart trennen, neu
 * abonnieren, danach Abschluss-Check + Daten-Nachladen (Catch-up für alles,
 * was während des toten Channels passiert ist). */
function healRealtime(){
  if(!_ccpId || _training || !sb()) return;
  if(_channel){ try{_channel.unsubscribe();}catch(e){} _channel=null; }
  subscribeRealtime();
  checkClosedEinsatz().then(function(closed){
    if(closed || !_ccpId) return;
    loadPatients().then(function(){ render(); });
  });
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState!=='visible') return;
  checkForUpdate();
  healRealtime();
  try{ deviceHeartbeat(); }catch(e){}   /* Lebenszeichen sofort nach Rückkehr in den Vordergrund */
  try{ runLocalPurge(); }catch(e){}   /* Fristen prüfen, wenn die App wieder sichtbar wird */
});

/* Wiederverbindung: offline erfasste/bearbeitete Patienten nachschieben und
 * JWT ggf. auffrischen. loadPatients() mischt offene lokale Änderungen ein und
 * lädt sie hoch (siehe flushPendingPatients). */
window.addEventListener('online', function(){
  refreshJwtIfNeeded();
  checkRevokedCode();    /* Reconnect: Code-Sperre nachprüfen (fire-and-forget, offline-Guard intern) */
  checkForUpdate();
  flushPendingClose();   /* offline gequeueten Einsatz-Abschluss nachziehen */
  try{ flushLatePatients(); }catch(e){}   /* Nachzügler nachreichen */
  try{ flushHerkunft(); }catch(e){}   /* Herkunftsprotokoll nachreichen */
  try{ probeSchema(1); }catch(e){}   /* Schema-/Uhr-Probe nach Reconnect */
  try{ deviceHeartbeat(); }catch(e){}   /* Lebenszeichen nach Reconnect */
  try{ flushPendingLeave(); }catch(e){}   /* vorgemerkte Abmeldung nachreichen */
  try{ ensureDeviceNo(sb()); }catch(e){}   /* Gerätenummer nach Reconnect sichern */
  try{ prefetchNum(true); }catch(e){}      /* nächste Online-Nummer sofort vorab holen (nicht auf Wächter-Bestätigung warten) */
  try{ if(sb()) sb().rpc('argus_run_purge').then(function(){},function(){}); }catch(e){}
  /* Channel nach Netz-Rückkehr IMMER neu aufbauen (toter Socket, s. o.) —
   * healRealtime übernimmt Abschluss-Check + Nachladen. */
  healRealtime();
});

/* #4 — Aktiver Verbindungs-Wächter (2026-10-14): iOS-PWAs feuern 'online' nach
 * dem Flugmodus oft spät oder gar nicht → die App hing gefühlt zu lange im
 * „lokalen Modus". Statt auf das Event zu warten, pingen wir aktiv (kurzer
 * version.json-Fetch mit hartem 3-s-Timeout) und reparieren bei der RÜCKKEHR
 * sofort (Heal + Flush). Gepingt wird NUR, wenn Erholung plausibel nötig ist
 * (offline geglaubt oder noch nicht synchronisierte Daten) → keine Dauerlast im
 * Normalbetrieb. */
var _netUp = (typeof navigator==='undefined') || navigator.onLine!==false;
var _netProbing=false;
function netProbe(){
  return new Promise(function(resolve){
    var done=false, ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    var to=setTimeout(function(){ if(!done){ done=true; try{ctrl&&ctrl.abort();}catch(e){} resolve(false); } },3000);
    fetch('./version.json?ping='+Date.now(),{cache:'no-store',signal:ctrl?ctrl.signal:undefined})
      .then(function(r){ if(!done){ done=true; clearTimeout(to); resolve(!!(r&&r.ok)); } })
      .catch(function(){ if(!done){ done=true; clearTimeout(to); resolve(false); } });
  });
}
setInterval(function(){
  if(_training || _netProbing) return;
  var pendingLeave=leavePending();   /* vorgemerkte Abmeldung hält den Wächter auch ohne aktiven CCP wach */
  if(!_ccpId && !pendingLeave && !(_lateN>0)) return;
  var pending=pendingLeave || _lateN>0; try{ pending=pending||patients.some(function(p){return p._dirty;}); }catch(e){}   /* _lateN: fremde _dirty-Nachzügler */
  if(_netUp && !pending && navigator.onLine!==false) return;   /* alles gut → kein Ping nötig */
  _netProbing=true;
  netProbe().then(function(up){
    _netProbing=false;
    if(up && !_netUp){
      _netUp=true;                 /* Verbindung zurück → sofort reparieren, nicht aufs 'online'-Event warten */
      try{ refreshJwtIfNeeded(); }catch(e){}
      try{ if(_sb && _sb.realtime && _sb.realtime.setAuth && currentJwt) _sb.realtime.setAuth(currentJwt); }catch(e){}
      try{ healRealtime(); }catch(e){}
      try{ flushPendingClose(); }catch(e){}
      try{ flushLatePatients(); }catch(e){}
      try{ probeSchema(1); }catch(e){}
      try{ loadMeta().then(function(){ return loadPatients(); }).then(function(){ try{render();}catch(e){} }); }catch(e){}
      try{ checkForUpdate(); }catch(e){}
      try{ prefetchNum(); }catch(e){}
      try{ flushPendingLeave(); }catch(e){}
    } else {
      var was=_netUp; _netUp=up;
      if(was!==up){ try{ render(); }catch(e){} }   /* Banner sofort auf 🔴/🟢 umstellen */
    }
  });
},4000);
/* Lebenszeichen (Phase 6.5): nur Vordergrund + aktiver CCP (Guards in deviceHeartbeat). Der
 * MasterMedic holt zusätzlich alle 10 s die Geräteliste (Anzeige übernimmt das 3,5-s-Render). */
setInterval(function(){ try{ deviceHeartbeat(); }catch(e){} }, HB_INTERVAL_MS);
setInterval(function(){ try{ pollDevices(); }catch(e){} }, 10000);
/* B7 (Plan 06.5-10): Schema-Re-Probe — wurde die Migration erst nach dem App-Start eingespielt (oder lief die Probe
 * im Funkloch ins Leere), bliebe _schemaV sonst bis zum nächsten Neustart zu niedrig. Alle 3 min, solange v<28 und Verbindung vermutet. */
setInterval(function(){ try{ if(_schemaV<28 && netLikelyUp() && !document.hidden && !_revokedLocked && sb() && localStorage.getItem('argus_jwt')) probeSchema(1); }catch(e){} }, 180000);
/* Nachzügler (Phase 6.5): nur solange fremde/abgeschlossene _dirty-Patienten lokal liegen (_lateN). */
setInterval(function(){ try{ if(_lateN>0) flushLatePatients(); }catch(e){} }, 60000);
/* Lokale Löschfristen (alle 5 min) + gebündeltes Herkunftsprotokoll (höchstens 1/min). */
setInterval(runLocalPurge, 300000);
setInterval(flushHerkunft, 60000);
setTimeout(runLocalPurge, 4000);   /* auch wenn der Start früh endet (Präsidium/Sperre) */
</script>
