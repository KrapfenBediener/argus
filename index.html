   * Verlängerung). Wenn ja → Client neu erstellen, Realtime-Abo trennen. */

  if(!window.supabaseLib || !window.supabaseLib.createClient) return _sb;
  if(_channel){ try{_channel.unsubscribe();}catch(e){} _channel=null; }
  _sbJwt = currentJwt;
  var headers = currentJwt ? { Authorization:'Bearer '+currentJwt } : {};
  _sb = window.supabaseLib.createClient(SUPA_URL, SUPA_KEY, {
    auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false},
    global:{ headers: headers }
  });

   * nicht für postgres_changes. */
  if(currentJwt && _sb.realtime && _sb.realtime.setAuth){ try{ _sb.realtime.setAuth(currentJwt); }catch(e){} }
  return _sb;
}

function subscribeRealtime(){

          var lb=n.locked_by, la=n.locked_at||0, fresh=(nowMs()-la)<LOCK_TTL;

        filter:'id=eq.'+_ccpId}, function(p){applyMeta(p.new);render();checkIncomingMergeRequest();})

/* ── Einladungs-System ─────────────────────────────────────────────────── */

/* ── Geräte-Freischaltungen: welche Präsidien darf dieses Gerät sehen ──────
 * Liste {p:praesidium_id, exp:ms|0}. exp=0 = dauerhaft, sonst Ablaufzeitpunkt.
 * Master-Geräte (_isMaster) umgehen die Filterung und sehen alle Präsidien. */
function getUnlocked(){
  var arr=[]; try{ arr=JSON.parse(localStorage.getItem('argus_unlocked')||'[]'); }catch(e){ arr=[]; }
  if(!Array.isArray(arr)) arr=[];
  var now=nowMs(); var live=arr.filter(function(u){return u&&u.p&&(!u.exp||u.exp>now);});
  if(live.length!==arr.length){ try{localStorage.setItem('argus_unlocked',JSON.stringify(live));}catch(e){} }
  return live;
}
function isUnlocked(pid){ if(_isMaster) return true; return getUnlocked().some(function(u){return u.p===pid;}); }

/* ── JWT je Präsidium (Schulungs-Fix 2026-10-15) ─────────────────────────────
 * Die App hielt nur EIN JWT (argus_jwt) — das des zuletzt eingegebenen Codes.
 * Wer Echtbetrieb UND Schulung mit zwei Codes freigeschaltet hatte und dann im
 * Picker das andere Präsidium wählte, schrieb mit einem JWT, dessen
 * praesidium_id nicht passte → RLS lehnte jeden CCP-Insert ab, die App zeigte
 * nur „Abgebrochen". Jetzt: pro Präsidium das JWT merken und beim Wechsel das
 * passende aktivieren; fehlt es, einmal den Code neu eingeben lassen. */

function jwtClaims(jwt){
  try{
    var p=(jwt||localStorage.getItem('argus_jwt')||'').split('.')[1]; if(!p) return null;
    p=p.replace(/-/g,'+').replace(/_/g,'/'); while(p.length%4) p+='=';
    var bin=atob(p), s=''; for(var i=0;i<bin.length;i++) s+='%'+('00'+bin.charCodeAt(i).toString(16)).slice(-2);
    return JSON.parse(decodeURIComponent(s));

/* Sammelcode (0024): nach dem Echt-Exchange zusätzlich den Schulungs-Zwilling
 * freischalten. Stiller Best-Effort — ohne Twin/offline passiert nichts. Danach
 * das aktive JWT wieder auf das Echt-Präsidium zurückstellen. */
async function unlockTwinFor(code, uv){
  if(!uv || uv.is_master || !uv.praesidium_id) return null;
  var tw=null;
  try{ tw=await exchangeCode(code,'schulung'); }catch(e){ tw=null; }
  if(tw && tw.praesidium_id && tw.praesidium_id!==uv.praesidium_id){
    addUnlock(tw.praesidium_id, uv.temporary?(uv.ttl_hours||24):null);
  }
  ensureJwtFor(uv.praesidium_id);   /* aktives JWT = Echt-Präsidium (Twin liegt im Map) */

/* true = aktives JWT passt zu pid (oder wurde passend umgeschaltet); false = Code neu nötig */
function ensureJwtFor(pid){
  if(!pid || _isMaster) return true;

  var c=jwtClaims(); if(c && c.praesidium_id===pid) return true;
  if(c && c.is_master) return true;
  var e=pidJwtMap()[pid];
  if(e && e.jwt && (!e.exp || e.exp>nowMs())){
    try{
      localStorage.setItem('argus_jwt',e.jwt); localStorage.setItem('argus_jwt_exp',String(e.exp||0));
      if(e.code) localStorage.setItem('argus_code',e.code);
    }catch(x){}
    return true;
  }

}

async function validateInviteToken(token){

/* ── Phase 4: Code gegen signiertes JWT tauschen ───────────────────────────

 * Der RPC validiert den 8-stelligen Code, signiert ein JWT mit praesidium_id /
 * is_master / exp und markiert Einmal-Codes serverseitig als verbraucht.
 * Pseudonymität bleibt gewahrt — kein Name, keine E-Mail, keine UID im JWT. */

  var clean=code.replace(/[\s\-]/g,'').toUpperCase();
  if(clean.length<8) return null;
  try{
    var body={ code:clean }; if(scope==='schulung') body.p_scope='schulung';
    var resp=await fetch(SUPA_URL+'/rest/v1/rpc/argus_exchange_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify(body)
    });

    if(data && data.error) _lastExchangeError=String(data.error);   /* Server-Klartext nicht schlucken */
    if(!data || !data.jwt) return null;
    localStorage.setItem('argus_jwt', data.jwt);
    localStorage.setItem('argus_jwt_exp', String(data.exp*1000)); /* ms */
    localStorage.setItem('argus_code', clean);                    /* für stille Verlängerung */
    storePidJwt(data.praesidium_id, data.jwt, data.exp*1000, clean);   /* je Präsidium merken (Picker-Wechsel) */
    if(data.scope==='schulung') localStorage.setItem('argus_twin_of_'+data.praesidium_id, '1');   /* Merker: Twin-JWT stammt aus Scope-Exchange → Verlängerung mit p_scope */

      short_code: clean.slice(0,4)+'-'+clean.slice(4),

      argus_role:      data.argus_role||null,
      praesidium_id:   data.praesidium_id||null,
      praesidium_name: data.praesidium_name||null,
      scope:           data.scope||effectiveScope
    };
  }catch(e){ return null; }
}

/* Stille JWT-Verlängerung: wenn Restlaufzeit < 7 Tage und online → mit dem
 * gespeicherten Code ein frisches JWT holen. Nutzer merkt nichts.
 * Bei Einmal-/24-h-Codes schlägt der Re-Exchange ggf. fehl → kein Problem,
 * das JWT läuft dann ab und der Nutzer gibt seinen Code neu ein. */
async function refreshJwtIfNeeded(){
  if(!navigator.onLine) return;
  var jwt=localStorage.getItem('argus_jwt');
  var exp=parseInt(localStorage.getItem('argus_jwt_exp')||'0',10);
  if(!jwt||!exp) return;
  if(exp-nowMs() > 7*24*3600*1000) return; /* noch frisch */
  var storedCode=localStorage.getItem('argus_code')||'';
  if(!storedCode) return;
  /* Stufe-1 Person-Sitzung: argus_role ist gesetzt → exchangePersonCode nutzen.
   * argus_exchange_code würde Person-Codes über CR-02 abweisen.
   * Scope: aktiven Picker-Modus übergeben, damit das frische JWT dasselbe
   * Präsidium (Echt oder Schulungs-Twin) enthält wie das ablaufende (0019). */
  var isPersonSession=!!(localStorage.getItem('argus_role'));
  /* Sammelcode (0024): Twin-JWT mit p_scope='schulung' verlängern, sonst Echt. */
  var twinScope=(!isPersonSession && _praesidiumId && localStorage.getItem('argus_twin_of_'+_praesidiumId)==='1') ? 'schulung' : undefined;
  var result=isPersonSession ? await exchangePersonCode(storedCode, pickerMode()) : await exchangeCode(storedCode, twinScope);
  if(!result && _lastExchangeError && _lastExchangeError.indexOf('gesperrt')>=0){
    /* Der gespeicherte Code wurde von der Leitung gesperrt → nicht still
     * ignorieren, sondern dieselbe Lock-Wirkung wie der Re-Check (D-20). */
    await applyRevokedLock(); return;
  }
  if(result && _ccpId && sb()) subscribeRealtime();
}
/* ── Phase 4.9: revoked-Re-Check (D-20) ─────────────────────────────────────
 * Gesperrte Codes (revoked-Flag, gesetzt über die Leitungs-Oberfläche) sperren
 * das Gerät beim nächsten Start bzw. Reconnect. Offline blockiert der Re-Check
 * NIEMALS: jede Unsicherheit (offline, Transportfehler, Timeout, unerwartetes
 * Format) wird ignoriert — gesperrt wird ausschließlich bei eindeutigem
 * revoked === true. */
var _revokedLocked=false;   /* Lock bereits ausgelöst → init-Fortsetzung abbrechen, kein Doppel-Modal */
/* Reine Entscheidungsfunktion (JSC-getestet). Eingabe = geparste RPC-Antwort
 * von argus_check_code oder null. Rückgabe:
 *  'lock'   NUR bei eindeutigem revoked === true
 *  'ok'     bei revoked === false (Code existiert und ist nicht gesperrt)
 *  'ignore' bei null/Transportfehler/unerwartetem Format UND bei found === false:
 *           ein gelöschter Code ist KEIN Sperr-Signal — konservativ, um
 *           Fehlaussperrungen zu vermeiden; Sperren läuft ausschließlich
 *           über revoked = true. */
function revokedDecision(resp){
  if(!resp || typeof resp!=='object') return 'ignore';
  if(resp.found===false) return 'ignore';
  if(resp.revoked===true) return 'lock';
  if(resp.revoked===false) return 'ok';
  return 'ignore';
}
/* Lock-Wirkung: Zugangsdaten entfernen, Realtime kappen, Hinweis-Modal,
 * Freischalt-Screen (gleicher Pfad wie fehlender Zugang im init). Wird auch
 * von refreshJwtIfNeeded genutzt, wenn der Re-Exchange mit „Code wurde
 * gesperrt" abgelehnt wird. */
async function applyRevokedLock(){
  if(_revokedLocked) return;
  _revokedLocked=true;
  try{
    localStorage.removeItem('argus_jwt');
    localStorage.removeItem('argus_jwt_exp');
    localStorage.removeItem('argus_code');
    localStorage.setItem('argus_unlocked','[]');   /* Freischaltungen leeren */
    /* Zusätzlich Rollen-/Verified-Reste entfernen — sonst bliebe ein
     * Master-Gerät über argus_is_master trotz Sperrung freigeschaltet. */
    localStorage.removeItem('argus_verified');
    localStorage.removeItem('argus_is_master');
    localStorage.removeItem('argus_praesidium_id');
    localStorage.removeItem('argus_praesidium_name');
    /* Stufe-1 Person-Sitzungsfelder (Plan 05.1-03) */
    localStorage.removeItem('argus_usbnk');
    localStorage.removeItem('argus_role');
    localStorage.removeItem('argus_person_praesidium');
    /* IN-01: Picker-Modus zurücksetzen — kein nächster Nutzer landet im
     * Schulungs-Reiter des gesperrten Vorgänger-Kontos. */
    localStorage.removeItem('argus_picker_mode');
  }catch(e){}
  _isMaster=false; _praesidiumId=null; _praesidiumName='';
  _usbnk=null; _argusRole=null;
  if(_channel){ try{_channel.unsubscribe();}catch(e){} _channel=null; }   /* Realtime nicht weiter nutzen */
  await confirmModal("Der Zugangscode wurde von der Leitung gesperrt. Bitte neuen Zugangscode anfordern.","OK");
  state.view='praesidium'; render();
}
/* Re-Check (fire-and-forget bei App-Start + online-Event — der Start wartet
 * NIE darauf). Offline-Guard steht VOR dem fetch; kurzes Abort-Timeout, damit
 * ein hängender Request nichts aufhält. Kein Aufruf-Effekt im Training. */
async function checkRevokedCode(){
  var code=null; try{ code=localStorage.getItem('argus_code'); }catch(e){}
  if(_configError) return;   /* ohne Config kein RPC (fetch liefe sonst gegen den eigenen Origin) */
  if(!code || navigator.onLine===false || _training) return;   /* NIE blockieren, NIE offline raten */
  var resp=null;
  try{
    var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    var tmr=ctrl?setTimeout(function(){try{ctrl.abort();}catch(e){}},6000):null;
    var r=await fetch(SUPA_URL+'/rest/v1/rpc/argus_check_code',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY },
      body:JSON.stringify({ code:code }),
      signal:ctrl?ctrl.signal:undefined
    });
    if(tmr)clearTimeout(tmr);
    if(r && r.ok) resp=await r.json();
  }catch(e){ resp=null; }   /* Transportfehler/Timeout → 'ignore' */
  if(revokedDecision(resp)==='lock') await applyRevokedLock();
}
/* Freischaltung über einen Code (von Hand eingegeben oder eingefügt). Tauscht den
 * Code gegen ein JWT (exchangeCode) und schaltet das Präsidium frei. */
async function doUnlock(rawCode){
  if(_configError){toast("⚠️ Konfiguration fehlt (config.js) — kein Backend verbunden");return;}
  var uc2=(rawCode||'').replace(/[\s\-]/g,'').toUpperCase();
  if(uc2.length<8){toast("Bitte vollständigen Code eingeben (Format: XXXX-XXXX)");return;}
  toast("Prüfe Code…");
  var uv=await exchangeCode(uc2);
  if(!uv){
    /* ── Stufe-1-Fallback: Person-Code (Plan 05.1-03, D5.1-02) ──────────────
     * Nur versuchen wenn der erste Exchange kein „gesperrt"-Fehler war.
     * CR-02 in 0015 weist Person-Codes bei argus_exchange_code sauber mit
     * „Pro-Person-Code — nur für die Leitungs-Seite gültig" ab; das ist KEIN
     * Sperr-Fehler — wir versuchen den Person-Exchange. */
    var wasGesperrt=_lastExchangeError && _lastExchangeError.indexOf('gesperrt')>=0;
    if(!wasGesperrt){
      var pv=await exchangePersonCode(uc2);
      if(pv){
        /* Person-Token empfangen: Rolle und Präsidium prüfen */
        var prole=(pv.argus_role||'').toLowerCase();
        if(prole==='master'||prole==='flz'){
          /* master/flz-Person-Tokens sind für die Leitungs-Seite (T-053-04).
           * Im Feld höflich abweisen — kein _isMaster setzen. */
          /* Stufe-1-Felder wieder räumen (kein Halbzustand) */
          try{
            localStorage.removeItem('argus_jwt');
            localStorage.removeItem('argus_jwt_exp');
            localStorage.removeItem('argus_code');
            localStorage.removeItem('argus_usbnk');
            localStorage.removeItem('argus_role');
            localStorage.removeItem('argus_person_praesidium');
          }catch(e){}
          _usbnk=null; _argusRole=null;
          toast("Dieser Zugang ist für die Leitungs-Seite — bitte dort anmelden");
          return;
        }
        if(!pv.praesidium_id){
          toast("Person-Code ohne Präsidium"); return;
        }
        /* normal/admin: Präsidium dauerhaft freischalten (kein TTL — Person-Session) */
        localStorage.setItem('argus_verified','true');
        addUnlock(pv.praesidium_id, null);   /* dauerhaft */
        _praesidiumId=pv.praesidium_id;
        _praesidiumName=pv.praesidium_name||'';
        localStorage.setItem('argus_praesidium_id',_praesidiumId);
        localStorage.setItem('argus_praesidium_name',_praesidiumName);
        await refreshSchulungFlag();
        /* Picker-Startzustand Echtbetrieb (sofern nicht schon Schulungs-Präsidium) */
        if(!localStorage.getItem('argus_picker_mode')){
          localStorage.setItem('argus_picker_mode','echt');
        }
        /* Präsidienliste mit schulungs_zwilling_id laden (für Picker) */
        if(sb()){
          var pruP=await sb().from('praesidien').select('id,name,schulung,schulungs_zwilling_id').order('name');
          _praesidienList=pruP.data||[];
        }
        /* D-02: kein Klarname im Toast — nur USBNK (Pseudonymität) */
        toast("Angemeldet als USBNK "+esc(_usbnk||''));
        render();
        return;
      }
    }
    toast(_lastExchangeError||"Ungültiger oder abgelaufener Code");return;   /* Server-Klartext (z. B. „Code wurde gesperrt") statt generischem Text */
  }
  localStorage.setItem('argus_verified','true');
  if(uv.is_master){
    _isMaster=true; localStorage.setItem('argus_is_master','true');
    toast("Master-Zugang freigeschaltet");
  } else if(uv.praesidium_id){
    addUnlock(uv.praesidium_id, uv.temporary?(uv.ttl_hours||24):null);
    await consumeSingleUse(uv);
    var twU=await unlockTwinFor(uc2, uv);   /* 0024: Schulungs-Zwilling gleich mit freischalten */
    toast((uv.temporary?"Freigeschaltet (24 h)":"Dauerhaft freigeschaltet")+(twU?" — Echtbetrieb + Schulung":""));
  } else {
    toast("Code ohne Präsidium"); return;
  }
  var pru=await sb().from('praesidien').select('id,name,schulung,schulungs_zwilling_id').order('name');
  _praesidienList=pru.data||[];
  render();
}
/* Zieht einen Freischalt-Code aus beliebigem Text — sowohl aus einem ganzen Link
 * (#code=XXXX-YYYY) als auch aus einem bloßen Code. */
function codeFromText(t){
  t=(t||'').trim();
  /* 1) ganzer Link: #code=XXXX-YYYY */
  var m=t.match(/[#&]code=([A-Za-z0-9]{4}-?[A-Za-z0-9]{4})/i);
  if(m) return m[1].toUpperCase();
  /* 2) ein Code-Token mit Bindestrich irgendwo im Text (XXXX-YYYY) */
  var m2=t.match(/(^|[^A-Za-z0-9])([A-Za-z0-9]{4}-[A-Za-z0-9]{4})([^A-Za-z0-9]|$)/);
  if(m2) return m2[2].toUpperCase();
  /* 3) bloßer Code NUR, wenn der gesamte (bereinigte) Text exakt 8 alnum ist
   *    — verhindert Fehlgriffe bei eingefügten Sätzen. */
  var clean=t.replace(/[\s\-]/g,'');
  if(/^[A-Za-z0-9]{8}$/.test(clean)) return clean.toUpperCase();
  return '';
}

/* Ermittelt die angezeigte Präsidienliste je Reiter und Sitzungstyp.
 * Person-Sitzung (_argusRole gesetzt, _usbnk gesetzt):
 *   Echt-Reiter  → eigenes Echt-Präsidium (argus_person_praesidium)
 *   Schul-Reiter → schulungs_zwilling_id-Twin davon (aus _praesidienList auflösen)
 * Sammelcode/Master:
 *   Echt-Reiter  → nicht-Schulungs-Präsidien im Scope (isUnlocked / _isMaster)
 *   Schul-Reiter → Schulungs-Präsidien im Scope */
function pickerList(tab){
  var isSchulTab=(tab==='schulung');
  var isPersonSession=!!(_argusRole&&_usbnk);
  if(isPersonSession){
    var ownPid=localStorage.getItem('argus_person_praesidium')||'';
    if(!isSchulTab){
      /* Echt: nur eigenes Präsidium */
      return _praesidienList.filter(function(p){return p.id===ownPid && !p.schulung;});
    } else {
      /* Schulung: Twin über schulungs_zwilling_id auflösen */
      var ownEntry=_praesidienList.find(function(p){return p.id===ownPid;});
      if(!ownEntry||!ownEntry.schulungs_zwilling_id) return [];
      var twinId=ownEntry.schulungs_zwilling_id;
      return _praesidienList.filter(function(p){return p.id===twinId && !!p.schulung;});
    }
  }else{
    /* Sammelcode / Master */
    var scope = _isMaster ? _praesidienList : _praesidienList.filter(function(p){return isUnlocked(p.id);});
    return scope.filter(function(p){ return isSchulTab ? !!p.schulung : !p.schulung; });
  }
}

 * Umnummerierung; der beitretende CCP bekommt die nächste freie Kennung und
 * schreibt seine eigenen Patienten darauf um. */
function nextFreeKennung(usedArr){

  return "Z";
}

    var pressed=null, downOnOv=false;

/* Reine Lese-/Validierungslogik der Offline-Abschluss-Queue (per JSC testbar):
 * null → nichts zu tun; {drop:true} → Key kaputt/unvollständig, nur löschen;
 * sonst {ccpId,typ} → RPC fällig. fristTage wird NICHT mehr gefordert:

 * gültig, das Feld wird ignoriert (der Server setzt ohnehin fest 72 Std). */

  if(!pc || !pc.ccpId || !pc.typ) return {drop:true};
  return {ccpId:pc.ccpId, typ:pc.typ};
}
/* Offline gequeueten Abschluss nachziehen — aufgerufen im init-Block und im

  var client=sb(); if(!client || navigator.onLine===false) return;
  try{
    var r=await qt(client.rpc('argus_close_einsatz',{p_ccp_id:pc.ccpId,p_typ:pc.typ}));
    if(r && !r.error){
      try{ localStorage.removeItem('argus_pending_close'); }catch(e2){}

  }catch(e){}

/* ── Herkunftsprotokoll (Phase 6.5, S7, D6.5-09) ───────────────────────────
 * Jeder erfolgreiche Upload wird automatisch notiert (Gerät, Weg direkt|nachgereicht, Patienten-ID —
 * kein Inhalt) und höchstens minütlich gebündelt per argus_log_herkunft gemeldet. Nur ab Schema >= 26.
 * Queue argus_herkunft_q = {"<ccpId>|<weg>": {dev, ids:[…]}}, je Schlüssel max. 500 IDs. */
var _herkBusy=false, _herkSeen={};
function readHerkQ(){
  try{ var q=JSON.parse(localStorage.getItem('argus_herkunft_q')||'null'); return (q && typeof q==='object') ? q : {}; }catch(e){ return {}; }
}
function queueHerkunft(ccpId, weg, ids){
  try{
    if(_schemaV<26 || _training || !ccpId || !ids || !ids.length) return;
    var q=readHerkQ(), k=ccpId+'|'+weg, e=q[k]||(q[k]={dev:0, ids:[]});
    var d=(ccpId===_ccpId) ? deviceNoSync() : 0; if(d>=1) e.dev=d;
    ids.forEach(function(id){
      if(typeof id!=='string' || !id) return;
      var sk=k+'|'+id; if(_herkSeen[sk]) return;   /* je Sitzung und Weg einmal je Patient */
      _herkSeen[sk]=true;
      if(e.ids.indexOf(id)<0) e.ids.push(id);
    });
    if(e.ids.length>500) e.ids=e.ids.slice(-500);
    if(Object.keys(_herkSeen).length>5000) _herkSeen={};
    localStorage.setItem('argus_herkunft_q', JSON.stringify(q));
  }catch(e){}
}
/* Weg eines Uploads im Hintergrund-Flush: war die Änderung schon länger offen → nachgereicht, sonst direkt. */
function herkWeg(p){ return (nowMs()-((p && p.updated)||0) > 30000) ? 'nachgereicht' : 'direkt'; }
async function flushHerkunft(){
  if(_herkBusy || _schemaV<26 || !sb() || !netLikelyUp()) return;
  _herkBusy=true;
  try{
    var keys=Object.keys(readHerkQ());
    for(var i=0;i<keys.length;i++){
      var k=keys[i], q0=readHerkQ(), e0=q0[k];
      if(!e0 || !e0.ids || !e0.ids.length){ if(e0){ delete q0[k]; try{ localStorage.setItem('argus_herkunft_q', JSON.stringify(q0)); }catch(e){} } continue; }
      var parts=k.split('|'), ccpId=parts[0], weg=parts[1];
      var dev=(e0.dev>=1) ? e0.dev : await devForCcp(ccpId);
      if(dev<1) continue;   /* Gerätenummer noch unbekannt → später */
      var batch=e0.ids.slice(0,200), res=null;
      try{ res=await qt(sb().rpc('argus_log_herkunft',{p_ccp_id:ccpId, p_dev:dev, p_weg:weg, p_ids:batch, p_kuerzel:operator||''})); }catch(e){ res=null; }
      var d=res?res.data:null;
      if(!d || res.error) continue;   /* Netzfehler → behalten */
      var q1=readHerkQ();   /* neu lesen: während des Aufrufs können IDs dazugekommen sein */
      if(d.error){   /* endgültige Server-Antwort (Nachfrist abgelaufen / CCP nicht gefunden / …) → Schlüssel verwerfen */
        delete q1[k];
      }else if(q1[k]){
        q1[k].ids=q1[k].ids.filter(function(x){ return batch.indexOf(x)<0; });
        if(!q1[k].ids.length) delete q1[k];
      }
      try{ localStorage.setItem('argus_herkunft_q', JSON.stringify(q1)); }catch(e){}
    }
  }catch(e){}
  finally{ _herkBusy=false; }
}
/* Offline-Robustheit: lokal noch nicht synchronisierte Patienten in die
 * Cloud-Liste einmischen und — wenn online — nachschieben. Konfliktlösung per
 * 'updated'-Zeitstempel (jüngere Version gewinnt). So überschreibt ein Reconnect
 * keine offline erfassten/bearbeiteten Patienten mehr. */
/* B4 (Plan 06.5-10): Wurde der Patient seit dem Lesen (updated=baseline) lokal weiterbearbeitet, liefert
 * dies den neueren lokalen Datensatz — der gelesene/zusammengeführte Stand darf ihn nie überschreiben,
 * und die _dirty-Markierung bleibt, bis die neuere Bearbeitung hochgeladen ist. Sonst null. */
async function localNewerThan(id, baseline){
  try{ var cur=await sGet("ccp_pat_"+id); if(cur && (cur.updated||0)>(baseline||0)) return cur; }catch(e){}
  return null;
}
async function flushPendingPatients(arr, client, ccpIds){
  var byId={}; arr.forEach(function(p){byId[p.id]=p;});
  var keys=await sList("ccp_pat_");
  var dead=false;   /* Netz tot (Timeout/Abbruch): restliche Uploads dieses Laufs auslassen — bleiben _dirty, nächster Lauf */
  function netDead(r){ return !!(r && r.error && (r.status===0 || !r.error.code)); }
  for(var i=0;i<keys.length;i++){
    var lp=await sGet(keys[i]);
    if(!lp || lp.demo || lp.training || !lp._dirty) continue;
    /* nur Patienten des aktuellen CCP(-Verbunds) berücksichtigen */
    if(lp.ccpId && ccpIds && ccpIds.indexOf(lp.ccpId)===-1) continue;
    var cloudP=byId[lp.id];

      /* Phase 6.5: statt "Cloud >= lokal → lokal verwerfen" je Feldgruppe zusammenführen */
      var m=mergeGroups(lp, cloudP, FGROUPS); m.ccpId=lp.ccpId||cloudP.ccpId;
      var won=Object.keys(FGROUPS).some(function(g){return groupSig(m,FGROUPS[g])!==groupSig(cloudP,FGROUPS[g]);}) || (m.deletedAt||null)!==(cloudP.deletedAt||null) || ((m.fts.ack&&m.fts.ack.t)||0)>((cloudP.fts&&cloudP.fts.ack&&cloudP.fts.ack.t)||0);

        byId[m.id]=normalize(m);

      }
      var mpushed=false, mrow=null;
      if(!dead){
        try{
          mrow=patToRow(m); delete mrow.locked_by; delete mrow.locked_at;
          var mr=await qt(client.from('patients').upsert(mrow), 12000);
          if(!mr.error) mpushed=true; else { noteSchemaError(mr.error); if(netDead(mr)) dead=true; }
        }catch(e){ dead=true; }
      }
      m._sig=groupSigs(m, FGROUPS);
      var nw1=await localNewerThan(m.id, lp.updated);
      if(nw1){ byId[m.id]=normalize(nw1); continue; }   /* während des Hochladens weiterbearbeitet: neuere Bearbeitung nicht überschreiben */

      continue;
    }
    var pushed=false, lrow=null;
    if(!dead){
      try{ lrow=patToRow(lp); delete lrow.locked_by; delete lrow.locked_at; var r=await qt(client.from('patients').upsert(lrow), 12000); if(!r.error) pushed=true; else { noteSchemaError(r.error); if(netDead(r)) dead=true; } }catch(e){ dead=true; }
    }
    var nw2=await localNewerThan(lp.id, lp.updated);
    if(nw2){ byId[lp.id]=normalize(nw2); continue; }   /* während des Hochladens weiterbearbeitet */
    if(pushed){ queueHerkunft(lp.ccpId||_ccpId, herkWeg(lp), [lp.id]); delete lp._dirty; if(lrow.fts) clearPending(lp.fts||{}, lrow.updated); await sSet("ccp_pat_"+lp.id, lp); }
    byId[lp.id]=normalize(lp);   /* immer anzeigen, auch wenn Upload (noch) scheitert */
  }

}
/* Busy-Guard (B4, Plan 06.5-10): loadPatients läuft nie doppelt. Wer während eines Laufs aufruft, bekommt
 * EINEN gemeinsamen Folgelauf (startet erst nach dem laufenden) — so sieht jeder Aufrufer einen Lauf, der nach
 * seinem Aufruf begann (Aufrufer speichern oft erst und laden dann), ohne dass zwei Läufe gleichzeitig
 * dieselben Datensätze hochladen oder überschreiben. */
var _lpRun=null, _lpNext=null;
function loadPatients(){
  if(!_lpRun && !_lpNext) return _lpStart();
  if(!_lpNext){
    _lpNext=_lpRun.then(function(){},function(){}).then(function(){ _lpNext=null; return _lpStart(); });
  }
  return _lpNext;
}
function _lpStart(){
  var pr=_loadPatientsRun();
  _lpRun=pr.then(function(){ _lpRun=null; }, function(e){ _lpRun=null; throw e; });
  return _lpRun;
}
/* Lokaler Bestand des aktuellen CCP(-Verbunds) ohne Netz (Offline-Fallback + Start-Notfall-Anzeige). */
async function readLocalPatients(){
  var keys=await sList("ccp_pat_");var arr=[];var tombsOff=[];
  /* Pitfall 7: Offline-Fallback zeigt nur Patienten des aktuellen CCP(-Verbunds) —
   * lokal liegen auch Nachzügler/Reste anderer CCPs. Ohne _ccpId: wie bisher. */
  var idsOff=null;
  if(_ccpId && !_training){
    idsOff=[_ccpId];
    try{ var jo=JSON.parse(localStorage.getItem('argus_ccp_ids_'+_ccpId)); if(Array.isArray(jo) && jo.length) idsOff=jo; }catch(e){}
  }
  for(var i=0;i<keys.length;i++){var p=await sGet(keys[i]);if(p){if(p.demo&&!_demoMerged)continue;if(p.training&&!_training)continue;if(_training&&!p.training)continue;
    if(idsOff && !p.demo && !p.training && p.ccpId && idsOff.indexOf(p.ccpId)<0) continue;
    normalize(p);
    if(p.deletedAt||p.status==='verworfen'){ tombsOff.push(p); continue; }
    if(!p._sig) p._sig=groupSigs(p, FGROUPS);
    arr.push(p);}}

async function _loadPatientsRun(){

  if(client && _ccpId && !_training && netLikelyUp()){   /* Training: rein lokal. Bekannt offline → sofort lokal (kein Netz-Hänger). */
    try{ await ensureDeviceNo(client); }catch(e){}   /* eigene Gerätenummer sichern, SOLANGE online (für offline danach) */
    if(stale()) return;
    try{
      var ccpIds=[ccpAt];
      if(_mergeGroupId){
        var g=await qt(client.from('ccps').select('id').eq('merge_group_id',_mergeGroupId));
        if(g.data && g.data.length>1){ ccpIds=g.data.map(function(c){return c.id;}); }
        else { /* allein in der Gruppe → Gruppe selbstheilend verlassen */
          if(!stale()) _mergeGroupId=null;
          try{await client.from('ccps').update({merge_group_id:null,merged:false}).eq('id',ccpAt);}catch(e2){}
        }
      }
      var realMerged = ccpIds.length>1;
      var q = realMerged
        ? await qt(client.from('patients').select('*').in('ccp_id',ccpIds))
        : await qt(client.from('patients').select('*').eq('ccp_id',ccpAt));

        var arr=q.data.map(patFromRow);

        /* Phase 6.5: Grabsteine (verworfene Patienten) nie in die Patientenliste;
         * CCP-Verbund für den Offline-Filter merken. */

        arr=arr.filter(function(p){return !(p.deletedAt||p.status==='verworfen');});
        tombsNew.forEach(function(tq){ tq._sig=groupSigs(tq, FGROUPS); });   /* Rückholen stempelt nur, was sich wirklich ändert */
        /* Eine lokale, nicht-dirty Kopie eines (fremd) verworfenen Patienten mit dem Grabstein-Stand
         * überschreiben — der Patient bleibt offline unsichtbar (Inhalt bleibt für das Rückholen, D6.5-19). */

        ccpMerged = realMerged || _demoMerged;
        if(_demoMerged){
          var keys2=await sList("ccp_pat_");
          for(var i=0;i<keys2.length;i++){var pd=await sGet(keys2[i]);if(pd&&pd.demo)arr.push(normalize(pd));}
        }
        if(_training){
          var keysT=await sList("ccp_pat_");

        arr.forEach(function(p){ p._sig=groupSigs(p, FGROUPS); });   /* sonst stempelt die erste Speicherung alle Gruppen */
        arr.sort(function(a,b){var ca=ccpBase(a.ccp),cb=ccpBase(b.ccp);if(ca!==cb)return ca<cb?-1:1;if(a.num!==b.num)return a.num-b.num;return ccpDev(a.ccp)-ccpDev(b.ccp);});

function normalize(p){
  if(!p.vit)p.vit={};if(!p.tx)p.tx={};if(!p.inj)p.inj=[];
  if(p.pupRe===undefined)p.pupRe="";if(p.pupLi===undefined)p.pupLi="";

  return p;
}

/* Gerätenummer SYNCHRON (für instantes, local-first Anlegen — nie auf Netz warten).

function deviceNoSync(){ return (_deviceNo!=null && _deviceNoCcp===_ccpId) ? _deviceNo : (isCcpCreator(_ccpId)?1:0); }

/* Spiegel der Reservierung in localStorage (argus_resnum_<ccpId>) — NUR Anzeige-/Startbeschleunigung;

function prefetchNum(force){

/* ── Nummernvergabe: fortlaufend online, Gerätenummer NUR offline (2026-10-14, Rev. 3) ──
 * Spec (Owner): Die Nummer läuft regulär fortlaufend über alle Geräte („A-7");
 * NUR wenn ein Gerät offline ist, wird die Gerätenummer angehängt und so erfasst
 * („A-7-2"). Und: Anlegen darf NIE auf das Netz warten (Local-First).
 * Umsetzung: Solange online, reserviert die App IM HINTERGRUND genau eine nächste

  var online=netLikelyUp(), now=nowMs();
  if(!_devices || !_devices.length){
    /* Nie geladen: ohne Verbindung ehrlich „unbekannt“ (nur mit Geräte-Schema), sonst still bis zum ersten Abruf. */
    if(!_devices && _schemaV>=26 && !online)
      return '<div class="sech">Geräte im CCP</div><div class="card" style="padding:10px"><div class="hint" style="padding:10px 12px;min-height:48px;display:flex;align-items:center">Gerätestand unbekannt (keine Verbindung)</div></div>';
    return '';
  }
  if(devStale(_devicesAt, now, online)){
    if(online){ try{ pollDevices(); }catch(e){} }   /* Rückkehr auf Home nach längerer Zeit: sofort neu holen statt bis zum 10-s-Takt zu warten */
    return '<div class="sech">Geräte im CCP</div><div class="card" style="padding:10px"><div class="hint" style="padding:10px 12px;min-height:48px;display:flex;align-items:center">Gerätestand unbekannt'+(online?' (veraltet)':' (keine Verbindung)')+(_devicesAt?' · zuletzt aktualisiert '+esc(hhmm(_devicesAt)):'')+'</div></div>';
  }
  var merged=(_ccpIdsKnown||[]).length>1, myDev=deviceNoSync();
  var col={verbunden:'var(--t3)', ausser_reichweite:'var(--t2)', abgemeldet:'var(--t1)', verlassen:'var(--mut)'};
  var h='<div class="sech">Geräte im CCP</div><div class="card" style="padding:10px">';
  _devices.forEach(function(d){
    var st=devStatus(d, now), self=(d.ccp_id===_ccpId && myDev>=1 && d.device_no===myDev);
    h+='<button class="txbtn" data-action="devtap" data-ccp="'+esc(d.ccp_id)+'" data-dev="'+esc(d.device_no)+'" style="width:100%;min-height:48px;display:flex;align-items:center;gap:10px;text-align:left;font-size:15px;margin-bottom:6px;padding:10px 12px">'+
      '<span style="width:12px;height:12px;border-radius:50%;flex:none;background:'+col[st]+'"></span>'+
      '<span style="flex:1;color:var(--tx)">'+esc(devLabel(d, now, {mm:masterMedic, merged:merged, hhmm:hhmm, self:self}))+'</span></button>';
  });
  return h+'</div>';
}

    h+='<button class="txbtn" data-action="capdiscard" style="flex:1;padding:10px 4px;border-color:var(--t1);color:var(--t1)">Verwerfen</button>';

function vCatlist(){
  var cat=state.cat, c=catDef(cat), special=!CATS[cat];
  /* Sortierung ausschließlich über CCP-Kennung + laufende Nummer. Eine Such-,
   * Sortier- oder Filterfunktion über das Namensfeld ist aus Datenschutzgründen
   * bewusst NICHT vorgesehen (T3 Namensfeld-Härtung, DATENSCHUTZ-SPEC) —
   * Patienten werden über die Nummer identifiziert, nicht über den Namen. */
  var list=bucketPatients(cat).sort(function(a,b){
    var ca=ccpBase(a.ccp),cb=ccpBase(b.ccp);
    if(ca!==cb)return ca<cb?-1:1;
    if(a.num!==b.num)return a.num-b.num;
    return ccpDev(a.ccp)-ccpDev(b.ccp);
  });
  /* Chronologie-Umschalter (Feedback 2026-06-13): Standard neueste zuerst,
   * auf Wunsch älteste zuerst. Nummer = Chronologie-Proxy je CCP. */
  var sortDesc=(state.catSortDesc!==false);
  if(sortDesc) list.reverse();
  var h='<div class="bigcat" style="background:'+c.bg+';color:'+c.fg+(c.bd?';border:1px solid '+c.bd:'')+';margin-bottom:14px"><span><span class="lab">'+c.label+'</span> <span class="nm">'+c.nm+'</span></span><span class="cc">'+list.length+'</span></div>';
  if(list.length>1) h+='<button class="ghost" data-action="catsort" style="margin:0 0 12px;font-size:12px;padding:7px 12px">↕ '+(sortDesc?'Neueste zuerst':'Älteste zuerst')+' — umkehren</button>';
  /* „Transportfertige auschecken" nur in den echten aktiven Kategorien. */
  if(!special){
    var readyList=list.filter(function(p){return p.ready;});
    if(readyList.length>0){
      h+='<button class="prim" data-action="checkoutready" data-cat="'+cat+'" style="background:var(--ready);margin:0 0 14px">✓ Alle '+readyList.length+' transportfertigen auschecken → gPA</button>';
    }
  }
  if(list.length===0)h+='<p class="muted" style="text-align:center;padding:20px">keine Patienten</p>';
  var dupC=dupNumKeys();
  list.forEach(function(p){
    var isd=!!dupC[(p.ccp||'A')+'|'+p.num];
    var cc=CATS[p.cat]||CATS.T3;
    /* In den Sammel-Listen (Alle/Prio/gPA) zusätzlich Kategorie zeigen. */
    var catPill = special ? '<span class="pill" style="background:'+cc.bg+';color:'+cc.fg+(cc.bd?';border:1px solid '+cc.bd:'')+'">'+cc.label+'</span>' : '';
    var gpaPill = (p.status==='gpa') ? '<span class="pill" style="background:var(--surf2);color:var(--mut)">gPA</span>' : '';
    /* T3 Namensfeld-Härtung: Die Liste zeigt bewusst KEINEN Namen — Nummer +
     * Pills identifizieren den Patienten; Hauptzeile ist die Sichtungszeit/TQ.
     * Der Name erscheint nur im Übergabe-Kontext (Übergabekarte/Export). */
    h+='<button class="patrow" data-action="openpat" data-id="'+p.id+'"><span class="pnum"'+(isd?' style="color:var(--prio)"':'')+'>'+pno(p)+(isd?' ⚠':'')+'</span>'+
      '<span style="flex:1"><span class="hint js-age" data-ts="'+p.lastTriage+'">'+ageStr(p.lastTriage)+'</span>'+
      (p.tqStart?' <span class="hint">· TQ <span class="js-tq" data-tq="'+p.tqStart+'">'+fmtDur(nowMs()-p.tqStart)+'</span></span>':'')+'</span>'+
      catPill+
      (p.prio?'<span class="pill" style="background:var(--prio);color:#fff">PRIO</span>':'')+
      (photoVisible(p)?'<span class="pill" style="background:var(--surf2);color:var(--mut)">📷</span>':'')+
      (function(){var l=lockInfo(p);return (l.locked&&!l.mine)?'<span class="pill" style="background:var(--surf2);color:var(--prio);border:1px solid var(--prio)">🔒 '+esc(l.by)+'</span>':'';})()+
      gpaPill+
      (p.ready&&p.status!=='gpa'?'<span class="pill" style="background:var(--ready);color:#fff">fertig</span>':'')+'</button>';
  });
  return h;
}

       '</div>';
  }
  if(isMasterMedic() && !_training && p.conf && p.conf.length){

        '<div style="font-weight:600;font-size:15px;color:var(--prio)">⚠ '+esc(conflictText(cf, hhmm))+'</div>';
      if(open){
        if(lv && typeof lv==='object'){

          Object.keys(lv).forEach(function(col){
            var fld=CONF_COL[col]||col;
            h+='<div style="font-size:14px;margin-top:3px"><b>'+esc(CONF_FIELD[fld]||fld)+':</b> '+esc(confValText(fld, lv[col]))+'</div>';

          h+='<div class="hint" style="margin-top:8px">Foto-Stand nicht gespeichert.</div>';

      }
      h+='<div class="row" style="margin-top:10px;flex-wrap:wrap">'+
        '<button class="txbtn" data-action="confshow" data-id="'+esc(p.id)+'" data-i="'+ci+'" style="flex:1">'+(open?'Stand ausblenden':'Überschriebenen Stand anzeigen')+'</button>'+
        (lv?'<button class="txbtn" data-action="confadopt" data-id="'+esc(p.id)+'" data-i="'+ci+'" style="flex:1">Stand übernehmen</button>':'')+
        '<button class="txbtn" data-action="confack" data-id="'+esc(p.id)+'" data-i="'+ci+'" style="flex:1">Erledigt</button></div></div>';
    });
  }
  h+='<div id="patbody"'+(ro?' style="opacity:.55;pointer-events:none"':'')+'>';
  h+='<div class="card" style="display:flex;align-items:center;gap:12px;padding:13px"><span class="pnum" style="font-size:28px">'+pno(p)+'</span>'+
    '<span class="pill" style="font-size:14px;background:'+c.bg+';color:'+c.fg+(c.bd?';border:1px solid '+c.bd:'')+'">'+c.label+' '+c.nm+'</span>'+
    '<span style="flex:1"></span>'+
    '<button class="txbtn '+(p.prio?"on":"")+'" data-action="prio" data-id="'+p.id+'" style="width:auto;'+(p.prio?'background:var(--prio);border-color:var(--prio);color:#fff':'')+'">Prio-Transport</button></div>';
  if(isDupNum(p)){
    h+='<div class="card" style="background:var(--surf2);border:1px solid var(--prio);padding:11px;margin-top:8px"><span style="color:var(--prio);font-weight:600">⚠ Nummer '+esc(pno(p))+' doppelt vergeben</span><div class="hint" style="margin-top:3px">Ein weiterer aktiver Patient im selben CCP trägt dieselbe Nummer. Bitte einen davon neu kennzeichnen.</div></div>';
  }

  /* T1 Foto-Lebenszyklus: Fotos sind dauerhaft an (v0.31.0) — Kamera-Button immer
   * verfügbar. Bestehende Fotos bleiben sichtbar; „Foto entfernen" bleibt verfügbar;
   * 72-h-Löschung nach Abschluss unverändert. */
  var fotoHint='<div class="hint" style="margin-top:6px">Nur zur Wiedererkennung (statt Name). Wird mit den Geräten dieses Einsatzes geteilt. Nach dem Einsatz 72 Std nur für die Leitung einsehbar, danach automatisch gelöscht.</div>';
  h+='<div class="sech" id="ph-foto">Foto zur Identifikation</div><div class="card">';
  if(photoVisible(p)){
    var _psafe=safePhoto(p.photo);
    if(_psafe){
      h+='<img src="'+_psafe+'" alt="Patientenfoto" data-action="photozoom" style="width:100%;max-height:280px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;cursor:pointer">';
      h+='<div class="hint" style="text-align:center;margin-top:4px;font-size:11px">Antippen zum Vergrößern</div>';
    }
    h+='<div class="row" style="margin-top:9px">'+
      '<label class="txbtn" style="flex:1;cursor:pointer;line-height:1.3">Neues Foto<input type="file" accept="image/*" capture="environment" data-kind="photo" style="display:none"></label>'+
      '<button class="txbtn" data-action="delphoto" data-id="'+p.id+'" style="flex:1">Foto entfernen</button></div>';
    h+=fotoHint;
  }else{
    h+='<label class="txbtn" style="display:block;padding:16px;cursor:pointer;font-size:15px">📷 Foto aufnehmen oder wählen<input type="file" accept="image/*" capture="environment" data-kind="photo" style="display:none"></label>';
    h+=fotoHint;

  h+='</div>';

  h+='<div class="sech" id="ph-cat">In andere Kategorie verschieben</div><div class="catset">';
  CATORDER.forEach(function(cat){var cc=CATS[cat];var on=p.cat===cat;h+='<button data-action="movecat" data-id="'+p.id+'" data-cat="'+cat+'" style="background:'+(on?cc.bg:"var(--surf2)")+';color:'+(on?cc.fg:"var(--mut)")+';border-color:'+(on?cc.bg:"var(--line)")+'">'+cc.label+'</button>';});
  h+='</div>';

  h+='<div class="sech" id="ph-stamm">Stammdaten</div><div class="card">'+
    '<label class="fieldlab">Name (optional)</label>'+inp("name",p.name)+
    '<div class="hint" style="margin-top:4px">Nur erfassen, wenn für Versorgung/Übergabe erforderlich.</div>'+
    '<div style="height:9px"></div><div class="grid3">'+
    '<div><label class="fieldlab">Alter</label>'+inp("age",p.age)+'</div>'+
    '<div><label class="fieldlab">Geschl.</label><select data-kind="pat" data-field="gender"><option value=""'+sel(p.gender,"")+'>—</option><option value="m"'+sel(p.gender,"m")+'>m</option><option value="w"'+sel(p.gender,"w")+'>w</option></select></div>'+
    '<div><label class="fieldlab">Allergien</label>'+inp("allergies",p.allergies)+'</div></div></div>';

  /* WR-02: tqLabel gibt Klartext zurück → esc() hier für den innerHTML-Kontext. */
  h+='<div class="sech">&lt;C&gt; Tourniquet</div><div class="card"><button class="txbtn '+(p.tqStart?"on":"")+'" data-action="tq" data-id="'+p.id+'" style="'+(p.tqStart?'background:var(--t1);border-color:var(--t1);color:#fff':'')+'">'+(p.tqStart?esc(tqLabel(p)):'TQ-Timer starten')+'</button></div>';

  h+='<div class="sech" id="ph-tx">Maßnahmen A–E</div><div class="card">';
  TXG.forEach(function(g){h+='<div class="subl">'+esc(g[0])+'</div><div class="grid3">';
    g[1].forEach(function(f){var on=p.tx&&p.tx[f[0]];h+='<button class="txbtn '+(on?"on":"")+'" data-kind="tx" data-field="'+f[0]+'">'+esc(f[1])+'</button>';});
    h+='</div>';});
  h+='</div>';

  h+='<div class="sech" id="ph-inj">Verletzungen</div><div class="card">';
  if(p.inj.length===0)h+='<div class="muted" style="font-size:13px;margin-bottom:8px">noch keine Einträge</div>';
  p.inj.forEach(function(it,idx){h+='<div class="injrow"><span style="flex:1">'+esc(it.r)+' – '+esc(it.a)+'</span><button class="delx" data-action="delinj" data-idx="'+idx+'">×</button></div>';});
  h+='<div class="row" style="margin-top:10px"><select data-field="injRegion" style="flex:1">';
  REGIONS.forEach(function(r){h+='<option>'+r+'</option>';});
  h+='</select><select data-field="injArt" style="flex:1">';
  ARTS.forEach(function(a){h+='<option>'+a+'</option>';});
  h+='</select><button class="txbtn" data-action="addinj" style="width:auto;padding:0 16px">＋</button></div>';
  h+='</div>';

  h+='<div class="sech" id="ph-vit">Vitalwerte</div><div class="card"><div class="grid3">'+
    '<div><label class="fieldlab">AF</label>'+vinp("af",p.vit.af)+'</div>'+
    '<div><label class="fieldlab">SpO₂</label>'+vinp("spo2",p.vit.spo2)+'</div>'+
    '<div><label class="fieldlab">HF</label>'+vinp("hf",p.vit.hf)+'</div></div><div style="height:9px"></div><div class="grid3">'+
    '<div><label class="fieldlab">RR</label>'+vinp("rr",p.vit.rr)+'</div>'+
    '<div><label class="fieldlab">WASB</label><select data-kind="vit" data-field="avpu"><option value=""'+sel(p.vit.avpu,"")+'>—</option><option value="W"'+sel(p.vit.avpu,"W")+'>W – wach</option><option value="A"'+sel(p.vit.avpu,"A")+'>A – ansprechbar</option><option value="S"'+sel(p.vit.avpu,"S")+'>S – Schmerzreiz</option><option value="B"'+sel(p.vit.avpu,"B")+'>B – bewusstlos</option></select></div>'+
    '<div><label class="fieldlab">Schmerz</label>'+vinp("pain",p.vit.pain)+'</div></div><div style="height:9px"></div><div class="grid2">'+
    '<div><label class="fieldlab">Pupille re</label>'+inp("pupRe",p.pupRe)+'</div>'+
    '<div><label class="fieldlab">Pupille li</label>'+inp("pupLi",p.pupLi)+'</div></div></div>';

  /* Vitalwerte-Verlauf (für längere Versorgung/PFC). Bewusst schlank & eingeklappt
   * — im Normalfall nur ein Knopf. „Messung protokollieren" friert die aktuellen
   * Vitalwerte mit Uhrzeit + Kürzel als Eintrag ein (gespeichert in p.vit.log). */
  var vlog=(p.vit && Array.isArray(p.vit.log)) ? p.vit.log : [];
  h+='<div class="card" style="padding:11px 13px">';
  h+='<button class="txbtn" data-action="logvit" data-id="'+p.id+'" style="width:100%">＋ Messung protokollieren</button>';
  if(vlog.length){
    h+='<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:var(--mut)">Protokollierte Messungen ('+vlog.length+')</summary><div style="margin-top:6px">';
    vlog.slice().reverse().forEach(function(m){
      var tm=new Date(m.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      var parts=[];
      if(m.af)parts.push('AF '+esc(m.af)); if(m.spo2)parts.push('SpO₂ '+esc(m.spo2));
      if(m.hf)parts.push('HF '+esc(m.hf)); if(m.rr)parts.push('RR '+esc(m.rr));
      if(m.avpu)parts.push('WASB '+esc(m.avpu)); if(m.pain)parts.push('Schmerz '+esc(m.pain));
      h+='<div style="font-size:13px;padding:6px 0;border-top:1px solid var(--line)"><span class="mono" style="font-weight:600">'+tm+'</span>'+(m.by?' · '+esc(m.by):'')+'<br><span class="hint">'+(parts.join(' · ')||'—')+'</span></div>';
    });
    h+='</div></details>';
  }
  h+='</div>';

  h+='<div class="sech" id="ph-karte">Verlauf / Karte</div><div class="card">'+
    '<label class="fieldlab">MOI / Unfallhergang</label><textarea data-kind="pat" data-field="moi">'+esc(p.moi)+'</textarea>'+
    '<div style="height:9px"></div><label class="fieldlab">Verletzung / Erkrankung (Freitext)</label><textarea data-kind="pat" data-field="injury">'+esc(p.injury)+'</textarea>'+
    '<div style="height:9px"></div><label class="fieldlab">Erstversorger</label>'+inp("fr",p.fr)+
    '<div style="height:9px"></div><label class="fieldlab">Notizen</label><textarea data-kind="pat" data-field="notes">'+esc(p.notes)+'</textarea>'+
    '<div class="hint" style="margin-top:6px">Keine Namen Dritter — nur versorgungsrelevante Fakten.</div></div>';

  if(p.status==='gpa'){
    h+='<div class="card" style="background:var(--surf2);border:1px solid var(--line);padding:11px;margin-bottom:8px"><span style="font-weight:600">↩ Bereits abtransportiert (gPA)</span><div class="hint" style="margin-top:3px">Falls versehentlich ausgecheckt: hier zurück in den aktiven Bestand holen.</div></div>';
    h+='<button class="prim" data-action="reactivate" data-id="'+p.id+'" style="background:var(--acc);color:#fff">↩ Zurückholen → aktiv</button>';
  }else{
    h+='<button class="txbtn '+(p.ready?"on":"")+'" data-action="ready" data-id="'+p.id+'" style="width:100%;padding:14px;font-size:15px;'+(p.ready?'background:var(--ready);border-color:var(--ready);color:#fff':'')+'">'+(p.ready?'✓ transportfertig':'als transportfertig markieren')+'</button>';
    h+='<button class="prim" data-action="gpa" data-id="'+p.id+'" style="background:var(--ready);color:#fff">Abtransport → gPA</button>';
  }
  h+='<p class="hint" style="text-align:center;margin-top:8px">Eingaben werden automatisch gespeichert.</p>';
  h+='</div>';
  return h;
}
/* ── Übergabe-Karte (gPA): Vorlese-Modus in AT-MIST-Reihenfolge ──────────────
 * Reine Darstellung bereits erfasster Daten. Nichts wird übertragen, kein
 * Drittsystem, kein PZC/QR/Foto. Ausgecheckte Patienten sind gesperrt; zum
 * Korrigieren „↩ Zurückholen". MDR-neutral (keine neue klinische Ausgabe). */
function vHandover(p,c){
  function amRow(letter,label,valueHtml,first,key){
    return '<div data-am="'+(key||letter)+'" style="display:flex;gap:11px;padding:12px 0'+(first?'':';border-top:1px solid var(--line)')+'">'+
      '<span class="mono" style="width:32px;height:32px;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+letter+'</span>'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700">'+label+'</div>'+
      '<div style="font-size:16px;font-weight:600;line-height:1.35;margin-top:2px">'+valueHtml+'</div></div></div>';
  }
  function vc(l,v){return '<div style="background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 8px"><div style="font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px">'+l+'</div><div class="mono" style="font-size:15px;font-weight:700;margin-top:1px">'+(v?esc(v):'—')+'</div></div>';}
  var dim='<span style="color:#9aa0a6;font-weight:400;font-style:italic">— nicht erfasst</span>';

  /* A — Alter / Geschlecht (optional, Pseudonymität) */
  var ap=[]; if(p.age)ap.push(esc(p.age)+' J'); var g=p.gender==='m'?'männl.':(p.gender==='w'?'weibl.':''); if(g)ap.push(g);
  var aVal=ap.length?ap.join(' · '):dim;
  /* T — Zeiten (automatisch) */
  var tp=[];
  /* AT-MIST (Owner 2026-10-14): Das erste T ist „Time" = Zeitpunkt. Das Tourniquet
   * ist eine Maßnahme und steht VOLLSTÄNDIG unter „T — Maßnahmen" (Ort, Anlagezeit,
   * laufende Dauer) — hier bewusst nicht mehr doppelt. */
  if(p.created)tp.push('<span style="font-size:13px;color:var(--mut);font-weight:400">erfasst '+ageStr(p.created)+'</span>');
  var tVal=tp.length?tp.join('<br>'):dim;
  /* M — Mechanismus (aus MOI/Unfallhergang) */
  var mVal=p.moi?esc(p.moi):dim;
  /* I — Verletzungen */
  var il=[]; (p.inj||[]).forEach(function(it){il.push(esc(it.r)+' – '+esc(it.a));}); if(p.injury)il.push(esc(p.injury));
  var iVal=il.length?il.join('<br>'):dim;
  /* S — Befund / Vitalwerte: nur erhobene Werte; PFC-Verlauf einklappbar (Default zu) */
  var v=p.vit||{};
  var vpairs=[['WASB',v.avpu],['AF',v.af],['SpO₂',v.spo2],['HF',v.hf],['RR',v.rr],['Schmerz',v.pain]].filter(function(x){return x[1]!=null&&x[1]!=='';});
  var sVal;
  if(vpairs.length){
    sVal='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px">'+vpairs.map(function(x){return vc(x[0],x[1]);}).join('')+'</div>';
  }else{
    sVal='<div style="margin-top:4px;font-weight:600;color:var(--mut)">Keine Vitalwerte erhoben</div>';
  }
  if(p.allergies)sVal+='<div style="margin-top:7px;color:var(--t1);font-weight:600;font-size:13.5px">⚠ Allergien: '+esc(p.allergies)+'</div>';
  var vlog=(p.vit&&Array.isArray(p.vit.log))?p.vit.log:[];
  if(vlog.length){
    sVal+='<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12.5px;color:var(--mut);font-weight:600">Verlauf — '+vlog.length+' protokollierte Messung'+(vlog.length>1?'en':'')+'</summary>'+
      '<div style="margin-top:5px;border:1px solid var(--line);border-radius:8px;overflow:hidden">';
    vlog.forEach(function(m){
      var tm=m.t?new Date(m.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'—';
      var parts=[];
      if(m.af)parts.push('AF '+esc(m.af)); if(m.spo2)parts.push('SpO₂ '+esc(m.spo2));
      if(m.hf)parts.push('HF '+esc(m.hf)); if(m.rr)parts.push('RR '+esc(m.rr));
      if(m.avpu)parts.push('WASB '+esc(m.avpu)); if(m.pain)parts.push('Schmerz '+esc(m.pain));
      sVal+='<div style="display:flex;gap:8px;padding:6px 9px;border-top:1px solid var(--line);font-size:12px"><span class="mono" style="font-weight:700;flex-shrink:0">'+tm+'</span><span style="color:var(--mut)">'+(parts.join(' · ')||'—')+'</span></div>';
    });
    sVal+='</div></details>';
  }
  /* T — Maßnahmen (Treatment): Das Tourniquet gehört nach AT-MIST hierher — mit
   * Anlageort (verhindert übersehene TQs unter Kleidung/Decken), Anlagezeit und
   * der laufenden Dauer in Rot (zeitkritisch, 2-Stunden-Grenze). */
  var tl=[];
  if(p.tqStart)tl.push('<span style="color:var(--t1);font-weight:700">Tourniquet'+(p.tqSite?' ('+esc(p.tqSite)+')':'')+' · angelegt '+new Date(p.tqStart).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr · liegt seit '+fmtDur(nowMs()-p.tqStart)+'</span>');
  TXG.forEach(function(grp){grp[1].forEach(function(f){ if(p.tx&&p.tx[f[0]]) tl.push(esc(f[1])); });});
  var ttVal=tl.length?tl.map(function(x){return '▸ '+x;}).join('<br>'):dim;

  var h='<div id="patbody">';
  h+='<div class="card" style="background:var(--surf2);border:1px solid var(--line);padding:11px 13px;display:flex;align-items:center;gap:9px;margin-bottom:10px">'+
     '<span style="font-size:15px">🔒</span><div style="flex:1">'+
     '<div style="font-weight:600">Ausgecheckt → gPA · Übergabe-Karte</div>'+
     '<div class="hint" style="margin-top:2px">Bearbeitung gesperrt · der Reihe nach vorlesen</div></div></div>';
  h+='<div class="card" data-am="hdr" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px">'+
     '<span class="pnum" style="font-size:30px">'+pno(p)+'</span>'+
     '<span class="pill" style="font-size:14px;background:'+c.bg+';color:'+c.fg+(c.bd?';border:1px solid '+c.bd:'')+'">'+c.label+' '+c.nm+'</span>'+
     (p.prio?'<span class="pill" style="font-size:13px;background:var(--prio);color:#fff">PRIO</span>':'')+
     (p.name?'<span style="flex-basis:100%;font-size:14px;color:var(--mut);margin-top:2px">Name: '+esc(p.name)+'</span>':'')+
     '</div>';
  h+='<div class="card" style="padding:4px 14px 12px">';
  h+=amRow('A','Alter / Geschlecht',aVal,true,'A');
  h+=amRow('T','Zeiten',tVal,false,'T1');
  h+=amRow('M','Mechanismus',mVal,false,'M');
  h+=amRow('I','Verletzungen',iVal,false,'I');
  h+=amRow('S','Befund / Vitalwerte',sVal,false,'S');
  h+=amRow('T','Maßnahmen',ttVal,false,'TT');
  h+='</div>';
  h+='<button class="prim" data-action="reactivate" data-id="'+p.id+'" style="background:var(--acc);color:#fff;margin-top:12px">↩ Zurückholen → aktiv (zum Korrigieren)</button>';
  h+='<p class="hint" style="text-align:center;margin-top:8px">Übergabe an die gPA — der Reihe nach vorlesen.</p>';
  h+='</div>';
  return h;
}
/* ── Übergabe-Export (Einsatz-Abschluss): JSON + druckbare Gesamtansicht ─────
 * Der Export ist die Übergabe an die dauerhafte Einsatzdokumentation des
 * Trägers — ARGUS selbst bleibt Durchgangsspeicher mit kurzen Löschfristen. */

/* Reiner Feld-Mapper für den Export (kein DOM — per JSC isoliert testbar).
 * Row-Format wie patToRow, aber mit bewussten Auslassungen:
 *  (a) leere optionale String-Felder werden WEGGELASSEN (insb. name) —
 *      „Export enthält Name nur, wenn erfasst" ist damit strukturell erfüllt;
 *  (b) photo wird IMMER weggelassen — BEWUSSTE ENTSCHEIDUNG, kein Versehen:
 *      das Foto ist ein streng befristetes Wiedererkennungsmittel und gehört
 *      nicht in die dauerhafte Trägerdoku. Die Leitungs-Oberfläche bleibt
 *      der einzige Foto-Abruf-Pfad. (Nebeneffekt: keine base64-aufgeblähten
 *      JSON-Dateien, die das iOS-Share-Limit sprengen.)
 *  (c) Sperr-Spalten (locked_by/locked_at) sind reine Laufzeit-Koordination
 *      und entfallen ebenfalls. vit (inkl. vit.log) bleibt vollständig. */
function exportRowFromPatient(p){
  var row={ id:p.id, num:p.num, ccp:p.ccp||'A', cat:p.cat, status:p.status||'active',
    prio:!!p.prio, ready:!!p.ready, tq_start:p.tqStart||null, tq_site:p.tqSite||null,
    created:p.created, last_triage:p.lastTriage, updated:p.updated,
    vit:p.vit||{}, tx:p.tx||{}, inj:p.inj||[] };

/* JSON-Datei teilen (Web Share API mit File — funktioniert in der iOS-PWA);
 * Fallback: Blob + temporärer Download-Link. Fehler enden im toast(). */
async function exportEinsatzJson(){
  try{
    var ex=buildEinsatzExport();
    var fname='argus-einsatz-'+(ex.ccp_kennungen||['A']).join('')+'-'+new Date().toISOString().slice(0,10)+'.json';
    var blob=new Blob([JSON.stringify(ex,null,2)],{type:'application/json'});
    if(navigator.share && navigator.canShare && window.File){
      try{
        var file=new File([blob],fname,{type:'application/json'});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); toast("Export geteilt"); return; }
      }catch(eSh){ if(eSh && eSh.name==='AbortError') return; /* Nutzer hat abgebrochen */ }
    }
    var a=document.createElement('a'); var url=URL.createObjectURL(blob);
    a.href=url; a.download=fname; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode)a.parentNode.removeChild(a); },800);
    toast("Export gespeichert: "+fname);
  }catch(err){ toast("Export fehlgeschlagen"); }
}

  var g=p.gender==='m'?'männl.':(p.gender==='w'?'weibl.':''); if(g)ap.push(g);
  var tp=[];
  /* TQ nicht mehr unter „Zeiten" (AT-MIST: Maßnahme) — siehe tl unten. */
  if(p.created)tp.push('erfasst '+ageStr(p.created));
  var il=[]; (p.inj||[]).forEach(function(it){il.push(esc(it.r)+' – '+esc(it.a));}); if(p.injury)il.push(esc(p.injury));
  var v=p.vit||{};
  var vp=[['WASB',v.avpu],['AF',v.af],['SpO₂',v.spo2],['HF',v.hf],['RR',v.rr],['Schmerz',v.pain]].filter(function(x){return x[1]!=null&&x[1]!=='';});
  var sVal=vp.length?('<span class="mono">'+vp.map(function(x){return x[0]+' '+esc(x[1]);}).join(' · ')+'</span>'):dim;
  if(p.allergies)sVal+='<br><b style="color:var(--t1)">⚠ Allergien: '+esc(p.allergies)+'</b>';
  var vlog=(p.vit&&Array.isArray(p.vit.log))?p.vit.log:[];
  if(vlog.length){
    sVal+='<div style="margin-top:4px;font-size:11.5px;color:var(--mut)">Verlauf:'+vlog.map(function(m){
      var tm=m.t?new Date(m.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'—';
      var parts=[]; if(m.af)parts.push('AF '+esc(m.af)); if(m.spo2)parts.push('SpO₂ '+esc(m.spo2));
      if(m.hf)parts.push('HF '+esc(m.hf)); if(m.rr)parts.push('RR '+esc(m.rr));
      if(m.avpu)parts.push('WASB '+esc(m.avpu)); if(m.pain)parts.push('Schmerz '+esc(m.pain));
      return '<br>'+tm+': '+(parts.join(' · ')||'—');
    }).join('')+'</div>';
  }
  var tl=[]; if(p.tqStart)tl.push('<b style="color:var(--t1)">Tourniquet'+(p.tqSite?' ('+esc(p.tqSite)+')':'')+' · angelegt '+new Date(p.tqStart).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr · liegt seit '+fmtDur(nowMs()-p.tqStart)+'</b>');
  TXG.forEach(function(grp){grp[1].forEach(function(f){ if(p.tx&&p.tx[f[0]]) tl.push(esc(f[1])); });});
  var h='<div class="card" style="padding:10px 13px;margin-bottom:10px">';
  h+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
     '<span class="pnum" style="font-size:20px">'+pno(p)+'</span>'+
     '<span class="pill" style="background:'+c.bg+';color:'+c.fg+(c.bd?';border:1px solid '+c.bd:'')+'">'+c.label+'</span>'+
     (p.prio?'<span class="pill" style="background:var(--prio);color:#fff">PRIO</span>':'')+
     (p.status==='gpa'?'<span class="pill" style="background:var(--surf2);color:var(--mut)">gPA</span>':'')+
     (p.name?'<span style="font-size:12.5px;color:var(--mut)">Name: '+esc(p.name)+'</span>':'')+
     '</div>';
  h+='<div style="margin-top:6px">';
  h+=row('A','Alter / Geschlecht', ap.length?ap.join(' · '):dim);
  h+=row('T','Zeiten', tp.length?tp.join(' · '):dim);

  f.style.cssText='position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:1;transition:opacity .35s ease';
  f.innerHTML='<div style="background:rgba(15,21,28,.92);color:#fff;padding:16px 24px;border-radius:16px;font-size:23px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.35)"><span style="color:#46c98a">✓</span> Nr. '+esc(String(num))+' · '+esc(catLabel)+'</div>';
  document.body.appendChild(f);
  setTimeout(function(){ f.style.opacity='0'; },650);
  setTimeout(function(){ if(f.parentNode)f.parentNode.removeChild(f); },1050);
}

function resizePhoto(file,maxEdge,quality){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);var img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.naturalWidth||img.width,hh=img.naturalHeight||img.height;
      var s=Math.min(1,maxEdge/Math.max(w,hh));
      var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(hh*s));
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
      cv.getContext("2d").drawImage(img,0,0,cw,ch);
      try{resolve(cv.toDataURL("image/jpeg",quality));}catch(e){reject(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("img"));};
    img.src=url;
  });
}

function confirmModal(msg,okLabel){
  return new Promise(function(resolve){
    var ov=document.createElement("div");ov.className="modalov";
    ov.innerHTML='<div class="modalbx"><div class="modalmsg">'+esc(msg)+'</div>'+
      '<div class="row" style="margin-top:16px">'+
      '<button class="ghost mc-cancel" style="flex:1;margin:0">Abbrechen</button>'+
      '<button class="prim mc-ok" style="flex:1;margin:0;background:var(--ready)">'+esc(okLabel||"OK")+'</button></div></div>';
    document.body.appendChild(ov);
    function done(v){ modalDismiss(ov, function(){ resolve(v); }); }
    /* Android-Fix (2026-10-15): Absicht beim Antippen merken (s. promptModal). */
    var pressed=null, downOnOv=false;
    ov.querySelector(".mc-ok").addEventListener("pointerdown",function(){pressed="ok";});
    ov.querySelector(".mc-cancel").addEventListener("pointerdown",function(){pressed="cancel";});
    ov.addEventListener("pointerdown",function(e){ pressed=null; downOnOv=(e.target===ov); },true);   /* Capture: Absicht bei jedem neuen Antippen zurücksetzen */
    ov.addEventListener("pointercancel",function(){ pressed=null; });
    ov.addEventListener("pointerup",function(){ if(pressed==="ok")done(true); else if(pressed==="cancel")done(false); pressed=null; });
    ov.querySelector(".mc-cancel").addEventListener("click",function(){done(false);});
    ov.querySelector(".mc-ok").addEventListener("click",function(){done(true);});
    ov.addEventListener("click",function(e){if(e.target===ov && downOnOv)done(false);});
  });
}
function cmpVer(a,b){
  var pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number);
  for(var i=0;i<3;i++){ var d=(pa[i]||0)-(pb[i]||0); if(d) return d>0?1:-1; }
  return 0;
}

function trainCount(){ return patients.filter(function(p){return p.training;}).length; }
function trainSome(f){ return patients.some(function(p){return p.training && f(p);}); }
function trainLoad(){ try{ _training=localStorage.getItem('argus_training')==='1'; _trainStep=parseInt(localStorage.getItem('argus_train_step')||'0',10)||0; if(_training)_photosAllowed=true; }catch(e){} }   /* Reload mitten im Training: Foto-Schalter lokal wieder an (s. Kommentar oben) */
function trainSave(){ try{ localStorage.setItem('argus_training',_training?'1':'0'); localStorage.setItem('argus_train_step',String(_trainStep)); }catch(e){} }
async function startTraining(){ if(!_training){ try{await trainReset();}catch(e){} clearLeftMarker(true); _trainStep=0; _trainMax=0; _trainCelebrate=false; if(_channel){try{_channel.unsubscribe();}catch(e){} _channel=null;} _ccpId=null; _mergeGroupId=null; patients=[]; state.view='start'; }   /* frischer Start: ohne CCP, damit „CCP eröffnen" jedes Mal echt durchlaufen wird (kein manuelles Zurücksetzen) */ _training=true; _photosAllowed=true; trainSave(); try{await loadPatients();}catch(e){} render(); }   /* Foto-Schalter lokal an (train-ccp synct nie → kein Cloud-Leck) */
async function trainReset(){ try{ var lk=await sList("ccp_pat_"); for(var i=0;i<lk.length;i++){ var pp=await sGet(lk[i]); if(pp && pp.training) await sDel(lk[i]); } }catch(e){} }
async function endTraining(){
  /* Overlay (Spotlight + Panel) VOR dem Dialog entfernen, sonst liegt es im Vordergrund. */
  try{ trainClearSpot(); var pe=document.getElementById('train-coach'); if(pe&&pe.parentNode)pe.parentNode.removeChild(pe); }catch(e){}
  var ok=await confirmModal('Training beenden?\n\nDie Übungsdaten auf diesem Gerät werden entfernt. Echte CCPs sind nicht betroffen.','Beenden');
  if(!ok){ try{ renderCoach(); }catch(e){} return; }
  _training=false; _photosAllowed=true; trainSave(); try{ trainTeardown(); }catch(e){}   /* Fotos bleiben dauerhaft an (v0.31.0) */ try{await trainReset();}catch(e){} clearLeftMarker(true); if(_channel){try{_channel.unsubscribe();}catch(e){} _channel=null;} _ccpId=null; _mergeGroupId=null; patients=[]; try{localStorage.removeItem('argus_ccp_id');}catch(e){} state.view='start'; try{await loadPatients();}catch(e){} render();   /* Übungs-CCP & -Daten weg → zurück zur Schulungs-Startseite, sauber für den nächsten Lauf */
}
function trainStep(d){
  if(d>0){ _trainStep=Math.min(_trainStep+1,TRAIN_LESSONS.length); if(_trainStep>_trainMax)_trainMax=_trainStep; }
  else { _trainStep=Math.max(0,_trainStep-1); }
  trainSave(); renderCoach();
}

function trainCheckAdvance(){
  var guard=0, adv=false;
  while(_trainStep<TRAIN_LESSONS.length && _trainStep>=_trainMax){
    var L=TRAIN_LESSONS[_trainStep], ok=false;
    if(L.adv){ try{ ok=!!L.adv(); }catch(e){ ok=false; } }
    if(ok){ _trainStep++; _trainMax=_trainStep; adv=true; if(++guard>30)break; } else break;
  }
  if(adv){ trainSave(); try{ toast('Schritt erledigt ✓'); }catch(e){} }
}
/* Spotlight: 4 Abdunkel-Rechtecke um das Ziel-Element (robust, ohne z-index-Tricks). */
var _trainSpotKey='';
function trainRect(id,x,y,w,h){
  var d=document.getElementById(id);
  if(!d){ d=document.createElement('div'); d.id=id; d.style.position='fixed'; d.style.zIndex='8000'; d.style.background='rgba(16,20,26,.58)'; document.body.appendChild(d); }
  d.style.left=x+'px'; d.style.top=y+'px'; d.style.width=w+'px'; d.style.height=h+'px';
}
function trainClearSpot(){ ['train-dt','train-db','train-dl','train-dr','train-ring','train-block'].forEach(function(id){ var e=document.getElementById(id); if(e&&e.parentNode)e.parentNode.removeChild(e); }); ['.train-dim','.train-block','.train-ring'].forEach(function(sel){ var es=document.querySelectorAll(sel); for(var i=0;i<es.length;i++){ if(es[i].parentNode)es[i].parentNode.removeChild(es[i]); } }); }
/* Scrollt das Ziel mittig in den Bereich ÜBER dem Panel (sonst sitzt es dahinter versteckt). */
function trainUnionRect(nodes){
  var Lf=1e9,Tf=1e9,Rf=-1e9,Bf=-1e9,any=false;
  for(var i=0;i<nodes.length;i++){ var eln=nodes[i]; if(!eln||!eln.getBoundingClientRect) continue; var r=eln.getBoundingClientRect(); if(r.width||r.height){ any=true; if(r.left<Lf)Lf=r.left; if(r.top<Tf)Tf=r.top; if(r.right>Rf)Rf=r.right; if(r.bottom>Bf)Bf=r.bottom; } }
  return any?{left:Lf,top:Tf,right:Rf,bottom:Bf,width:Rf-Lf,height:Bf-Tf}:null;
}
function trainScrollToRect(rect){
  try{
    var sc=document.scrollingElement||document.documentElement||document.body;
    var panel=document.getElementById('train-coach');
    var ph=panel?panel.offsetHeight:230;
    var safeTop=54, safeBottom=window.innerHeight-ph-14;       /* unter sticky-Topbar / über dem Coach-Panel */
    if(safeBottom-safeTop<70) safeBottom=safeTop+70;
    if(rect.top>=safeTop && rect.bottom<=safeBottom) return;   /* schon frei sichtbar → NICHT scrollen (Top-Elemente bleiben unangetastet) */
    var delta;
    if(rect.height > (safeBottom-safeTop)){
      /* Ziel(e) höher als der freie Bereich — z. B. mehrere gestapelte Buttons auf
       * schmalem Display (Lektion „Direkt anlegen" / „Patienten öffnen"). Zentrieren
       * würde die Oberkante über safeTop schieben; stattdessen Oberkante an safeTop
       * ausrichten, damit möglichst viele Ziele OBERHALB des Coach-Panels sichtbar
       * sind (sonst verschwinden untere Buttons hinter dem Panel = „Highlighting off"). */
      delta = rect.top - safeTop;
    } else {
      var center=(safeTop+safeBottom)/2;
      delta = rect.top + rect.height/2 - center;
    }
    sc.scrollTop=Math.max(0, sc.scrollTop + delta);
  }catch(e){}
}
/* Dim-Overlay mit EINEM Loch pro Ziel (mehrere Ziele → mehrere Löcher; alles dazwischen bleibt dunkel).
 * Annahme: Löcher überlappen sich vertikal nicht (nach oben sortiert) — passt für gestapelte Ziele. */
function trainDim(holes, vw, vh, block){
  var rects=[], prevB=0, i;
  for(i=0;i<holes.length;i++){
    var ho=holes[i];
    if(ho.y>prevB) rects.push([0,prevB,vw,ho.y-prevB]);               /* Band oberhalb / zwischen den Löchern */
    if(ho.x>0) rects.push([0,ho.y,ho.x,ho.h]);                         /* links neben dem Loch */
    var rx=ho.x+ho.w; if(rx<vw) rects.push([rx,ho.y,vw-rx,ho.h]);      /* rechts neben dem Loch */
    if(ho.y+ho.h>prevB) prevB=ho.y+ho.h;
  }
  if(prevB<vh) rects.push([0,prevB,vw,vh-prevB]);                      /* Band unterhalb */
  var k=0;
  for(i=0;i<rects.length;i++){ var c=rects[i]; if(c[2]<=0||c[3]<=0)continue; var id='train-dim-'+k; k++; var d=document.getElementById(id); if(!d){ d=document.createElement('div'); d.id=id; d.className='train-dim'; d.style.position='fixed'; d.style.zIndex='8000'; d.style.background='rgba(16,20,26,.58)'; document.body.appendChild(d); } d.style.left=c[0]+'px'; d.style.top=c[1]+'px'; d.style.width=c[2]+'px'; d.style.height=c[3]+'px'; d.style.pointerEvents=block?'auto':'none'; }
  var ex; while((ex=document.getElementById('train-dim-'+k))){ if(ex.parentNode)ex.parentNode.removeChild(ex); k++; }
}
/* Pro Loch ein Element (Ring oder transparenter Blocker), wiederverwendet + Überzählige entfernt. */
function trainHoleEls(prefix, cls, z, holes, decorate){
  var k=0,i;
  for(i=0;i<holes.length;i++){ var ho=holes[i]; var id=prefix+k; k++; var e=document.getElementById(id); if(!e){ e=document.createElement('div'); e.id=id; e.className=cls; e.style.position='fixed'; e.style.zIndex=z; document.body.appendChild(e); if(decorate)decorate(e); } e.style.left=ho.x+'px'; e.style.top=ho.y+'px'; e.style.width=ho.w+'px'; e.style.height=ho.h+'px'; }
  var ex; while((ex=document.getElementById(prefix+k))){ if(ex.parentNode)ex.parentNode.removeChild(ex); k++; }
}
function trainSpotlight(nodes, spotKey, mode, forceScroll){
  if(!nodes || !nodes.length){ trainClearSpot(); _trainSpotKey=''; return; }
  var changed=_trainSpotKey!==spotKey; _trainSpotKey=spotKey;
  var u=trainUnionRect(nodes); if(!u){ trainClearSpot(); return; }
  /* NUR bei neuem Ziel zentrieren — und NUR bei einem einzelnen Ziel. Bei mehreren Zielen ist die
   * Union breit; zentrieren würde beide an den Rand drücken → dann gar nicht scrollen. */
  /* Auch bei MEHREREN Zielen scrollen (vorher nur bei <=1): sonst bleiben auf
   * schmalem Display untere gestapelte Ziele hinter dem Coach-Panel. trainScrollToRect
   * richtet bei zu hohen Ziel-Unions die Oberkante aus statt zu zentrieren. */
  if(changed||forceScroll){ trainScrollToRect(u); var u2=trainUnionRect(nodes); if(u2) u=u2; }
  var pad=6, vw=window.innerWidth, vh=window.innerHeight, i;
  var holes=[];
  for(i=0;i<nodes.length;i++){ var el=nodes[i]; if(!el||!el.getBoundingClientRect)continue; var rr=el.getBoundingClientRect(); if(!(rr.width||rr.height))continue; holes.push({x:Math.max(0,rr.left-pad),y:Math.max(0,rr.top-pad),w:rr.width+2*pad,h:rr.height+2*pad}); }
  if(!holes.length){ trainClearSpot(); return; }
  holes.sort(function(a,b){return a.y-b.y;});
  var block=(mode!=='choice');                        /* choice: nichts blockieren (mehrere Wege antippbar) */
  trainDim(holes, vw, vh, block);                     /* ein Loch je Ziel → Bereiche dazwischen bleiben dunkel */
  trainHoleEls('train-block-','train-block','8000', mode==='explain'?holes:[], function(e){ e.style.background='transparent'; });   /* explain: Ziel sichtbar, aber nicht antippbar */
  trainHoleEls('train-ring-','train-ring','8001', holes, function(e){ e.style.pointerEvents='none'; e.style.borderRadius='12px'; e.style.boxShadow='0 0 0 2px #1f2530,0 0 0 5px #fff,0 0 0 10px rgba(31,37,48,.30)'; });   /* ein Ring je Ziel */
}
function trainTeardown(){
  trainClearSpot();
  var el=document.getElementById('train-coach'); if(el&&el.parentNode)el.parentNode.removeChild(el);
  var ap=document.getElementById('app'); if(ap)ap.style.paddingBottom='';
}
/* Coach: großes Panel unten + Spotlight aufs Ziel. Eigenständig am Body, Aufruf in
 * try/catch → kann den App-Render nie brechen. */
function renderCoach(){
  if(!_training){ trainTeardown(); return; }
  try{ trainCheckAdvance(); }catch(e){}
  var ap=document.getElementById('app'); if(ap)ap.style.paddingBottom=Math.max(300,Math.round(window.innerHeight*0.7))+'px';   /* genug Scroll-Raum, damit auch der unterste Button (z. B. „Abtransport → gPA") über das Panel gescrollt werden kann */
  var n=TRAIN_LESSONS.length, fin=_trainStep>=n;
  var L=fin?null:TRAIN_LESSONS[_trainStep];
  /* Kontext-Wächter: kontextgebundene Lektionen (ctx) prüfen ihre Ansicht —
   * vorzeitiges Verlassen führt zur Einstiegs-Lektion (ctxBack) zurück. */
  if(L && L.ctx && L.ctxBack!==undefined){
    var _okCtx=false; try{ _okCtx=!!L.ctx(); }catch(e){}
    if(!_okCtx){ _trainStep=L.ctxBack; trainSave(); L=TRAIN_LESSONS[_trainStep]; }
  }
  var nodes=null, doitTxt=null, backRedirect=false;
  if(L){
    doitTxt=(typeof L.doit==='function')?L.doit():(L.doit||null);
    var sel=(typeof L.sel==='function')?L.sel():L.sel;
    if(sel){ var _nl=document.querySelectorAll(sel); if(_nl.length) nodes=_nl; }
    /* Ziel liegt auf der Startseite, wir sind aber auf einer Unteransicht → Übergang „zurück". */
    if(!nodes && L.home && state.view!=='home'){ var _bb=document.getElementById('backbtn'); if(_bb){ nodes=[_bb]; backRedirect=true; } }
  }
  var target=nodes?nodes[0]:null;
  var spotKey=target?((backRedirect?'B':'S')+_trainStep+'|'+(doitTxt||'')):'';
  /* Bei der Rückkehr-Umleitung (home:true, Ziel = ‹-Button) darf der Spotlight NICHT
   * blockieren — sonst legt der Explain-Modus einen transparenten Blocker über ‹ und
   * „Zurück" funktioniert nicht. 'choice' = kein Blocker, Ring bleibt. */
  var spotMode=backRedirect?'choice':((L&&L.mode)||'explain');
  var el=document.getElementById('train-coach');
  if(!el){ el=document.createElement('div'); el.id='train-coach'; el.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:8002'; document.body.appendChild(el); }
  var pct=Math.round((Math.min(_trainStep,n)/n)*100);
  var key=(fin?'fin':('s'+_trainStep))+'|'+(doitTxt||'')+'|'+(target?'t':'n')+'|'+(backRedirect?'b':'');
  if(el.getAttribute('data-k')!==key){
    el.setAttribute('data-k',key);
    var head='<div style="height:6px;background:var(--surf2)"><i style="display:block;height:100%;width:'+pct+'%;background:var(--acc)"></i></div>';
    if(fin){
      el.innerHTML='<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 30px rgba(0,0,0,.30);overflow:hidden">'+head+
        '<div style="padding:15px 17px 0"><div style="font-size:20px;font-weight:700">🎓 Training abgeschlossen</div>'+
        '<div style="font-size:14.5px;color:#33373b;margin-top:6px;line-height:1.45">Du hast den kompletten Ablauf durchgespielt — jederzeit wiederholbar.</div></div>'+
        '<div style="display:flex;gap:9px;padding:14px 17px 16px">'+
        '<button data-tc="end" style="flex:1;border:0;border-radius:11px;padding:13px;font-weight:700;font-size:15px;background:var(--acc);color:#fff">Beenden &amp; Übungsdaten löschen</button></div></div>';
    }else if(backRedirect){
      el.innerHTML='<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 30px rgba(0,0,0,.30);overflow:hidden">'+head+
        '<div style="padding:15px 17px 0"><div style="font-size:18px;font-weight:700;color:var(--acc)">↩ Zurück zur Startseite</div>'+
        '<div style="font-size:14.5px;color:#33373b;margin-top:6px;line-height:1.45">Alles klar. Wenn du hier fertig bist, tippe oben links auf <b>‹</b> — dann geht es weiter mit <b>'+esc(L.t)+'</b>.</div></div>'+
        '<div style="display:flex;gap:9px;padding:14px 17px 16px">'+
        '<button data-tc="end" style="border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px 15px;font-weight:600;color:var(--mut)">Beenden</button>'+
        '<button data-tc="skip" style="flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px;font-weight:600;color:var(--mut)">Überspringen ›</button>'+
        '</div></div>';
    }else{
      /* „Zurück verhakt"-Fix: Hat die Lektion einen Spotlight-Selektor, findet ihn aber
       * nicht (Nutzer hat die passende Ansicht unerwartet verlassen), dann KEIN „Weiter"
       * anbieten — stattdessen Rückkehr-Hinweis + „Überspringen". So läuft man nicht
       * blind durch ansichtsgebundene Lektionen ohne Spotlight; kehrt man in die Ansicht
       * zurück, geht es am SELBEN Schritt weiter (kein Fortschrittsverlust). Lektionen
       * ganz ohne Selektor (sel===null: Willkommen, Standort, Patientenfotos …) sind
       * nicht betroffen, ihr „Weiter" bleibt frei. */
      var expectedButMissing = !!sel && !target && !backRedirect;
      var doit=(doitTxt&&target)?'<div style="margin-top:11px;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--acc)">👆 '+esc(doitTxt)+'</div>'
              :(expectedButMissing?'<div style="margin-top:11px;background:var(--surf2);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--mut)">Du hast die passende Ansicht verlassen — geh dorthin zurück, dann geht es hier weiter.</div>':'');
      var canNext=!(L.adv&&_trainStep>=_trainMax) && !expectedButMissing;   /* „Weiter" erst frei, wenn Aufgabe erledigt UND das Spotlight-Ziel sichtbar ist */
      el.innerHTML='<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 30px rgba(0,0,0,.30);overflow:hidden">'+head+
        '<div style="padding:15px 17px 0">'+
        '<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--acc)">🎓 Lektion '+(_trainStep+1)+' / '+n+'<span style="margin-left:auto;color:var(--mut);font-weight:600;text-transform:none;letter-spacing:0;font-size:10.5px">nur dieses Gerät</span></div>'+
        '<div style="font-size:20px;font-weight:700;letter-spacing:-.01em;margin-top:9px">'+esc(L.t)+'</div>'+
        '<div style="font-size:14.5px;color:#33373b;margin-top:6px;line-height:1.45">'+esc(L.x)+'</div>'+doit+'</div>'+
        '<div style="display:flex;gap:9px;padding:14px 17px 16px">'+
        (_trainStep>0?'<button data-tc="back" aria-label="Vorherige Lektion" title="Vorherige Lektion" style="border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px 14px;font-weight:700;color:var(--mut)">‹</button>':'')+
        '<button data-tc="end" style="border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px 15px;font-weight:600;color:var(--mut)">Beenden</button>'+
        (canNext?'<button data-tc="next" style="flex:1;border:0;border-radius:11px;padding:13px;font-weight:700;font-size:15px;background:var(--acc);color:#fff">'+(_trainStep===n-1?'Abschließen ✓':'Weiter ›')+'</button>':'<button data-tc="nextoff" style="flex:1;border:0;border-radius:11px;padding:13px;font-weight:700;font-size:15px;background:var(--surf2);color:#9aa0a6">Aufgabe erledigen …</button>')+
        '</div>'+
        (canNext?'':'<div style="text-align:center;padding:0 0 12px"><a href="#" data-tc="skip" style="font-size:12.5px;color:var(--mut);text-decoration:none">Schritt überspringen ›</a></div>')+
        '</div>';
    }
  }
  var b;
  if((b=el.querySelector('[data-tc=next]')))b.onclick=function(){trainStep(1);};
  if((b=el.querySelector('[data-tc=skip]')))b.onclick=function(e){if(e&&e.preventDefault)e.preventDefault();trainStep(1);};
  if((b=el.querySelector('[data-tc=back]')))b.onclick=function(){trainStep(-1);};   /* 1.2: explizit eine Lektion zurück */
  if((b=el.querySelector('[data-tc=end]')))b.onclick=function(){endTraining();};
  /* Spotlight ZULETZT — das Panel (samt Höhe) steht jetzt, damit der Scroll die echte Panelhöhe kennt
   * und das Ziel nicht hinter dem Panel landet. NUR bei neuem Ziel zentrieren → freies Scrollen bleibt möglich. */
  var wasKey=_trainSpotKey;
  try{ trainSpotlight(nodes, spotKey, spotMode, false); }catch(e){ trainClearSpot(); }
  if(target && spotKey!==wasKey && window.requestAnimationFrame){ requestAnimationFrame(function(){ if(_training && _trainSpotKey===spotKey){ try{ trainSpotlight(nodes, spotKey, spotMode, true); }catch(e){} } }); }
}

/* Erst-Einführung als überspringbare Karten-Sequenz (Button-Navigation, kein Swipe). */

        (i>0?'<button class="ghost btn-back" style="flex:1;margin:0">Zurück</button>':'')+
        '<button class="prim btn-next" style="flex:2;margin:0;background:var(--ready)">'+(i<steps.length-1?'Weiter':'Los geht’s')+'</button>'+
      '</div>'+
      '<button class="ghost btn-skip" style="width:100%;margin-top:10px;border:0;color:var(--mut);font-size:13px">Überspringen</button>'+

    var bb=ov.querySelector('.btn-back'); if(bb)bb.addEventListener('click',function(){ if(i>0){i--;draw();} });
