  if(meshBytes(sig)+200<=MESH_PROTO.maxMsg){ meshSend(t, {order:MESH_GROUPS_ORDER, pats:map}, to); return; }
  var pairs=ids.map(function(id){ return [id, map[id]]; });
  meshChunk(pairs, MESH_PROTO.chunk).forEach(function(part){
    var o={}; part.forEach(function(x){ o[x[0]]=x[1]; });
    meshSend(t, {order:MESH_GROUPS_ORDER, pats:o}, to);
  });
}
/* invh an einen Link (bei Link-Aufbau sofort, Research Pattern 3). */
function meshSendInvh(to, now){
  var h=meshMyBuckets();
  _mesh.invhTo[to]={at:now||nowMs(), sig:h.join(',')};
  _mesh.diag.invh++;
  return meshSend('invh', {h:h}, to);
}
/* Anti-Entropie im Takt (Pitfall 8): je Link höchstens alle invMs — nur wenn sich die eigene Bucket-Signatur seit dem
 * letzten invh an diesen Link geändert hat, spätestens nach 2·invMs. */
function meshInvhTakt(now){
  var P=MESH_PROTO, h=null, sig='', frisch=meshRuhe(now);
  Object.keys(_mesh.authed).forEach(function(k){
    var e=_mesh.invhTo[k];
    if(e && now-e.at<P.invMs) return;
    if(h===null){ h=meshMyBuckets(); sig=h.join(','); }
    if(e && e.sig===sig && now-e.at<2*P.invMs) return;
    if(e && frisch && now-e.at<3*P.invMs) return;   /* Push zuerst (meshRuhe) */
    _mesh.invhTo[k]={at:now, sig:sig};
    _mesh.diag.invh++;
    meshSend('invh', {h:h}, k);
  });
}
/* Push zuerst (Messrunde 1, A3): true = die letzte Änderung des eigenen Bestands (eigenes Delta vorgemerkt bzw. fremdes
 * angewendet → Weiterleitung) ist jünger als invRuheMs. Die Prüfsummen ändern sich schon VOR dem Senden des Deltas (Debounce
 * 500 ms, dann Weiterleitung mit Jitter) — ohne Ruhe holt die Anti-Entropie den Push ein und löst unnötige inv/req/delta aus.
 * Gilt für den Takt und die Antwort auf ein fremdes invh; an einen Link, der 3·invMs nichts bekam, geht es trotzdem
 * (keine Aushungerung bei laufenden Änderungen). _mesh.changedAt setzen meshQueueDelta und meshApplyIncoming. */
function meshRuhe(now){ return now-(_mesh.changedAt||0)<MESH_PROTO.invRuheMs; }
/* invh empfangen: abweichende Buckets → mein Teil-Inventar dieser Buckets an den Link (er zieht per req nach); damit
 * auch ich nachziehen kann, antworte ich mit meinen Prüfsummen, wenn an diesen Link seit 5 s keine ging (keine Schleife).
 * Push zuerst (A3): ist die eigene Änderung frisch, bleibt das inv aus (der Nachbar bekommt das Delta); die invh-Antwort geht. */
function meshHandleInvh(msg, key){
  var now=nowMs(), mine=meshMyBuckets(), diff=meshInvBucketDiff(mine, msg.h);
  if(!diff.length) return;
  /* Messrunde 1 (Befund 6): Das invh beim Link-Aufbau kann beim Nachbarn verworfen werden, wenn es vor seiner Meldung
   * „verbunden“ eintrifft (nur authentisierte Links) — dann wartete eine Seite bis zum nächsten Takt (10 s). Das ERSTE invh
   * je Link wird darum immer mit den eigenen Prüfsummen beantwortet (einmalig, keine Schleife). */
  var erst=!_mesh.invhVon[key]; _mesh.invhVon[key]=true;
  var e=_mesh.invhTo[key], frisch=meshRuhe(now);
  /* Nachprüfung 26.10.2026 (inv-Verstärkung): ein kleines invh mit beliebigen Prüfsummen löst sonst beliebig oft das volle
   * Teil-Inventar aus — je Link höchstens alle invAntwortMs ein inv (das erste je Link sofort). */
  var invOk=now-(_mesh.invAntwort[key]||0)>=MESH_PROTO.invAntwortMs;
  if(!(frisch && e && now-e.at<3*MESH_PROTO.invMs) && invOk){
    var inv=meshInventoryFor(patients.concat(_tombs||[]), MESH_GROUPS_ORDER, diff, MESH_PROTO.invBuckets);
    if(Object.keys(inv).length){ _mesh.invAntwort[key]=now; meshSendMap('inv', inv, key); }
  }
  if(erst || !e || now-e.at>=5000){ _mesh.invhTo[key]={at:now, sig:mine.join(',')}; _mesh.diag.invh++; meshSend('invh', {h:mine}, key); }
}
/* inv empfangen (D6.7-03): was ICH vom Absender brauche (meshDiff) → req an den Absender. */
function meshHandleInv(msg, key){
  var order=Array.isArray(msg.order) ? msg.order : MESH_GROUPS_ORDER;
  var need=meshDiff(meshMyInventory(), msg.pats, order);
  /* HO-02: schon vorgemerkte Foto-Stempel nicht erneut anfordern (keine Schleife) */
  var remoteT={};
  patients.concat(_tombs||[]).forEach(function(p){ if(p && p.id && p._fotoRemoteT) remoteT[p.id]=p._fotoRemoteT; });
  need=meshPruneFotoNeed(need, msg.pats, order, remoteT);
  if(Object.keys(need).length) meshSendMap('req', need, key);
}
/* req empfangen (D6.7-05/-06, T-06.7-01): je Patient Weißlisten-Delta der angeforderten Gruppen (nie Übungsdaten,
 * nie Patienten eines fremden CCP), in Teile à MESH_PROTO.chunk an den Anfordernden. */
async function meshHandleReq(msg, key){
  var pats=msg.pats||{}, ids=Object.keys(pats), out=[];
  var cids=(_ccpIdsKnown && _ccpIdsKnown.length) ? _ccpIdsKnown : (_ccpId ? [_ccpId] : []);
  for(var i=0;i<ids.length;i++){
    var p=null; try{ p=await sGet('ccp_pat_'+ids[i]); }catch(e){ p=null; }
    /* Messrunde 1 (Befund C): liegt der Satz (noch) nicht im Speicher, aus dem Arbeitsspeicher liefern — das Inventar
     * (meshMyBuckets) stammt aus patients/_tombs, die Antwort auf ein req muss denselben Bestand kennen. */
    if(!p){ var k, mem0=patients.concat(_tombs||[]); for(k=0;k<mem0.length;k++){ if(mem0[k] && mem0[k].id===ids[i]){ p=mem0[k]; break; } } }
    if(!p || p.demo || p.training) continue;
    if(p.ccpId && cids.indexOf(p.ccpId)<0) continue;
    out.push(meshDelta(p, pats[ids[i]], FGROUPS));
  }
  if(!out.length) return;
  var parts=meshChunk(out, MESH_PROTO.chunk);
  parts.forEach(function(part, i){ meshSend('delta', {part:i+1, of:parts.length, pats:part, zug:true}, key); });   /* 06.10-09 (PE-1): gezogen — keine Herkunft mit Ursprungs-CCP */
}
/* delta empfangen (D6.7-03): je Eintrag anwenden, danach Anzeige/Gateway. Rückgabe: ids der geänderten Patienten
 * (der Dispatcher leitet nur weiter, wenn sie nicht leer ist — gezogene Deltas wie Push-Deltas). */
async function meshHandleDelta(msg, key){
  var list=Array.isArray(msg.pats) ? msg.pats : [], changed=[], need=[], nach={};
  /* Messrunde 1 (Befund B): „angefordert“ = Antwort auf MEIN req — kommt immer direkt vom Nachbarn (meshHandleReq sendet
   * an den Anfordernden). Eine weitergeleitete zug-Antwort ist für mich ein Push und unterliegt dem Rumpf-Schutz. */
  var angefordert=(msg.zug===true && meshNodeKey(msg.ccp, msg.from)===key);
  await meshSerial(async function(){
    for(var i=0;i<list.length;i++){
      var r=null; try{ r=await meshApplyIncoming(list[i], msg.from, msg.zug===true ? '' : msg.ccp, angefordert); }catch(e){ r=null; }   /* 06.10-09 (PE-1): Ursprungs-CCP nur bei Eager-Push */
      if(r && r.rumpf){ nach[list[i].id]=MESH_GROUPS_ORDER.slice(); continue; }
      if(r){ changed.push(list[i].id); if(r.needPhoto) need.push(list[i].id); }
    }
  });
  /* Rumpf-Schutz (Befund B): unbekannter Satz ohne vollständige Kernstempel → nicht anwenden, sondern alle Gruppen beim
   * Absender-Link anfordern (ein req je Nachricht). Der gezogene vollständige Satz wird dann wie jedes Delta weitergeleitet;
   * das Teil-Delta selbst nicht (sonst forderten die Nachbarn bei mir an, bevor ich den Satz habe). */
  if(Object.keys(nach).length){ _mesh.diag.rumpf=(_mesh.diag.rumpf|0)+1; meshSendMap('req', nach, key); }
  if(changed.length) meshAfterApply(changed, need);
  return changed;
}
/* Rumpf-Prüfung (Messrunde 1, Befund B): Ein Delta für einen hier unbekannten Patienten ist nur dann ein vollständiger Satz,
 * wenn es die Stempel aller Kerngruppen trägt (cat, st, vit, tx, tq, stamm — foto und del sind entbehrlich). Ein Teil-Delta
 * (z. B. nur st aus dem Schnellmenü kurz nach dem Anlegen) würde sonst als Patient ohne Kategorie gespeichert — und nie heilen,
 * weil meshInventory fehlende Stempel mit updated auffüllt (D6.7-03). Rein; true = unvollständig. */
function meshRumpf(inc, order){
  var f=(inc && inc.fts && typeof inc.fts==='object') ? inc.fts : {};
  return (order||MESH_GROUPS_ORDER).some(function(g){
    if(g==='foto' || g==='del') return false;
    var e=f[g]; return !(e && typeof e==='object' && typeof e.t==='number' && e.t>0);
  });
}
/* Ursprungsgerät eines Deltas (T-06.7-38): d des jüngsten Stempels, sonst 0. */
function meshOriginDev(inc){
  var best=null, f=(inc && inc.fts) || {};
  Object.keys(f).forEach(function(g){ var e=f[g]; if(e && typeof e.t==='number' && (best===null || e.t>best.t)) best=e; });
  var d=best ? parseInt(best.d, 10) : 0;
  return (d>=1) ? d : 0;
}
/* Delta anwenden (D6.7-03/-04, T-06.7-38): local aus dem Speicher, meshApply (mergeGroups), dann als offener Satz
 * sichern: _dirty, Provenienz _via mesh + _fuer Ursprungsgerät (nur wenn der Satz keine eigenen unbestätigten
 * Stempel trägt — die behalten die eigene Provenienz), _sig neu, sSet, patients/_tombs nachziehen. Rückgabe r oder
 * false (nichts Neues). */
async function meshApplyIncoming(inc, fromDev, fromCcp, angefordert){
  if(!inc || typeof inc.id!=='string') return false;
  var local=null; try{ local=await sGet('ccp_pat_'+inc.id); }catch(e){ local=null; }
  if(local && (local.demo || local.training)) return false;
  /* Rumpf-Schutz (Messrunde 1, Befund B): unbekannt + Push + unvollständig → nicht anwenden; der Aufrufer fordert alle
   * Gruppen an. Angeforderte (direkt gezogene) Deltas werden immer angewendet — keine Schleife bei Altsätzen ohne fts. */
  if(!local && !angefordert && meshRumpf(inc, MESH_GROUPS_ORDER)) return {rumpf:true, changed:false, isNew:false};
  var r=meshApply(local, inc, FGROUPS);
  if(!r.changed && !r.isNew && !r.stamps && r.mark && local){
    /* HO-02: reine Vormerkungsänderung — nur die drei Felder nachziehen, kein _dirty, keine Herkunft */
    var vk=['_fotoRemote','_fotoRemoteT','_fotoRemoteD'];
    var setMark=function(x){ vk.forEach(function(k){ if(r.merged[k]!==undefined) x[k]=r.merged[k]; else delete x[k]; }); };
    setMark(local);
    await sSet('ccp_pat_'+local.id, local);
    var q;
    for(q=0;q<patients.length;q++){ if(patients[q].id===local.id) setMark(patients[q]); }
    for(q=0;q<_tombs.length;q++){ if(_tombs[q].id===local.id) setMark(_tombs[q]); }
    return r;
  }
  if(!r.changed && !r.isNew && !r.stamps) return false;   /* Befund F: jüngere Stempel ohne Inhaltsänderung zählen wie eine Änderung (Upload/Quittung, keine invh-Schleife) */
  var m=normalize(r.merged);
  if(!m.ccpId && _ccpId) m.ccpId=_ccpId;
  m._dirty=true;
  var own=false;
  Object.keys(m.fts||{}).forEach(function(g){ var e=m.fts[g]; if(e && e.p) own=true; });
  if(!own){ m._via='mesh'; m._fuer=meshOriginDev(inc) || (fromDev|0); m._fuerCcp=meshFuerCcp(inc, fromDev, fromCcp); }   /* 06.10-09 (PE-1): Ursprungs-CCP im Verbund, sonst null */
  /* Befund 6b: Kam die Quittung des Gateways VOR diesem Delta (eigener Upload des Nachbarn: rcpt und delta laufen getrennt), deckt sie den
   * Stand ggf. schon — dann nicht erneut öffnen (meshReceipt prüft streng: exakte Stempel, volle Deckung; sonst bleibt der Satz offen). */
  var rl=_mesh.rcptLast[m.id];
  if(rl && nowMs()-(rl.at||0)<MESH_PROTO.rcptMemMs) meshReceipt(m, rl.fts);
  m._sig=groupSigs(m, FGROUPS);
  await sSet('ccp_pat_'+m.id, m);
  _mesh.changedAt=nowMs();   /* Push zuerst (meshRuhe): Weiterleitung folgt */
  var tomb=!!(m.deletedAt || m.status==='verworfen');
  var i=-1, j=-1, k;
  for(k=0;k<patients.length;k++){ if(patients[k].id===m.id){ i=k; break; } }
  for(k=0;k<_tombs.length;k++){ if(_tombs[k].id===m.id){ j=k; break; } }
  if(tomb){
    if(i>=0) patients.splice(i, 1);
    if(j>=0) _tombs[j]=m; else _tombs.push(m);
  }else{
    if(j>=0) _tombs.splice(j, 1);
    if(i>=0) patients[i]=m;
    else{
      patients.push(m);
      patients.sort(function(a, b){ var ca=ccpBase(a.ccp), cb=ccpBase(b.ccp); if(ca!==cb) return ca<cb?-1:1; if(a.num!==b.num) return a.num-b.num; return ccpDev(a.ccp)-ccpDev(b.ccp); });
    }
  }
  return r;
}
/* Nach dem Anwenden (T-06.7-37): offenen Patienten auf das aktualisierte Objekt zeigen lassen (Sperrfelder bleiben,
 * meshApply erhält sie), Foto bei Bedarf anfordern (D6.7-06); Render NIE im Patienten-/Checklisten-View (Fokusverlust
 * wie beim Realtime-Handler); Gateway: jedes Gerät mit Netz lädt das Offene hoch (D6.7-04). */
function meshAfterApply(changed, needPhotoIds){
  var v=state.view, cur=state.edit;
  if(cur && changed.indexOf(cur.id)>=0){
    var fresh=null, k;
    for(k=0;k<patients.length;k++){ if(patients[k].id===cur.id){ fresh=patients[k]; break; } }
    if(!fresh){ for(k=0;k<_tombs.length;k++){ if(_tombs[k].id===cur.id){ fresh=_tombs[k]; break; } } }
    if(fresh && fresh!==cur){
      if(cur.lockedBy!==undefined && fresh.lockedBy===undefined){ fresh.lockedBy=cur.lockedBy; fresh.lockedAt=cur.lockedAt; }
      state.edit=fresh;
    }
    if(v==='patient' && (needPhotoIds||[]).indexOf(cur.id)>=0) meshRequestPhoto(cur.id);
  }
  if(v!=='patient' && v!=='checklist'){ try{ render(); }catch(e){} }
  meshGatewayFlush();
}
/* Gateway-Flush (D6.7-04): mit Netz lädt loadPatients → flushPendingPatients alle _dirty-Sätze hoch (Herkunft „für
 * Gerät X“, Quittung in _meshRcptQ). Verzögert 1,5 s, gebündelt; im Patienten-View aufgeschoben (state.edit bliebe
 * sonst an einem alten Objekt hängen). Auch aus dem online-Handler (Netz kehrt zurück). */
function meshGatewayFlush(){
  if(!_mesh.native) return;
  if(!(netLikelyUp() && sb() && _ccpId && !_training)) return;
  if(_mesh.gwTimer) return;
  _mesh.gwTimer=setTimeout(function(){
    _mesh.gwTimer=null;
    if(state.view==='patient'){ meshGatewayFlush(); return; }
    if(!(netLikelyUp() && sb() && _ccpId && !_training)) return;
    try{ loadPatients().then(function(){ if(state.view==='home') render(); }, function(){}); }catch(e){}
  }, 1500);
}
/* rcpt empfangen (D6.7-04, HO-03): meshReceipt je Gruppenstempel (p nur bei exakt gleichem Stempel, _dirty/_via/_fuer nur bei
 * vollständig gedecktem Stand) im Speicher und im Arbeitsobjekt; Zähler „nicht synchronisiert“ auf home nachziehen.
 * Rückgabe: Zahl der Sätze, an denen sich etwas geändert hat (Weiterleitung nur dann). */
async function meshHandleRcpt(msg, key){
  var list=Array.isArray(msg.pats) ? msg.pats : [], n=0;
  function sig(x){ return JSON.stringify([x.fts||null, x._dirty||null, x._via||null, x._fuer||null]); }
  await meshSerial(async function(){
    for(var i=0;i<list.length;i++){
      var r=list[i], p=null, hit=false;
      if(r && typeof r.id==='string' && r.fts && typeof r.fts==='object'){   /* Befund 6b: merken — ein Delta, das nach der Quittung eintrifft, prüft dagegen */
        var alt=_mesh.rcptLast[r.id];
        _mesh.rcptLast[r.id]={at:nowMs(), fts:(alt && alt.fts) ? meshRcptAdd([{id:r.id, fts:alt.fts}], r.id, r.fts, 1)[0].fts : r.fts};
      }
      try{ p=await sGet('ccp_pat_'+r.id); }catch(e){ p=null; }
      if(p && !p.demo && !p.training){ var s0=sig(p); meshReceipt(p, r.fts); if(sig(p)!==s0) hit=true; try{ await sSet('ccp_pat_'+r.id, p); }catch(e){} }
      var mem=null, k;
      for(k=0;k<patients.length;k++){ if(patients[k].id===r.id){ mem=patients[k]; break; } }
      if(!mem){ for(k=0;k<_tombs.length;k++){ if(_tombs[k].id===r.id){ mem=_tombs[k]; break; } } }
      if(mem && mem!==p){ var s1=sig(mem); meshReceipt(mem, r.fts); if(sig(mem)!==s1) hit=true; }
      if(hit) n++;
    }
  });
  if(state.view==='home'){ try{ render(); }catch(e){} }
  return n;
}
/* ── Deltas, Quittungen, Sperren, Fotos, Heartbeat, CCP-Stammdaten (D6.7-02/-04/-06/-07/-08, D6.10-02/-16) ── */
/* Delta vormerken (D6.7-03, T-06.7-32): aus savePatient je geänderter Gruppe, gebündelt je Patient, Debounce
 * deltaDebounceMs. Nur aktiv (mindestens ein Link) — alles davor holt die Anti-Entropie beim Verbinden nach. */
function meshQueueDelta(p, groups){
  if(!_mesh.native || !p || typeof p.id!=='string' || p.demo || p.training) return;
  if(!meshActive() || !groups || !groups.length) return;
  var q=_mesh.deltaQ[p.id]||(_mesh.deltaQ[p.id]={});
  groups.forEach(function(g){ if(MESH_GROUPS_ORDER.indexOf(g)>=0) q[g]=1; });
  _mesh.changedAt=nowMs();   /* Push zuerst (meshRuhe) */
  if(!_mesh.deltaTimer) _mesh.deltaTimer=setTimeout(function(){ _mesh.deltaTimer=null; try{ meshFlushDeltas(); }catch(e){} }, MESH_PROTO.deltaDebounceMs);
}
/* Vorgemerkte Deltas senden: frisch aus dem Speicher (sGet), Weißlisten-Delta nur der vorgemerkten Gruppen, in Teile
 * à MESH_PROTO.chunk an alle Links (die Nachbarn leiten weiter, nur wenn neu). */
async function meshFlushDeltas(){
  var q=_mesh.deltaQ; _mesh.deltaQ={};
  if(!meshActive()) return;
  var ids=Object.keys(q), out=[];
  for(var i=0;i<ids.length;i++){
    var p=null; try{ p=await sGet('ccp_pat_'+ids[i]); }catch(e){ p=null; }
    if(!p || p.demo || p.training) continue;
    var gs=MESH_GROUPS_ORDER.filter(function(g){ return !!q[ids[i]][g]; });
    if(gs.length) out.push(meshDelta(p, gs, FGROUPS));
  }
  if(!out.length) return;
  var parts=meshChunk(out, MESH_PROTO.chunk);
  parts.forEach(function(part, i){ meshSend('delta', {part:i+1, of:parts.length, pats:part}, 'links'); });
}
/* Quittungen senden (D6.7-04, T-06.7-33): _meshRcptQ (gefüllt von confirmUpload/flushPendingPatients) gebündelt
 * höchstens 1× je rcptBundleMs an alle Links; leert die Queue. */
function meshDrainRcpt(now){
  now=now||nowMs();
  if(!_meshRcptQ.length || !meshActive()) return;
  if(now-_mesh.lastRcpt<MESH_PROTO.rcptBundleMs) return;
  var items=_meshRcptQ.splice(0, _meshRcptQ.length); _meshRcptQ=[];
  _mesh.lastRcpt=now;
  meshChunk(items, MESH_PROTO.chunk).forEach(function(part){ meshSend('rcpt', {pats:part}, 'links'); });
}
/* Inhalt eines Sperr-Ereignisses (D6.7-07): gesendet nach pushLock aus acquire/releasePatientLock und aus dem
 * Sperr-Heartbeat (offline) — jeweils nur, wenn das Mesh aktiv ist und der Patient kein Übungsdatensatz ist. */
function meshLockBody(p, release){
  return {pid:p.id, by:String(release ? (operator||'') : (p.lockedBy||operator||'')).slice(0,40), lockedAt:Number(p.lockedAt)||0, release:!!release, mm:isMasterMedic()};
}
/* lock empfangen (D6.7-07, T-06.7-35): meshLockApply wie der Server-Weg; ist es der offene Patient, dieselbe Logik wie im
 * Realtime-Handler (Wartender übernimmt bei frei/abgelaufen, Bearbeiter erkennt fremde Übernahme). Rückgabe true =
 * Sperre hat sich geändert (Weiterleitung nur dann). */
function meshHandleLock(msg, key){
  var p=null, k;
  for(k=0;k<patients.length;k++){ if(patients[k].id===msg.pid){ p=patients[k]; break; } }
  if(!p || p.demo || p.training) return false;
  var now=nowMs();
  if(!meshLockApply(p, msg, now, LOCK_TTL)) return false;
  try{ sSet('ccp_pat_'+p.id, p).then(null, function(){}); }catch(e){}
  if(state.view==='patient' && state.edit && state.edit.id===p.id){
    var lb=p.lockedBy, la=p.lockedAt||0, fresh=(now-la)<LOCK_TTL;
    if(state.edit!==p){ state.edit.lockedBy=lb; state.edit.lockedAt=la; }
    if(state.readonly){
      if(!lb || !fresh || lb===operator){
        acquirePatientLock(state.edit).then(function(){ render(); toast('Patient frei — du kannst jetzt bearbeiten'); }, function(){});
      }
    }else if(lb && lb!==operator && fresh){
      state.readonly=true; render(); toast('Sperre durch '+lb+' übernommen');
    }
  }
  return true;
}
/* Foto-Inhaber (D6.10-16): Knoten-id des Geräts d — im eigenen CCP ccpHash:d, im Verbund das Gerät d mit der Kennung des
 * Patienten-CCP (Fund, Link oder Geräteliste; 06.10-09 ergänzt Foto-Kandidaten). '' = unbekannt. */
function meshFotoInhaber(p, d){
  if(!(d>=1) || !p) return '';
  if(!p.ccpId || p.ccpId===_ccpId) return meshNodeKey(_mesh.ccpHash, d);
  var kn=ccpBase(p.ccp), hit='';
  [_mesh.links, _mesh.found, _mesh.devs].forEach(function(m){
    Object.keys(m||{}).forEach(function(k){ var x=m[k]; if(!hit && x && parseInt(x.dev, 10)===d && (x.kn||_mesh.kns[k])===kn) hit=k; });
  });
  return hit;
}
/* Foto anfordern (D6.7-06, D6.10-16): nur für den geöffneten Patienten mit Foto-Vormerkung (_fotoRemote) und ohne Foto bzw.
 * mit älterem Foto (HO-02: _fotoRemoteT jünger als der lokale Foto-Stempel); Inhaber = Gerät der Vormerkung (_fotoRemoteD),
 * sonst Gerät des Foto-Stempels, sonst Ursprungsgerät; höchstens alle 15 s je Patient. Liegt ein Datenlink zum Inhaber →
 * foto-req direkt; ist der Inhaber in Reichweite (Fund) → kurzzeitige Direktverbindung (connect data, temporär — nach der
 * Ressource oder 20 s wieder getrennt, falls nicht im Linkplan), foto-req sobald verbunden; sonst bzw. wenn der Direktlink
 * binnen 5 s nicht steht, Rückfall: foto-req an alle Links, die Nachbarn reichen weiter (meshHandleFotoReq). Keine
 * automatische Verteilung. */
function meshRequestPhoto(pid){
  if(!meshActive() || typeof pid!=='string') return;
  var p=null, k;
  for(k=0;k<patients.length;k++){ if(patients[k].id===pid){ p=patients[k]; break; } }
  if(!p){ for(k=0;k<_tombs.length;k++){ if(_tombs[k].id===pid){ p=_tombs[k]; break; } } }
  if(!p || !p._fotoRemote || p.demo || p.training) return;
  var lt=(p.fts && p.fts.foto && p.fts.foto.t) || 0;
  if(p.photo && !((p._fotoRemoteT||0)>lt)) return;
  var now=nowMs();
  if(_mesh.fotoReq[pid] && now-_mesh.fotoReq[pid]<15000) return;
  _mesh.fotoReq[pid]=now;
  var d=(p._fotoRemoteD|0) || ((p.fts && p.fts.foto && p.fts.foto.d)|0) || (p._fuer|0);
  /* 06.10-09 (PE-1): Gerätenummern gibt es je CCP — Kandidaten über alle Verbund-CCPs, der Patienten-CCP zuerst */
  var ph=(!p.ccpId || p.ccpId===_ccpId) ? _mesh.ccpHash : (_mesh.hashOf[p.ccpId] || ''), err={};
  Object.keys(_mesh.authed).concat(Object.keys(_mesh.found)).forEach(function(x){ err[x]=true; });
  var ks=meshFotoKandidaten(d, ph, Object.keys(_mesh.bund), err).filter(function(x){ return x!==_mesh.nodeKey; });
  var to=ks[0] || meshFotoInhaber(p, d);
  if(!(d>=1) || to===_mesh.nodeKey){
    var ks=Object.keys(_mesh.authed); if(!ks.length) return;
    d=_mesh.links[ks[0]] ? (_mesh.links[ks[0]].dev|0) : 0; to='';
    if(!(d>=1)) return;
  }
  if(to && _mesh.authed[to]){ meshSend('foto-req', {pid:pid, to:d}, to); return; }
  var N=_mesh.native;
  if(to && N && _mesh.found[to]){
    _mesh.fotoTemp[to]={at:now, done:false};
    _mesh.fotoPending[pid]={to:to, dev:d, at:now};
    _mesh.outTry[to]=now;
    try{ N.call('connect',{to:to, channel:'data'}).then(null, function(){}); }catch(e){}
    return;
  }
  meshSend('foto-req', {pid:pid, to:d}, 'links');
}
/* Link-Aufbau: wartende Foto-Anforderungen an diesen Direktlink senden. */
function meshFotoLinkUp(k){
  Object.keys(_mesh.fotoPending).forEach(function(pid){
    var w=_mesh.fotoPending[pid];
    if(!w || w.to!==k) return;
    delete _mesh.fotoPending[pid];
    meshSend('foto-req', {pid:pid, to:w.dev}, k);
  });
}
/* Takt: Direktlink nicht binnen 5 s verbunden → Rückfall über die Nachbarn; temporäre Foto-Links nach der Ressource oder
 * 20 s trennen, wenn sie nicht (mehr) im Linkplan stehen — der Linkplan selbst trennt sie nie. */
function meshFotoTempPrune(now){
  var N=_mesh.native;
  Object.keys(_mesh.fotoPending).forEach(function(pid){
    var w=_mesh.fotoPending[pid];
    if(!w || now-w.at<5000) return;
    delete _mesh.fotoPending[pid];
    if(meshActive()) meshSend('foto-req', {pid:pid, to:w.dev}, 'links');
  });
  Object.keys(_mesh.fotoTemp).forEach(function(k){
    var e=_mesh.fotoTemp[k], l=_mesh.links[k];
    if(!e || !(e.done || now-e.at>=20000)) return;
    var wartet=Object.keys(_mesh.fotoPending).some(function(pid){ return _mesh.fotoPending[pid].to===k; });
    if(wartet) return;
    delete _mesh.fotoTemp[k];
    if(l){
      l.temp=false;
      if(N && _mesh.want.indexOf(k)<0){ try{ N.call('disconnect',{to:k}).then(null, function(){}); }catch(x){} }
    }
  });
}
/* Foto als Ressource liefern (D6.7-06, T-06.7-36): Data-URI zerlegen, Name foto:<pid>:<stamp>:<mime>, sendResource. */
function meshServePhoto(p, key){
  var N=_mesh.native; if(!N || !p || typeof p.photo!=='string') return false;
  var uri=p.photo, i=uri.indexOf(';base64,');
  if(uri.indexOf('data:')!==0 || i<0) return false;
  var mime=uri.slice(5, i), b64=uri.slice(i+8);
  if(!b64) return false;
  var stamp=(p.fts && p.fts.foto && p.fts.foto.t) || 0;
  try{ N.call('sendResource', {to:key, name:'foto:'+p.id+':'+stamp+':'+mime, base64:b64}).then(null, function(){}); }catch(e){ return false; }
  return true;
}
/* foto-req empfangen (D6.10-16): habe ich das aktuelle Foto (keine jüngere Vormerkung) → liefern; sonst weiterreichen —
 * an den Inhaber-Link, wenn verbunden, sonst an alle Links außer dem Absender (ttl − 1) — und den Absender-Link vormerken
 * (fotoWait): die Ressource kommt zurück und wird ohne Speichern durchgereicht (meshOnResource). */
async function meshHandleFotoReq(msg, key){
  var p=null; try{ p=await sGet('ccp_pat_'+msg.pid); }catch(e){ p=null; }
  if(p && (p.demo || p.training)) return;
  if(p && p.photo && !p._fotoRemote && meshServePhoto(p, key)) return;
  if(!(msg.ttl>0)){ _mesh.diag.ttl0++; return; }
  var owner=(p ? meshFotoInhaber(p, msg.to) : '') || meshNodeKey(_mesh.ccpHash, msg.to);
  var targets=(owner && owner!==key && _mesh.authed[owner]) ? [owner] : Object.keys(_mesh.authed).filter(function(k){ return k!==key; });
  if(!targets.length) return;
  var w=_mesh.fotoWait[msg.pid]||[];
  if(w.indexOf(key)<0) w.push(key);
  _mesh.fotoWait[msg.pid]=w;
  var json=''; try{ json=JSON.stringify(meshTtlNext(msg)); }catch(e){ return; }
  targets.forEach(function(k){ meshSendRaw(k, json); });
  _mesh.diag.fwd++;
}
/* resource empfangen (D6.7-06, D6.10-16, T-06.7-36): nur von verbundenen Datenlinks; Stempel geklemmt (futureMs), Data-URI
 * nur über safePhoto. Übernahme NUR auf eigene Anforderung (fotoReq + Vormerkung) und bei bestandener Annahme: Foto +
 * Stempel der Ressource (Gerät aus der Vormerkung), Vormerkung weg, offener Satz (_dirty); Provenienz _via/_fuer nur ohne
 * eigene unbestätigte Stempel. Wartende Anforderer (fotoWait) bekommen die Ressource durchgereicht — ohne sSet, ohne
 * Übernahme auf diesem Gerät (keine Zwischenspeicherung, T-06.10-42). Render im Patienten-View nur ohne fokussiertes Feld.
 * MI-09 (JS-Teil); Größenbegrenzung vertagt. */
async function meshOnResource(ev){
  var N=_mesh.native;
  if(!N || !ev || typeof ev.name!=='string' || typeof ev.base64!=='string' || !ev.base64) return;
  if(typeof ev.from!=='string' || !_mesh.authed[ev.from]) return;
  var pid=String(ev.name).split(':')[1]||'';
  if(!pid) return;
  var p=null; try{ p=await sGet('ccp_pat_'+pid); }catch(e){ p=null; }
  if(p && (p.demo || p.training)) return;
  var ws=(_mesh.fotoWait[pid]||[]).filter(function(w){ return w!==ev.from; });
  var own=!!(p && p._fotoRemote && _mesh.fotoReq[pid]);
  if(!own && !ws.length){ _mesh.lastError='rx:foto:ungefragt'; return; }
  var now=nowMs();
  var acc=meshPhotoAccept(ev.name, p, nowMs());
  if(String(ev.name).indexOf('foto:')!==0 || !isFinite(acc.stamp) || acc.stamp>now+MESH_PROTO.futureMs) return;   /* Klemme */
  var uri=safePhoto('data:'+acc.mime+';base64,'+ev.base64);
  if(!uri) return;
  var lt=(p && p.fts && p.fts.foto && p.fts.foto.t) || 0;
  var take=own && acc.ok && !(p.photo===uri && lt===acc.stamp);
  if(take){
    var fd=(p._fotoRemoteD|0) || (_mesh.links[ev.from] ? (_mesh.links[ev.from].dev|0) : 0);
    var put=function(x){
      x.photo=uri;
      if(!x.fts || typeof x.fts!=='object') x.fts={};
      x.fts.foto={t:acc.stamp, d:fd};
      delete x._fotoRemote; delete x._fotoRemoteT; delete x._fotoRemoteD;
      x._dirty=true;
      var mine=Object.keys(x.fts).some(function(g){ var e=x.fts[g]; return !!(e && e.p); });
      if(!mine){ x._via='mesh'; x._fuer=fd; x._fuerCcp=null; }
      x._sig=groupSigs(x, FGROUPS);
    };
    put(p);
    try{ await sSet('ccp_pat_'+pid, p); }catch(e){}
    var mem=null, k;
    for(k=0;k<patients.length;k++){ if(patients[k].id===pid){ mem=patients[k]; break; } }
    if(!mem){ for(k=0;k<_tombs.length;k++){ if(_tombs[k].id===pid){ mem=_tombs[k]; break; } } }
    if(mem && mem!==p) put(mem);
    if(state.view==='patient'){
      if(state.edit && state.edit.id===pid){
        var ae=document.activeElement, tag=(ae && ae.tagName)||'';
        if(tag!=='INPUT' && tag!=='TEXTAREA'){ try{ render(); }catch(e){} }
      }
    }else if(state.view!=='checklist'){ try{ render(); }catch(e){} }
  }
  if(own && _mesh.fotoTemp[ev.from]) _mesh.fotoTemp[ev.from].done=true;   /* Direktlink erledigt → Abbau im Takt */
  if(ws.length){
    delete _mesh.fotoWait[pid];
    ws.forEach(function(w){ try{ N.call('sendResource', {to:w, name:ev.name, base64:ev.base64}).then(null, function(){}); }catch(e){} });
  }
  if(take) meshGatewayFlush();
}
/* MasterMedic-Stand nachführen: ein lokaler Wechsel (Übernahme, Server) bekommt die Zeit des Bemerkens; der beim Start
 * schon bekannte bzw. ein leerer Stand zählt 0. So überschreibt der hb des bisherigen MasterMedic keinen jüngeren Wechsel. */
/* 0.37.1: MasterMedic-Wechsel aus dem hb gelten aus dem eigenen CCP und — im Verbund — aus jedem CCP des Bunds. */
function meshMmQuelle(h){ return !!h && (h===_mesh.ccpHash || !!(_mergeGroupId && _mesh.bund && _mesh.bund[h])); }
function meshMmStand(now){
  var v=String(masterMedic||'');
  if(_mesh.mm.v===null) _mesh.mm={v:v, at:0};
  else if(_mesh.mm.v!==v) _mesh.mm={v:v, at:v ? now : 0};
  return _mesh.mm;
}
/* Heartbeat senden (D6.7-08, D6.10-02): Kürzel, offene Sätze, Netzlage, Alter der letzten Uhrprobe, MasterMedic-Kürzel
 * mit Zeit des Wechsels (nur, wenn dieses Gerät der MasterMedic ist) und CCP-Kennung — an alle Links, die Nachbarn
 * leiten weiter (Geräteliste ohne Nabe). */
function meshSendHb(to){
  var now=nowMs(); if(!to) _mesh.lastHb=now;   /* gezielt (Link-Aufbau, Befund E): der Takt an alle bleibt unberührt */
  var open=0; try{ open=patients.filter(function(p){ return p._dirty; }).length; }catch(e){}
  var last=(_clockSamples && _clockSamples.length) ? (_clockSamples[_clockSamples.length-1].at||0) : 0;
  var b={op:operator||'', open:open, online:netLikelyUp(), offQ:last ? Math.max(0, now-last) : -1,
    mm:(operator && masterMedic && operator===masterMedic) ? String(masterMedic).slice(0,40) : ''};
  if(b.mm) b.mmAt=meshMmStand(now).at;
  if(/^[A-Z]{1,3}$/.test(String(_ccpKennung||''))) b.kennung=_ccpKennung;
  if(to){ meshSend('hb', b, to); return; }   /* Befund E: hb sofort an den neuen Link — Geräteliste, offene Sätze, MasterMedic-Stand (mmAt) ohne 15-s-Takt; hello trägt mm nur als „bekannter MasterMedic“ */
  meshSend('hb', b, 'links');
}
/* hb empfangen (D6.10-02, T-06.10-43): Geräteliste je Knoten-id (Verbund: Kennung je Gerät). MasterMedic-Wechsel ohne
 * Netz aus dem hb des MasterMedic-Geräts — nur gleicher CCP, nie leer, nur ohne Netz (online entscheidet der Server) und
 * nur, wenn sein Wechsel nicht älter ist als der hier bekannte (mmAt, geklemmt auf futureMs). Rückgabe true = Eintrag neu
 * oder älter als 5 s (Weiterleitung). */
function meshHandleHb(msg, key){
  var now=nowMs(), nk=meshNodeKey(msg.ccp, msg.from), cur=_mesh.devs[nk];
  if(nk===_mesh.nodeKey) return false;
  var mmNeu=(typeof msg.mm==='string') ? msg.mm : '', mmAtNeu=Number(msg.mmAt)||0;
  /* Messrunde 1 (Befund A2): auch weiterleiten, wenn sich MasterMedic/Wechselzeit dieses Geräts geändert haben (auch < 5 s) */
  var neu=!cur || now-(cur.last||0)>=5000 || (cur.mm||'')!==mmNeu || (cur.mmAt||0)!==mmAtNeu;
  _mesh.devs[nk]={dev:msg.from, ccp:msg.ccp, kn:(typeof msg.kennung==='string') ? msg.kennung : ((cur && cur.kn) || ''),
    op:String(msg.op||'').slice(0,40), mm:mmNeu, mmAt:mmAtNeu, last:now, open:msg.open|0, online:!!msg.online};
  /* Phase 6.10 (D6.10-05/-09/-21): Offline-Nummern (≥ 50) des eigenen CCP in die Nummernliste — jedes Gerät führt sie, damit
   * jedes die nächste freie Nummer kennt; neu für das MasterMedic-Gerät → einmal „Neues Gerät beigetreten“. */
  if(msg.ccp===_mesh.ccpHash && msg.from>=50 && _ccpId && meshNrMerken(_ccpId, msg.from) && meshIchMm()){
    try{ toast(beitrittHinweisText(msg.from, String(msg.op||'').slice(0,40))); }catch(e){}
  }
  if(msg.ccp===_mesh.ccpHash && msg.from>=50 && _ccpId) meshNrAktiv(_ccpId, msg.from);   /* Nachprüfung 26.10.2026: aktiv → Nummer bleibt für immer */
  var at=Number(msg.mmAt), cur2=meshMmStand(now), online=netLikelyUp();
  if(!(isFinite(at) && at>=0 && at<=now+MESH_PROTO.futureMs)) at=0;
  /* Messrunde 1 (Befund MM): auch MIT Netz übernehmen, wenn der Wechsel jünger ist als der hier bekannte Stand (Gateway:
   * per CAS auf den Server, bei 0 Zeilen gilt der Server); ohne Netz wie bisher (nicht älter) — in beiden Fällen Merker,
   * damit das nächste Gerät mit Netz den Wechsel nachreicht und applyMeta den alten Serverwert nicht zurückdreht. */
  if(meshMmQuelle(msg.ccp) && typeof msg.mm==='string' && msg.mm && msg.mm!==masterMedic && (online ? at>cur2.at : at>=cur2.at)){
    var alt=mmServerWert();
    if(msg.ccp!==_mesh.ccpHash) mmVerbundHinweis(masterMedic, msg.mm, _mergeGroupId);   /* 0.37.1: Wechsel in einem anderen CCP des Verbunds */
    masterMedic=msg.mm; _mesh.mm={v:msg.mm, at:at};
    try{ sSet('ccp_mastermedic', masterMedic).then(null, function(){}); }catch(e){}
    try{
      if(!_training && _ccpId){
        mmPendingMerken(msg.mm, alt, at);
        if(online) flushPendingMm().then(null, function(){});
      }
    }catch(e){}
    if(state.view==='home'){ try{ render(); }catch(e){} }
  }
  return neu;
}
/* CCP-Stammdaten (06.10-03/-05, T-06.10-41): NUR solange der eigene CCP vorläufig ist (dann braucht ihn jedes Gateway) —
 * aus dem eigenen Warteschlangen-Eintrag + joinToken aus der Fassade. null = nichts zu senden. */
function meshCcpBody(){

    joinToken:meshSecretValid(tok) ? String(tok).toLowerCase() : null, stand:Number(e.stand)||0};   /* stand: letzte Änderung durch den CCP (06.10-09) */
  if(!/^[A-Z]{1,3}$/.test(b.kennung) || !/^[0-9a-f-]{36}$/i.test(b.praesidiumId) || !(b.eroeffnetAt>0)) return null;

/* Takt: Stammdaten geändert (Kennung, Ort, MasterMedic, Lage) → erneut an alle Links desselben CCP; höchstens alle 5 s prüfen. */

/* ccp empfangen (06.10-03/-05, T-06.10-44): nur für den eigenen CCP oder einen CCP des Verbunds, nur vorläufig, nur gleiches

function meshHandleCcp(msg, key){

    einsatzlage_name:msg.lageName||null, eroeffnet_at:msg.eroeffnetAt, master_medic:msg.mm||'', fuer:'mesh', at:(cur && cur.at) || nowMs()};
  if(ms) e.stand=ms;

  var changed=!cur || ['praesidium_id','kennung','ort','einsatzlage_id','einsatzlage_name','eroeffnet_at','master_medic','stand'].some(function(k){
    var a=(cur[k]===undefined) ? null : cur[k], b=(e[k]===undefined) ? null : e[k]; return a!==b;
  });
  if(changed){
    if(cur) q[i]=e; else q.push(e);

  if(msg.joinToken && !meshSecretValid(tok)){

        changed=true;
        if(id!==_ccpId){ meshSecretAuffrischen(); meshSetKeys(); }   /* 06.10-09: Verbund-Partner — Schlüsselbund nachziehen (D6.10-10) */
      }
    }catch(x){}
  }
  if(msg.lageId && msg.lageName){   /* 06.10-07: Lage mitnehmen (Reihenfolge Lage → CCP beim Nachreichen) */

      lagePendingSchreiben(lq);
    }

function funkText(c){
  /* Deutsche Buchstabiertafel (Polizei-Funk), Owner-Vorgabe 2026-10-17: „CCP Anton“ statt NATO. */
  var TAFEL={A:'Anton',B:'Berta',C:'Cäsar',D:'Dora',E:'Emil',F:'Friedrich',G:'Gustav',H:'Heinrich',I:'Ida',J:'Julius',K:'Kaufmann',L:'Ludwig',M:'Martha',N:'Nordpol',O:'Otto',P:'Paula',Q:'Quelle',R:'Richard',S:'Samuel',T:'Theodor',U:'Ulrich',V:'Viktor',W:'Wilhelm',X:'Xanthippe',Y:'Ypsilon',Z:'Zacharias'};
  var ZAHL=['null','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf'];
  /* Trainer-Abstimmung offen: Farbwörter vs. T-Kategorien — nur diese Zeile ändern */
  var FARBE={T1:'Rot',T2:'Gelb',T3:'Grün',T5:'Schwarz'};
  function z(n){ n=+n||0; return (n>=0&&n<=12)?ZAHL[n]:String(n); }
  var ken=String(c.kennung||'A').split('/').map(function(k){
    var u=k.trim().toUpperCase();

  }).join('/');
  /* Tourniquets bewusst NICHT in der Funkmeldung (Owner 2026-10-17: für die Lagemeldung irrelevant). */
  var teile=[z(c.t1)+' '+FARBE.T1, z(c.t2)+' '+FARBE.T2, z(c.t3)+' '+FARBE.T3, z(c.t5)+' '+FARBE.T5,

  var ort=String(c.ort||'').replace(/^\s*ccp(?![A-Za-zÄÖÜäöüß0-9])[\s:·\-–]*/i,'').trim();
  return 'CCP '+ken+(ort?', '+ort:'')+', '+c.hhmm+' — '+teile.join(', ')+'.';

function vCatlist(){
  var cat=state.cat, c=catDef(cat), special=!CATS[cat];
  /* Sortierung ausschließlich über CCP-Kennung + laufende Nummer. Eine Such-,
   * Sortier- oder Filterfunktion über das Namensfeld ist aus Datenschutzgründen
   * bewusst NICHT vorgesehen (T3 Namensfeld-Härtung, DATENSCHUTZ-SPEC) —
   * Patienten werden über die Nummer identifiziert, nicht über den Namen. */
  var list=bucketPatients(cat).sort(function(a,b){
    var ca=ccpBase(a.ccp),cb=ccpBase(b.ccp);
    if(ca!==cb)return ca<cb?-1:1;
    if(a.num!==b.num)return a.num-b.num;
    return ccpDev(a.ccp)-ccpDev(b.ccp);
  });
  /* Chronologie-Umschalter (Feedback 2026-06-13): Standard neueste zuerst,
   * auf Wunsch älteste zuerst. Nummer = Chronologie-Proxy je CCP. */
  var sortDesc=(state.catSortDesc!==false);
  if(sortDesc) list.reverse();
  var h='<div class="bigcat" style="background:'+c.bg+';color:'+c.fg+(c.bd?';border:1px solid '+c.bd:'')+';margin-bottom:14px"><span><span class="lab">'+c.label+'</span> <span class="nm">'+c.nm+'</span></span><span class="cc">'+list.length+'</span></div>';
  if(list.length>1) h+='<button class="ghost" data-action="catsort" style="margin:0 0 12px;font-size:12px;padding:7px 12px">↕ '+(sortDesc?'Neueste zuerst':'Älteste zuerst')+' — umkehren</button>';
  /* „Transportfertige auschecken" nur in den echten aktiven Kategorien. */
  if(!special){
    var readyList=list.filter(function(p){return p.ready;});
    if(readyList.length>0){
      h+='<button class="prim" data-action="checkoutready" data-cat="'+cat+'" style="background:var(--ready);margin:0 0 14px">✓ Alle '+readyList.length+' transportfertigen auschecken → gPA</button>';
    }
  }
  if(list.length===0)h+='<p class="muted" style="text-align:center;padding:20px">keine Patienten</p>';
  var dupC=dupNumKeys();
  list.forEach(function(p){
    var isd=!!dupC[(p.ccp||'A')+'|'+p.num];
    var cc=CATS[p.cat]||CATS.T3;
    /* In den Sammel-Listen (Alle/Prio/gPA) zusätzlich Kategorie zeigen. */
    var catPill = special ? '<span class="pill" style="background:'+cc.bg+';color:'+cc.fg+(cc.bd?';border:1px solid '+cc.bd:'')+'">'+cc.label+'</span>' : '';
    var gpaPill = (p.status==='gpa') ? '<span class="pill" style="background:var(--surf2);color:var(--mut)">gPA</span>' : '';
    /* T3 Namensfeld-Härtung: Die Liste zeigt bewusst KEINEN Namen — Nummer +
     * Pills identifizieren den Patienten; Hauptzeile ist die Sichtungszeit/TQ.
     * Der Name erscheint nur im Übergabe-Kontext (Übergabekarte/Export). */
    h+='<button class="patrow" data-action="openpat" data-id="'+esc(p.id)+'"><span class="pnum"'+(isd?' style="color:var(--prio)"':'')+'>'+esc(pno(p))+(isd?' ⚠':'')+'</span>'+
      '<span style="flex:1"><span class="hint js-age" data-ts="'+(Number(p.lastTriage)||0)+'">'+ageStr(p.lastTriage)+'</span>'+
      (p.tqStart?' <span class="hint">· TQ <span class="js-tq" data-tq="'+(Number(p.tqStart)||0)+'">'+fmtDur(nowMs()-p.tqStart)+'</span></span>':'')+'</span>'+
      catPill+
      (p.prio?'<span class="pill" style="background:var(--prio);color:#fff">PRIO</span>':'')+
      (photoVisible(p)?'<span class="pill" style="background:var(--surf2);color:var(--mut)">📷</span>':'')+
      (function(){var l=lockInfo(p);return (l.locked&&!l.mine)?'<span class="pill" style="background:var(--surf2);color:var(--prio);border:1px solid var(--prio)">🔒 '+esc(l.by)+'</span>':'';})()+
      gpaPill+
      (p.ready&&p.status!=='gpa'?'<span class="pill" style="background:var(--ready);color:#fff">fertig</span>':'')+'</button>';
  });
  return h;

    '<div><label class="fieldlab">Schmerz</label>'+vinp("pain",p.vit.pain)+'</div></div><div style="height:9px"></div><div class="grid2">'+

    '<div><label class="fieldlab">Pupille li</label>'+inp("pupLi",p.pupLi)+'</div></div></div>';

  /* Vitalwerte-Verlauf (für längere Versorgung/PFC). Bewusst schlank & eingeklappt

/* ── Übergabe-Karte (gPA): Vorlese-Modus in AT-MIST-Reihenfolge ──────────────
 * Reine Darstellung bereits erfasster Daten. Nichts wird übertragen, kein
 * Drittsystem, kein PZC/QR/Foto. Ausgecheckte Patienten sind gesperrt; zum
 * Korrigieren „↩ Zurückholen". MDR-neutral (keine neue klinische Ausgabe). */
function vHandover(p,c){
  function amRow(letter,label,valueHtml,first,key){
    return '<div data-am="'+(key||letter)+'" style="display:flex;gap:11px;padding:12px 0'+(first?'':';border-top:1px solid var(--line)')+'">'+
      '<span class="mono" style="width:32px;height:32px;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+letter+'</span>'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700">'+label+'</div>'+
      '<div style="font-size:16px;font-weight:600;line-height:1.35;margin-top:2px">'+valueHtml+'</div></div></div>';
  }
  function vc(l,v){return '<div style="background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 8px"><div style="font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px">'+l+'</div><div class="mono" style="font-size:15px;font-weight:700;margin-top:1px">'+(v?esc(v):'—')+'</div></div>';}
  var dim='<span style="color:#9aa0a6;font-weight:400;font-style:italic">— nicht erfasst</span>';

  /* A — Alter / Geschlecht (optional, Pseudonymität) */
  var ap=[]; if(p.age)ap.push(esc(p.age)+' J'); var g=p.gender==='m'?'männl.':(p.gender==='w'?'weibl.':''); if(g)ap.push(g);
  var aVal=ap.length?ap.join(' · '):dim;
  /* T — Zeiten (automatisch) */
  var tp=[];
  /* AT-MIST (Owner 2026-10-14): Das erste T ist „Time" = Zeitpunkt. Das Tourniquet
   * ist eine Maßnahme und steht VOLLSTÄNDIG unter „T — Maßnahmen" (Ort, Anlagezeit,
   * laufende Dauer) — hier bewusst nicht mehr doppelt. */
  if(p.created)tp.push('<span style="font-size:13px;color:var(--mut);font-weight:400">erfasst '+ageStr(p.created)+'</span>');
  var tVal=tp.length?tp.join('<br>'):dim;
  /* M — Mechanismus (aus MOI/Unfallhergang) */
  var mVal=p.moi?esc(p.moi):dim;
  /* I — Verletzungen */
  var il=[]; (p.inj||[]).forEach(function(it){il.push(esc(it.r)+' – '+esc(it.a));}); if(p.injury)il.push(esc(p.injury));
  var iVal=il.length?il.join('<br>'):dim;
  /* S — Befund / Vitalwerte: nur erhobene Werte; PFC-Verlauf einklappbar (Default zu) */
  var v=p.vit||{};
  var vpairs=[['WASB',v.avpu],['AF',v.af],['SpO₂',v.spo2],['HF',v.hf],['RR',v.rr],['Schmerz',v.pain]].filter(function(x){return x[1]!=null&&x[1]!=='';});
  var sVal;
  if(vpairs.length){
    sVal='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px">'+vpairs.map(function(x){return vc(x[0],x[1]);}).join('')+'</div>';
  }else{
    sVal='<div style="margin-top:4px;font-weight:600;color:var(--mut)">Keine Vitalwerte erhoben</div>';
  }
  if(p.allergies)sVal+='<div style="margin-top:7px;color:var(--t1);font-weight:600;font-size:13.5px">⚠ Allergien: '+esc(p.allergies)+'</div>';
  var vlog=(p.vit&&Array.isArray(p.vit.log))?p.vit.log:[];
  if(vlog.length){
    sVal+='<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12.5px;color:var(--mut);font-weight:600">Verlauf — '+vlog.length+' protokollierte Messung'+(vlog.length>1?'en':'')+'</summary>'+
      '<div style="margin-top:5px;border:1px solid var(--line);border-radius:8px;overflow:hidden">';
    vlog.forEach(function(m){
      var tm=m.t?new Date(m.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'—';
      var parts=[];
      if(m.af)parts.push('AF '+esc(m.af)); if(m.spo2)parts.push('SpO₂ '+esc(m.spo2));
      if(m.hf)parts.push('HF '+esc(m.hf)); if(m.rr)parts.push('RR '+esc(m.rr));
      if(m.avpu)parts.push('WASB '+esc(m.avpu)); if(m.pain)parts.push('Schmerz '+esc(m.pain));
      sVal+='<div style="display:flex;gap:8px;padding:6px 9px;border-top:1px solid var(--line);font-size:12px"><span class="mono" style="font-weight:700;flex-shrink:0">'+tm+'</span><span style="color:var(--mut)">'+(parts.join(' · ')||'—')+'</span></div>';
    });
    sVal+='</div></details>';
  }
  /* T — Maßnahmen (Treatment): Das Tourniquet gehört nach AT-MIST hierher — mit
   * Anlageort (verhindert übersehene TQs unter Kleidung/Decken), Anlagezeit und
   * der laufenden Dauer in Rot (zeitkritisch, 2-Stunden-Grenze). */
  var tl=[];
  if(p.tqStart)tl.push('<span style="color:var(--t1);font-weight:700">Tourniquet'+(p.tqSite?' ('+esc(p.tqSite)+')':'')+' · angelegt '+new Date(p.tqStart).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr · liegt seit '+fmtDur(nowMs()-p.tqStart)+'</span>');
  TXG.forEach(function(grp){grp[1].forEach(function(f){ if(p.tx&&p.tx[f[0]]) tl.push(esc(f[1])); });});
  var ttVal=tl.length?tl.map(function(x){return '▸ '+x;}).join('<br>'):dim;

  var h='<div id="patbody">';
  h+='<div class="card" style="background:var(--surf2);border:1px solid var(--line);padding:11px 13px;display:flex;align-items:center;gap:9px;margin-bottom:10px">'+
     '<span style="font-size:15px">🔒</span><div style="flex:1">'+
     '<div style="font-weight:600">Ausgecheckt → gPA · Übergabe-Karte</div>'+
     '<div class="hint" style="margin-top:2px">Bearbeitung gesperrt · der Reihe nach vorlesen</div></div></div>';
  h+='<div class="card" data-am="hdr" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px">'+
     '<span class="pnum" style="font-size:30px">'+esc(pno(p))+'</span>'+
     '<span class="pill" style="font-size:14px;background:'+c.bg+';color:'+c.fg+(c.bd?';border:1px solid '+c.bd:'')+'">'+c.label+' '+c.nm+'</span>'+
     (p.prio?'<span class="pill" style="font-size:13px;background:var(--prio);color:#fff">PRIO</span>':'')+
     (p.name?'<span style="flex-basis:100%;font-size:14px;color:var(--mut);margin-top:2px">Name: '+esc(p.name)+'</span>':'')+
     '</div>';
  h+='<div class="card" style="padding:4px 14px 12px">';
  h+=amRow('A','Alter / Geschlecht',aVal,true,'A');
  h+=amRow('T','Zeiten',tVal,false,'T1');
  h+=amRow('M','Mechanismus',mVal,false,'M');
  h+=amRow('I','Verletzungen',iVal,false,'I');
  h+=amRow('S','Befund / Vitalwerte',sVal,false,'S');
  h+=amRow('T','Maßnahmen',ttVal,false,'TT');
  h+='</div>';
  h+='<button class="prim" data-action="reactivate" data-id="'+esc(p.id)+'" style="background:var(--acc);color:#fff;margin-top:12px">↩ Zurückholen → aktiv (zum Korrigieren)</button>';
  h+='<p class="hint" style="text-align:center;margin-top:8px">Übergabe an die gPA — der Reihe nach vorlesen.</p>';
  h+='</div>';
  return h;
}
/* ── Übergabe-Export (Einsatz-Abschluss): JSON + druckbare Gesamtansicht ─────
 * Der Export ist die Übergabe an die dauerhafte Einsatzdokumentation des
 * Trägers — ARGUS selbst bleibt Durchgangsspeicher mit kurzen Löschfristen. */

/* Reiner Feld-Mapper für den Export (kein DOM — per JSC isoliert testbar).
 * Row-Format wie patToRow, aber mit bewussten Auslassungen:
 *  (a) leere optionale String-Felder werden WEGGELASSEN (insb. name) —
 *      „Export enthält Name nur, wenn erfasst" ist damit strukturell erfüllt;
 *  (b) photo wird IMMER weggelassen — BEWUSSTE ENTSCHEIDUNG, kein Versehen:
 *      das Foto ist ein streng befristetes Wiedererkennungsmittel und gehört
 *      nicht in die dauerhafte Trägerdoku. Die Leitungs-Oberfläche bleibt
 *      der einzige Foto-Abruf-Pfad. (Nebeneffekt: keine base64-aufgeblähten
 *      JSON-Dateien, die das iOS-Share-Limit sprengen.)
 *  (c) Sperr-Spalten (locked_by/locked_at) sind reine Laufzeit-Koordination
 *      und entfallen ebenfalls. vit (inkl. vit.log) bleibt vollständig. */
function exportRowFromPatient(p){
  var row={ id:p.id, num:p.num, ccp:p.ccp||'A', cat:p.cat, status:p.status||'active',
    prio:!!p.prio, ready:!!p.ready, tq_start:p.tqStart||null, tq_site:p.tqSite||null,
    created:p.created, last_triage:p.lastTriage, updated:p.updated,
    vit:p.vit||{}, tx:p.tx||{}, inj:p.inj||[] };
  var opt=[['name',p.name],['age',p.age],['gender',p.gender],['allergies',p.allergies],
    ['pup_re',p.pupRe],['pup_li',p.pupLi],['moi',p.moi],['injury',p.injury],
    ['fr',p.fr],['notes',p.notes],['by',p.by]];
  for(var i=0;i<opt.length;i++){
    if(opt[i][1]!=null && String(opt[i][1]).trim()!=='') row[opt[i][0]]=opt[i][1];
  }
  /* KEIN row.photo — siehe Kommentar oben (Leitungs-Oberfläche = einziger Foto-Abruf-Pfad). */
  return row;
}
/* Export-Objekt: Kopf + alle Patienten des aktuellen CCP/Verbunds
 * (demo-/training-Datensätze ausgeschlossen). */
function buildEinsatzExport(){
  var pats=patients.filter(function(p){return !p.demo && !p.training;});
  var ks={}; pats.forEach(function(p){ks[p.ccp||'A']=true;});
  var kArr=Object.keys(ks).sort(); if(!kArr.length) kArr=[_ccpKennung||'A'];
  return {
    format:'argus-einsatz-export',
    exportiert_am:new Date().toISOString(),
    app_version:APP_VERSION,
    ccp_kennungen:kArr,
    ort:(checklist.hdr&&checklist.hdr.ort)||'',
    einsatz_typ:_closeTyp||null,
    bediener:operator||'',
    patienten_anzahl:pats.length,
    patienten:pats.map(exportRowFromPatient)
  };
}
/* JSON-Datei teilen (Web Share API mit File — funktioniert in der iOS-PWA);
 * Fallback: Blob + temporärer Download-Link. Fehler enden im toast(). */
async function exportEinsatzJson(){
  try{
    var ex=buildEinsatzExport();
    var fname='argus-einsatz-'+(ex.ccp_kennungen||['A']).join('')+'-'+new Date().toISOString().slice(0,10)+'.json';
    var blob=new Blob([JSON.stringify(ex,null,2)],{type:'application/json'});
    if(navigator.share && navigator.canShare && window.File){
      try{
        var file=new File([blob],fname,{type:'application/json'});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); toast("Export geteilt"); return; }
      }catch(eSh){ if(eSh && eSh.name==='AbortError') return; /* Nutzer hat abgebrochen */ }
    }
    /* Hülle: WKWebView hat keinen Download-Manager — ein stiller „Export
     * gespeichert“-Toast wäre falsch (RESEARCH Frage 2; Plan B @capacitor/share
     * nur bei Befund in Checkpoint A). */
    if(isNativeShell()){ toast("Teilen nicht verfügbar — Export bitte über die Leitungs-Seite"); return; }
    var a=document.createElement('a'); var url=URL.createObjectURL(blob);
    a.href=url; a.download=fname; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode)a.parentNode.removeChild(a); },800);
    toast("Export gespeichert: "+fname);
  }catch(err){ toast("Export fehlgeschlagen"); }
}
/* Kompakte Druck-/Vorlese-Karte eines Patienten für die Gesamtansicht —

      '<div style="flex:1;min-width:0"><div style="font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700">'+label+'</div>'+

  var g=p.gender==='m'?'männl.':(p.gender==='w'?'weibl.':''); if(g)ap.push(g);
  var tp=[];
  /* TQ nicht mehr unter „Zeiten" (AT-MIST: Maßnahme) — siehe tl unten. */
  if(p.created)tp.push('erfasst '+ageStr(p.created));
  var il=[]; (p.inj||[]).forEach(function(it){il.push(esc(it.r)+' – '+esc(it.a));}); if(p.injury)il.push(esc(p.injury));
  var v=p.vit||{};
  var vp=[['WASB',v.avpu],['AF',v.af],['SpO₂',v.spo2],['HF',v.hf],['RR',v.rr],['Schmerz',v.pain]].filter(function(x){return x[1]!=null&&x[1]!=='';});
  var sVal=vp.length?('<span class="mono">'+vp.map(function(x){return x[0]+' '+esc(x[1]);}).join(' · ')+'</span>'):dim;
  if(p.allergies)sVal+='<br><b style="color:var(--t1)">⚠ Allergien: '+esc(p.allergies)+'</b>';
  var vlog=(p.vit&&Array.isArray(p.vit.log))?p.vit.log:[];
  if(vlog.length){
    sVal+='<div style="margin-top:4px;font-size:11.5px;color:var(--mut)">Verlauf:'+vlog.map(function(m){
      var tm=m.t?new Date(m.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'—';
      var parts=[]; if(m.af)parts.push('AF '+esc(m.af)); if(m.spo2)parts.push('SpO₂ '+esc(m.spo2));
      if(m.hf)parts.push('HF '+esc(m.hf)); if(m.rr)parts.push('RR '+esc(m.rr));
      if(m.avpu)parts.push('WASB '+esc(m.avpu)); if(m.pain)parts.push('Schmerz '+esc(m.pain));
      return '<br>'+tm+': '+(parts.join(' · ')||'—');

function resizePhoto(file,maxEdge,quality){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);var img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.naturalWidth||img.width,hh=img.naturalHeight||img.height;
      var s=Math.min(1,maxEdge/Math.max(w,hh));
      var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(hh*s));
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
      cv.getContext("2d").drawImage(img,0,0,cw,ch);
      try{resolve(cv.toDataURL("image/jpeg",quality));}catch(e){reject(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("img"));};
    img.src=url;
  });
}

function confirmModal(msg,okLabel){
  return new Promise(function(resolve){
    var ov=document.createElement("div");ov.className="modalov";
    ov.innerHTML='<div class="modalbx"><div class="modalmsg">'+esc(msg)+'</div>'+
      '<div class="row" style="margin-top:16px">'+
      '<button class="ghost mc-cancel" style="flex:1;margin:0">Abbrechen</button>'+
      '<button class="prim mc-ok" style="flex:1;margin:0;background:var(--ready)">'+esc(okLabel||"OK")+'</button></div></div>';
    document.body.appendChild(ov);
    function done(v){ modalDismiss(ov, function(){ resolve(v); }); }
    /* Android-Fix (2026-10-15): Absicht beim Antippen merken (s. promptModal). */
    var pressed=null, downOnOv=false;
    ov.querySelector(".mc-ok").addEventListener("pointerdown",function(){pressed="ok";});
    ov.querySelector(".mc-cancel").addEventListener("pointerdown",function(){pressed="cancel";});
    ov.addEventListener("pointerdown",function(e){ pressed=null; downOnOv=(e.target===ov); },true);   /* Capture: Absicht bei jedem neuen Antippen zurücksetzen */
    ov.addEventListener("pointercancel",function(){ pressed=null; });
    ov.addEventListener("pointerup",function(){ if(pressed==="ok")done(true); else if(pressed==="cancel")done(false); pressed=null; });
    ov.querySelector(".mc-cancel").addEventListener("click",function(){done(false);});
    ov.querySelector(".mc-ok").addEventListener("click",function(){done(true);});
    ov.addEventListener("click",function(e){if(e.target===ov && downOnOv)done(false);});
  });
}
function cmpVer(a,b){
  var pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number);
  for(var i=0;i<3;i++){ var d=(pa[i]||0)-(pb[i]||0); if(d) return d>0?1:-1; }
  return 0;
}

function trainCount(){ return patients.filter(function(p){return p.training;}).length; }
function trainSome(f){ return patients.some(function(p){return p.training && f(p);}); }
function trainLoad(){ try{ _training=localStorage.getItem('argus_training')==='1'; _trainStep=parseInt(localStorage.getItem('argus_train_step')||'0',10)||0; if(_training)_photosAllowed=true; }catch(e){} }   /* Reload mitten im Training: Foto-Schalter lokal wieder an (s. Kommentar oben) */
function trainSave(){ try{ localStorage.setItem('argus_training',_training?'1':'0'); localStorage.setItem('argus_train_step',String(_trainStep)); }catch(e){} }
async function startTraining(){ if(!_training){ try{ meshStop('training'); }catch(e){} try{await trainReset();}catch(e){} clearLeftMarker(true); _trainStep=0; _trainMax=0; _trainCelebrate=false; if(_channel){try{_channel.unsubscribe();}catch(e){} _channel=null;} _ccpId=null; _mergeGroupId=null; patients=[]; mergeInfoReset(); _trainLagen=null; _trainLageId=null; state.view='start'; }   /* frischer Start: ohne CCP, damit „CCP eröffnen" jedes Mal echt durchlaufen wird (kein manuelles Zurücksetzen) */ _training=true; _photosAllowed=true; trainSave(); try{await loadPatients();}catch(e){} render(); }   /* Foto-Schalter lokal an (train-ccp synct nie → kein Cloud-Leck) */
async function trainReset(){ try{ var lk=await sList("ccp_pat_"); for(var i=0;i<lk.length;i++){ var pp=await sGet(lk[i]); if(pp && pp.training) await sDel(lk[i]); } }catch(e){} }
async function endTraining(){
  /* Overlay (Spotlight + Panel) VOR dem Dialog entfernen, sonst liegt es im Vordergrund. */
  try{ trainClearSpot(); var pe=document.getElementById('train-coach'); if(pe&&pe.parentNode)pe.parentNode.removeChild(pe); }catch(e){}
  var ok=await confirmModal('Training beenden?\n\nDie Übungsdaten auf diesem Gerät werden entfernt. Echte CCPs sind nicht betroffen.','Beenden');
  if(!ok){ try{ renderCoach(); }catch(e){} return; }
  _training=false; _photosAllowed=true; trainSave(); try{ trainTeardown(); }catch(e){}   /* Fotos bleiben dauerhaft an (v0.31.0) */ try{await trainReset();}catch(e){} clearLeftMarker(true); if(_channel){try{_channel.unsubscribe();}catch(e){} _channel=null;} _ccpId=null; _mergeGroupId=null; patients=[]; mergeInfoReset(); _trainLagen=null; _trainLageId=null; try{localStorage.removeItem('argus_ccp_id');}catch(e){} state.view='start'; try{await loadPatients();}catch(e){} try{ meshStart(); }catch(e){} render();   /* Übungs-CCP & -Daten weg → zurück zur Schulungs-Startseite, sauber für den nächsten Lauf */
}
function trainStep(d){
  if(d>0){ _trainStep=Math.min(_trainStep+1,TRAIN_LESSONS.length); if(_trainStep>_trainMax)_trainMax=_trainStep; }
  else { _trainStep=Math.max(0,_trainStep-1); }
  trainSave(); renderCoach();
}
/* Auto-Weiter an der Front (nicht im Review). Dezente Kurzbestätigung per Toast. */
function trainCheckAdvance(){
  var guard=0, adv=false;
  while(_trainStep<TRAIN_LESSONS.length && _trainStep>=_trainMax){

function trainScrollToRect(rect){

/* Geister-Klick-Schutz (Android-Fix III, 2026-10-15): Auf Touch-Geräten feuert
 * der Browser NACH pointerup/touchend noch ein synthetisches „click" — und zwar
 * auf das Element, das in diesem Moment unter dem Finger liegt. Wird der Dialog
 * schon beim Loslassen entfernt, trifft dieser Klick die Seite DARUNTER. In der
 * Schulung liegt dort exakt der vom Coach-Spotlight zentrierte Knopf „Neue CCP
 * eröffnen" → der Handler lief erneut, die Ort-Abfrage erschien wieder, „OK" wirkte
 * wie „Abbrechen". Daher: Dialog erst unsichtbar + über alles legen (fängt den
 * Geister-Klick ab), die Antwort sofort liefern, DOM-Entfernung kurz verzögern. */
function modalDismiss(ov, cb){
  if(ov._dismissed) return; ov._dismissed=true;
  try{ if(document.activeElement && ov.contains(document.activeElement)) document.activeElement.blur(); }catch(e){}
  var kill=function(e){ e.stopPropagation(); e.preventDefault(); };
  ['click','pointerdown','pointerup','touchstart','touchend','mousedown','mouseup'].forEach(function(t){ ov.addEventListener(t,kill,true); });
  ov.style.opacity='0'; ov.style.zIndex='8600'; ov.style.transition='none';
  setTimeout(function(){ if(ov.parentNode)ov.parentNode.removeChild(ov); },450);
  if(cb) cb();
}
function promptModal(msg,def){
  return new Promise(function(resolve){
    var ov=document.createElement("div");ov.className="modalov";
    ov.innerHTML='<div class="modalbx"><div class="modalmsg">'+esc(msg)+'</div>'+
      '<input class="mc-inp" style="margin-top:12px" value="'+esc(def||"")+'">'+
      '<div class="row" style="margin-top:16px">'+
      '<button class="ghost mc-cancel" style="flex:1;margin:0">Abbrechen</button>'+
      '<button class="prim mc-ok" style="flex:1;margin:0">OK</button></div></div>';
    document.body.appendChild(ov);
    /* Android-Fix II (2026-10-15): Dialog mit Eingabefeld OBEN verankern statt
     * zentrieren — die Tastatur verkleinert den Viewport, ein zentrierter Dialog
     * springt beim Auf-/Zuklappen. Auf Android schluckt der erste Tipp oft nur die
     * Tastatur; der zweite landete dann dort, wo „OK" vorher war (Hintergrund). */
    ov.style.alignItems='flex-start'; ov.style.paddingTop='max(10vh,48px)';
    var inp=ov.querySelector(".mc-inp");
    function done(v){ modalDismiss(ov, function(){ resolve(v); }); }
    /* Android-Fix (2026-10-15): Der Tipp auf OK blendet die Tastatur aus, der
     * Dialog rutscht nach, und das click-Ereignis trifft den Hintergrund → wurde
     * als Abbrechen gewertet. Daher: beim ANTIPPEN merken, was gedrückt wurde,
     * und beim Loslassen diese Absicht ausführen; Hintergrund bricht nur ab,
     * wenn der Tipp auch auf dem Hintergrund BEGANN. click bleibt als Fallback. */
    var pressed=null, downOnOv=false;
    ov.querySelector(".mc-ok").addEventListener("pointerdown",function(){pressed="ok";});
    ov.querySelector(".mc-cancel").addEventListener("pointerdown",function(){pressed="cancel";});
    ov.addEventListener("pointerdown",function(e){ pressed=null; downOnOv=(e.target===ov); },true);   /* Capture: Absicht bei jedem neuen Antippen zurücksetzen */
    ov.addEventListener("pointercancel",function(){ pressed=null; });
    ov.addEventListener("pointerup",function(){ if(pressed==="ok")done(inp.value); else if(pressed==="cancel")done(null); pressed=null; });
    ov.querySelector(".mc-cancel").addEventListener("click",function(){done(null);});
    ov.querySelector(".mc-ok").addEventListener("click",function(){done(inp.value);});
    /* KEIN Abbruch per Hintergrund-Tipp bei Eingabe-Dialogen — Abbrechen nur über
     * den Knopf (verhindert jeden Tastatur-Verrutsch-Fehlalarm). */
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); done(inp.value); } });
    setTimeout(function(){try{inp.focus();}catch(e){}},50);
  });
}

/* Startfall (Owner-Befund 0.35.4, „C-1-2“): Beitritt/Eröffnung/Wiederbeitritt enden in go("home"). Bisher holte erst das

 * (no-op, wenn reserviert/offline/Training/Backoff); der Erfassungsbildschirm ist das Sicherheitsnetz. Nie warten. */
function go(view){state.view=view;if(view==="capture"){state.capMode="menu";state.capDirect=false;}state.capPopup=false;if(view==="home"||view==="capture"){ try{ prefetchNum(); }catch(e){} }render();if(view==="start"||view==="home")maybeShowIntro();}
async function back(){
  if(state.view==="patient"){await releasePatientLock();state.readonly=false;go("catlist");}
  else if(state.view==="einsatzexport"){_closeTyp=null;go("overview");}
  else if(state.view==="catlist"){go("overview");}
  else if(state.view==="capture"&&state.capMode==="tac"){state.capMode="menu";render();}
  else if(state.view==="home"){
    /* Einziger Verlassen-Hook (D6.5-02): die CCP-Grenze. MasterToken-Sitzung bleibt ausgenommen. */
    if(_isMaster || !_ccpId){ await loadOpenCcpCount(); go("start"); }
    else{
      var nLeave=0; try{ nLeave=patients.filter(function(p){return p._dirty;}).length; }catch(e){}
      var okLeave=await confirmModal(leaveText(_ccpKennung, deviceNoSync(), nLeave, isMasterMedic()), "CCP verlassen");
      if(!okLeave) return;
      var lageAlt=(_ccpLageFuer===_ccpId) ? _ccpLageId : undefined;   /* Phase 6.11 (D6.11-13) */
      await leaveCcpState();
      await loadOpenCcpCount();
      lageNachVerlassen(lageAlt);   /* Phase 6.11 (D6.11-13): wieder in der Lage des verlassenen CCP */
    }
  }
  else if(state.view==="funk"){go("home");}
  else if(state.view==="admin"){go("praesidium");}
  else if(state.view==="help"){ go(_ccpId?"home":"start"); }
  else if(state.view==="datenschutz"){ go("help"); }   /* einziger Einstieg: Hilfestellungen */
  else if(state.view==="lage"){ go("start"); }   /* Phase 6.11 (D6.11-13): Menü „Lage auswählen“ → Startseite */
  else{go("home");}
}

/* Sperr-Heartbeat (alle 5 s, nur im Patienten-View). Behandelt beide Rollen:
 *  • Bearbeiter: hält die eigene Sperre frisch; erkennt eine fremde Übernahme.
 *  • Wartender (readonly): erkennt, wenn die Sperre frei wird (Bearbeiter raus
 *    oder 45 s ohne Lebenszeichen) und übernimmt dann automatisch.
 * Re-rendert nur bei echtem Rollenwechsel (sonst Fokusverlust beim Tippen). */
setInterval(async function(){
  if(state.view!=="patient"||!state.edit) return;
  /* Phase 6.7 (D6.7-07): ohne Netz hält das Mesh die eigene Sperre frisch (Keepalive alle 15 s als lock-Ereignis). */
  if(!netLikelyUp() && meshActive() && state.edit.lockedBy===operator && nowMs()-_lockBeat>15000){
    _lockBeat=nowMs(); state.edit.lockedAt=nowMs();
    try{ meshSend('lock', meshLockBody(state.edit, false), 'links'); }catch(e){}
    return;
  }
  var client=sb();
  if(!(client && _ccpId)) return;
  var r; try{ r=await client.from('patients').select('locked_by,locked_at').eq('id',state.edit.id).single(); }catch(e){ return; }
  if(!r||!r.data) return;
  var lb=r.data.locked_by, la=r.data.locked_at||0, fresh=(nowMs()-la)<LOCK_TTL;
  if(state.readonly){
    /* Wartender: Sperre frei (niemand / abgelaufen / wieder ich) → übernehmen */
    if(!lb || !fresh || lb===operator){
      await acquirePatientLock(state.edit); render();
      toast("Patient frei — du kannst jetzt bearbeiten");
    }else{ state.edit.lockedBy=lb; state.edit.lockedAt=la; }
    return;
  }
  /* Bearbeiter: fremde Übernahme erkennen */
  if(state.edit.lockedBy===operator && lb && lb!==operator && fresh){
    state.readonly=true; state.edit.lockedBy=lb; state.edit.lockedAt=la;
    render(); toast("Sperre durch "+lb+" übernommen"); return;
  }
  /* Keepalive höchstens alle 15 s, und nur solange wir die Sperre noch halten. */
  if(state.edit.lockedBy===operator && nowMs()-_lockBeat > 15000){
    _lockBeat=nowMs(); state.edit.lockedAt=nowMs();
    try{ await client.from('patients').update({locked_at:state.edit.lockedAt}).eq('id',state.edit.id).eq('locked_by',operator); }catch(e){}
  }
},5000);

(async function init(){
  /* Hülle: Zugangsschlüssel aus der Keychain, Migration localStorage→Keychain,
   * Neuinstallation verwirft Reste; Timeout 1,2 s (Local-first) */
  await hydrateAccessFromKeychain();
  meshSecretMigrate();   /* P2: Alt-Schlüssel des Mesh-Geheimnisses in die Zugangsfassade (wirft nie) */
  await nativeStartup();   /* Hülle: Build-Nummer, Launch-URL — begrenzt durch withTimeout */
  operator=await getOperator();if(!operator)operator="";
  /* Fehlende/kaputte config.js nicht still schlucken: einmaliger Hinweis beim
   * Start (kein natives alert — In-App-Toast). Banner zeigt es dauerhaft. */
  if(_configError){ setTimeout(function(){ toast('⚠️ Konfiguration fehlt (config.js) — kein Backend verbunden'); }, 600); }
  try{ _training=false; _trainStep=0; localStorage.removeItem('argus_training'); localStorage.removeItem('argus_train_step'); }catch(e){}   /* Training NICHT über App-Neustart fortführen */

  /* Erstinstallation erkennen — VOR allem anderen, solange die Geräte-Ablage noch
   * leer ist. Ein bestehender Nutzer (irgendwelche ARGUS-Daten vorhanden) bekommt
   * KEIN Intro (nur stilles Markieren); nur eine echte Neuinstallation. Eine
   * spätere Freischaltung für ein weiteres Präsidium ändert das nicht. */
  var introSeen=localStorage.getItem('argus_intro_seen');
  var hadData=!!(operator||localStorage.getItem('argus_verified')||localStorage.getItem('argus_unlocked')||accessGet('argus_jwt')||localStorage.getItem('argus_seen_version')||localStorage.getItem('argus_ccp_id'));
  window._pendingIntro = (!introSeen && !hadData);
  if(!introSeen && hadData){ try{localStorage.setItem('argus_intro_seen','1');}catch(e){} }

  /* „Was ist neu"-Hinweis: einmalig pro Version. Wird für bestehende Nutzer
   * angezeigt (auch beim ersten Lauf mit sichtbarer Version), nicht für eine
   * brandneue Erstinstallation. Läuft unabhängig vom späteren View-Pfad. */
  var seenV=localStorage.getItem('argus_seen_version');
  var existingUser=!!(accessGet('argus_jwt')||localStorage.getItem('argus_unlocked')||localStorage.getItem('argus_verified'));
  localStorage.setItem('argus_seen_version',APP_VERSION);
  if(seenV ? (seenV!==APP_VERSION) : existingUser){ setTimeout(function(){ whatsNewModal(seenV); },700); }

  /* ── Zugangsprüfung (nur einmalig beim ersten Start) ─────────────
   * argus_verified = true  →  einmal freigeschaltet, dauerhaft Zugang
   * Einladungslink         →  einmalige Registrierung, danach verified
   * Nichts von beidem      →  gesperrter Bildschirm
   * ──────────────────────────────────────────────────────────────── */
  var verified=localStorage.getItem('argus_verified');
  var urlToken=extractInviteToken();
  var urlCode=extractInviteCode();
  /* Befund 7 (Sicherheitsprüfung 26.10.2026): im Browser (Install-Screen) steht der Code nach dem Lesen nur noch in
   * sessionStorage (dieser Tab), nicht mehr im URL-Verlauf — ein Reload des Install-Screens findet ihn dort wieder. */
  var codeAusUrl=!!urlCode, tokenAusUrl=!!urlToken;
  if(!urlCode && !isStandalone()){ try{ urlCode=extractInviteCode('#code='+(sessionStorage.getItem('argus_install_code')||'')); }catch(e){ urlCode=null; } }
  /* Nachprüfung 26.10.2026: #inv= im Browser genauso — Token nur in sessionStorage (dieser Tab), nie im URL-Verlauf */
  if(!urlCode && !urlToken && !isStandalone()){ try{ urlToken=extractInviteToken('#inv='+(sessionStorage.getItem('argus_install_inv')||'')); }catch(e){ urlToken=null; } }
  _praesidiumId   = localStorage.getItem('argus_praesidium_id')||null;
  _praesidiumSchulung = localStorage.getItem('argus_praesidium_schulung')==='1';
  _praesidiumName = localStorage.getItem('argus_praesidium_name')||'';
  _isMaster       = accessGet('argus_is_master')==='true';
  /* Stufe-1 Person-Sitzung wiederherstellen (Plan 05.1-03) */
  _usbnk     = localStorage.getItem('argus_usbnk')||null;
  _argusRole = localStorage.getItem('argus_role')||null;

  /* ── Freischalt-Link mit 8-stelligem Code (#code=) ──────────────── */
  if(urlCode){
    if(!isStandalone()){
      /* Browser (noch nicht installiert): Install-Screen anzeigen. Der Code steht
       * bereits im Link — KEIN DB-Read (anon darf access_tokens nicht mehr lesen;
       * Lücke aus Phase 4 geschlossen). Eingelöst wird erst im Standalone. */
      var ucClean=urlCode.replace(/[\s\-]/g,'').toUpperCase();
      state.installShortCode = ucClean.length>=8 ? ucClean.slice(0,4)+'-'+ucClean.slice(4,8) : urlCode;
      state.installTokenFull=urlCode;
      try{ sessionStorage.setItem('argus_install_code', urlCode); }catch(e){}
      if(codeAusUrl){ try{ history.replaceState(null,'',window.location.pathname+window.location.search); }catch(e){} }
      $("clock").textContent=new Date().toLocaleTimeString("de-DE");
      state.view='install'; render(); return;
    } else {
      /* Installierte PWA: echter Eintritt → JWT holen (Einmal-Code wird jetzt
       * serverseitig verbraucht). */
      var cdata=await exchangeCode(urlCode);
      if(!cdata){ try{ history.replaceState(null,'',window.location.pathname); }catch(e){} }   /* Nachprüfung 26.10.2026: Code auch bei Fehlschlag aus dem Verlauf */
      if(cdata){
        localStorage.setItem('argus_verified','true'); verified='true';
        history.replaceState(null,'',window.location.pathname);
        if(cdata.is_master){ accessSet('argus_is_master','true'); _isMaster=true; }
        else if(cdata.praesidium_id){
          addUnlock(cdata.praesidium_id, cdata.temporary?(cdata.ttl_hours||24):null);
          try{ await unlockTwinFor(urlCode, cdata); }catch(e){}   /* 0024: Schulungs-Zwilling mit freischalten */
          _praesidiumId=cdata.praesidium_id;
          _praesidiumName=(cdata.praesidien&&cdata.praesidien.name)||'';
          localStorage.setItem('argus_praesidium_id',_praesidiumId);
          localStorage.setItem('argus_praesidium_name',_praesidiumName);
          refreshSchulungFlag();
        }
      }
    }
  }
  /* ── Einladungslink mit 32-Zeichen-Token (#inv=, Install-Flow) ──── */
  else if(urlToken){
    if(!isStandalone()){
      /* Browser (Install-Screen): Token nur noch in sessionStorage, Fragment VOR dem Rendern aus dem Verlauf (wie #code=, Befund 7) */
      try{ sessionStorage.setItem('argus_install_inv', urlToken); }catch(e){}
      if(tokenAusUrl){ try{ history.replaceState(null,'',window.location.pathname+window.location.search); }catch(e){} }
    }
    var tokenData=await validateInviteToken(urlToken);
    if(!tokenData && isStandalone()){ try{ history.replaceState(null,'',window.location.pathname); }catch(e){} }   /* Nachprüfung 26.10.2026: auch bei Fehlschlag aus dem Verlauf */
    if(tokenData){
      if(!isStandalone()){
        state.installShortCode=tokenData.short_code||urlToken.slice(0,8).toUpperCase();
        state.installTokenFull=urlToken;
        $("clock").textContent=new Date().toLocaleTimeString("de-DE");
        state.view='install'; render(); return;
      }
      localStorage.setItem('argus_verified','true'); verified='true';
      accessSet('argus_invite',urlToken);
      history.replaceState(null,'',window.location.pathname);
      if(tokenData.is_master){ accessSet('argus_is_master','true'); _isMaster=true; }
      else if(tokenData.praesidium_id){
        addUnlock(tokenData.praesidium_id, tokenData.temporary?(tokenData.ttl_hours||24):null);
        await consumeSingleUse(tokenData);
        _praesidiumId=tokenData.praesidium_id;
        _praesidiumName=(tokenData.praesidien&&tokenData.praesidien.name)||'';
        localStorage.setItem('argus_praesidium_id',_praesidiumId);
        localStorage.setItem('argus_praesidium_name',_praesidiumName);
        refreshSchulungFlag();
      }
    }
  }

  /* Präsidienliste (für die Landingpage; schulungs_zwilling_id für Picker). B3: nie unbegrenzt warten —
   * mit lokalem Cache vom letzten erfolgreichen Abruf: Cache sofort, Abruf im Hintergrund; ohne Cache
   * (Erststart) nur bei vermuteter Verbindung und mit hartem Timeout. */
  var _prlCached=false;
  try{ var _prc=JSON.parse(localStorage.getItem('argus_praesidien_cache')||'null'); if(Array.isArray(_prc) && _prc.length){ _praesidienList=_prc; _prlCached=true; } }catch(e){}
  if(sb() && netLikelyUp()){
    var _prlP=(async function(){
      try{
        var prlAll=await qt(sb().from('praesidien').select('id,name,schulung,schulungs_zwilling_id').order('name'));
        if(prlAll && !prlAll.error && Array.isArray(prlAll.data)){
          _praesidienList=prlAll.data;
          try{ localStorage.setItem('argus_praesidien_cache', JSON.stringify(prlAll.data)); }catch(e){}
        }
      }catch(e){}
    })();
    if(_prlCached){ _prlP.then(function(){ if(state.view==='praesidium'){ try{ render(); }catch(e){} } }); }
    else await _prlP;
  }

  /* ── Phase-4-Migration: Altgerät ohne JWT → einmalige Code-Neueingabe ────
   * Geräte mit altem Zugang (verified / unlocked / master), aber ohne JWT
   * werden zur Code-Eingabe geführt. Danach 30 Tage Ruhe. URL-Links
   * (#code= / #inv=) umgehen die Migration (werden oben verarbeitet). */
  /* HO-04: nur wenn die Keychain sicher gelesen wurde (ok) oder PWA — bei Timeout/Lesefehler/
   * fehlendem Plugin wäre der fehlende JWT kein Beweis für ein Altgerät (Local-first, nichts löschen). */
  var hasLegacyAccess = accessMigrationAllowed(_kcHyd) && ((verified==='true' || getUnlocked().length>0 || _isMaster) && !accessGet('argus_jwt'));
  if(hasLegacyAccess && !urlCode && !urlToken){
    localStorage.removeItem('argus_verified');
    localStorage.removeItem('argus_unlocked');
    localStorage.removeItem('argus_praesidium_id');
    localStorage.removeItem('argus_praesidium_name');
